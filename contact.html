




<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact - Game Hub</title>
<style>
  /* ===== ALL COLORS LIVE HERE - soft blue theme, matches index.html ===== */
  :root {
    --bg: #eaf2fb;
    --header-bg: #4a90c2;
    --header-text: #ffffff;

    --nav-bg: #ffffff;
    --nav-border: #4a90c2;
    --nav-text: #2c6693;
    --nav-hover-bg: #dceaf7;

    --card-bg: #ffffff;
    --card-border: #cfe0ef;
    --body-text: #1c2b36;
    --email-text: #2c6693;
    --email-hover-bg: #dceaf7;
  }

  * {
    box-sizing: border-box;
  }

  html, body {
    margin: 0;
    height: 100%;
    background: var(--bg);
    font-family: Arial, Helvetica, sans-serif;
  }

  /* Always reserve space for a vertical scrollbar, even on short pages,
     so the header doesn't shift left/right between pages */
  html {
    overflow-y: scroll;
  }

  /* Keeps the header and nav visible at the top while the page scrolls */
  .site-header-wrap {
    position: sticky;
    top: 0;
    z-index: 100;
  }

  header {
    background: var(--header-bg);
    color: var(--header-text);
    text-align: center;
    padding: 1.5rem 1rem 1.2rem;
  }

  header h1 {
    margin: 0;
    font-size: 2.5rem;
    letter-spacing: 1px;
  }

  nav {
    display: flex;
    justify-content: center;
    gap: 20px;
    background: var(--nav-bg);
    padding: 14px 12px;
    border-bottom: 1px solid var(--card-border);
  }

  nav a {
    color: var(--nav-text);
    text-decoration: none;
    font-weight: bold;
    font-size: 1.1rem;
    padding: 8px 20px;
    border: 1px solid var(--nav-border);
    border-radius: 6px;
    transition: background 150ms ease;
  }

  nav a:hover {
    background: var(--nav-hover-bg);
  }

  main {
    max-width: 500px;
    margin: 24px auto 60px auto;
    padding: 0 20px;
  }

  .page-title {
    font-size: 30px;
    font-weight: bold;
    text-align: center;
    color: var(--body-text);
    margin: 0 0 18px;
  }

  .contact-card {
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 8px;
    padding: 35px;
    text-align: center;
  }

  .intro-text {
    text-align: center;
    margin: 0 0 22px;
  }

  .intro-text p {
    color: var(--body-text);
    font-size: 1.1rem;
    line-height: 1.6rem;
    margin: 0 0 14px;
  }

  .contact-card p {
    color: var(--body-text);
    font-size: 1.1rem;
    line-height: 1.6rem;
    margin: 0 0 14px;
  }

  .email-link {
    display: inline-block;
    margin-top: 10px;
    color: var(--email-text);
    text-decoration: none;
    font-weight: bold;
    font-size: 1.15rem;
    padding: 10px 22px;
    border: 1px solid var(--nav-border);
    border-radius: 6px;
    transition: background 150ms ease;
  }

  .email-link:hover {
    background: var(--email-hover-bg);
  }

  /* ---- Contact form ---- */
  .contact-form {
    text-align: left;
  }

  .form-field {
    margin-bottom: 20px;
  }

  .name-row {
    display: flex;
    gap: 16px;
  }

  .name-row > div {
    flex: 1;
    min-width: 0;
  }

  .form-field label {
    display: block;
    font-weight: bold;
    color: var(--nav-text);
    margin-bottom: 6px;
    font-size: 0.95rem;
  }

  .form-field input[type="text"],
  .form-field input[type="email"],
  .form-field textarea {
    width: 100%;
    padding: 10px 12px;
    background: var(--bg);
    border: 1px solid var(--card-border);
    border-radius: 6px;
    font-family: inherit;
    font-size: 1rem;
    color: var(--body-text);
  }

  .form-field textarea {
    min-height: 120px;
    resize: vertical;
  }

  .field-note {
    margin: 6px 0 0;
    font-size: 0.82rem;
    color: var(--nav-text);
    font-style: italic;
  }

  .checkbox-field {
    display: flex;
    align-items: flex-start;
    gap: 8px;
    margin-bottom: 22px;
  }

  .checkbox-field input[type="checkbox"] {
    margin-top: 3px;
    width: 16px;
    height: 16px;
    flex-shrink: 0;
    accent-color: var(--header-bg);
  }

  .checkbox-field label {
    color: var(--body-text);
    font-size: 0.95rem;
    line-height: 1.4;
  }

  .submit-btn {
    display: block;
    width: 100%;
    background: var(--header-bg);
    color: var(--header-text);
    font-weight: bold;
    font-size: 1.1rem;
    padding: 12px 22px;
    border: 1px solid var(--nav-border);
    border-radius: 6px;
    cursor: pointer;
    transition: background 150ms ease;
  }

  .submit-btn:hover {
    background: #3d7aa8;
  }
</style>
</head>
<body>

  <div class="site-header-wrap">
    <header>
      <h1>Game Hub</h1>
    </header>

    <nav>
      <a href="index.html">Home</a>
      <a href="about.html">About</a>
    </nav>
  </div>

  <main>
    <h2 class="page-title">Contact</h2>

    <div class="intro-text">
      <p>I encourage comments and suggestions.</p>
      <p>If you have a hankering, send me a message.</p>
      <p>Perry Johnson</p>
    </div>

    <div class="contact-card">

      <form class="contact-form" action="https://api.web3forms.com/submit" method="POST">

        <input type="hidden" name="access_key" value="b9a01d40-83f8-40d1-b6e2-443de47688cc">

        <!-- Sets the email subject line Web3Forms uses -->
        <input type="hidden" name="subject" value="New message from Game Hub contact form">

        <!-- Honeypot spam trap: hidden from real visitors via CSS, but bots that
             auto-fill every field will fill this in too, and Web3Forms silently
             discards any submission where it's non-empty. Web3Forms specifically
             looks for a field named "botcheck" for this. -->
        <input type="checkbox" name="botcheck" style="display:none">

        <div class="form-field name-row">
          <div>
            <label for="firstName">First Name</label>
            <input type="text" id="firstName" name="first_name" required>
          </div>
          <div>
            <label for="lastName">Last Name</label>
            <input type="text" id="lastName" name="last_name" required>
          </div>
        </div>

        <div class="form-field">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" required>
          <p class="field-note">Your email address will not be sold or shared.</p>
        </div>

        <div class="form-field">
          <label for="message">Your Message</label>
          <textarea id="message" name="message" required></textarea>
        </div>

        <div class="checkbox-field">
          <input type="checkbox" id="announcements" name="announcements" value="yes">
          <label for="announcements">Yes, I want notices of new versions of Game Hub.</label>
        </div>

        <button type="submit" class="submit-btn">Send Message</button>
      </form>

    </div>
  </main>

</body>
</html>
