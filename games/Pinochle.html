  /* ===================================================================
     LAYOUT PHILOSOPHY
     Redesigned to match a reference screenshot: a solid green board with
     a black outline, named characters with cartoon avatars and speech
     bubbles, a bright yellow bidding panel in the center, and a
     Team/Score/Bid/Bidder/Melds table in the corner. Structurally it's
     still the same CSS-grid seating (N/W/felt/E/S) as before — this pass
     is almost entirely a re-skin, not a layout rewrite.
     =================================================================== */
  :root{
    --board-green: #3f9142;
    --board-green-dark: #327638;
    --board-border: #111111;
    --page-bg: #dfe7f0;
    --card-bg: #fffdf8;
    --card-border: #b7b7b7;
    --ink: #1b1b1b;
    --red: #b3261e;

    --yellow: #eef07a;
    --yellow-border: #2a2a10;
    --cream: #fffdf5;
    --cream-border: #222;

    --green-btn: #2f7d3a;
    --green-btn-dark: #235c2b;
    --pass-btn-bg: #8a2020;
    --pass-btn-border: #4a1010;

    --bubble-bg: #ffffff;
    --bubble-border: #111111;

    --cardback-1: #d6394a;   /* cardback diamond pattern, red */
    --cardback-2: #ffffff;   /* cardback diamond pattern, white */
    --cardback-border: #7a1c26;

    --shadow-soft: rgba(255,255,255,.55);
    --shadow-medium: rgba(0,0,0,.4);
    --shadow-strong: rgba(0,0,0,.6);
    --glow-active: rgba(255,255,255,.6);
  }
  *{ box-sizing: border-box; }
  html, body{ height: 100%; margin:0; }
  body{
    font-family: 'Inter', 'Segoe UI', Tahoma, sans-serif;
    background: var(--page-bg); /* light neutral backdrop so the board reads as a
                             framed play area, not a full-bleed background */
    color: var(--ink);
    display: flex;
    flex-direction: column;
    overflow: hidden; /* the page itself never scrolls — see the table-wrap
                          sizing notes below for how that's enforced */
  }

  .revBadge{
    position: fixed;
    top: 10px;
    right: 12px;
    z-index: 9999;
    font-size: 0.7rem;
    font-weight: 600;
    color: #000000;
    pointer-events: none;
  }

  /* ===== TEMPORARY DEBUG OUTLINES - toggled via the "Show Outlines"
     button, remove entirely once layout work is done. Each major
     layout box gets its own color so boundaries are easy to tell apart
     in a screenshot. Uses outline (not border), so nothing shifts or
     resizes - these are purely visual, drawn on top. ===== */
  body.debug-on #table-wrap{ outline: 2px solid magenta; outline-offset: -2px; }
  body.debug-on #seat-N{ outline: 2px solid orange; outline-offset: -2px; }
  body.debug-on #seat-W{ outline: 2px solid cyan; outline-offset: -2px; }
  body.debug-on #seat-E{ outline: 2px solid cyan; outline-offset: -2px; }
  body.debug-on #seat-S{ outline: 2px solid yellow; outline-offset: -2px; }
  body.debug-on #felt{ outline: 2px solid deeppink; outline-offset: -2px; }
  body.debug-on #trickArea{ outline: 2px solid lime; outline-offset: -2px; }
  body.debug-on #scoreTable{ outline: 2px solid blue; outline-offset: -2px; }
  body.debug-on #trumpBadge{ outline: 2px solid blue; outline-offset: -2px; }
  body.debug-on #sessionWinsBox{ outline: 2px solid blue; outline-offset: -2px; }
  body.debug-on #yourNameBox{ outline: 2px solid blue; outline-offset: -2px; }
  /* ===== END TEMPORARY DEBUG OUTLINES ===== */

  /* ---------- Buttons: small vertical stack, fixed to the left edge —
     replaces the old horizontal header bar, reclaiming its full height
     for the board itself. No page title anymore either, for the same
     reason - every bit of vertical space matters on a short window. ---------- */
  #pageTitle{
    margin: 0 0 10px;
    font-size: 2rem;
    font-weight: 800;
    letter-spacing: 2px;
    color: #1e3a22;
    text-shadow: 1px 1px 0 rgba(255,255,255,.5);
  }
  #buttonGroup{
    position: fixed;
    top: 10px; left: 10px;
    z-index: 70;
    display:flex;
    flex-direction: column;
    gap:6px;
  }
  #buttonGroup button{
    background: var(--cream);
    color: var(--ink);
    border: 2px solid var(--board-border);
    border-radius: 6px;
    padding: 6px 14px;
    cursor:pointer;
    font-size:.8rem;
    font-weight:700;
    white-space: nowrap;
  }
  #buttonGroup button:hover{ background:#fff; }

  /* ---------- The board ---------- */
  #table-wrap{
    display:grid;
    /* West/East columns scale between 110px and 150px based on window
       width, rather than a flat 150px that could squeeze the center
       column too hard on a narrower window. */
    /* Middle column now sized to match the felt's own max-width (320px)
       plus a 0.5in gap on each side, instead of 1fr - which let the
       felt sit centered with a large, uneven amount of green space
       between it and Mike/Lisa's boxes. Grid content is centered within
       table-wrap (see justify-content below) since the columns no
       longer necessarily fill the full board width. */
    grid-template-columns: clamp(105px,10vw,140px) 416px clamp(105px,10vw,140px);
    justify-content: center;
    /* One static layout for every phase — no more dynamically swapping
       row heights based on game phase. That was meant to free up space
       during bidding/melding, but forcing the whole grid to recompute on
       every phase change was almost certainly what caused the multi-
       second stutter, on top of making the board visibly jump around.
       Bill's row is tightened here instead (it had real unused space
       below his cards), redirecting that room to South's row, which is
       where the clipping actually happens. */
    /* Row heights now scale with the window's actual height (vh) rather
       than fixed pixel floors — on a shorter window (like a smaller
       resolution or a non-maximized browser), all three rows shrink
       together proportionally instead of the board silently overflowing
       and clipping South's row off the bottom. On a tall window, they
       grow up to the same maximums as before. */
    /* Calibrated against an actual measured window height of 578px
       (via the on-screen size readout) rather than guessing - at that
       height, table-wrap has roughly 524px total to split across all
       three rows. These floors add up to about 516px, leaving a small
       safety buffer. South's row gets the most since that's the
       player's own hand and the top priority to never clip. */
    /* Row 2 (Mike/Lisa + the felt) used to carry the 1fr flexible slot,
       which meant it greedily absorbed any leftover vertical space in
       the window - measured at a real 838px-tall window, that pushed
       row 2 to 238.6px even though its actual content (a 12-card
       cardback stack, name, and status line) only needs about 211px.
       That stolen space is exactly what South's row was missing when
       the name/status got clipped off the bottom. Row 2's max is now
       fixed just above its measured content need instead of 1fr, and
       South's row (row 3) carries the flexible slot instead, so any
       surplus height in the window now goes to the row that actually
       needs it. */
    /* Row 1 and row 2's floors (the fixed minimums below the clamp's own
       vh-based number) turned out to still be taller than they need to
       be - measured directly at a real 549px-tall window, the whole grid
       (both floors, plus gaps/padding/border) needed about 21px more than
       table-wrap actually had to give, and since a grid row won't shrink
       itself below its own stated floor, that 21px simply overflowed
       table-wrap's own clipped edge instead - landing on South's row
       since it's last. Trimmed both floors here (Bill's row and Mike/
       Lisa's row) well past that shortfall so South's row - the one
       that actually needs the protection - has real breathing room
       instead of just barely fitting. */
    grid-template-rows:
      minmax(clamp(122px,16vh,195px), 195px)
      minmax(clamp(165px,20vh,211px), 211px)
      minmax(clamp(183px,30vh,350px), 1fr);
    gap: 6px;
    padding: 10px;
    flex: 1;
    min-height: 0;
    overflow: hidden;
    background: var(--board-green);
    border: 4px solid var(--board-border);
    border-radius: 14px;
    /* Matches topBar's margin above so the title/buttons stay aligned
       with the board's edges at every window size. */
    /* Left/right margins no longer need to match, since the buttons
       are position:fixed (not part of this element's own layout).
       Left is sized to snugly fit the button stack's own width instead
       of the wider clamp used before, closing the dead gap between the
       buttons and the board. Right stays independently responsive. */
    margin: 0.05in clamp(0.2in, 7vw, 2.0in) 0.1in 165px;
    position: relative;
  }

  #pauseOverlay{
    display:none;
    position:absolute; inset:0; z-index:50;
    background: rgba(0,0,0,.15);
    /* Was pointer-events:none, which let clicks fall straight through to
       the board underneath while "paused" — you could still play a card
       or click a bid button mid-pause, which could leave game state
       inconsistent by the time a deferred AI/trick timer finally fired
       after resuming (the same silent-freeze pattern documented below
       in pausableTimeout/advanceTrick, just triggered a different way).
       Now the overlay actually blocks interaction with the board. */
    pointer-events:auto;
    align-items:flex-start; justify-content:center;
    padding-top: 16px;
  }
  #pauseOverlay .pause-badge{
    background: rgba(0,0,0,.75);
    color:#fff;
    font-size:1.3rem;
    font-weight:700;
    padding: 10px 22px;
    border-radius: 10px;
    text-align:center;
  }

  .seat{
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:flex-start;
    padding: 6px;
    position: relative;
    overflow: hidden; /* no scrollbars — content is sized to fit instead */
    min-height: 0;
  }
  /* Active-seat highlight now lives on the name itself since there's no
     avatar to glow anymore */
  .seat.active .name{
    text-shadow: 0 0 8px var(--glow-active), 0 1px 2px rgba(0,0,0,.6);
  }
  .seat .name{
    font-weight:700;
    font-size: calc(.9rem + 2px);
    color:#fff;
    text-shadow: 0 1px 2px rgba(0,0,0,.6);
  }
  .name-row{
    display:flex;
    align-items:center;
    gap:6px;
    width:100%;
    margin-top:2px;
    /* Never shrink or get squeezed out - a seat's name/status must always stay visible even
       when the available height is tighter than expected (a shorter window, a different font's
       metrics rendering a hand of cards slightly taller, etc). Without this, flexbox's default
       min-height:auto on #south-hand (see below) kept it from actually shrinking, so on a tight
       window this row (and meta-line right after it) could get pushed entirely past seat-S's own
       clipped bottom edge instead - i.e. the name/status simply wasn't there. */
    flex-shrink:0;
  }
  #seat-N .name-row, #seat-S .name-row{ justify-content:center; }
  #seat-W .name-row{ justify-content:center; }
  #seat-E .name-row{ justify-content:center; }
  /* Combines what used to be two separate lines (Declarer/Dealer tag,
     and tricks-taken count) into one — that alone meaningfully shrinks
     how much height each seat needs, which is what was causing "Declarer"
     to get clipped at the bottom of the board. */
  .meta-line{
    font-size:.68rem;
    font-weight:700;
    min-height: 1em;
    text-align:center;
    white-space: nowrap;
    flex-shrink:0; /* same reasoning as .name-row above - the Dealer/Declarer status line must
                       never be the thing that gets squeezed off-screen on a tight window */
  }
  .meta-line .tag{ color: var(--yellow); text-shadow: 0 1px 2px rgba(0,0,0,.7); }
  .meta-line .tricks{ color:#fff; text-shadow: 0 1px 2px rgba(0,0,0,.6); }
  .meta-line .sep{ color:#fff; opacity:.6; margin: 0 3px; }

  /* Speech bubbles — hidden until showBubble() reveals them, with a
     little CSS-triangle tail pointing back toward the avatar that said it.
     display:none by default (not just opacity:0) so a hidden bubble takes
     up zero layout space — with big cards now, every seat's height is
     tight, and a bubble reserving space it isn't using was part of what
     squeezed the rest of the board. */
  .bubble{
    display:none;
    position:relative;
    background: var(--bubble-bg);
    border: 2px solid var(--bubble-border);
    border-radius: 16px;
    padding: 9px 16px;
    font-size:1.05rem;
    font-weight:600;
    color: var(--ink);
    max-width: 190px;
    text-align:center;
    pointer-events:none;
    z-index: 10;
  }
  .bubble.visible{ display:block; }
  /* West/East columns are narrower than North/South's open space, so
     their bubbles get a smaller font + tighter padding to keep bid
     text on one line without needing the column itself to be wide. */
  #bubble-N, #bubble-S, #bubble-W, #bubble-E{
    font-size: .85rem;
    padding: 6px 10px;
  }
  #bubble-W, #bubble-E{
    max-width: 130px;
  }
  #bubble-N, #bubble-S{
    margin-left: 12px;
  }
  .bubble.tail-top::before, .bubble.tail-top::after{
    content:''; position:absolute; left:22px; border:9px solid transparent;
  }
  .bubble.tail-top::before{ top:-18px; border-bottom-color: var(--bubble-border); }
  .bubble.tail-top::after{ top:-15px; border-bottom-color: var(--bubble-bg); }
  .bubble.tail-bottom::before, .bubble.tail-bottom::after{
    content:''; position:absolute; left:22px; border:9px solid transparent;
  }
  .bubble.tail-bottom::before{ bottom:-18px; border-top-color: var(--bubble-border); }
  .bubble.tail-bottom::after{ bottom:-15px; border-top-color: var(--bubble-bg); }
  .bubble.tail-left::before, .bubble.tail-left::after{
    content:''; position:absolute; top:50%; transform:translateY(-50%); border:9px solid transparent;
  }
  .bubble.tail-left::before{ left:-18px; border-right-color: var(--bubble-border); }
  .bubble.tail-left::after{ left:-15px; border-right-color: var(--bubble-bg); }
  .bubble.tail-right::before, .bubble.tail-right::after{
    content:''; position:absolute; top:50%; transform:translateY(-50%); border:9px solid transparent;
  }
  .bubble.tail-right::before{ right:-18px; border-left-color: var(--bubble-border); }
  .bubble.tail-right::after{ right:-15px; border-left-color: var(--bubble-bg); }

  /* Cardback fans: horizontal (North) vs vertical (West/East) */
  .cardback-row{ display:flex; margin-top:6px; }
  #seat-W .cardback-row, #seat-E .cardback-row{ margin-top:-6px; }
  .cardback-row.vertical{ flex-direction:column; align-items:center; }
  .cardback{
    width:84px; height:118px;
    /* Diamond lattice instead of plain diagonal stripes: a solid red base
       with two crossing sets of white diagonal bands. The earlier stripe
       version had its first gradient layer fully opaque, which hid the
       second layer entirely — this version keeps both bands translucent
       enough that they actually weave together. */
    background-color: var(--cardback-1);
    background-image:
      repeating-linear-gradient(45deg, transparent 0 4px, var(--cardback-2) 4px 8px),
      repeating-linear-gradient(-45deg, transparent 0 4px, var(--cardback-2) 4px 8px);
    border: 1px solid var(--cardback-border);
    border-radius:6px;
    margin-left:-60px;
  }
  .cardback-row .cardback:first-child{ margin-left:0; }
  /* No per-card content on a cardback, so the vertical stack (West/East)
     can overlap far more aggressively than a real hand of cards could —
     that's what keeps 12 full-size cardbacks fitting in the seat's height.
     They're also rotated 90° — a common convention for the side seats in
     card game UIs, so the cards read as "facing" the table's center. */
  /* Mike/Lisa's 12-card hands now sit in an actual 3x4 grid (see .cardback-row.vertical
     above), sized down from the normal 84x118 cardback so 3 fit across their narrow side
     column - no overlap or rotation trick needed since a real grid handles the spacing. */
  .cardback-row.vertical .cardback{ margin-left:0; margin-top:-113px; transform: rotate(90deg); }
  .cardback-row.vertical .cardback:first-child{ margin-top:0; }

  /* Small face-down pile shown at the center of the felt only while the
     dealing animation (animateDealIn(), see script below) is running —
     hidden the rest of the time. Same cardback pattern/colors as the real
     .cardback class, just sized down and absolutely stacked, so it reads
     as "the deck" without touching that class's row-overlap margins. */
  #dealDeck{
    display:none;
    position:absolute;
    top:50%; left:50%;
    width:40px; height:56px;
    transform:translate(-50%,-50%);
    z-index:5;
  }
  #dealDeck .deal-deck-card{
    position:absolute;
    top:0; left:0;
    width:40px; height:56px;
    border-radius:5px;
    background-color: var(--cardback-1);
    background-image:
      repeating-linear-gradient(45deg, transparent 0 4px, var(--cardback-2) 4px 8px),
      repeating-linear-gradient(-45deg, transparent 0 4px, var(--cardback-2) 4px 8px);
    border: 1px solid var(--cardback-border);
    box-shadow: 1px 2px 3px var(--shadow-medium);
  }
  #dealDeck .deal-deck-card:nth-child(2){ transform: translate(2px,-2px); }
  #dealDeck .deal-deck-card:nth-child(3){ transform: translate(4px,-4px); }


  #seat-N{ grid-column:2; grid-row:1; }
  /* align-self:start so these hug their own content (name + card stack)
     instead of the default grid stretch-to-fill-the-row behavior, which
     was leaving visible empty green space below Mike/Lisa's card piles
     up to row 2's full track height - the same fix already applied to
     #felt for the same reason. This tightens the visible aqua outline
     around the actual content, though - like felt - it doesn't by
     itself change how tall row 2 needs to be, since that's still set by
     the tallest content in the row (Mike/Lisa's 12-card stack). */
  #seat-W{ grid-column:1; grid-row:2; align-self:start; }
  #seat-E{ grid-column:3; grid-row:2; align-self:start; }
  /* South spans all 3 columns instead of being confined to the same
     narrow center column as North — South's hand needs noticeably more
     horizontal room than North's overlapping cardback row, and this
     also gives South's name/status line enough room to render instead
     of being squeezed out by the cramped narrow column. */
  #seat-S{ grid-column:1 / span 3; grid-row:3; justify-content:flex-start; }

  /* ---------- Center area: trick-in-progress AND the bidding UI share
     this space, since only one is ever relevant at a given moment ---------- */
  #felt{
    grid-column:2; grid-row:2;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:8px;
    position:relative;
    overflow: hidden;
    min-height: 0;
    /* Hugs the actual trick-card area (3 x 84px cards) instead of
       stretching to fill the entire middle column, which was making
       the red-bordered box look far wider than the cards it contains.
       Centered within the column via margin:auto. */
    max-width: 320px;
    width: 100%;
    margin: 0 auto;
    /* Without this, a grid item stretches to fill its row's full height
       by default - since row 2 is noticeably taller than the trick
       display actually needs, that left the red double-border box with
       a lot of empty green space inside it, top and bottom. align-self
       lets it size to its own content instead and just center itself
       within the row, which is what made the box look oversized. */
    align-self: center;
    /* #felt has no visible content at all for a brief moment between
       hands (after the deal animation finishes and before the first
       bid appears) and briefly between tricks - with align-self:center
       alone, that moment collapsed the whole double red border down to
       a flat sliver, since an empty flex column has no height of its
       own. This floor keeps the box a sensible size at all times while
       still letting it shrink well below the old full-row-height
       stretch the rest of the time.
       152px specifically - not just "big enough to look right" - the
       North and South trick-slot cards are only 2px tall on paper (see
       #trickArea's row heights below) and rely on overflowing that row
       to show a full card; measured directly, a full 4-card trick needs
       about 149px of vertical room top-to-bottom to avoid clipping
       North's or South's card. The first version of this fix (140px)
       was sized from the control panels (bidding/meld/passing), which
       are shorter than that and don't show a trick - so it never
       surfaced this until an actual trick with both North and South
       cards down was captured. */
    min-height: 152px;
    /* Double red border around the center playing area, with a 2px gap
       between the two lines. Using box-shadow rather than outline —
       #felt has overflow:hidden, and outline rendering next to an
       element's own overflow:hidden is unreliable across browsers even
       though it shouldn't be per spec. box-shadow doesn't have that
       problem. The first ring matches the felt's own green background
       (table-wrap's background, since felt itself has none) to fake the
       gap; the second is the actual outer red line. */
    box-shadow: 0 0 0 2px var(--board-green), 0 0 0 4px var(--red);
  }
  #trickArea{
    display:grid;
    grid-template-areas:
      ".    n    ."
      "w    c    e"
      ".    s    .";
    /* Equal-width columns so no played card is narrower than another.
       Rows scale with viewport height (matching the same approach as
       the board's own rows) so the whole trick display shrinks on a
       shorter window instead of poking outside the felt's red border —
       the top/bottom rows overlap into the middle row rather than each
       card needing its own full-height row. */
    /* Columns/rows sized to match the actual scaled card footprint
       (0.7 scale = ~59x83px), with a ~10px gap between cards - this is
       the largest gap that fits within the tight vertical budget this
       board has to work with at a 578px-tall window (see the row2
       floor comment below); a full 12px (0.125in) gap would push the
       required space just over that floor and risk clipping South's
       hand again. */
    grid-template-columns: 59px 59px 59px;
    grid-template-rows: 2px 83px 2px;
    gap: 10px;
    gap:0;
  }
  .trick-slot{ display:flex; align-items:center; justify-content:center; overflow:visible; }
  /* Played cards specifically are scaled down ~20% - this is scoped
     only to cards inside the trick area (not your hand, not the
     decks), so it shrinks their real rendered footprint enough to
     comfortably fit inside the felt at any window size without
     clipping, without touching card sizing anywhere else on the page. */
  .trick-slot .card{ transform: scale(0.7); }
  /* Stacking order for the overlap - keeps a consistent, readable
     layering every trick regardless of play order. */
  #tc-N{ grid-area:n; z-index:1; }
  #tc-W{ grid-area:w; z-index:2; }
  #tc-S{ grid-area:s; z-index:3; }
  #tc-E{ grid-area:e; z-index:4; }
  /* Mike/Lisa's bid bubbles are direct grid items instead of being nested
     inside their aqua boxes, so they never contribute to seat-W/seat-E's
     own layout height (that's what stops them from pushing the card piles
     down). They used to be anchored in Bill's row (row 1) above Mike/Lisa's
     own row, which visually put the bubble on top of their name instead of
     beside it, then (Revision 11) moved beside the name but toward the
     felt. Per request, now anchored to the OUTSIDE of the name instead -
     Mike's bubble off the left edge of his own column, Lisa's off the
     right edge of hers. table-wrap's grid is centered inside a wider box
     (see its own justify-content:center), which leaves real unused green
     space outside column 1/3 - wide enough for a one-line bubble like
     "I bid 250" without overlapping the card stack or running off the
     board, at any window width the game supports. positionSideBubble()
     (see script) measures the actual rendered gap to the name each time a
     bubble is shown and nudges it to ~18px via a transform, so this stays
     correct at any window size instead of guessing a fixed number.
     align-self:start plus the small top margin lines the bubble up with
     the name text's own vertical position near the top of the seat. */
  #bubble-W{ grid-column:1; grid-row:2; justify-self:start; align-self:start; margin-top:2px; z-index:20; }
  #bubble-E{ grid-column:3; grid-row:2; justify-self:end; align-self:start; margin-top:2px; z-index:20; }

  #trumpBadge{
    /* Placed directly into North's row, aligned to the left edge of
       East's column (justify-self:start) - stays exactly flush with
       Lisa's box regardless of that column's actual width. */
    grid-column: 3; grid-row: 1;
    justify-self: start; align-self: start;
    margin-top: 8px;
    position:relative; z-index:15;
    background: var(--shadow-soft);
    color:#1b1b1b;
    border: 2px solid rgba(0,0,0,.35);
    border-radius: 12px;
    padding: 8px 20px;
    font-size:1.35rem;
    font-weight:700;
    /* Without this, a longer trump name (Diamonds is the longest of the four) wrapped onto its
       own second line instead of widening the box - the min-width JS below only sets a floor,
       it doesn't make the box grow to fit unwrapped content on its own. nowrap forces the text
       to stay on one line, which is what actually makes the box grow to fit it. */
    white-space: nowrap;
  }

  /* ---------- Card visuals ---------- */
  /* Rank+suit live in the top-left corner (mirrored bottom-right), with a
     big suit symbol in the middle. This is the traditional playing-card
     layout for a reason: when cards overlap in a fan, the next card
     covers the RIGHT side of the one under it, so corner content stays
     visible — centered content (what this used to be) gets covered up
     and becomes unreadable the moment cards overlap. */
  .card{
    width:84px; height:118px;
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 6px;
    display:flex;
    flex-direction:column;
    justify-content:space-between;
    padding: 4px;
    font-weight:800;
    box-shadow: 1px 2px 3px var(--shadow-medium);
    color: var(--ink);
    user-select:none;
  }
  .card.red{ color: var(--red); }
  .card .corner{ font-size:1.1rem; line-height:1; }
  .card .center-suit{ font-size:2.6rem; text-align:center; }
  /* Grid cells in #trickArea are 68x93 — this now uses nearly all of
     that (previously 62x87, which was too small to hold text at the
     1.1rem/2.6rem sizes without the bottom corner overflowing past the
     card's edge). Tighter padding reclaims a bit more room too. */
  .card.mini{ width:66px; height:91px; padding:2px; }
  .card.mini .corner{ font-size:1.1rem; }
  .card.mini .center-suit{ font-size:2.6rem; }

  /* South (human) hand — overlapping fan (restored), sized big to match
     the reference. overflow is hidden rather than auto/scroll on both
     axes: the overlap keeps 12 cards well within the available width so
     there's nothing to scroll to in the first place. */
  #south-hand{
    display:flex;
    justify-content:center;
    flex-wrap: nowrap;
    overflow: hidden;
    margin-top: 2px;
    padding: 20px 4px 6px;
    width: 100%;
    /* min-height:0 overrides flexbox's default min-height:auto on a column flex item (seat-S is
       display:flex; flex-direction:column). Without this, the hand couldn't actually shrink below
       its own natural content height on a tight window - it would just keep its full size and
       push name-row/meta-line (both flex-shrink:0 now) past seat-S's own clipped bottom edge
       instead, which is what was making the name/status vanish. With this, if space ever runs
       short, it's the hand's own top padding/overflow that quietly gives first, while the name
       and status stay put. */
    min-height: 0;
  }
  #south-hand .cardWrap{
    flex-shrink: 0;
    margin-left: -50px;
    position: relative; /* lets z-index below actually take effect */
  }
  #south-hand .cardWrap:first-child{ margin-left: 0; }
  /* When reviewing cards passed to you as declarer, your hand temporarily
     grows to 16 — the normal -50px overlap was sized for exactly 12
     cards, so 16 cards at that spacing overflowed the container width
     and got clipped (mostly the leftmost card, since overflow:hidden
     with centered content clips unevenly once combined with the overlap
     direction). Tighter overlap keeps the full, larger hand within the
     same width. */
  #south-hand.crowded .cardWrap{ margin-left: -59px; }
  #south-hand.crowded .cardWrap:first-child{ margin-left: 0; }
  #south-hand .card{
    cursor:pointer;
    transition: transform .12s;
  }
  #south-hand .card:hover{ transform: translateY(-8px); }
  /* Applied briefly during a genuine south-hand rebuild (see render()) so
     a card your mouse is already on doesn't visibly animate into its
     hover-lifted state — it should just already be there. */
  #south-hand.no-transition .card{ transition: none !important; }
  #south-hand .card.disabled{
    opacity:.35;
    cursor: not-allowed;
  }
  #south-hand .card.disabled:hover{ transform:none; }
  /* Selection indicator is border/glow only — deliberately NOT using
     transform. Any transform value (even a small translateY) makes CSS
     paint that element above every normal, non-transformed sibling,
     regardless of hand order — that's what kept covering neighbors no
     matter how much z-index or margin was layered on top of it. Skipping
     transform entirely means the selected card stays in its normal
     stacking position, so the fan's overlap order is completely
     unaffected by selection. */
  #south-hand .cardWrap.selected .card{
    box-shadow: 0 0 0 3px #fff, 0 0 0 5px var(--board-border), 1px 2px 3px var(--shadow-medium);
  }
  /* "Used" = appeared in at least one declared meld already — a subtle
     marker only, the card stays fully selectable for reuse in another
     meld (e.g. a queen in a marriage can also count toward "queens
     around"), unlike the old hard lock this replaced. */

  /* ---------- Bid / Pass / Meld control panels ---------- */
  .control-panel{
    display:none;
    gap:6px;
    flex-wrap:wrap;
    justify-content:center;
    align-items:center;
    background: var(--yellow);
    border: 2px solid var(--yellow-border);
    border-radius: 10px;
    padding: 8px 10px;
    margin-top:4px;
    width: 100%;
    max-width: 380px;
    max-height: 100%;
    overflow: hidden; /* no scrollbars — content is sized to fit instead */
  }
  .control-panel.wide-panel{ max-width: 480px; }
  @keyframes blink-win{ 0%,49%{ opacity:1; } 50%,100%{ opacity:0; } }
  .win-blink{ animation: blink-win 1s step-start infinite; }
  .control-panel table{ width:100%; border-collapse:collapse; font-size:.85rem; margin-bottom:6px; }
  .control-panel td, .control-panel th{ border:1px solid #b3a94a; padding:3px 8px; text-align:center; }
  .control-panel th{ background: rgba(255,255,255,.25); }
  /* Round Complete's two tables need to fit in less space than a normal
     control-panel gets — tighter padding/font here instead of scrolling. */
  .control-panel.wide-panel table{ font-size:.78rem; margin-bottom:4px; }
  .control-panel.wide-panel td, .control-panel.wide-panel th{ padding:1px 8px; }
  .control-panel.wide-panel h3{ margin: 0 0 4px; }
  .control-panel.wide-panel button{ padding:3px 12px; margin-top:2px; }
  .control-panel h3{
    width:100%; text-align:center; margin:0 0 2px;
    font-size:.88rem; color:#3a3a10;
  }
  .control-panel button{
    background: #fff;
    color: var(--ink);
    border: 2px solid var(--board-border);
    border-radius: 6px;
    padding: 4px 12px;
    cursor:pointer;
    font-weight:700;
  }
  .control-panel button:hover{ background:#f2f2f2; }
  .control-panel button:disabled{ opacity:.4; cursor:not-allowed; }
  .control-panel button.pass{ background:var(--pass-btn-bg); color:#fff; border-color:var(--pass-btn-border); }
  .control-panel .bidStatus{ width:100%; text-align:center; font-size:calc(.78rem + 3px); color:#3a3a10; margin-bottom:2px; }
  .control-panel .meldGroupList{ width:100%; font-size:calc(.72rem + 3px); max-height:60px; overflow-y:auto; margin-bottom:4px; text-align:center; color:#3a3a10; }
  /* Meld panel needs more room than the other control panels — it now
     carries an extra instructional line plus the running group list. */
  /* Meld panel floats as its own popup instead of being squeezed inside
     the felt's limited space — unlike Round Complete, melding needs you
     to keep clicking cards in your hand while this is open, so it can't
     use the full-screen modal overlay (that would block those clicks).
     position:fixed also means it's never subject to felt's overflow
     clipping, so it can never get truncated. */
  #meldPanel{
    position: fixed;
    top: 90px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 60;
    width: 90%;
    box-shadow: 0 4px 20px rgba(0,0,0,.4);
  }
  #meldPanel{ min-height: 190px; }
  #meldPanel .meldGroupList{ max-height: 90px; }
  #meldPanel .meldHelp{ width:100%; text-align:center; font-size:calc(.78rem + 3px); color:#3a3a10; margin-bottom:4px; line-height:1.3; }

  /* ---------- Score table (top-left corner) — restyled to match the
     Trump badge's look: same dark-green translucent background, white
     bold text, rounded border, instead of the old small cream table. ---------- */
  #scoreTable{
    /* Placed directly into North's row, aligned to the right edge of
       West's column (justify-self:end) - this keeps it exactly flush
       with Mike's box regardless of how wide that column ends up being,
       instead of a fixed pixel position that could drift out of
       alignment. */
    grid-column: 1; grid-row: 1;
    justify-self: end; align-self: start;
    margin-top: 8px;
    position:relative; z-index:15;
    background: var(--shadow-soft);
    border: 2px solid rgba(0,0,0,.35);
    border-radius: 10px;
    padding: 7px 10px;
    box-shadow: 0 2px 6px var(--shadow-medium);
  }
  #scoreTable table{ border-collapse: collapse; }
  #scoreTable th, #scoreTable td{
    padding: 3px 10px;
    text-align:center;
    white-space:nowrap;
    color:#1b1b1b;
  }
  #scoreTable th{
    font-size:calc(.68rem + 2px);
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:.5px;
    border-bottom: 1px solid rgba(0,0,0,.3);
  }
  #scoreTable td{ font-size:calc(.85rem + 2px); font-weight:400; }
  #scoreTable tr:not(:last-child) td{ border-bottom: 1px solid rgba(0,0,0,.15); }

  /* ---------- This Session's Wins / Your Name (bottom corners of the board) ----------
     Styled to be an exact match of AceyDeucey's "This Session's Wins" box: same
     cream-dark background, black border, Arial font, bold underlined title.
     Anchored exactly the same way #scoreTable/#trumpBadge anchor to the top
     corners: grid-column limited to just the West/East column (not spanning the
     full board width) with justify-self:end/start, so each box's outer edge is
     pinned to the very same West/East column boundary the top boxes use, and the
     two rows of corner boxes line up vertically. align-self:end drops it to the
     bottom of row 3, below South's hand/name/status (which pack to the top of
     that row) - the same surplus green space at the bottom of the board that
     earlier revisions freed up. A shared fixed width keeps the two new boxes
     exactly the same size regardless of their differing content. */
  .corner-box{
    grid-row: 3;
    align-self: end;
    position:relative; z-index:15;
    box-sizing:border-box;
    width:180px;
    min-height:73px;
    /* background:#d8c8a0; */
    background: var(--shadow-soft);
    border:2px solid #000000;
    border-radius:8px;
    padding:8px 12px;
    font-family:Arial, Helvetica, sans-serif;
    color:#000000;
    text-align:left;
  }
  #sessionWinsBox{ grid-column: 1; justify-self: end; margin: 0 0 8px 0; }
  #yourNameBox{ grid-column: 3; justify-self: start; margin: 0 0 8px 0; }
  .corner-box-title{
    font-weight:bold;
    text-decoration:underline;
    font-size:0.85rem;
    margin-bottom:6px;
    white-space:nowrap;
  }
  #yourNameBox .corner-box-title{ text-align:center; }
  .corner-box-stats{ font-size:0.8rem; white-space:nowrap; }
  /* Each row's label sits on the left, its value on the right, so the two counts
     line up in their own column regardless of either team label's length -
     same pattern as AceyDeucey's Remaining Pips rows. */
  .wins-row{ display:flex; justify-content:space-between; gap:10px; }
  .wins-row + .wins-row{ margin-top:2px; }
  .wins-value{ font-weight:700; text-align:right; }
  #yourNameInput{
    width:100%;
    box-sizing:border-box;
    padding:4px 8px;
    border-radius:5px;
    border:1px solid #000;
    font-family:Arial, Helvetica, sans-serif;
    font-size:0.8rem;
    background:#fffdf5;
    color:#000;
  }

  /* ---------- Log ---------- */
  #outlineToggle{
    /* Invisible but still clickable in its original spot - opacity:0
       (unlike display:none) keeps it in the page layout and able to
       receive clicks, it just isn't visually rendered. Matches logToggle below. */
    opacity:0;
    position:fixed; bottom:50px; left:10px;
    background: var(--cream); color:var(--ink);
    border:2px solid var(--board-border); border-radius:20px;
    padding:8px 14px; cursor:pointer; font-size:.8rem; z-index:50;
  }
  #logToggle{
    /* Invisible but still clickable in its original spot - opacity:0
       (unlike display:none) keeps it in the page layout and able to
       receive clicks, it just isn't visually rendered. */
    opacity:0;
    position:fixed; bottom:10px; left:10px;
    background: var(--cream); color:var(--ink);
    border:2px solid var(--board-border); border-radius:20px;
    padding:8px 14px; cursor:pointer; font-size:.8rem; z-index:50;
  }
  #logPanel{
    position:fixed; bottom:50px; left:10px; width:320px; max-height:50vh;
    background: var(--cream); border:2px solid var(--board-border); border-radius:8px;
    padding:10px; overflow-y:auto; font-size:.78rem; z-index:50; display:none;
    color: var(--ink);
  }
  #logPanel div{ margin-bottom:4px; border-bottom:1px solid #ccc; padding-bottom:3px;}

  /* ---------- Diagnostic readout (temporary - see debug-on toggle) ----------
     Shown alongside the debug outlines. Reports the actual live window
     size and whether South's name/status line fits inside it, so a
     screenshot taken with outlines on tells us the real numbers instead
     of us having to guess them from cropped screenshots. */
  #debugReadout{
    display:none;
    position:fixed; top:8px; right:8px; z-index:60;
    background: rgba(0,0,0,.8); color:#fff;
    font-family: monospace; font-size:12px; line-height:1.5;
    padding:8px 12px; border-radius:6px;
    white-space:pre;
  }
  body.debug-on #debugReadout{ display:block; }

  /* ---------- Universal modal ---------- */
  #universalModal{
    display:none;
    position:fixed; inset:0;
    background: transparent;
    z-index:100;
  }
  #universalModal .modalBox{
    position: fixed;
    box-shadow: 0 4px 20px rgba(0,0,0,.5);
    background: var(--cream);
    color: var(--ink);
    border: 3px solid var(--board-border);
    border-radius: 12px;
    padding: 22px;
    max-width: 520px;
    width: 90%;
    max-height: 80vh;
    overflow-y:auto;
  }
  #universalModal h2{ margin-top:0; color: var(--ink); text-align:center; }
  #universalModal .modalBody{ font-size:.92rem; line-height:1.5; text-align:center; }
  #universalModal .modalBtns{
    display:flex; gap:10px; justify-content:center; margin-top:16px;
  }
  #universalModal button{
    background: var(--green-btn); color: #fff;
    border:2px solid var(--board-border); border-radius:6px;
    padding:8px 16px; cursor:pointer; font-weight:600;
  }
  #universalModal button:hover{ background: var(--green-btn-dark); }

  /* Exit-confirmation look, matching AceyDeucey's "Exit Game" popup exactly (cream/gold,
     Playfair Display + Space Mono). Scoped to .modalBox.exit-style, which showModal() only
     adds when its new extraClass argument is 'exit-style' (see the Exit button handler below)
     - every other popup on this page (Rules, Options, Round Complete, etc.) keeps its normal
     green-bordered look. */
  #universalModal .modalBox.exit-style{
    background:#eee1c6;
    color:#241608;
    border-width:2px;
    border-color:#c9a227;
  }
  #universalModal .modalBox.exit-style h2{
    font-family:'Playfair Display', serif;
    font-weight:700;
    color:#241608;
  }
  #universalModal .modalBox.exit-style .modalBody{
    font-family:'Space Mono', monospace;
    color:#241608;
  }
  #universalModal .modalBox.exit-style .modalBtns button{
    background:#e6c65c;
    color:#241608;
    border:2px solid #c9a227;
    font-family:'Playfair Display', serif;
    font-weight:700;
  }
  #universalModal .modalBox.exit-style .modalBtns button:hover{
    filter:brightness(1.06);
  }
  #universalModal .modalBox.exit-style .modalBtns button:last-child{
    background:#d8c8a0;
  }

  /* Recorded Scores popup gets a taller cap than the default 80vh so its
     (now-limited-to-12) rows fit without a scrollbar. Scoped to
     .modalBox.scores-style (set only by showScoresModal()) so Round
     Complete / Win Game / Rules keep the normal 80vh cap. */
  #universalModal .modalBox.scores-style{
    max-height: 92vh;
  }

  #universalModal table{ width:100%; border-collapse: collapse; font-size:.85rem; }
  #universalModal td, #universalModal th{ padding:3px 6px; border-bottom:1px solid #ccc; text-align:left;}
  /* Team name headers and their numbers center under each other - only
     the leftmost row-label column (Bid, Meld Score, etc.) stays
     left-aligned, since that reads naturally as a label list. */
  #universalModal th:not(:first-child),
  #universalModal td:not(:first-child){ text-align:center; }
  /* The Round Complete / Win popups stack two separate <table>
     elements. Each table normally sizes its own first column based on
     its own row labels ("Bid" vs "Previous Score", etc.), so the two
     tables' columns didn't line up visually even though each one was
     internally centered. Forcing a shared fixed width for every
     table's first column keeps both tables' team-name columns aligned
     with each other. */
  #universalModal td:first-child,
  #universalModal th:first-child{ width:150px; }

  /* Recorded Scores table (Pinochle): its first column is just a short rank
     number ("1.", "2.", ...), not a row label like the Round Complete
     tables use their first column for - so it doesn't need that shared
     150px width, which was what pushed the number away from "Winner" and
     left the rest of the table looking off-center in the popup. Narrowing
     the rank column back down to its own content and centering the table
     as a block (instead of stretching it to the popup's full width) pulls
     the number snug against "Winner" and centers the whole table. */
  #universalModal table.scores-table{ width:auto; margin:0 auto; }
  #universalModal table.scores-table td:first-child,
  #universalModal table.scores-table th:first-child{
    width:auto;
    text-align:right;
    padding-right:2px;
  }
  #universalModal table.scores-table td:not(:first-child),
  #universalModal table.scores-table th:not(:first-child){
    padding-left:14px;
  }
  /* Date is the last column - right-justified per Perry's request, overriding the generic
     center-alignment every other non-first column in this table gets above. */
  #universalModal table.scores-table td:last-child,
  #universalModal table.scores-table th:last-child{
    text-align:right;
  }
  /* Row spacing trimmed by ~1/32in total (top+bottom padding 3px+3px down
     to 1.5px+1.5px) - only for this table, so Round Complete/Win Game's
     tables (which share the generic #universalModal td/th rule above) are
     untouched. Same reduction already applied to 500's Recorded Scores. */
  #universalModal table.scores-table td,
  #universalModal table.scores-table th{
    padding-top: 1.5px;
    padding-bottom: 1.5px;
  }

  /* =================================================================
     Border around the whole playing field. Kept deliberately simple —
     a plain `border`, nothing fancier — after both the outline and
     box-shadow versions of a double-line effect reportedly weren't
     showing up at all. This is about as bulletproof as CSS gets, so if
     even this doesn't show, the cause is something other than the
     border technique itself.
     ================================================================= */

  @media (max-width: 720px){
    #table-wrap{
      grid-template-columns: 80px 1fr 80px;
      grid-template-rows: minmax(120px,140px) minmax(150px,1fr) minmax(180px,210px);
      margin: 6px 16px 10px;
    }
    .card, .cardback{ width:44px; height:64px; }
    .card .corner{ font-size:.62rem; }
    .card .center-suit{ font-size:1.2rem; }
    #south-hand .cardWrap{ margin-left: -22px; }
    .cardback-row .cardback{ margin-left: -30px; }
    .cardback-row.vertical .cardback{ margin-left:0; margin-top: -58px; }
    #scoreTable th{ font-size:.62rem; }
    #scoreTable td{ font-size:.8rem; }
    #scoreTable th, #scoreTable td{ padding: 2px 8px; }
    #pageTitle{ font-size:1.1rem; }
    #topBar{ padding: 5px 0; margin: 0 16px; }
    #topBar button{ padding:5px 9px; font-size:.7rem; }
  }
</style>
</head>
<body>

<script>
  const PAGE_REVISION = 38;
  document.getElementById('revBadge').textContent = 'Rev. ' + PAGE_REVISION;

/* =====================================================================
   PINOCHLE — standalone game
   4 players (partnership): South = You, North = your partner (AI),
   East & West = opponents (AI). Single 48-card deck (two copies of
   9,J,Q,K,10,A in each suit). Standard American partnership rules,
   simplified in a few places noted inline where full auction-pinochle
   rules get genuinely ambiguous between different house-rule sets.
   ===================================================================== */

// ---------------------------------------------------------------------
// CONSTANTS
// ---------------------------------------------------------------------
const SUITS = ['♠','♥','♦','♣'];
const RED_SUITS = ['♥','♦'];
const RANKS = ['A','10','K','Q','J','9']; // trick-taking strength order, high to low
// Card point values are fixed by the game (not house-rule flexible) —
// this is what makes the 240 (+10 for last trick = 250) point deck.
const RANK_POINTS = { 'A':10, '10':10, 'K':10, 'Q':0, 'J':0, '9':0 };
const RANK_STRENGTH = { 'A':6, '10':5, 'K':4, 'Q':3, 'J':2, '9':1 };
// "Counters" in pinochle jargon — the big scoring cards. Used by the
// house rule requiring the non-declaring team to win at least one trick
// containing one of these, or forfeit their meld for the hand.
const COUNTER_RANKS = ['A','10','K'];

const SEATS = ['S','W','N','E']; // turn order is clockwise; S sits at bottom, W left, N top, E right
const SEAT_NAME = { S:'You', W:'Mike', N:'Bill', E:'Lisa' };
const TEAM = { S:'NS', N:'NS', W:'EW', E:'EW' };
const PARTNER = { S:'N', N:'S', W:'E', E:'W' };
// Team labels for the score table — built from SEAT_NAME so renaming a
// character above automatically updates the table too.
// Function instead of a fixed object so it always reflects the current
// SEAT_NAME.S — needed since the player can rename themselves in Options.
function getTeamLabel(team){
  return team === 'NS' ? `${SEAT_NAME.S} & ${SEAT_NAME.N}` : `${SEAT_NAME.W} & ${SEAT_NAME.E}`;
}

// Player's own name ("Your Name" box, lower-right corner) - persisted in localStorage so it's
// remembered the next time the app is opened, not just for the current tab/session (the same
// treatment given to AceyDeucey's and Yahtzee's player-name fields). #south-name and
// #yourNameInput already exist in the DOM at this point (this script tag sits after
// #table-wrap in the markup), so it's safe to apply the saved name to both right here.
const PLAYER_NAME_KEY = 'pinochlePlayerName_v1';
try {
  const savedPlayerName = localStorage.getItem(PLAYER_NAME_KEY);
  if(savedPlayerName && savedPlayerName.trim()){
    SEAT_NAME.S = savedPlayerName.trim();
    document.getElementById('south-name').textContent = SEAT_NAME.S;
    document.getElementById('yourNameInput').value = SEAT_NAME.S;
  }
} catch(e) { /* ignore */ }

// "This Session's Wins" tally (lower-left corner box) - counts whole GAMES won by
// each team this session, not individual hands. Persisted in sessionStorage (like
// AceyDeucey's own session-wins feature) so a refresh mid-game doesn't lose the
// count, but it's never reset on New Game - only an intentional Exit clears it.
// Lets an in-progress game survive Instructions (opens in a new tab, which inherits a copy of
// this tab's sessionStorage) and Back to Pinochle in that tab - see saveResumeState /
// tryRestoreResumeState below. Without this, Back to Pinochle always looked like a fresh page
// load and silently dealt a brand new game over the one still running in the original tab.
const RESUME_KEY = 'pinochleResumeState_v1';

const SESSION_WINS_KEY = 'pinochleSessionWins_v1';
let sessionWins = { NS:0, EW:0 };
function loadSessionWins(){
  try{
    const raw = sessionStorage.getItem(SESSION_WINS_KEY);
    if(raw){
      const parsed = JSON.parse(raw);
      if(typeof parsed.NS === 'number' && typeof parsed.EW === 'number'){
        sessionWins = parsed;
      }
    }
  }catch(e){ /* sessionStorage unavailable - just keep the zeroed default */ }
}
function saveSessionWins(){
  try{ sessionStorage.setItem(SESSION_WINS_KEY, JSON.stringify(sessionWins)); }catch(e){}
}
loadSessionWins();

const MIN_BID = 250;
const BID_STEP = 10;
const GAME_TARGET = 1500;
// Was previously two separate hardcoded numbers (120 in the AI's bidding
// logic, 130 in the human bid panel) that had no relationship to MIN_BID
// at all — meaning raising MIN_BID could put it ABOVE those caps, and
// nobody would ever be able to bid. Scales proportionally now instead.
const MAX_BID = Math.round(MIN_BID * 2.4);
// House-rule addition: after trump is named, each player passes this many
// cards to their partner before melding. Not part of every pinochle
// ruleset — easy to set to 0 to turn the feature off entirely.
const PASS_COUNT = 4;

// ---------------------------------------------------------------------
// STATE
// Kept as one object so it's easy to see the whole shape of a "hand"
// at a glance, and so render() can just read from a single source.
// ---------------------------------------------------------------------
let state = {
  scores: { NS: 0, EW: 0 },
  dealerIdx: 0,          // index into SEATS of current dealer
  hands: { S:[], N:[], E:[], W:[] },
  trump: null,
  bid: 0,
  bidWinner: null,
  bidHistory: [],
  biddingOrder: [],
  biddingTurn: 0,
  passesInRow: 0,
  passedSeats: new Set(), // seats that have passed this auction — skipped for the rest of it
  highestBidderSeenBid: false,
  phase: 'deal',          // deal | bidding | trump | passing | humanMeld | meld | play | scoring
  melds: { S:0, N:0, E:0, W:0 },
  meldDetail: { S:[], N:[], E:[], W:[] },
  trick: {},               // seat -> card currently on the felt
  trickLeader: null,
  trickResolving: false,   // true from the moment a trick is first detected complete
                            // until it's actually cleared - guards against resolving it twice
  tricksWon: { NS: [], EW: [] }, // arrays of card-point totals per trick, for reference
  pointsThisHand: { NS: 0, EW: 0 },
  lastTrickWinner: null,
  cardsPlayedCount: 0,

  // --- card passing: sequential declarer/partner exchange ---
  passSelection: [],       // card ids the human has picked so far this stage
  passDeclarer: null,      // seat that won the bid
  passPartner: null,       // declarer's partner seat
  passStage: 'toDeclarer', // 'toDeclarer' | 'toPartner' — which half of the exchange is active
  passStageOneCards: [],   // cards partner sent to declarer, for the recap modal
  passStageTwoCards: [],   // cards declarer sent back, for the recap modal

  // --- manual human melding ---
  humanMeldSelection: [],     // card ids currently highlighted, not yet declared
  humanMeldUsed: new Set(), // card ids used in at least one declared meld — informational only, no longer blocks reselection
  humanMeldGroups: [],        // [{label, points, cardIds}] — what the player has declared so far
  humanMeldTotal: 0,
  meldError: '',               // feedback shown inside the meld panel when a declare attempt is invalid

  // --- score table (Bid/Bidder columns show each team's most recent bid) ---
  teamBidInfo: { NS: { amount:0, bidder:null }, EW: { amount:0, bidder:null } },

  // --- tricks taken this hand, per player (not per team) ---
  tricksTaken: { S:0, N:0, E:0, W:0 },

  // House rule: has the non-declaring team won at least one trick with a
  // counter (A/10/K) yet this hand? If not by the end, their meld is
  // forfeited.
  nonDeclarerWonCounterTrick: false,

  // Options setting: when true, the AI declares South's meld automatically
  // (same calcMeld() logic used for the other three players) instead of
  // South melding by hand. Deliberately not reset by dealNewHand()/newGame()
  // — it's a standing preference, not per-round state.
  aiCreatesMelds: false,

  // Options setting: when true, shows every player's actual cards (as
  // compact colored text, not full card graphics) instead of cardbacks —
  // for testing/debugging. Also not reset by dealNewHand()/newGame().
  viewAllCards: false,

  // Options setting: enables the spacebar as a pause/resume toggle.
  spacebarPauseEnabled: false,
  // Live pause state — when true, scheduled AI/game-progression timers
  // (bidding, playing, trick advancement) hold off firing until unpaused.
  // Doesn't block your own manual actions if it happens to be your turn.
  paused: false
};

let log = [];
// Tracks the last HTML rendered into #south-hand — used to skip
// recreating the DOM when nothing about it actually changed (see render()).
let _lastSouthHandHtml = '';
// Bumped every time animateDealIn() starts a new deal animation - each of
// its scheduled steps captures the id at the time it was scheduled and
// no-ops if a newer deal has since started (defensive; nothing in the game
// currently re-deals mid-animation, but this keeps a stray double-deal from
// leaving two overlapping animations fighting over the same card elements).
let dealAnimId = 0;

// ---------------------------------------------------------------------
// DECK / DEAL
// ---------------------------------------------------------------------
function buildDeck(){
  const deck = [];
  SUITS.forEach(suit=>{
    RANKS.forEach(rank=>{
      // two copies of every card — this is the "double deck" feel of
      // pinochle even though it's technically a single 48-card pack
      deck.push({ suit, rank, id: suit+rank+'_a' });
      deck.push({ suit, rank, id: suit+rank+'_b' });
    });
  });
  return deck;
}

function shuffle(arr){
  for(let i=arr.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [arr[i],arr[j]] = [arr[j],arr[i]];
  }
  return arr;
}

function sortHand(cards){
  // Group by suit, and within suit low-to-high left-to-right — makes the
  // human hand readable and gives the AI a stable, predictable view.
  const suitOrder = ['♠','♥','♣','♦'];
  return [...cards].sort((a,b)=>{
    if(a.suit !== b.suit) return suitOrder.indexOf(a.suit) - suitOrder.indexOf(b.suit);
    return RANK_STRENGTH[a.rank] - RANK_STRENGTH[b.rank];
  });
}

// Pause support: wraps setTimeout so scheduled game-progression callbacks
// (AI bidding/playing, trick advancement) respect state.paused. If still
// paused when the timer would fire, it just keeps rechecking every 200ms
// instead of firing — once unpaused, it runs normally.
function pausableTimeout(fn, delay){
  const wrapped = () => {
    if(state.paused){
      setTimeout(wrapped, 200);
    } else {
      // Guarded: fn() drives bidding/passing/trick-play progression, and
      // an uncaught error here (e.g. from state left inconsistent by
      // something that happened while paused) used to die silently right
      // here — nothing else was scheduled to pick the chain back up, so
      // the game looked permanently frozen right at the moment of
      // resuming. Catch it, log it, and at least re-render so the board
      // isn't left visually stuck even if that particular step failed.
      try {
        fn();
      } catch(err){
        console.error('pausableTimeout: game-progression step failed', err);
        addLog('⚠ Something went wrong resuming the game. If it looks stuck, try New Hand.');
        render();
      }
    }
  };
  setTimeout(wrapped, delay);
}

function dealNewHand(){
  try {
    dealNewHandInner();
  } catch(err){
    // Every path that starts a new hand (Deal Next Round, Start a new
    // game, and the very first deal at startup) funnels through here.
    // Previously an uncaught error partway through this — however
    // unlikely — would leave state.hands partly reset with nothing to
    // show and nothing to click, which looks exactly like a frozen game
    // with no cards, and no indication anything went wrong.
    console.error('dealNewHand failed', err);
    addLog('⚠ Something went wrong starting the new hand. If the board looks stuck, try Exit and reopen, or use New Hand from the menu.');
    render();
  }
}
function dealNewHandInner(){
  const deck = shuffle(buildDeck());
  state.hands = { S:[], N:[], E:[], W:[] };
  for(let i=0;i<48;i++){
    const seat = SEATS[i % 4];
    // deal starting left of dealer, one card of a 4-round deal — for a
    // human it doesn't matter who "physically" gets card 1, so we just
    // deal round-robin across all four seats.
    state.hands[seat].push(deck[i]);
  }
  SEATS.forEach(s => state.hands[s] = sortHand(state.hands[s]));

  state.trump = null;
  document.getElementById('trumpBadge').innerHTML = '<span style="font-weight:400;">Trump:</span>';
  state.bid = 0;
  state.bidWinner = null;
  state.bidHistory = [];
  state.passesInRow = 0;
  state.passedSeats = new Set();
  state.melds = { S:0, N:0, E:0, W:0 };
  state.meldDetail = { S:[], N:[], E:[], W:[] };
  state.trick = {};
  state.trickLeader = null;
  state.trickResolving = false;
  state.pointsThisHand = { NS:0, EW:0 };
  state.lastTrickWinner = null;
  state.cardsPlayedCount = 0;
  state.passSelection = [];
  state.passDeclarer = null;
  state.passPartner = null;
  state.passStage = 'toDeclarer';
  state.passStageOneCards = [];
  state.passStageTwoCards = [];
  state.humanMeldSelection = [];
  state.humanMeldUsed = new Set();
  state.humanMeldGroups = [];
  state.humanMeldTotal = 0;
  state.meldError = '';
  state.teamBidInfo = { NS: { amount:0, bidder:null }, EW: { amount:0, bidder:null } };
  state.tricksTaken = { S:0, N:0, E:0, W:0 };
  state.nonDeclarerWonCounterTrick = false;
  hideAllBubbles();

  // bidding starts to the left of the dealer
  const startIdx = (state.dealerIdx + 1) % 4;
  state.biddingOrder = [0,1,2,3].map(i => SEATS[(startIdx+i)%4]);
  state.biddingTurn = 0;
  state.phase = 'bidding';

  addLog(`New hand dealt. Dealer: ${SEAT_NAME[SEATS[state.dealerIdx]]}. Bidding starts with ${SEAT_NAME[state.biddingOrder[0]]}.`);
  render();
  animateDealIn();
}

// ---------------------------------------------------------------------
// DEAL ANIMATION
// Flies each of the 48 cards out from a small pile at the center of the
// felt to its already-correct spot in that seat's hand, in the same
// S/W/N/E round-robin order dealNewHandInner() just dealt them in. render()
// (called right before this) has already built the exact, final hand
// markup - south's real cards fanned out, N/W/E's cardbacks in their rows -
// so this never changes what gets shown, only how it arrives. It works by
// grabbing each already-positioned card element, offsetting it back to the
// deck with a CSS transform (which doesn't affect layout, so nothing about
// the fan/row positions changes), then transitioning that offset back to
// zero, staggered card by card. setHandMsg()/processBiddingTurn() - which
// the deal used to call immediately - are deferred until the animation
// finishes, so bidding doesn't start while cards are still arriving.
function animateDealIn(){
  const myId = ++dealAnimId;

  // The "View All Cards" debug option replaces N/W/E's cardbacks with a
  // plain text grid (see render()) - there's nothing card-shaped to fly in
  // for those seats, so skip the animation entirely rather than fake it.
  if(state.viewAllCards){
    setHandMsg('');
    processBiddingTurn();
    return;
  }

  const seatEls = {
    S: Array.from(document.querySelectorAll('#south-hand .cardWrap')),
    N: Array.from(document.querySelectorAll('#cards-N .cardback')),
    W: Array.from(document.querySelectorAll('#cards-W .cardback')),
    E: Array.from(document.querySelectorAll('#cards-E .cardback')),
  };
  // Defensive: if the DOM doesn't actually have 12 elements per seat for
  // any reason, skip the animation rather than risk animating the wrong
  // elements (or crashing on a missing one) - just deal instantly instead.
  if(!SEATS.every(s => seatEls[s].length === 12)){
    setHandMsg('');
    processBiddingTurn();
    return;
  }

  // Walk the elements in the same order dealNewHandInner()'s own loop dealt
  // them (SEATS = ['S','W','N','E'], one card per seat per round) - not the
  // cards' identities, just which already-rendered element flies in at
  // which step, so South's fan reveals left-to-right in its normal sorted
  // order while N/W/E's interchangeable cardbacks fill in alongside it.
  const nextIdx = { S:0, N:0, W:0, E:0 };
  const flat = [];
  for(let round=0; round<12; round++){
    SEATS.forEach(seat => flat.push({ seat, el: seatEls[seat][nextIdx[seat]++] }));
  }

  const feltRect = document.getElementById('felt').getBoundingClientRect();
  const deckCenter = { x: feltRect.left + feltRect.width/2, y: feltRect.top + feltRect.height/2 };
  // West/East's cardbacks are permanently rotated 90° by .cardback-row.vertical
  // .cardback - that rotation has to stay part of the transform throughout
  // (an inline transform would otherwise silently override the CSS one and
  // the backs would flash unrotated for the deal).
  const ROTATE = { N:'', S:'', W:'rotate(90deg)', E:'rotate(90deg)' };
  const FLIGHT_MS = 380, STAGGER_MS = 34;

  // #table-wrap, each .seat, and #south-hand all clip their own content
  // (overflow:hidden, so hands/panels never spill past the board's edges)
  // - which would clip the "flying" part of this animation the moment a
  // card's mid-flight position is outside its own seat's box, since every
  // card starts this animation already living inside its final seat's DOM.
  // Relaxed for the duration of the animation only, then restored exactly
  // as part of the completion step below - nothing else changes state
  // during this window (bidding hasn't started yet), so this is safe.
  const overflowEls = [
    document.getElementById('table-wrap'),
    document.getElementById('seat-N'),
    document.getElementById('seat-W'),
    document.getElementById('seat-E'),
    document.getElementById('seat-S'),
    document.getElementById('south-hand'),
  ];
  overflowEls.forEach(el => { el.style.overflow = 'visible'; });

  const deckPile = document.getElementById('dealDeck');
  deckPile.style.display = 'block';

  // Snap every card back to the deck's position via a transform offset -
  // done synchronously, in the same tick as the render() call just above,
  // so the browser never paints the fully-dealt hand before the animation
  // starts (nothing about the element's actual layout position changes).
  flat.forEach(({seat, el}) => {
    const r = el.getBoundingClientRect();
    const dx = deckCenter.x - (r.left + r.width/2);
    const dy = deckCenter.y - (r.top + r.height/2);
    el.style.transition = 'none';
    el.style.opacity = '0';
    el.style.transform = `translate(${dx}px, ${dy}px) ${ROTATE[seat]} scale(0.8)`;
  });

  // Reveal them one at a time, same order as dealt.
  flat.forEach(({seat, el}, i) => {
    pausableTimeout(() => {
      if(dealAnimId !== myId) return;
      void el.offsetWidth; // force the hidden/offset state above to commit first
      el.style.transition = 'transform 0.38s cubic-bezier(.22,.85,.4,1), opacity 0.18s ease';
      requestAnimationFrame(() => {
        if(dealAnimId !== myId) return;
        el.style.opacity = '1';
        el.style.transform = `translate(0,0) ${ROTATE[seat]} scale(1)`;
      });
    }, i * STAGGER_MS);
  });

  // Cleanup + hand off to bidding once the last card has landed.
  pausableTimeout(() => {
    if(dealAnimId !== myId) return;
    deckPile.style.display = 'none';
    overflowEls.forEach(el => { el.style.overflow = ''; });
    flat.forEach(({el}) => {
      el.style.transition = '';
      el.style.opacity = '';
      el.style.transform = '';
    });
    setHandMsg('');
    processBiddingTurn();
  }, (flat.length - 1) * STAGGER_MS + FLIGHT_MS + 80);
}

// ---------------------------------------------------------------------
// MELD CALCULATION
// Each player melds only their OWN 12-card hand (partnership pinochle
// rule — you don't combine hands). Team meld = sum of the two partners.
// This meld table is the common "standard American" set; some kitchen-
// table groups vary the four-of-a-kind values or add a 9-of-trump
// ("dix") bonus — easy to tweak the numbers below if you play those.
// ---------------------------------------------------------------------
function calcMeld(hand, trump){
  const detail = [];
  let total = 0;
  const count = (suit, rank) => hand.filter(c=>c.suit===suit && c.rank===rank).length;

  // --- Run: A-10-K-Q-J of trump ---
  const runCards = ['A','10','K','Q','J'];
  const runCopies = Math.min(...runCards.map(r=>count(trump,r)));
  if(runCopies >= 1){
    const pts = runCopies===2 ? 1500 : 150;
    total += pts;
    detail.push({ label: `${runCopies===2?'Double run':'Run'} (A-10-K-Q-J of trump)`, points: pts });
  }

  // --- Marriages (K+Q same suit) ---
  // A run already "uses up" one K/Q pair of trump, so we only count
  // marriages beyond what the run already accounted for.
  SUITS.forEach(suit=>{
    let kCount = count(suit,'K');
    let qCount = count(suit,'Q');
    if(suit === trump && runCopies >= 1){
      kCount -= runCopies; qCount -= runCopies;
    }
    const pairs = Math.max(0, Math.min(kCount,qCount));
    if(pairs > 0){
      const per = suit===trump ? 40 : 20;
      total += per*pairs;
      detail.push({ label: `${pairs>1?pairs+'x ':''}${suit===trump?'Royal marriage':'Marriage'} (${suit})`, points: per*pairs });
    }
  });

  // --- Pinochle: J♦ + Q♠ ---
  const jd = count('♦','J'), qs = count('♠','Q');
  const pinPairs = Math.min(jd,qs);
  if(pinPairs === 1){ total += 40; detail.push({ label:'Pinochle (J♦+Q♠)', points:40 }); }
  if(pinPairs === 2){ total += 300; detail.push({ label:'Double pinochle', points:300 }); }

  // --- Dix: 9 of trump ---
  const dixCount = count(trump, '9');
  if(dixCount === 1){ total += 10; detail.push({ label:'Dix (9 of trump)', points:10 }); }
  if(dixCount === 2){ total += 20; detail.push({ label:'Double dix', points:20 }); }

  // --- Four of a kind (one of each suit), single or double set ---
  const quadTable = { A:[100,1000], K:[80,800], Q:[60,600], J:[40,400] };
  Object.keys(quadTable).forEach(rank=>{
    const copies = Math.min(...SUITS.map(s=>count(s,rank)));
    if(copies >= 1){
      const pts = copies===2 ? quadTable[rank][1] : quadTable[rank][0];
      total += pts;
      detail.push({ label: `${copies===2?'Double ':''}${rank==='A'?'Aces':rank==='K'?'Kings':rank==='Q'?'Queens':'Jacks'} around`, points: pts });
    }
  });

  return { total, detail };
}

// ---------------------------------------------------------------------
// MANUAL MELD VALIDATION (South only)
// Checks an exact set of selected cards against the same combo values
// used above in calcMeld — this is what makes manual melding "real"
// rather than just cosmetic: if the selection doesn't exactly match a
// known combo, it's rejected and the player has to try again, the same
// way a mis-laid meld would get challenged at a real table.
// ---------------------------------------------------------------------
function rankAroundLabel(r){ return {A:'Aces', K:'Kings', Q:'Queens', J:'Jacks'}[r]; }

function validateMeldSelection(cards, trump){
  if(!cards.length) return { valid:false };

  // Run / double run: exactly A-10-K-Q-J of trump, once or twice each
  if(cards.every(c=>c.suit===trump)){
    const need = ['A','10','K','Q','J'];
    const countRank = r => cards.filter(c=>c.rank===r).length;
    if(cards.length===5 && need.every(r=>countRank(r)===1)){
      return { valid:true, label:'Run (A-10-K-Q-J of trump)', points:150 };
    }
    if(cards.length===10 && need.every(r=>countRank(r)===2)){
      return { valid:true, label:'Double run', points:1500 };
    }
  }

  // Marriage / double marriage: K+Q (or 2x K+Q) of the same suit
  if(cards.length===2 && cards[0].suit===cards[1].suit){
    const ranks = cards.map(c=>c.rank).sort().join(',');
    if(ranks === 'K,Q'){
      const suit = cards[0].suit;
      return { valid:true, label: (suit===trump?'Royal marriage':'Marriage')+` (${suit})`, points: suit===trump?40:20 };
    }
  }
  if(cards.length===4 && cards.every(c=>c.suit===cards[0].suit)){
    const suit = cards[0].suit;
    const kC = cards.filter(c=>c.rank==='K').length, qC = cards.filter(c=>c.rank==='Q').length;
    if(kC===2 && qC===2){
      const per = suit===trump ? 80 : 40;
      return { valid:true, label:(suit===trump?'Double royal marriage':'Double marriage')+` (${suit})`, points: per };
    }
  }

  // Pinochle / double pinochle: J♦ + Q♠
  if(cards.length===2){
    const jd = cards.filter(c=>c.suit==='♦' && c.rank==='J').length;
    const qs = cards.filter(c=>c.suit==='♠' && c.rank==='Q').length;
    if(jd===1 && qs===1) return { valid:true, label:'Pinochle (J♦+Q♠)', points:40 };
  }
  if(cards.length===4){
    const jd = cards.filter(c=>c.suit==='♦' && c.rank==='J').length;
    const qs = cards.filter(c=>c.suit==='♠' && c.rank==='Q').length;
    if(jd===2 && qs===2) return { valid:true, label:'Double pinochle', points:300 };
  }

  // Dix / double dix: 9 of trump
  if(cards.length===1 && cards[0].suit===trump && cards[0].rank==='9'){
    return { valid:true, label:'Dix (9 of trump)', points:10 };
  }
  if(cards.length===2 && cards.every(c=>c.suit===trump && c.rank==='9')){
    return { valid:true, label:'Double dix', points:20 };
  }

  // Around / double around: one (or two) of a rank in every suit
  if(cards.length===4){
    const rank = cards[0].rank;
    if(['A','K','Q','J'].includes(rank) && cards.every(c=>c.rank===rank)){
      const suitsSeen = new Set(cards.map(c=>c.suit));
      if(suitsSeen.size===4){
        const table = { A:100, K:80, Q:60, J:40 };
        return { valid:true, label:`${rankAroundLabel(rank)} around`, points: table[rank] };
      }
    }
  }
  if(cards.length===8){
    const rank = cards[0].rank;
    if(['A','K','Q','J'].includes(rank) && cards.every(c=>c.rank===rank)){
      const bySuit = {};
      cards.forEach(c=> bySuit[c.suit] = (bySuit[c.suit]||0)+1);
      if(Object.keys(bySuit).length===4 && Object.values(bySuit).every(v=>v===2)){
        const table = { A:1000, K:900, Q:600, J:400 };
        return { valid:true, label:`Double ${rankAroundLabel(rank)} around`, points: table[rank] };
      }
    }
  }

  return { valid:false };
}

// ---------------------------------------------------------------------
// BIDDING
// Simple auction: each player either passes or names a bid strictly
// higher than the current one. If all four pass, the hand is redealt
// with the next dealer rather than forcing anyone to take a bid.
// ---------------------------------------------------------------------
function processBiddingTurn(){
  if(state.phase !== 'bidding') return;

  const activeSeats = SEATS.filter(s => !state.passedSeats.has(s));

  // Ends the auction: only one bidder left standing with a live bid.
  // (This replaces the old "3 consecutive passes" check — now that a
  // passed player is skipped permanently rather than just for one turn,
  // passesInRow could still be under 3 at the exact moment only one
  // active bidder remains, which left the game re-prompting that lone
  // bidder to bid against no one — the actual cause of the "nothing
  // happens after bidding ends" freeze.)
  if(state.bid > 0 && activeSeats.length <= 1){
    finishBidding();
    return;
  }
  // Everyone passed with no bid at all — redeal with the next dealer,
  // rather than forcing the dealer to take a default bid they never
  // actually earned.
  if(activeSeats.length === 0){
    addLog(`All four players passed. Redealing with the next dealer.`);
    nextHand();
    return;
  }

  // Skip anyone who's already passed this hand — they're out of the
  // auction, not just sitting out a single turn.
  while(state.passedSeats.has(state.biddingOrder[state.biddingTurn % 4])){
    state.biddingTurn++;
  }
  const seat = state.biddingOrder[state.biddingTurn % 4];

  highlightActiveSeat(seat);

  if(seat === 'S'){
    renderBidPanel();
  } else {
    pausableTimeout(()=> aiBid(seat), 700);
  }
}

function aiBid(seat){
  const hand = state.hands[seat];
  // ceiling estimates the whole PARTNERSHIP's likely combined score,
  // not just this seat's own hand — a bid has to be met by both
  // partners' meld + tricks together. PARTNER_BASELINE is a rough
  // estimate of an average partner's own contribution (meld + likely
  // trick points), so a merely-average hand doesn't look artificially
  // weak just because we can't see the partner's cards.
  const PARTNER_BASELINE = 125;
  const ceiling = Math.min(MAX_BID, estimateHandStrength(hand) + PARTNER_BASELINE);
  const nextBid = state.bid === 0 ? MIN_BID : state.bid + BID_STEP;

  if(nextBid <= ceiling && nextBid <= MAX_BID){
    placeBid(seat, nextBid);
  } else {
    placePass(seat);
  }
}

function estimateHandStrength(hand){
  // Realistic point estimate used for AI bidding: meld counts at its
  // full, guaranteed value (once declared, it's added to score
  // outright), while trick-taking cards count for meaningfully less
  // than their full 10-point value, since actually winning the trick
  // they're in is never certain. Off-suit aces count for even less
  // than trump ones, since a trump lead or a stronger off-suit card
  // can beat them. This intentionally weights meld far more heavily
  // than raw card-counting, so a hand with modest meld doesn't get an
  // inflated bid ceiling just from holding a few strong cards.
  let best = 0;
  SUITS.forEach(suit=>{
    const meld = calcMeld(hand, suit).total;
    let counterEstimate = 0;
    hand.forEach(c=>{
      const isTrump = c.suit === suit;
      if(c.rank==='A') counterEstimate += isTrump ? 7 : 3;
      else if(c.rank==='10') counterEstimate += isTrump ? 6 : 0;
      else if(c.rank==='K') counterEstimate += isTrump ? 5 : 0;
    });
    const score = meld + counterEstimate;
    if(score > best) best = score;
  });
  return best;
}

function bestTrumpFor(hand){
  let best = SUITS[0], bestScore = -1;
  SUITS.forEach(suit=>{
    const meld = calcMeld(hand, suit).total;
    const length = hand.filter(c=>c.suit===suit).length;
    const score = meld + length*8;
    if(score > bestScore){ bestScore = score; best = suit; }
  });
  return best;
}

function placeBid(seat, amount){
  state.bid = amount;
  state.bidWinner = seat;
  state.passesInRow = 0;
  state.bidHistory.push(`${SEAT_NAME[seat]}: ${amount}`);
  state.teamBidInfo[TEAM[seat]] = { amount, bidder: SEAT_NAME[seat] };
  addLog(`${SEAT_NAME[seat]} bids ${amount}.`);
  showBubble(seat, `I bid ${amount}`, true);
  state.biddingTurn++;
  render();
  pausableTimeout(processBiddingTurn, 350);
}

function placePass(seat){
  state.passesInRow++;
  state.passedSeats.add(seat);
  state.bidHistory.push(`${SEAT_NAME[seat]}: Pass`);
  addLog(`${SEAT_NAME[seat]} passes.`);
  showBubble(seat, 'Pass', true);
  state.biddingTurn++;
  render();
  pausableTimeout(processBiddingTurn, 350);
}

function renderBidPanel(){
  const panel = document.getElementById('bidPanel');
  panel.style.display = 'flex';
  const next = state.bid === 0 ? MIN_BID : state.bid + BID_STEP;

  let html = `<h3>What is your bid?</h3>`;
  if(state.bid > 0){
    html += `<div class="bidStatus">Current high bid: ${state.bid} (${SEAT_NAME[state.bidWinner]})</div>`;
  }
  // offer a small ladder of bid choices rather than a raw number input —
  // faster to click through, and keeps bidding brisk. Increments scale
  // with BID_STEP so they still make sense if that constant changes.
  const options = [next, next + BID_STEP];
  options.forEach(v=>{
    if(v <= MAX_BID + BID_STEP) html += `<button onclick="humanBid(${v})">${v}</button>`;
  });
  html += `<button class="pass" onclick="humanPass()">Pass</button>`;
  panel.innerHTML = html;
}

function humanBid(amount){
  document.getElementById('bidPanel').style.display = 'none';
  placeBid('S', amount);
}
function humanPass(){
  document.getElementById('bidPanel').style.display = 'none';
  placePass('S');
}

function finishBidding(){
  document.getElementById('bidPanel').style.display = 'none';
  hideAllBubbles();
  clearActiveSeat();
  addLog(`Bidding won by ${SEAT_NAME[state.bidWinner]} at ${state.bid}.`);
  state.phase = 'trump';
  render(); // refreshes the board immediately (e.g. the score table's Bid column) instead of waiting on whatever happens next

  if(state.bidWinner === 'S'){
    promptHumanTrumpChoice();
  } else {
    const trump = bestTrumpFor(state.hands[state.bidWinner]);
    setTrump(trump);
  }
}

function promptHumanTrumpChoice(){
  const panel = document.getElementById('trumpPanel');
  panel.style.display = 'flex';
  const btns = SUITS.map(s=>`<button onclick="chooseTrump('${s}')">${s} ${suitName(s)}</button>`).join('');
  panel.innerHTML = `<h3>You won the bid at ${state.bid}! Choose your trump suit:</h3>${btns}`;
}
function chooseTrump(suit){
  document.getElementById('trumpPanel').style.display = 'none';
  setTrump(suit);
}
function suitName(s){ return {'♠':'Spades','♥':'Hearts','♦':'Diamonds','♣':'Clubs'}[s]; }

function setTrump(suit){
  state.trump = suit;
  addLog(`Trump is ${suit} ${suitName(suit)}.`);
  const isRed = RED_SUITS.includes(suit);
  const color = isRed ? '#b3261e' : '#000000';
  document.getElementById('trumpBadge').innerHTML = `<span style="font-weight:400;">Trump:</span> <span style="color:${color}">${suit} ${suitName(suit)}</span>`;
  startPassingPhase();
}

// ---------------------------------------------------------------------
// CARD PASSING — sequential declarer/partner exchange
// House-rule addition: right after trump is named, the declarer's
// partner passes PASS_COUNT cards to the declarer FIRST. The declarer
// then reviews their now-larger hand and passes PASS_COUNT cards back.
// This works the same regardless of which of the four seats ended up
// declarer — "partner" and "declarer" are roles computed from
// state.bidWinner, not hardcoded to any particular seat.
// ---------------------------------------------------------------------
function aiChoosePassCards(seat, trump, favorHigh=false){
