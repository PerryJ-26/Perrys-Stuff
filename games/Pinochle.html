



<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Pinochle</title>
<style>
  /* ===================================================================
     LAYOUT PHILOSOPHY
     Redesigned to match a reference screenshot: a solid green board with
     a black outline, named characters with cartoon avatars and speech
     bubbles, a bright yellow bidding panel in the center, and a
     Team/Score/Bid/Bidder/Melds table in the corner. Structurally it's
     still the same CSS-grid seating (N/W/felt/E/S) as before — this pass
     is almost entirely a re-skin, not a layout rewrite.
     =================================================================== */
  :root{
    --board-green: #3f9142;
    --board-green-dark: #327638;
    --board-border: #111111;
    --page-bg: #dfe7f0;
    --card-bg: #fffdf8;
    --card-border: #b7b7b7;
    --ink: #1b1b1b;
    --red: #b3261e;

    --yellow: #eef07a;
    --yellow-border: #2a2a10;
    --cream: #fffdf5;
    --cream-border: #222;

    --green-btn: #2f7d3a;
    --green-btn-dark: #235c2b;
    --pass-btn-bg: #8a2020;
    --pass-btn-border: #4a1010;

    --bubble-bg: #ffffff;
    --bubble-border: #111111;

    --cardback-1: #d6394a;   /* cardback diamond pattern, red */
    --cardback-2: #ffffff;   /* cardback diamond pattern, white */
    --cardback-border: #7a1c26;

    --shadow-soft: rgba(255,255,255,.45);
    --shadow-medium: rgba(0,0,0,.4);
    --shadow-strong: rgba(0,0,0,.6);
    --glow-active: rgba(255,255,255,.6);
  }
  *{ box-sizing: border-box; }
  html, body{ height: 100%; margin:0; }
  body{
    font-family: 'Segoe UI', Tahoma, sans-serif;
    background: var(--page-bg); /* light neutral backdrop so the board reads as a
                             framed play area, not a full-bleed background */
    color: var(--ink);
    display: flex;
    flex-direction: column;
    overflow: hidden; /* the page itself never scrolls — see the table-wrap
                          sizing notes below for how that's enforced */
  }

  /* ---------- Page title ---------- */
  /* ---------- Top bar: title left, buttons right, one row ---------- */
  #topBar{
    flex-shrink: 0;
    display:flex;
    justify-content:space-between;
    align-items:center;
    height: 44px; /* fixed, rather than sized by its content — this way
                      pageTitle's font-size can grow without taking any
                      space away from table-wrap/felt below it */
    padding: 0;
    margin: 0 4in; /* matches table-wrap's own side margins so the title
                       and buttons line up with the board's left/right
                       edges below, instead of the viewport's edges */
  }
  #pageTitle{
    margin: 0;
    font-size: 2rem;
    font-weight: 800;
    letter-spacing: 2px;
    color: #1e3a22;
    text-shadow: 1px 1px 0 rgba(255,255,255,.5);
  }
  #buttonGroup{
    display:flex;
    gap:10px;
  }
  #topBar button{
    background: var(--cream);
    color: var(--ink);
    border: 2px solid var(--board-border);
    border-radius: 6px;
    padding: 6px 14px;
    cursor:pointer;
    font-size:.8rem;
    font-weight:700;
  }
  #topBar button:hover{ background:#fff; }

  /* ---------- The board ---------- */
  #table-wrap{
    display:grid;
    grid-template-columns: 150px 1fr 150px;
    /* One static layout for every phase — no more dynamically swapping
       row heights based on game phase. That was meant to free up space
       during bidding/melding, but forcing the whole grid to recompute on
       every phase change was almost certainly what caused the multi-
       second stutter, on top of making the board visibly jump around.
       Bill's row is tightened here instead (it had real unused space
       below his cards), redirecting that room to South's row, which is
       where the clipping actually happens. */
    grid-template-rows: minmax(175px,195px) minmax(300px,1fr) minmax(265px,350px);
    gap: 6px;
    padding: 10px;
    flex: 1;
    min-height: 0;
    overflow: hidden;
    background: var(--board-green);
    border: 4px solid var(--board-border);
    border-radius: 14px;
    /* Trimmed further from last pass to free up more room for the board
       now that cards are bigger — sides stay generous, top/bottom are
       kept to just what's needed. */
    margin: 0.05in 4in 0.1in;
    position: relative;
  }

  #pauseOverlay{
    display:none;
    position:absolute; inset:0; z-index:50;
    background: rgba(0,0,0,.15);
    /* Was pointer-events:none, which let clicks fall straight through to
       the board underneath while "paused" — you could still play a card
       or click a bid button mid-pause, which could leave game state
       inconsistent by the time a deferred AI/trick timer finally fired
       after resuming (the same silent-freeze pattern documented below
       in pausableTimeout/advanceTrick, just triggered a different way).
       Now the overlay actually blocks interaction with the board. */
    pointer-events:auto;
    align-items:flex-start; justify-content:center;
    padding-top: 16px;
  }
  #pauseOverlay .pause-badge{
    background: rgba(0,0,0,.75);
    color:#fff;
    font-size:1.3rem;
    font-weight:700;
    padding: 10px 22px;
    border-radius: 10px;
    text-align:center;
  }

  .seat{
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:flex-start;
    padding: 6px;
    position: relative;
    overflow: hidden; /* no scrollbars — content is sized to fit instead */
    min-height: 0;
  }
  /* Active-seat highlight now lives on the name itself since there's no
     avatar to glow anymore */
  .seat.active .name{
    text-shadow: 0 0 8px var(--glow-active), 0 1px 2px rgba(0,0,0,.6);
  }
  .seat .name{
    font-weight:700;
    font-size: calc(.9rem + 2px);
    color:#fff;
    text-shadow: 0 1px 2px rgba(0,0,0,.6);
  }
  .name-row{
    display:flex;
    align-items:center;
    gap:6px;
    width:100%;
    margin-top:2px;
  }
  #seat-N .name-row, #seat-S .name-row{ justify-content:center; }
  #seat-W .name-row{ justify-content:flex-start; }
  #seat-E .name-row{ justify-content:flex-end; }
  /* Combines what used to be two separate lines (Declarer/Dealer tag,
     and tricks-taken count) into one — that alone meaningfully shrinks
     how much height each seat needs, which is what was causing "Declarer"
     to get clipped at the bottom of the board. */
  .meta-line{
    font-size:.68rem;
    font-weight:700;
    min-height: 1em;
    text-align:center;
    white-space: nowrap;
  }
  .meta-line .tag{ color: var(--yellow); text-shadow: 0 1px 2px rgba(0,0,0,.7); }
  .meta-line .tricks{ color:#fff; text-shadow: 0 1px 2px rgba(0,0,0,.6); }
  .meta-line .sep{ color:#fff; opacity:.6; margin: 0 3px; }

  /* Speech bubbles — hidden until showBubble() reveals them, with a
     little CSS-triangle tail pointing back toward the avatar that said it.
     display:none by default (not just opacity:0) so a hidden bubble takes
     up zero layout space — with big cards now, every seat's height is
     tight, and a bubble reserving space it isn't using was part of what
     squeezed the rest of the board. */
  .bubble{
    display:none;
    position:relative;
    background: var(--bubble-bg);
    border: 2px solid var(--bubble-border);
    border-radius: 16px;
    padding: 9px 16px;
    font-size:1.05rem;
    font-weight:600;
    color: var(--ink);
    max-width: 190px;
    text-align:center;
    pointer-events:none;
    z-index: 10;
  }
  .bubble.visible{ display:block; }
  .bubble.tail-top::before, .bubble.tail-top::after{
    content:''; position:absolute; left:22px; border:9px solid transparent;
  }
  .bubble.tail-top::before{ top:-18px; border-bottom-color: var(--bubble-border); }
  .bubble.tail-top::after{ top:-15px; border-bottom-color: var(--bubble-bg); }
  .bubble.tail-bottom::before, .bubble.tail-bottom::after{
    content:''; position:absolute; left:22px; border:9px solid transparent;
  }
  .bubble.tail-bottom::before{ bottom:-18px; border-top-color: var(--bubble-border); }
  .bubble.tail-bottom::after{ bottom:-15px; border-top-color: var(--bubble-bg); }
  .bubble.tail-left::before, .bubble.tail-left::after{
    content:''; position:absolute; top:18px; border:9px solid transparent;
  }
  .bubble.tail-left::before{ left:-18px; border-right-color: var(--bubble-border); }
  .bubble.tail-left::after{ left:-15px; border-right-color: var(--bubble-bg); }
  .bubble.tail-right::before, .bubble.tail-right::after{
    content:''; position:absolute; top:18px; border:9px solid transparent;
  }
  .bubble.tail-right::before{ right:-18px; border-left-color: var(--bubble-border); }
  .bubble.tail-right::after{ right:-15px; border-left-color: var(--bubble-bg); }

  /* Cardback fans: horizontal (North) vs vertical (West/East) */
  .cardback-row{ display:flex; margin-top:6px; }
  .cardback-row.vertical{ flex-direction:column; align-items:center; }
  .cardback{
    width:84px; height:118px;
    /* Diamond lattice instead of plain diagonal stripes: a solid red base
       with two crossing sets of white diagonal bands. The earlier stripe
       version had its first gradient layer fully opaque, which hid the
       second layer entirely — this version keeps both bands translucent
       enough that they actually weave together. */
    background-color: var(--cardback-1);
    background-image:
      repeating-linear-gradient(45deg, transparent 0 4px, var(--cardback-2) 4px 8px),
      repeating-linear-gradient(-45deg, transparent 0 4px, var(--cardback-2) 4px 8px);
    border: 1px solid var(--cardback-border);
    border-radius:6px;
    margin-left:-60px;
  }
  .cardback-row .cardback:first-child{ margin-left:0; }
  /* No per-card content on a cardback, so the vertical stack (West/East)
     can overlap far more aggressively than a real hand of cards could —
     that's what keeps 12 full-size cardbacks fitting in the seat's height.
     They're also rotated 90° — a common convention for the side seats in
     card game UIs, so the cards read as "facing" the table's center. */
  .cardback-row.vertical .cardback{ margin-left:0; margin-top:-113px; transform: rotate(90deg); }
  .cardback-row.vertical .cardback:first-child{ margin-top:0; }


  #seat-N{ grid-column:2; grid-row:1; }
  #seat-W{ grid-column:1; grid-row:2; }
  #seat-E{ grid-column:3; grid-row:2; }
  #seat-S{ grid-column:2; grid-row:3; justify-content:flex-start; }

  /* ---------- Center area: trick-in-progress AND the bidding UI share
     this space, since only one is ever relevant at a given moment ---------- */
  #felt{
    grid-column:2; grid-row:2;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:8px;
    position:relative;
    overflow: hidden;
    min-height: 0;
    /* Double red border around the center playing area, with a 2px gap
       between the two lines. Using box-shadow rather than outline —
       #felt has overflow:hidden, and outline rendering next to an
       element's own overflow:hidden is unreliable across browsers even
       though it shouldn't be per spec. box-shadow doesn't have that
       problem. The first ring matches the felt's own green background
       (table-wrap's background, since felt itself has none) to fake the
       gap; the second is the actual outer red line. */
    box-shadow: 0 0 0 2px var(--board-green), 0 0 0 4px var(--red);
  }
  #trickArea{
    display:grid;
    grid-template-areas:
      ".    n    ."
      "w    c    e"
      ".    s    .";
    grid-template-columns: 68px 68px 68px;
    grid-template-rows: 93px 93px 93px;
    gap:6px;
  }
  .trick-slot{ display:flex; align-items:center; justify-content:center; }
  #tc-N{ grid-area:n; } #tc-E{ grid-area:e; } #tc-S{ grid-area:s; } #tc-W{ grid-area:w; }
  #trumpBadge{
    position:absolute; top:8px; right:8px; z-index:15;
    background: var(--shadow-soft);
    color:#1b1b1b;
    border: 2px solid rgba(0,0,0,.35);
    border-radius: 12px;
    padding: 8px 20px;
    font-size:1.35rem;
    font-weight:700;
  }

  /* ---------- Card visuals ---------- */
  /* Rank+suit live in the top-left corner (mirrored bottom-right), with a
     big suit symbol in the middle. This is the traditional playing-card
     layout for a reason: when cards overlap in a fan, the next card
     covers the RIGHT side of the one under it, so corner content stays
     visible — centered content (what this used to be) gets covered up
     and becomes unreadable the moment cards overlap. */
  .card{
    width:84px; height:118px;
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 6px;
    display:flex;
    flex-direction:column;
    justify-content:space-between;
    padding: 4px;
    font-weight:800;
    box-shadow: 1px 2px 3px var(--shadow-medium);
    color: var(--ink);
    user-select:none;
  }
  .card.red{ color: var(--red); }
  .card .corner{ font-size:1.1rem; line-height:1; }
  .card .center-suit{ font-size:2.6rem; text-align:center; }
  /* Grid cells in #trickArea are 68x93 — this now uses nearly all of
     that (previously 62x87, which was too small to hold text at the
     1.1rem/2.6rem sizes without the bottom corner overflowing past the
     card's edge). Tighter padding reclaims a bit more room too. */
  .card.mini{ width:66px; height:91px; padding:2px; }
  .card.mini .corner{ font-size:1.1rem; }
  .card.mini .center-suit{ font-size:2.6rem; }

  /* South (human) hand — overlapping fan (restored), sized big to match
     the reference. overflow is hidden rather than auto/scroll on both
     axes: the overlap keeps 12 cards well within the available width so
     there's nothing to scroll to in the first place. */
  #south-hand{
    display:flex;
    justify-content:center;
    flex-wrap: nowrap;
    overflow: hidden;
    margin-top: 2px;
    padding: 20px 4px 6px;
    width: 100%;
  }
  #south-hand .cardWrap{
    flex-shrink: 0;
    margin-left: -50px;
    position: relative; /* lets z-index below actually take effect */
  }
  #south-hand .cardWrap:first-child{ margin-left: 0; }
  /* When reviewing cards passed to you as declarer, your hand temporarily
     grows to 16 — the normal -50px overlap was sized for exactly 12
     cards, so 16 cards at that spacing overflowed the container width
     and got clipped (mostly the leftmost card, since overflow:hidden
     with centered content clips unevenly once combined with the overlap
     direction). Tighter overlap keeps the full, larger hand within the
     same width. */
  #south-hand.crowded .cardWrap{ margin-left: -59px; }
  #south-hand.crowded .cardWrap:first-child{ margin-left: 0; }
  #south-hand .card{
    cursor:pointer;
    transition: transform .12s;
  }
  #south-hand .card:hover{ transform: translateY(-8px); }
  /* Applied briefly during a genuine south-hand rebuild (see render()) so
     a card your mouse is already on doesn't visibly animate into its
     hover-lifted state — it should just already be there. */
  #south-hand.no-transition .card{ transition: none !important; }
  #south-hand .card.disabled{
    opacity:.35;
    cursor: not-allowed;
  }
  #south-hand .card.disabled:hover{ transform:none; }
  /* Selection indicator is border/glow only — deliberately NOT using
     transform. Any transform value (even a small translateY) makes CSS
     paint that element above every normal, non-transformed sibling,
     regardless of hand order — that's what kept covering neighbors no
     matter how much z-index or margin was layered on top of it. Skipping
     transform entirely means the selected card stays in its normal
     stacking position, so the fan's overlap order is completely
     unaffected by selection. */
  #south-hand .cardWrap.selected .card{
    box-shadow: 0 0 0 3px #fff, 0 0 0 5px var(--board-border), 1px 2px 3px var(--shadow-medium);
  }
  /* "Used" = appeared in at least one declared meld already — a subtle
     marker only, the card stays fully selectable for reuse in another
     meld (e.g. a queen in a marriage can also count toward "queens
     around"), unlike the old hard lock this replaced. */

  /* ---------- Bid / Pass / Meld control panels ---------- */
  .control-panel{
    display:none;
    gap:6px;
    flex-wrap:wrap;
    justify-content:center;
    align-items:center;
    background: var(--yellow);
    border: 2px solid var(--yellow-border);
    border-radius: 10px;
    padding: 8px 10px;
    margin-top:4px;
    width: 100%;
    max-width: 380px;
    max-height: 100%;
    overflow: hidden; /* no scrollbars — content is sized to fit instead */
  }
  .control-panel.wide-panel{ max-width: 480px; }
  @keyframes blink-win{ 0%,49%{ opacity:1; } 50%,100%{ opacity:0; } }
  .win-blink{ animation: blink-win 1s step-start infinite; }
  .control-panel table{ width:100%; border-collapse:collapse; font-size:.85rem; margin-bottom:6px; }
  .control-panel td, .control-panel th{ border:1px solid #b3a94a; padding:3px 8px; text-align:center; }
  .control-panel th{ background: rgba(255,255,255,.25); }
  /* Round Complete's two tables need to fit in less space than a normal
     control-panel gets — tighter padding/font here instead of scrolling. */
  .control-panel.wide-panel table{ font-size:.78rem; margin-bottom:4px; }
  .control-panel.wide-panel td, .control-panel.wide-panel th{ padding:1px 8px; }
  .control-panel.wide-panel h3{ margin: 0 0 4px; }
  .control-panel.wide-panel button{ padding:3px 12px; margin-top:2px; }
  .control-panel h3{
    width:100%; text-align:center; margin:0 0 2px;
    font-size:.88rem; color:#3a3a10;
  }
  .control-panel button{
    background: #fff;
    color: var(--ink);
    border: 2px solid var(--board-border);
    border-radius: 6px;
    padding: 4px 12px;
    cursor:pointer;
    font-weight:700;
  }
  .control-panel button:hover{ background:#f2f2f2; }
  .control-panel button:disabled{ opacity:.4; cursor:not-allowed; }
  .control-panel button.pass{ background:var(--pass-btn-bg); color:#fff; border-color:var(--pass-btn-border); }
  .control-panel .bidStatus{ width:100%; text-align:center; font-size:calc(.78rem + 3px); color:#3a3a10; margin-bottom:2px; }
  .control-panel .meldGroupList{ width:100%; font-size:calc(.72rem + 3px); max-height:60px; overflow-y:auto; margin-bottom:4px; text-align:center; color:#3a3a10; }
  /* Meld panel needs more room than the other control panels — it now
     carries an extra instructional line plus the running group list. */
  #meldPanel{ min-height: 190px; }
  #meldPanel .meldGroupList{ max-height: 90px; }
  #meldPanel .meldHelp{ width:100%; text-align:center; font-size:calc(.78rem + 3px); color:#3a3a10; margin-bottom:4px; line-height:1.3; }

  /* ---------- Score table (top-left corner) — restyled to match the
     Trump badge's look: same dark-green translucent background, white
     bold text, rounded border, instead of the old small cream table. ---------- */
  #scoreTable{
    position:absolute; top:8px; left:8px; z-index:15;
    background: var(--shadow-soft);
    border: 2px solid rgba(0,0,0,.35);
    border-radius: 10px;
    padding: 7px 10px;
    box-shadow: 0 2px 6px var(--shadow-medium);
  }
  #scoreTable table{ border-collapse: collapse; }
  #scoreTable th, #scoreTable td{
    padding: 3px 10px;
    text-align:center;
    white-space:nowrap;
    color:#1b1b1b;
  }
  #scoreTable th{
    font-size:calc(.68rem + 2px);
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:.5px;
    border-bottom: 1px solid rgba(0,0,0,.3);
  }
  #scoreTable td{ font-size:calc(.85rem + 2px); font-weight:400; }
  #scoreTable tr:not(:last-child) td{ border-bottom: 1px solid rgba(0,0,0,.15); }

  /* ---------- Log ---------- */
  #logToggle{
    position:fixed; bottom:10px; left:10px;
    background: var(--cream); color:var(--ink);
    border:2px solid var(--board-border); border-radius:20px;
    padding:8px 14px; cursor:pointer; font-size:.8rem; z-index:50;
  }
  #logPanel{
    position:fixed; bottom:50px; left:10px; width:320px; max-height:50vh;
    background: var(--cream); border:2px solid var(--board-border); border-radius:8px;
    padding:10px; overflow-y:auto; font-size:.78rem; z-index:50; display:none;
    color: var(--ink);
  }
  #logPanel div{ margin-bottom:4px; border-bottom:1px solid #ccc; padding-bottom:3px;}

  /* ---------- Universal modal ---------- */
  #universalModal{
    display:none;
    position:fixed; inset:0;
    background: transparent;
    z-index:100;
    align-items:center; justify-content:center;
  }
  #universalModal .modalBox{
    box-shadow: 0 4px 20px rgba(0,0,0,.5);
    background: var(--cream);
    color: var(--ink);
    border: 3px solid var(--board-border);
    border-radius: 12px;
    padding: 22px;
    max-width: 520px;
    width: 90%;
    max-height: 80vh;
    overflow-y:auto;
  }
  #universalModal h2{ margin-top:0; color: var(--ink); text-align:center; }
  #universalModal .modalBody{ font-size:.92rem; line-height:1.5; text-align:center; }
  #universalModal .modalBtns{
    display:flex; gap:10px; justify-content:center; margin-top:16px;
  }
  #universalModal button{
    background: var(--green-btn); color: #fff;
    border:2px solid var(--board-border); border-radius:6px;
    padding:8px 16px; cursor:pointer; font-weight:600;
  }
  #universalModal button:hover{ background: var(--green-btn-dark); }
  #universalModal table{ width:100%; border-collapse: collapse; font-size:.85rem; }
  #universalModal td, #universalModal th{ padding:3px 6px; border-bottom:1px solid #ccc; text-align:left;}

  /* =================================================================
     Border around the whole playing field. Kept deliberately simple —
     a plain `border`, nothing fancier — after both the outline and
     box-shadow versions of a double-line effect reportedly weren't
     showing up at all. This is about as bulletproof as CSS gets, so if
     even this doesn't show, the cause is something other than the
     border technique itself.
     ================================================================= */

  @media (max-width: 720px){
    #table-wrap{
      grid-template-columns: 80px 1fr 80px;
      grid-template-rows: minmax(120px,140px) minmax(150px,1fr) minmax(180px,210px);
      margin: 6px 16px 10px;
    }
    .card, .cardback{ width:44px; height:64px; }
    .card .corner{ font-size:.62rem; }
    .card .center-suit{ font-size:1.2rem; }
    #south-hand .cardWrap{ margin-left: -22px; }
    .cardback-row .cardback{ margin-left: -30px; }
    .cardback-row.vertical .cardback{ margin-left:0; margin-top: -58px; }
    #scoreTable th{ font-size:.62rem; }
    #scoreTable td{ font-size:.8rem; }
    #scoreTable th, #scoreTable td{ padding: 2px 8px; }
    #pageTitle{ font-size:1.1rem; }
    #topBar{ padding: 5px 0; margin: 0 16px; }
    #topBar button{ padding:5px 9px; font-size:.7rem; }
  }
</style>
</head>
<body>

<div id="topBar">
  <h1 id="pageTitle">Pinochle</h1>
  <div id="buttonGroup">
    <button id="newHandBtn">New Game</button>
    <button id="rulesBtn">Instructions</button>
    <button id="optionsBtn">Options</button>
    <button id="exitBtn">Exit</button>
  </div>
</div>

<div id="table-wrap">
  <div id="pauseOverlay"><div class="pause-badge">⏸ PAUSED — press Space to resume</div></div>
  <div class="seat" id="seat-N">
    <div class="name-row">
      <div class="name">Bill</div>
      <div class="bubble tail-left" id="bubble-N"></div>
    </div>
