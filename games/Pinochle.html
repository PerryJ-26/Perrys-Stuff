<script>
/* =====================================================================
   PINOCHLE — standalone game
   4 players (partnership): South = You, North = your partner (AI),
   East & West = opponents (AI). Single 48-card deck (two copies of
   9,J,Q,K,10,A in each suit). Standard American partnership rules,
   simplified in a few places noted inline where full auction-pinochle
   rules get genuinely ambiguous between different house-rule sets.
   ===================================================================== */

// ---------------------------------------------------------------------
// CONSTANTS
// ---------------------------------------------------------------------
const SUITS = ['♠','♥','♦','♣'];
const RED_SUITS = ['♥','♦'];
const RANKS = ['A','10','K','Q','J','9']; // trick-taking strength order, high to low
// Card point values are fixed by the game (not house-rule flexible) —
// this is what makes the 240 (+10 for last trick = 250) point deck.
const RANK_POINTS = { 'A':10, '10':10, 'K':10, 'Q':0, 'J':0, '9':0 };
const RANK_STRENGTH = { 'A':6, '10':5, 'K':4, 'Q':3, 'J':2, '9':1 };
// "Counters" in pinochle jargon — the big scoring cards. Used by the
// house rule requiring the non-declaring team to win at least one trick
// containing one of these, or forfeit their meld for the hand.
const COUNTER_RANKS = ['A','10','K'];

const SEATS = ['S','W','N','E']; // turn order is clockwise; S sits at bottom, W left, N top, E right
const SEAT_NAME = { S:'You', W:'Mike', N:'Bill', E:'Lisa' };
const TEAM = { S:'NS', N:'NS', W:'EW', E:'EW' };
const PARTNER = { S:'N', N:'S', W:'E', E:'W' };
// Team labels for the score table — built from SEAT_NAME so renaming a
// character above automatically updates the table too.
// Function instead of a fixed object so it always reflects the current
// SEAT_NAME.S — needed since the player can rename themselves in Options.
function getTeamLabel(team){
  return team === 'NS' ? `${SEAT_NAME.S} & ${SEAT_NAME.N}` : `${SEAT_NAME.W} & ${SEAT_NAME.E}`;
}

const MIN_BID = 250;
const BID_STEP = 10;
const GAME_TARGET = 1500;
// Was previously two separate hardcoded numbers (120 in the AI's bidding
// logic, 130 in the human bid panel) that had no relationship to MIN_BID
// at all — meaning raising MIN_BID could put it ABOVE those caps, and
// nobody would ever be able to bid. Scales proportionally now instead.
const MAX_BID = Math.round(MIN_BID * 2.4);
// House-rule addition: after trump is named, each player passes this many
// cards to their partner before melding. Not part of every pinochle
// ruleset — easy to set to 0 to turn the feature off entirely.
const PASS_COUNT = 4;

// ---------------------------------------------------------------------
// STATE
// Kept as one object so it's easy to see the whole shape of a "hand"
// at a glance, and so render() can just read from a single source.
// ---------------------------------------------------------------------
let state = {
  scores: { NS: 0, EW: 0 },
  dealerIdx: 0,          // index into SEATS of current dealer
  hands: { S:[], N:[], E:[], W:[] },
  trump: null,
  bid: 0,
  bidWinner: null,
  bidHistory: [],
  biddingOrder: [],
  biddingTurn: 0,
  passesInRow: 0,
  passedSeats: new Set(), // seats that have passed this auction — skipped for the rest of it
  highestBidderSeenBid: false,
  phase: 'deal',          // deal | bidding | trump | passing | humanMeld | meld | play | scoring
  melds: { S:0, N:0, E:0, W:0 },
  meldDetail: { S:[], N:[], E:[], W:[] },
  trick: {},               // seat -> card currently on the felt
  trickLeader: null,
  tricksWon: { NS: [], EW: [] }, // arrays of card-point totals per trick, for reference
  pointsThisHand: { NS: 0, EW: 0 },
  lastTrickWinner: null,
  cardsPlayedCount: 0,

  // --- card passing: sequential declarer/partner exchange ---
  passSelection: [],       // card ids the human has picked so far this stage
  passDeclarer: null,      // seat that won the bid
  passPartner: null,       // declarer's partner seat
  passStage: 'toDeclarer', // 'toDeclarer' | 'toPartner' — which half of the exchange is active
  passStageOneCards: [],   // cards partner sent to declarer, for the recap modal
  passStageTwoCards: [],   // cards declarer sent back, for the recap modal

  // --- manual human melding ---
  humanMeldSelection: [],     // card ids currently highlighted, not yet declared
  humanMeldUsed: new Set(), // card ids used in at least one declared meld — informational only, no longer blocks reselection
  humanMeldGroups: [],        // [{label, points, cardIds}] — what the player has declared so far
  humanMeldTotal: 0,
  meldError: '',               // feedback shown inside the meld panel when a declare attempt is invalid

  // --- score table (Bid/Bidder columns show each team's most recent bid) ---
  teamBidInfo: { NS: { amount:0, bidder:null }, EW: { amount:0, bidder:null } },

  // --- tricks taken this hand, per player (not per team) ---
  tricksTaken: { S:0, N:0, E:0, W:0 },

  // House rule: has the non-declaring team won at least one trick with a
  // counter (A/10/K) yet this hand? If not by the end, their meld is
  // forfeited.
  nonDeclarerWonCounterTrick: false,

  // Options setting: when true, the AI declares South's meld automatically
  // (same calcMeld() logic used for the other three players) instead of
  // South melding by hand. Deliberately not reset by dealNewHand()/newGame()
  // — it's a standing preference, not per-round state.
  aiCreatesMelds: false,

  // Options setting: when true, shows every player's actual cards (as
  // compact colored text, not full card graphics) instead of cardbacks —
  // for testing/debugging. Also not reset by dealNewHand()/newGame().
  viewAllCards: false,

  // Options setting: enables the spacebar as a pause/resume toggle.
  spacebarPauseEnabled: false,
  // Live pause state — when true, scheduled AI/game-progression timers
  // (bidding, playing, trick advancement) hold off firing until unpaused.
  // Doesn't block your own manual actions if it happens to be your turn.
  paused: false
};

let log = [];
// Tracks the last HTML rendered into #south-hand — used to skip
// recreating the DOM when nothing about it actually changed (see render()).
let _lastSouthHandHtml = '';

// ---------------------------------------------------------------------
// DECK / DEAL
// ---------------------------------------------------------------------
function buildDeck(){
  const deck = [];
  SUITS.forEach(suit=>{
    RANKS.forEach(rank=>{
      // two copies of every card — this is the "double deck" feel of
      // pinochle even though it's technically a single 48-card pack
      deck.push({ suit, rank, id: suit+rank+'_a' });
      deck.push({ suit, rank, id: suit+rank+'_b' });
    });
  });
  return deck;
}

function shuffle(arr){
  for(let i=arr.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [arr[i],arr[j]] = [arr[j],arr[i]];
  }
  return arr;
}

function sortHand(cards){
  // Group by suit, and within suit low-to-high left-to-right — makes the
  // human hand readable and gives the AI a stable, predictable view.
  const suitOrder = ['♠','♥','♣','♦'];
  return [...cards].sort((a,b)=>{
    if(a.suit !== b.suit) return suitOrder.indexOf(a.suit) - suitOrder.indexOf(b.suit);
    return RANK_STRENGTH[a.rank] - RANK_STRENGTH[b.rank];
  });
}

// Pause support: wraps setTimeout so scheduled game-progression callbacks
// (AI bidding/playing, trick advancement) respect state.paused. If still
// paused when the timer would fire, it just keeps rechecking every 200ms
// instead of firing — once unpaused, it runs normally.
function pausableTimeout(fn, delay){
  const wrapped = () => {
    if(state.paused){
      setTimeout(wrapped, 200);
    } else {
      // Guarded: fn() drives bidding/passing/trick-play progression, and
      // an uncaught error here (e.g. from state left inconsistent by
      // something that happened while paused) used to die silently right
      // here — nothing else was scheduled to pick the chain back up, so
      // the game looked permanently frozen right at the moment of
      // resuming. Catch it, log it, and at least re-render so the board
      // isn't left visually stuck even if that particular step failed.
      try {
        fn();
      } catch(err){
        console.error('pausableTimeout: game-progression step failed', err);
        addLog('⚠ Something went wrong resuming the game. If it looks stuck, try New Hand.');
        render();
      }
    }
  };
  setTimeout(wrapped, delay);
}

function dealNewHand(){
  try {
    dealNewHandInner();
  } catch(err){
    // Every path that starts a new hand (Deal Next Round, Start a new
    // game, and the very first deal at startup) funnels through here.
    // Previously an uncaught error partway through this — however
    // unlikely — would leave state.hands partly reset with nothing to
    // show and nothing to click, which looks exactly like a frozen game
    // with no cards, and no indication anything went wrong.
    console.error('dealNewHand failed', err);
    addLog('⚠ Something went wrong starting the new hand. If the board looks stuck, try Exit and reopen, or use New Hand from the menu.');
    render();
  }
}
function dealNewHandInner(){
  const deck = shuffle(buildDeck());
  state.hands = { S:[], N:[], E:[], W:[] };
  for(let i=0;i<48;i++){
    const seat = SEATS[i % 4];
    // deal starting left of dealer, one card of a 4-round deal — for a
    // human it doesn't matter who "physically" gets card 1, so we just
    // deal round-robin across all four seats.
    state.hands[seat].push(deck[i]);
  }
  SEATS.forEach(s => state.hands[s] = sortHand(state.hands[s]));

  state.trump = null;
  document.getElementById('trumpBadge').innerHTML = '<span style="font-weight:400;">Trump:</span>';
  state.bid = 0;
  state.bidWinner = null;
  state.bidHistory = [];
  state.passesInRow = 0;
  state.passedSeats = new Set();
  state.melds = { S:0, N:0, E:0, W:0 };
  state.meldDetail = { S:[], N:[], E:[], W:[] };
  state.trick = {};
  state.trickLeader = null;
  state.pointsThisHand = { NS:0, EW:0 };
  state.lastTrickWinner = null;
  state.cardsPlayedCount = 0;
  state.passSelection = [];
  state.passDeclarer = null;
  state.passPartner = null;
  state.passStage = 'toDeclarer';
  state.passStageOneCards = [];
  state.passStageTwoCards = [];
  state.humanMeldSelection = [];
  state.humanMeldUsed = new Set();
  state.humanMeldGroups = [];
  state.humanMeldTotal = 0;
  state.meldError = '';
  state.teamBidInfo = { NS: { amount:0, bidder:null }, EW: { amount:0, bidder:null } };
  state.tricksTaken = { S:0, N:0, E:0, W:0 };
  state.nonDeclarerWonCounterTrick = false;
  hideAllBubbles();

  // bidding starts to the left of the dealer
  const startIdx = (state.dealerIdx + 1) % 4;
  state.biddingOrder = [0,1,2,3].map(i => SEATS[(startIdx+i)%4]);
  state.biddingTurn = 0;
  state.phase = 'bidding';

  addLog(`New hand dealt. Dealer: ${SEAT_NAME[SEATS[state.dealerIdx]]}. Bidding starts with ${SEAT_NAME[state.biddingOrder[0]]}.`);
  render();
  setHandMsg('');
  processBiddingTurn();
}

// ---------------------------------------------------------------------
// MELD CALCULATION
// Each player melds only their OWN 12-card hand (partnership pinochle
// rule — you don't combine hands). Team meld = sum of the two partners.
// This meld table is the common "standard American" set; some kitchen-
// table groups vary the four-of-a-kind values or add a 9-of-trump
// ("dix") bonus — easy to tweak the numbers below if you play those.
// ---------------------------------------------------------------------
function calcMeld(hand, trump){
  const detail = [];
  let total = 0;
  const count = (suit, rank) => hand.filter(c=>c.suit===suit && c.rank===rank).length;

  // --- Run: A-10-K-Q-J of trump ---
  const runCards = ['A','10','K','Q','J'];
  const runCopies = Math.min(...runCards.map(r=>count(trump,r)));
  if(runCopies >= 1){
    const pts = runCopies===2 ? 1500 : 150;
    total += pts;
    detail.push({ label: `${runCopies===2?'Double run':'Run'} (A-10-K-Q-J of trump)`, points: pts });
  }

  // --- Marriages (K+Q same suit) ---
  // A run already "uses up" one K/Q pair of trump, so we only count
  // marriages beyond what the run already accounted for.
  SUITS.forEach(suit=>{
    let kCount = count(suit,'K');
    let qCount = count(suit,'Q');
    if(suit === trump && runCopies >= 1){
      kCount -= runCopies; qCount -= runCopies;
    }
    const pairs = Math.max(0, Math.min(kCount,qCount));
    if(pairs > 0){
      const per = suit===trump ? 40 : 20;
      total += per*pairs;
      detail.push({ label: `${pairs>1?pairs+'x ':''}${suit===trump?'Royal marriage':'Marriage'} (${suit})`, points: per*pairs });
    }
  });

  // --- Pinochle: J♦ + Q♠ ---
  const jd = count('♦','J'), qs = count('♠','Q');
  const pinPairs = Math.min(jd,qs);
  if(pinPairs === 1){ total += 40; detail.push({ label:'Pinochle (J♦+Q♠)', points:40 }); }
  if(pinPairs === 2){ total += 300; detail.push({ label:'Double pinochle', points:300 }); }

  // --- Dix: 9 of trump ---
  const dixCount = count(trump, '9');
  if(dixCount === 1){ total += 10; detail.push({ label:'Dix (9 of trump)', points:10 }); }
  if(dixCount === 2){ total += 20; detail.push({ label:'Double dix', points:20 }); }

  // --- Four of a kind (one of each suit), single or double set ---
  const quadTable = { A:[100,1000], K:[80,800], Q:[60,600], J:[40,400] };
  Object.keys(quadTable).forEach(rank=>{
    const copies = Math.min(...SUITS.map(s=>count(s,rank)));
    if(copies >= 1){
      const pts = copies===2 ? quadTable[rank][1] : quadTable[rank][0];
      total += pts;
      detail.push({ label: `${copies===2?'Double ':''}${rank==='A'?'Aces':rank==='K'?'Kings':rank==='Q'?'Queens':'Jacks'} around`, points: pts });
    }
  });

  return { total, detail };
}

// ---------------------------------------------------------------------
// MANUAL MELD VALIDATION (South only)
// Checks an exact set of selected cards against the same combo values
// used above in calcMeld — this is what makes manual melding "real"
// rather than just cosmetic: if the selection doesn't exactly match a
// known combo, it's rejected and the player has to try again, the same
// way a mis-laid meld would get challenged at a real table.
// ---------------------------------------------------------------------
function rankAroundLabel(r){ return {A:'Aces', K:'Kings', Q:'Queens', J:'Jacks'}[r]; }

function validateMeldSelection(cards, trump){
  if(!cards.length) return { valid:false };

  // Run / double run: exactly A-10-K-Q-J of trump, once or twice each
  if(cards.every(c=>c.suit===trump)){
    const need = ['A','10','K','Q','J'];
    const countRank = r => cards.filter(c=>c.rank===r).length;
    if(cards.length===5 && need.every(r=>countRank(r)===1)){
      return { valid:true, label:'Run (A-10-K-Q-J of trump)', points:150 };
    }
    if(cards.length===10 && need.every(r=>countRank(r)===2)){
      return { valid:true, label:'Double run', points:1500 };
    }
  }

  // Marriage / double marriage: K+Q (or 2x K+Q) of the same suit
  if(cards.length===2 && cards[0].suit===cards[1].suit){
    const ranks = cards.map(c=>c.rank).sort().join(',');
    if(ranks === 'K,Q'){
      const suit = cards[0].suit;
      return { valid:true, label: (suit===trump?'Royal marriage':'Marriage')+` (${suit})`, points: suit===trump?40:20 };
    }
  }
  if(cards.length===4 && cards.every(c=>c.suit===cards[0].suit)){
    const suit = cards[0].suit;
    const kC = cards.filter(c=>c.rank==='K').length, qC = cards.filter(c=>c.rank==='Q').length;
    if(kC===2 && qC===2){
      const per = suit===trump ? 80 : 40;
      return { valid:true, label:(suit===trump?'Double royal marriage':'Double marriage')+` (${suit})`, points: per };
    }
  }

  // Pinochle / double pinochle: J♦ + Q♠
  if(cards.length===2){
    const jd = cards.filter(c=>c.suit==='♦' && c.rank==='J').length;
    const qs = cards.filter(c=>c.suit==='♠' && c.rank==='Q').length;
    if(jd===1 && qs===1) return { valid:true, label:'Pinochle (J♦+Q♠)', points:40 };
  }
  if(cards.length===4){
    const jd = cards.filter(c=>c.suit==='♦' && c.rank==='J').length;
    const qs = cards.filter(c=>c.suit==='♠' && c.rank==='Q').length;
    if(jd===2 && qs===2) return { valid:true, label:'Double pinochle', points:300 };
  }

  // Dix / double dix: 9 of trump
  if(cards.length===1 && cards[0].suit===trump && cards[0].rank==='9'){
    return { valid:true, label:'Dix (9 of trump)', points:10 };
  }
  if(cards.length===2 && cards.every(c=>c.suit===trump && c.rank==='9')){
    return { valid:true, label:'Double dix', points:20 };
  }

  // Around / double around: one (or two) of a rank in every suit
  if(cards.length===4){
    const rank = cards[0].rank;
    if(['A','K','Q','J'].includes(rank) && cards.every(c=>c.rank===rank)){
      const suitsSeen = new Set(cards.map(c=>c.suit));
      if(suitsSeen.size===4){
        const table = { A:100, K:80, Q:60, J:40 };
        return { valid:true, label:`${rankAroundLabel(rank)} around`, points: table[rank] };
      }
    }
  }
  if(cards.length===8){
    const rank = cards[0].rank;
    if(['A','K','Q','J'].includes(rank) && cards.every(c=>c.rank===rank)){
      const bySuit = {};
      cards.forEach(c=> bySuit[c.suit] = (bySuit[c.suit]||0)+1);
      if(Object.keys(bySuit).length===4 && Object.values(bySuit).every(v=>v===2)){
        const table = { A:1000, K:900, Q:600, J:400 };
        return { valid:true, label:`Double ${rankAroundLabel(rank)} around`, points: table[rank] };
      }
    }
  }

  return { valid:false };
}

// ---------------------------------------------------------------------
// BIDDING
// Simple auction: each player either passes or names a bid strictly
// higher than the current one. If all four pass, the dealer takes the
// default MIN_BID and automatically wins the round (house rule).
// ---------------------------------------------------------------------
function processBiddingTurn(){
  if(state.phase !== 'bidding') return;

  const activeSeats = SEATS.filter(s => !state.passedSeats.has(s));

  // Ends the auction: only one bidder left standing with a live bid.
  // (This replaces the old "3 consecutive passes" check — now that a
  // passed player is skipped permanently rather than just for one turn,
  // passesInRow could still be under 3 at the exact moment only one
  // active bidder remains, which left the game re-prompting that lone
  // bidder to bid against no one — the actual cause of the "nothing
  // happens after bidding ends" freeze.)
  if(state.bid > 0 && activeSeats.length <= 1){
    finishBidding();
    return;
  }
  // Everyone passed with no bid at all — house rule: the dealer takes
  // the default MIN_BID and automatically wins the round, rather than
  // redealing.
  if(activeSeats.length === 0){
    const dealerSeat = SEATS[state.dealerIdx];
    state.bid = MIN_BID;
    state.bidWinner = dealerSeat;
    state.teamBidInfo[TEAM[dealerSeat]] = { amount: MIN_BID, bidder: SEAT_NAME[dealerSeat] };
    addLog(`All four players passed. ${SEAT_NAME[dealerSeat]} (the dealer) takes the default bid of ${MIN_BID} and automatically wins the round.`);
    finishBidding();
    return;
  }

  // Skip anyone who's already passed this hand — they're out of the
  // auction, not just sitting out a single turn.
  while(state.passedSeats.has(state.biddingOrder[state.biddingTurn % 4])){
    state.biddingTurn++;
  }
  const seat = state.biddingOrder[state.biddingTurn % 4];

  highlightActiveSeat(seat);

  if(seat === 'S'){
    renderBidPanel();
  } else {
    pausableTimeout(()=> aiBid(seat), 700);
  }
}

function aiBid(seat){
  const hand = state.hands[seat];
  const strength = estimateHandStrength(hand);
  // Rough heuristic: convert hand strength into a "comfortable ceiling"
  // bid, then decide whether to top the current bid or pass. strength
  // tops out around ~130 regardless of the bid economy in play, so it's
  // mapped proportionally onto the [MIN_BID, MAX_BID] range rather than
  // added to a hardcoded base — that's what lets this keep working
  // sensibly if MIN_BID/MAX_BID change.
  const ceiling = MIN_BID + Math.round(strength * (MAX_BID - MIN_BID) / 130);
  const nextBid = state.bid === 0 ? MIN_BID : state.bid + BID_STEP;

  if(nextBid <= ceiling && nextBid <= MAX_BID){
    placeBid(seat, nextBid);
  } else {
    placePass(seat);
  }
}

function estimateHandStrength(hand){
  // Quick-and-dirty scorer used only for AI bidding decisions: counts
  // aces/tens heavily, gives credit for any suit that could be trump
  // (i.e. where this hand has real length/strength), and adds a taste
  // of likely meld by checking every suit as a hypothetical trump.
  let best = 0;
  SUITS.forEach(suit=>{
    let score = 0;
    hand.forEach(c=>{
      if(c.suit === suit){
        if(c.rank==='A') score += 8;
        else if(c.rank==='10') score += 6;
        else if(c.rank==='K') score += 4;
        else if(c.rank==='Q') score += 3;
        else if(c.rank==='J') score += 2;
      } else {
        if(c.rank==='A') score += 3; // off-suit aces are still worth something
      }
    });
    const meld = calcMeld(hand, suit).total;
    score += meld * 0.12;
    if(score > best) best = score;
  });
  return best;
}

function bestTrumpFor(hand){
  let best = SUITS[0], bestScore = -1;
  SUITS.forEach(suit=>{
    const meld = calcMeld(hand, suit).total;
    const length = hand.filter(c=>c.suit===suit).length;
    const score = meld + length*8;
    if(score > bestScore){ bestScore = score; best = suit; }
  });
  return best;
}

function placeBid(seat, amount){
  state.bid = amount;
  state.bidWinner = seat;
  state.passesInRow = 0;
  state.bidHistory.push(`${SEAT_NAME[seat]}: ${amount}`);
  state.teamBidInfo[TEAM[seat]] = { amount, bidder: SEAT_NAME[seat] };
  addLog(`${SEAT_NAME[seat]} bids ${amount}.`);
  showBubble(seat, `I bid ${amount}`, true);
  state.biddingTurn++;
  render();
  pausableTimeout(processBiddingTurn, 350);
}

function placePass(seat){
  state.passesInRow++;
  state.passedSeats.add(seat);
  state.bidHistory.push(`${SEAT_NAME[seat]}: Pass`);
  addLog(`${SEAT_NAME[seat]} passes.`);
  showBubble(seat, 'Pass', true);
  state.biddingTurn++;
  render();
  pausableTimeout(processBiddingTurn, 350);
}

function renderBidPanel(){
  const panel = document.getElementById('bidPanel');
  panel.style.display = 'flex';
  const next = state.bid === 0 ? MIN_BID : state.bid + BID_STEP;

  let html = `<h3>What is your bid?</h3>`;
  if(state.bid > 0){
    html += `<div class="bidStatus">Current high bid: ${state.bid} (${SEAT_NAME[state.bidWinner]})</div>`;
  }
  // offer a small ladder of bid choices rather than a raw number input —
  // faster to click through, and keeps bidding brisk. Increments scale
  // with BID_STEP so they still make sense if that constant changes.
  const options = [next, next + BID_STEP];
  options.forEach(v=>{
    if(v <= MAX_BID + BID_STEP) html += `<button onclick="humanBid(${v})">${v}</button>`;
  });
  html += `<button class="pass" onclick="humanPass()">Pass</button>`;
  panel.innerHTML = html;
}

function humanBid(amount){
  document.getElementById('bidPanel').style.display = 'none';
  placeBid('S', amount);
}
function humanPass(){
  document.getElementById('bidPanel').style.display = 'none';
  placePass('S');
}

function finishBidding(){
  document.getElementById('bidPanel').style.display = 'none';
  hideAllBubbles();
  clearActiveSeat();
  addLog(`Bidding won by ${SEAT_NAME[state.bidWinner]} at ${state.bid}.`);
  state.phase = 'trump';
  render(); // refreshes the board immediately (e.g. the score table's Bid column) instead of waiting on whatever happens next

  if(state.bidWinner === 'S'){
    promptHumanTrumpChoice();
  } else {
    const trump = bestTrumpFor(state.hands[state.bidWinner]);
    setTrump(trump);
  }
}

function promptHumanTrumpChoice(){
  const panel = document.getElementById('trumpPanel');
  panel.style.display = 'flex';
  const btns = SUITS.map(s=>`<button onclick="chooseTrump('${s}')">${s} ${suitName(s)}</button>`).join('');
  panel.innerHTML = `<h3>You won the bid at ${state.bid}! Choose your trump suit:</h3>${btns}`;
}
function chooseTrump(suit){
  document.getElementById('trumpPanel').style.display = 'none';
  setTrump(suit);
}
function suitName(s){ return {'♠':'Spades','♥':'Hearts','♦':'Diamonds','♣':'Clubs'}[s]; }

function setTrump(suit){
  state.trump = suit;
  addLog(`Trump is ${suit} ${suitName(suit)}.`);
  const isRed = RED_SUITS.includes(suit);
  const color = isRed ? '#b3261e' : '#000000';
  document.getElementById('trumpBadge').innerHTML = `<span style="font-weight:400;">Trump:</span> <span style="color:${color}">${suit} ${suitName(suit)}</span>`;
  startPassingPhase();
}

// ---------------------------------------------------------------------
// CARD PASSING — sequential declarer/partner exchange
// House-rule addition: right after trump is named, the declarer's
// partner passes PASS_COUNT cards to the declarer FIRST. The declarer
// then reviews their now-larger hand and passes PASS_COUNT cards back.
// This works the same regardless of which of the four seats ended up
// declarer — "partner" and "declarer" are roles computed from
// state.bidWinner, not hardcoded to any particular seat.
// ---------------------------------------------------------------------
function aiChoosePassCards(seat, trump, favorHigh=false){
  // Lower score = safer to give away: avoid trump, avoid aces/tens,
  // prefer low card-point junk. favorHigh flips that — used when a
  // partner is helping their declarer (trump/high cards first), while
  // the declarer discarding back to their partner always favors keeping
  // their own strength (favorHigh=false), regardless of who's declarer.
  const scored = state.hands[seat].map(c=>({
    c,
    score: (c.suit===trump ? 1000:0) + (c.rank==='A' ? 300:0) + (c.rank==='10' ? 100:0) + RANK_POINTS[c.rank]*5
  }));
  scored.sort((a,b)=> favorHigh ? (b.score-a.score) : (a.score-b.score));
  return scored.slice(0, PASS_COUNT).map(x=>x.c);
}

function startPassingPhase(){
  state.phase = 'passing';
  state.passSelection = [];
  state.passDeclarer = state.bidWinner;
  state.passPartner = PARTNER[state.passDeclarer];
  state.passStage = 'toDeclarer';
  state.passStageOneCards = [];
  state.passStageTwoCards = [];

  addLog(`${SEAT_NAME[state.passPartner]} will pass ${PASS_COUNT} cards to ${SEAT_NAME[state.passDeclarer]} (the declarer), who will review their hand and pass ${PASS_COUNT} back.`);
  render();
  setHandMsg('');

  if(state.passPartner === 'S'){
    // You're the partner — choose what to send to the declarer
    renderPassPanel();
  } else {
    // AI partner always favors helping the declarer with trump/high cards
    const cards = aiChoosePassCards(state.passPartner, state.trump, true);
    givePartnerCardsToDeclarer(cards);
  }
}

function givePartnerCardsToDeclarer(cards){
  const { passPartner, passDeclarer } = state;
  const ids = cards.map(c=>c.id);
  state.hands[passPartner] = state.hands[passPartner].filter(c=>!ids.includes(c.id));
  state.hands[passDeclarer] = sortHand(state.hands[passDeclarer].concat(cards));
  state.passStageOneCards = cards;
  addLog(`${SEAT_NAME[passPartner]} passes ${cards.map(c=>c.rank+c.suit).join(', ')} to ${SEAT_NAME[passDeclarer]}.`);
  showBubble(passPartner, 'Here you go!');

  state.passStage = 'toPartner';
  state.passSelection = [];
  render();

  if(passDeclarer === 'S'){
    // You're the declarer — review your (now bigger) hand and choose
    // what to send back
    renderPassPanel();
  } else {
    // AI declarer discards its own weakest PASS_COUNT cards from the
    // full hand it's now holding (reusing aiChoosePassCards works fine
    // here since it just operates on whatever's currently in the hand)
    const cards = aiChoosePassCards(passDeclarer, state.trump, false);
    giveDeclarerCardsToPartner(cards);
  }
}

function giveDeclarerCardsToPartner(cards){
  const { passDeclarer, passPartner } = state;
  const ids = cards.map(c=>c.id);
  state.hands[passDeclarer] = state.hands[passDeclarer].filter(c=>!ids.includes(c.id));
  state.hands[passPartner] = sortHand(state.hands[passPartner].concat(cards));
  state.passStageTwoCards = cards;
  addLog(`${SEAT_NAME[passDeclarer]} passes ${cards.map(c=>c.rank+c.suit).join(', ')} back to ${SEAT_NAME[passPartner]}.`);
  showBubble(passDeclarer, 'Here you go!');

  document.getElementById('passPanel').style.display = 'none';
  render();

  // Only South cares about a written recap — if neither the declarer nor
  // the partner is South (the other team won the bid), just move on.
  if(state.passDeclarer === 'S' || state.passPartner === 'S'){
    const sentText = state.passStageOneCards.map(c=>c.rank+c.suit).join(', ');
    const backText = state.passStageTwoCards.map(c=>c.rank+c.suit).join(', ');
    showModal('Cards Exchanged', `
      <p>${SEAT_NAME[state.passPartner]} passed <b>${sentText}</b> to ${SEAT_NAME[state.passDeclarer]}.</p>
      <p>${SEAT_NAME[state.passDeclarer]} passed <b>${backText}</b> back to ${SEAT_NAME[state.passPartner]}.</p>
    `, `<button onclick="closeModal(); startHumanMelding();">Continue To Melding</button>`, false);
  } else {
    startHumanMelding();
  }
}

function togglePassSelection(cardId){
  const idx = state.passSelection.indexOf(cardId);
  if(idx >= 0){
    state.passSelection.splice(idx,1);
  } else {
    if(state.passSelection.length >= PASS_COUNT) return; // must deselect one before adding another
    state.passSelection.push(cardId);
  }
  render();
  renderPassPanel();
}

function renderPassPanel(){
  const panel = document.getElementById('passPanel');
  panel.style.display = 'flex';
  const n = state.passSelection.length;
  const isReviewStage = state.passStage === 'toPartner';
  const targetSeat = isReviewStage ? state.passPartner : state.passDeclarer;
  const verb = isReviewStage ? 'pass back' : 'pass';
  panel.innerHTML = `
    <div class="bidStatus">Select ${PASS_COUNT} cards to ${verb} to ${SEAT_NAME[targetSeat]} (${n}/${PASS_COUNT} selected)</div>
    <button ${n !== PASS_COUNT ? 'disabled' : ''} onclick="confirmHumanPassSelection()">Pass Selected Cards</button>
  `;
}

function confirmHumanPassSelection(){
  const actingSeat = state.passStage === 'toPartner' ? state.passDeclarer : state.passPartner;
  const chosen = state.hands[actingSeat].filter(c => state.passSelection.includes(c.id));
  state.passSelection = [];
  document.getElementById('passPanel').style.display = 'none';

  if(state.passStage === 'toPartner'){
    giveDeclarerCardsToPartner(chosen);
  } else {
    givePartnerCardsToDeclarer(chosen);
  }
}

// ---------------------------------------------------------------------
// MELD PHASE
// South melds manually: select cards from your hand and declare them
// as a group; the group only scores if it exactly matches a real combo
// (see validateMeldSelection). North/East/West still meld automatically
// since they're AI and there's nothing to click for them.
// ---------------------------------------------------------------------
function startHumanMelding(){
  state.phase = 'humanMeld';
  state.humanMeldSelection = [];
  state.humanMeldUsed = new Set();
  state.humanMeldGroups = [];
  state.humanMeldTotal = 0;
  state.meldError = '';

  if(state.aiCreatesMelds){
    // Options setting: let the AI declare your meld automatically instead
    // of melding by hand, using the same calcMeld() logic as Bill/Mike/Lisa.
    const { total, detail } = calcMeld(state.hands.S, state.trump);
    state.melds.S = total;
    state.meldDetail.S = detail;
    state.humanMeldTotal = total;
    addLog(`AI declares your meld: ${total} points.`);
    render();
    finalizeMeldPhase();
    return;
  }

  render();
  setHandMsg('');
  renderMeldPanel();
}

function toggleMeldSelection(cardId){
  const idx = state.humanMeldSelection.indexOf(cardId);
  if(idx >= 0) state.humanMeldSelection.splice(idx,1);
  else state.humanMeldSelection.push(cardId);
  state.meldError = '';
  render();
  renderMeldPanel();
}

// Groups a meld label into its broader "family" for reuse checking — e.g.
// "Marriage (♣)", "Royal marriage (♠)", and "Double marriage (♦)" are all
// family "marriage". Cards ARE allowed to be reused across DIFFERENT
// families (a king counts toward both a marriage and kings-around), but
// not reused within the SAME family — that's what let one King of Clubs
// pair with two different Queens of Clubs and get declared as two
// separate marriages, when only one King actually exists to marry.
function meldFamily(label){
  return label.toLowerCase()
    .replace(/^double\s+/, '')
    .replace(/^royal\s+/, '')
    .replace(/\s*\([^)]*\)\s*$/, '')
    .trim();
}

// Returns the conflicting already-declared group if any of `cardIds`
// is already used in a group of the same meld family, else null.
function findMeldFamilyConflict(label, cardIds, groups){
  const family = meldFamily(label);
  return groups.find(g => meldFamily(g.label) === family && g.cardIds.some(id => cardIds.includes(id))) || null;
}

function declareMeldGroup(){
  const cards = state.hands.S.filter(c => state.humanMeldSelection.includes(c.id));
  const result = validateMeldSelection(cards, state.trump);
  if(!result.valid){
    // Shown INSIDE the panel itself now, not via handMsg — handMsg sits
    // below the panel in the felt's flex column, and with the panel this
    // size there usually wasn't room left to actually see it (felt clips
    // overflow rather than scrolling), so the feedback was invisible.
    state.meldError = "That's not a valid meld — check the suits/ranks and try again.";
    renderMeldPanel();
    return;
  }
  // Card reuse across DIFFERENT meld families is allowed (e.g. a king in
  // a marriage can also count toward kings-around), but reusing a card
  // within the SAME family isn't a real second meld — that was the gap
  // letting one King of Clubs pair with two different Queens of Clubs and
  // score as two separate marriages, or a single J♦+Q♠ pair score as
  // "Pinochle" twice.
  const newIds = cards.map(c=>c.id);
  const conflict = findMeldFamilyConflict(result.label, newIds, state.humanMeldGroups);
  if(conflict){
    state.meldError = `Those cards are already counted in your "${conflict.label}" declaration — a card can't be reused for a second ${meldFamily(result.label)}.`;
    renderMeldPanel();
    return;
  }
  state.meldError = '';
  cards.forEach(c => state.humanMeldUsed.add(c.id));
  state.humanMeldGroups.push({ label: result.label, points: result.points, cardIds: cards.map(c=>c.id) });
  state.humanMeldTotal += result.points;
  state.humanMeldSelection = [];
  addLog(`You declared ${result.label} for ${result.points} points.`);
  render();
  renderMeldPanel();
}

function clearMeldSelection(){
  state.humanMeldSelection = [];
  state.meldError = '';
  render();
  renderMeldPanel();
}

function finishHumanMelding(){
  // If cards are still selected but never explicitly Declared, try to
  // save them automatically rather than silently losing the points —
  // Declare is for confirming multiple separate groups in one turn, it
  // shouldn't be a trap if you forget it on the last one.
  if(state.humanMeldSelection.length){
    const cards = state.hands.S.filter(c => state.humanMeldSelection.includes(c.id));
    const result = validateMeldSelection(cards, state.trump);
    const conflict = findMeldFamilyConflict(result.label, cards.map(c=>c.id), state.humanMeldGroups);
    if(result.valid && !conflict){
      cards.forEach(c => state.humanMeldUsed.add(c.id));
      state.humanMeldGroups.push({ label: result.label, points: result.points, cardIds: cards.map(c=>c.id) });
      state.humanMeldTotal += result.points;
      addLog(`You declared ${result.label} for ${result.points} points.`);
    }
    state.humanMeldSelection = [];
  }
  state.melds.S = state.humanMeldTotal;
  state.meldDetail.S = state.humanMeldGroups.length
    ? state.humanMeldGroups.map(g => ({ label: g.label, points: g.points }))
    : [];
  document.getElementById('meldPanel').style.display = 'none';
  finalizeMeldPhase();
}

function renderMeldPanel(){
  const panel = document.getElementById('meldPanel');
  panel.style.display = 'flex';
  const groupsHtml = state.humanMeldGroups.length
    ? state.humanMeldGroups.map(g => `<div>${g.label}: +${g.points}</div>`).join('')
    : '<div><i>No melds declared yet</i></div>';
  const selCount = state.humanMeldSelection.length;
  const errorHtml = state.meldError ? `<div style="color:var(--red);font-weight:600;width:100%;text-align:center;margin-bottom:4px;">${state.meldError}</div>` : '';
  panel.innerHTML = `
    <div class="meldHelp">Select one meld and click Declare Selected.<br>Click Done Melding when no more selections are available.</div>
    <div class="bidStatus">Running meld total: <b>${state.humanMeldTotal}</b></div>
    ${errorHtml}
    <div class="meldGroupList">${groupsHtml}</div>
    <div style="width:100%; display:flex; justify-content:space-between; align-items:center; margin-top:4px;">
      <button onclick="declareMeldGroup()" ${selCount===0 ? 'disabled' : ''}>Declare Selected (${selCount})</button>
      <button onclick="clearMeldSelection()" ${selCount===0 ? 'disabled' : ''}>Clear Selection</button>
      <button onclick="finishHumanMelding()">Done Melding</button>
    </div>
  `;
}

function finalizeMeldPhase(){
  state.phase = 'meld';
  // South's meld was already set by finishHumanMelding(); the other
  // three seats are computer players, so their melds are just calculated.
  ['N','E','W'].forEach(seat=>{
    const { total, detail } = calcMeld(state.hands[seat], state.trump);
    state.melds[seat] = total;
    state.meldDetail[seat] = detail;
  });

  render();
  addLog(`Melds — Your Team: ${state.melds.N + state.melds.S}, Opponents: ${state.melds.E + state.melds.W}.`);
  showMeldSummary('NS');
}

// Builds the Type/Player/Points breakdown for one team and shows it, with
// a button to flip to the other team's — matches the two-screen layout
// from the reference (a "your melds" view and an "opponent melds" view
// rather than one combined table).
// Wraps any suit symbols in a string with colored spans, matching the
// cards' red/black scheme — used for meld labels like "Marriage (♥)" or
// "Pinochle (J♦+Q♣)" which otherwise show as plain uncolored text.
function colorizeSuits(text){
  return text
    .replace(/♥/g, '<span style="color:#b3261e">♥</span>')
    .replace(/♦/g, '<span style="color:#b3261e">♦</span>')
    .replace(/♠/g, '<span style="color:#000">♠</span>')
    .replace(/♣/g, '<span style="color:#000">♣</span>');
}

function showMeldSummary(team){
  const seatsInTeam = team === 'NS' ? ['S','N'] : ['W','E'];
  let rows = '';
  let total = 0;
  seatsInTeam.forEach(seat=>{
    (state.meldDetail[seat] || []).forEach(d=>{
      rows += `<tr><td>${colorizeSuits(d.label)}</td><td style="text-align:center;">${SEAT_NAME[seat]}</td><td style="text-align:center;">${d.points}</td></tr>`;
      total += d.points;
    });
  });
  if(!rows) rows = `<tr><td colspan="3" style="text-align:center;"><i>No melds</i></td></tr>`;

  const body = `
    <table style="width:100%;border-collapse:collapse;">
      <tr><th style="border:1px solid #999;">Type</th><th style="border:1px solid #999;">Player</th><th style="border:1px solid #999;">Points</th></tr>
      ${rows.replace(/<td>/g,'<td style="border:1px solid #999;">')}
      <tr><td colspan="2" style="font-weight:700;text-align:center;border:1px solid #999;padding-top:8px;">Total points this round</td><td style="text-align:center;font-weight:700;border:1px solid #999;">${total}</td></tr>
    </table>
  `;
  const otherTeam = team === 'NS' ? 'EW' : 'NS';
  const toggleLabel = team === 'NS' ? 'Opponent Melds »' : '« Your Team Melds';
  const title = team === 'NS' ? 'Your Team Melds' : 'Opponent Melds';
  showModal(title, body, `
    <button onclick="showMeldSummary('${otherTeam}')">${toggleLabel}</button>
    <button onclick="closeModal(); startPlay();">Start Play</button>
  `, false);
}

// ---------------------------------------------------------------------
// TRICK PLAY
// Simplified follow-rule: must follow suit if able; if void in the led
// suit, must play trump if holding any; otherwise anything goes. (Full
// "must head the trick when possible" over-trumping rules exist in some
// house variants — left out here to keep the AI's decisions legible.)
// ---------------------------------------------------------------------
function startPlay(){
  state.phase = 'play';
  state.trick = {};
  state.trickLeader = state.bidWinner; // bid winner leads the first trick
  addLog(`${SEAT_NAME[state.trickLeader]} leads the first trick.`);
  render();
  advanceTrick();
}

function legalPlays(seat, leadSuit){
  const hand = state.hands[seat];
  if(!leadSuit) return hand.slice();
  const followers = hand.filter(c=>c.suit === leadSuit);
  if(followers.length) return followers;
  const trumps = hand.filter(c=>c.suit === state.trump);
  if(trumps.length){
    // Relaxed per request: if EVERY trump card happens to be a counter
    // (A/10/K), don't force one to be given up — open up the whole hand
    // instead. If there's at least one non-counter trump available, the
    // normal must-trump rule still applies (returning all trump options
    // still lets the player freely pick the non-counter one).
    const hasNonCounterTrump = trumps.some(c => !COUNTER_RANKS.includes(c.rank));
    if(hasNonCounterTrump) return trumps;
    return hand.slice();
  }
  return hand.slice();
}

function advanceTrick(){
  const playedSeats = Object.keys(state.trick);
  if(playedSeats.length === 4){
    resolveTrick();
    return;
  }
  // seat order for this trick starts at the leader
  const order = rotateFrom(state.trickLeader);
  const seat = order.find(s => !state.trick[s]);
  highlightActiveSeat(seat);

  if(seat === 'S'){
    render(); // enables clickable cards for the human
  } else {
    // Guarded: if this seat somehow already has a card in the trick by
    // the time this fires (a stale duplicate schedule), skip it rather
    // than call aiPlay again — that was the actual cause of the freeze
    // reported after the first full hand: a second call landing on an
    // already-empty hand crashed deep inside the AI's card-choice logic,
    // which silently killed the setTimeout chain that drives trick play.
    pausableTimeout(()=>{ if(!state.trick[seat]) aiPlay(seat); }, 650);
  }
}

function rotateFrom(seat){
  const i = SEATS.indexOf(seat);
  return [0,1,2,3].map(k => SEATS[(i+k)%4]);
}

function leadSuitOfTrick(){
  if(!state.trickLeader || !state.trick[state.trickLeader]) return null;
  return state.trick[state.trickLeader].suit;
}

function aiPlay(seat){
  const leadSuit = leadSuitOfTrick();
  const options = legalPlays(seat, leadSuit);
  const card = chooseAiCard(seat, options, leadSuit);
  playCard(seat, card);
}

function chooseAiCard(seat, options, leadSuit){
  // Basic but sensible trick-play heuristic:
  //  - if leading: lead a strong card in a suit we're long/strong in
  //  - if following and can win cheaply: win as cheaply as possible
  //  - if can't/shouldn't win: throw the lowest-value card
  const trump = state.trump;
  const trickCardsSoFar = Object.values(state.trick);

  if(!leadSuit){
    // Leading: prefer trump if we have strong trump length, else our
    // best off-suit ace, else just the highest card we hold.
    const trumps = options.filter(c=>c.suit===trump);
    if(trumps.length >= 3){
      return trumps.sort((a,b)=>RANK_STRENGTH[b.rank]-RANK_STRENGTH[a.rank])[0];
    }
    const aces = options.filter(c=>c.rank==='A');
    if(aces.length) return aces[0];
    return [...options].sort((a,b)=>RANK_STRENGTH[b.rank]-RANK_STRENGTH[a.rank])[0];
  }

  // Following: figure out what's currently winning the trick
  const currentWinner = currentTrickWinner();
  const partnerSeat = PARTNER[seat];
  const partnerWinning = currentWinner === partnerSeat;

  const winningCandidates = options.filter(c => beatsCurrentTrick(c, leadSuit));
  // True only if this player is the last of the four to act this trick —
  // otherwise whoever's "currently winning" could still get overtaken by
  // someone yet to play, and a counter thrown now could end up captured
  // by whichever team actually wins, not necessarily the declarer's.
  const isLastToAct = Object.keys(state.trick).length === 3;

  // NOTE: there used to be a special-case rule here that deliberately threw
  // a counter whenever this seat was void in both the led suit and trump,
  // the trick's current winner was the bid winner, and this was the last
  // play of the trick. The intent (per the original comment) was to feed
  // a counter to OUR OWN PARTNER when their win was already locked in —
  // but the condition checked "is the bid winner" rather than "is our
  // partner", so it also fired whenever an OPPONENT happened to be the
  // declarer, handing them a free counter for no reason even when a
  // harmless card was available. Removed: the partnerWinning branch right
  // below already covers the intended case (throwing our best counter
  // when partner has the trick locked up), and when an opponent is
  // winning instead, falling through to the normal "can't win — dump the
  // lowest-value card" logic further down is the correct play.

  if(partnerWinning){
    // Partner's already winning the trick — the right move is to unload
    // counters (A/10/K) onto it, not dump our worst card. How aggressively
    // depends on whether anyone left to act could still steal the trick:
    //  - last to act: the win is locked in, so throw our BEST counter.
    //  - still players behind us: some risk of being overtaken, so throw
    //    a counter if we have one (banking points is still usually right)
    //    but favor a lower-ranked counter over our single best one.
    const counters = options.filter(c => COUNTER_RANKS.includes(c.rank));
    if(counters.length){
      const byStrengthDesc = [...counters].sort((a,b)=>RANK_STRENGTH[b.rank]-RANK_STRENGTH[a.rank]);
      const byStrengthAsc = [...counters].sort((a,b)=>RANK_STRENGTH[a.rank]-RANK_STRENGTH[b.rank]);
      return isLastToAct ? byStrengthDesc[0] : byStrengthAsc[0];
    }
    // no counters available — just throw our lowest-value card
    return [...options].sort((a,b)=>RANK_POINTS[a.rank]-RANK_POINTS[b.rank])[0];
  }
  if(winningCandidates.length){
    // win as cheaply as possible
    return winningCandidates.sort((a,b)=>{
      if(a.suit===trump && b.suit!==trump) return -1; // prefer non-trump win when tied
      return RANK_STRENGTH[a.rank]-RANK_STRENGTH[b.rank];
    })[0];
  }
  // can't win — dump the lowest point card, preferably off-suit if we
  // couldn't follow anyway
  return [...options].sort((a,b)=>RANK_POINTS[a.rank]-RANK_POINTS[b.rank])[0];
}

function beatsCurrentTrick(card, leadSuit){
  const trump = state.trump;
  const played = Object.values(state.trick);
  if(played.length === 0) return true;
  let bestSoFar = null;
  Object.keys(state.trick).forEach(s=>{
    const c = state.trick[s];
    if(!bestSoFar) { bestSoFar = c; return; }
    if(cardBeats(c, bestSoFar, leadSuit, trump)) bestSoFar = c;
  });
  return cardBeats(card, bestSoFar, leadSuit, trump);
}

function cardBeats(c, current, leadSuit, trump){
  const cTrump = c.suit === trump, curTrump = current.suit === trump;
  if(cTrump && !curTrump) return true;
  if(!cTrump && curTrump) return false;
  if(cTrump && curTrump) return RANK_STRENGTH[c.rank] > RANK_STRENGTH[current.rank];
  // neither is trump
  if(c.suit === leadSuit && current.suit === leadSuit) return RANK_STRENGTH[c.rank] > RANK_STRENGTH[current.rank];
  if(c.suit === leadSuit) return true;
  return false;
}

function currentTrickWinner(){
  const leadSuit = leadSuitOfTrick();
  const seats = Object.keys(state.trick);
  if(!seats.length) return null;
  let winner = seats[0];
  seats.forEach(s=>{
    if(cardBeats(state.trick[s], state.trick[winner], leadSuit, state.trump)) winner = s;
  });
  return winner;
}

function playCard(seat, card){
  // Defensive guard: a missing card or a seat that's already played this
  // trick means something upstream scheduled a duplicate/stale call —
  // bail out quietly instead of crashing deep in the trick-resolution
  // logic (this pairs with the guard in advanceTrick's AI scheduling).
  if(!card || state.trick[seat]) return;
  state.hands[seat] = state.hands[seat].filter(c=>c.id !== card.id);
  state.trick[seat] = card;
  state.cardsPlayedCount++;
  addLog(`${SEAT_NAME[seat]} plays ${card.rank}${card.suit}.`);
  render();
  pausableTimeout(advanceTrick, 500);
}

function resolveTrick(){
  const winner = currentTrickWinner();
  let pts = 0;
  Object.values(state.trick).forEach(c => pts += RANK_POINTS[c.rank]);
  const isLastTrick = state.cardsPlayedCount === 48;
  if(isLastTrick) pts += 10; // last trick bonus

  const team = TEAM[winner];
  state.pointsThisHand[team] += pts;
  state.tricksTaken[winner]++;

  // House rule tracking: did the NON-declaring team just win a trick with
  // a counter (A/10/K) in it? Only matters once per hand — no need to
  // keep checking after it's already true.
  const nonDeclarerTeam = TEAM[state.bidWinner] === 'NS' ? 'EW' : 'NS';
  if(team === nonDeclarerTeam && !state.nonDeclarerWonCounterTrick){
    const hasCounter = Object.values(state.trick).some(c => COUNTER_RANKS.includes(c.rank));
    if(hasCounter) state.nonDeclarerWonCounterTrick = true;
  }

  addLog(`${SEAT_NAME[winner]} wins the trick (+${pts} pts)${isLastTrick ? ' — last trick bonus included' : ''}.`);

  setHandMsg(`${SEAT_NAME[winner]} takes the trick (+${pts}).`);
  render();

  pausableTimeout(()=>{
    state.trick = {};
    state.trickLeader = winner;
    clearTrickArea();
    if(isLastTrick){
      finishHand();
    } else {
      advanceTrick();
    }
  }, 900);
}

// ---------------------------------------------------------------------
// SCORING / HAND END
// ---------------------------------------------------------------------
function finishHand(){
  state.phase = 'scoring';
  const bidTeam = TEAM[state.bidWinner];
  const otherTeam = bidTeam === 'NS' ? 'EW' : 'NS';

  const meldByTeam = { NS: state.melds.N + state.melds.S, EW: state.melds.E + state.melds.W };
  const trickByTeam = { NS: state.pointsThisHand.NS, EW: state.pointsThisHand.EW };

  // House rule: the non-declaring team forfeits their meld for the hand
  // if they never won a trick containing a counter (A/10/K). The raw
  // meldByTeam value still gets DISPLAYED (so it's clear what they
  // actually melded), but the forfeited amount is what counts toward
  // the round score.
  const meldForfeited = !state.nonDeclarerWonCounterTrick;
  const effectiveMeldByTeam = { ...meldByTeam };
  if(meldForfeited) effectiveMeldByTeam[otherTeam] = 0;

  // "Round Score" here is the raw meld+trick total, regardless of whether
  // the bidding team actually made their contract — that's what the
  // reference layout shows in the This Round table (previously labeled
  // "Total Score", renamed per request).
  const roundRawByTeam = { NS: effectiveMeldByTeam.NS + trickByTeam.NS, EW: effectiveMeldByTeam.EW + trickByTeam.EW };
  const bidByTeam = { NS: 0, EW: 0 };
  bidByTeam[bidTeam] = state.bid;

  const madeIt = roundRawByTeam[bidTeam] >= state.bid;

  const previousScores = { NS: state.scores.NS, EW: state.scores.EW };
  // This is the actual signed change applied to cumulative score — differs
  // from roundRawByTeam for the bidding team when they're set (they lose
  // the bid amount instead of scoring their raw meld+tricks).
  const netChangeByTeam = { NS: 0, EW: 0 };
  netChangeByTeam[bidTeam] = madeIt ? roundRawByTeam[bidTeam] : -state.bid;
  netChangeByTeam[otherTeam] = roundRawByTeam[otherTeam];

  state.scores.NS += netChangeByTeam.NS;
  state.scores.EW += netChangeByTeam.EW;

  if(meldForfeited && meldByTeam[otherTeam] > 0){
    addLog(`${getTeamLabel(otherTeam)} forfeited their meld (${meldByTeam[otherTeam]} pts) — they never won a trick with a counter (A/10/K).`);
  }
  addLog(`Hand result — Your Team: ${state.scores.NS}, Opponents: ${state.scores.EW}.`);
  render();

  const gameOver = state.scores.NS >= GAME_TARGET || state.scores.EW >= GAME_TARGET;
  const winnerTeam = state.scores.NS > state.scores.EW ? 'NS' : 'EW';
  const heading = gameOver
    ? `*** ${getTeamLabel(winnerTeam).toUpperCase()} WIN THE GAME! ***`
    : 'Round Complete';
  const btnLabel = gameOver ? 'Start a new game' : 'Deal The Next Round';

  const row = (label, ns, ew) =>
    `<tr><td style="font-weight:600;">${label}</td><td>${ns}</td><td>${ew}</td></tr>`;
  const forfeitNote = (meldForfeited && meldByTeam[otherTeam] > 0)
    ? `<div style="text-align:center;font-size:.78rem;color:#7a1010;margin-bottom:4px;">${getTeamLabel(otherTeam)} forfeited their meld (${meldByTeam[otherTeam]} pts) — no trick with a counter (A/10/K) won.</div>`
    : '';

  const panel = document.getElementById('roundPanel');
  panel.style.display = 'flex';
  panel.innerHTML = `
    <h3 style="${gameOver ? 'color:red;font-size:1.1rem;' : ''}" class="${gameOver ? 'win-blink' : ''}">${heading}</h3>
    ${forfeitNote}
    <table>
      <tr><th></th><th>${getTeamLabel('NS')}</th><th>${getTeamLabel('EW')}</th></tr>
      ${row('Bid', bidByTeam.NS, bidByTeam.EW)}
      ${row('Meld Score', meldByTeam.NS, meldByTeam.EW)}
      ${row('Trick Score', trickByTeam.NS, trickByTeam.EW)}
      ${row('Round Score', roundRawByTeam.NS, roundRawByTeam.EW)}
    </table>
    <table>
      <tr><th></th><th>${getTeamLabel('NS')}</th><th>${getTeamLabel('EW')}</th></tr>
      ${row('Round Score', netChangeByTeam.NS, netChangeByTeam.EW)}
      ${row('Previous Score', previousScores.NS, previousScores.EW)}
      ${row('Total Score', state.scores.NS, state.scores.EW)}
    </table>
    <button onclick="document.getElementById('roundPanel').style.display='none'; ${gameOver ? 'newGame()' : 'nextHand()'};">${btnLabel}</button>
  `;
}

function nextHand(){
  // Defensive check: finishHand() already checks for game-over using the
  // scores it just computed, but this is a backstop that guarantees a
  // new hand can never get dealt once a team has actually reached
  // GAME_TARGET, no matter how that state came about.
  if(state.scores.NS >= GAME_TARGET || state.scores.EW >= GAME_TARGET){
    showGameOverPanel();
    return;
  }
  state.dealerIdx = (state.dealerIdx + 1) % 4;
  dealNewHand();
}

function showGameOverPanel(){
  const winnerTeam = state.scores.NS > state.scores.EW ? 'NS' : 'EW';
  const panel = document.getElementById('roundPanel');
  panel.style.display = 'flex';
  panel.innerHTML = `
    <h3 style="color:red;font-size:1.1rem;" class="win-blink">*** ${getTeamLabel(winnerTeam).toUpperCase()} WIN THE GAME! ***</h3>
    <table>
      <tr><th></th><th>${getTeamLabel('NS')}</th><th>${getTeamLabel('EW')}</th></tr>
      <tr><td style="font-weight:600;">Total Score</td><td>${state.scores.NS}</td><td>${state.scores.EW}</td></tr>
    </table>
    <button onclick="document.getElementById('roundPanel').style.display='none'; newGame();">Start a new game</button>
  `;
}

function newGame(){
  state.scores = { NS:0, EW:0 };
  state.dealerIdx = 0;
  log = [];
  document.getElementById('logPanel').innerHTML = '';
  dealNewHand();
}

// ---------------------------------------------------------------------
// RENDER
// ---------------------------------------------------------------------
function cardHtml(card, mini){
  const isRed = RED_SUITS.includes(card.suit);
  return `<div class="card ${isRed?'red':''} ${mini?'mini':''}">
    <div class="corner">${card.rank}${card.suit}</div>
    <div class="center-suit">${card.suit}</div>
    <div class="corner corner-bottom" style="align-self:flex-end;">${card.rank}${card.suit}</div>
  </div>`;
}

// Compact "rank+suit as colored text" display for the View All Cards
// testing option — not the full card graphic, just enough to identify
// each card at a glance, packed into a fixed-column grid (so a whole
// 12-card hand fits in a handful of rows instead of one long column).
function cardTextGridHtml(hand, columns){
  const cells = hand.map(c=>{
    const isRed = RED_SUITS.includes(c.suit);
    return `<span style="color:${isRed ? '#b3261e' : '#000'};">${c.rank}${c.suit}</span>`;
  }).join('');
  return `<div style="display:grid; grid-template-columns:repeat(${columns},1fr); gap:5px 8px; font-size:1.15rem; font-weight:700; text-align:center; background:#fffdf8; border:1px solid #999; border-radius:6px; padding:6px; width:100%;">${cells}</div>`;
}

function render(){
  updateScoreTable();

  // Combined Declarer/Dealer + Tricks line — one line per seat instead of
  // two, which is what actually fixed "Declarer" getting clipped: it cut
  // the vertical space each seat needs rather than just hoping the row
  // was tall enough.
  const declarerPhases = ['trump','passing','humanMeld','meld','play','scoring'];
  const showDeclarer = declarerPhases.includes(state.phase);
  const showTricks = state.phase==='play' || state.phase==='scoring';
  const dealerSeat = SEATS[state.dealerIdx];
  SEATS.forEach(seat=>{
    let tag = '';
    if(showDeclarer && state.bidWinner === seat) tag = 'Declarer';
    else if(seat === dealerSeat) tag = 'Dealer';
    const tagHtml = tag ? `<span class="tag">${tag}</span>` : '';
    const tricksHtml = showTricks ? `<span class="tricks">Tricks: ${state.tricksTaken[seat]}</span>` : '';
    const sep = (tagHtml && tricksHtml) ? `<span class="sep">•</span>` : '';
    document.getElementById(`meta-${seat}`).innerHTML = tagHtml + sep + tricksHtml;
  });

  // The trick-in-progress grid only has content during play — outside that
  // phase it was just an empty placeholder still claiming its full height,
  // which is exactly what was squeezing/clipping the bid panel during
  // bidding. Hide it whenever there's nothing to show.
  document.getElementById('trickArea').style.display = (state.phase === 'play') ? 'grid' : 'none';

  // Default these to hidden — renderPassPanel()/renderMeldPanel() re-show
  // them explicitly whenever those phases are actually active, so a
  // leftover panel from an earlier phase never lingers on screen.
  document.getElementById('passPanel').style.display = 'none';
  document.getElementById('meldPanel').style.display = 'none';
  document.getElementById('trumpPanel').style.display = 'none';
  document.getElementById('roundPanel').style.display = 'none';

  // AI seats: show a card-back per remaining card, or — with View All
  // Cards enabled — a compact colored text grid of their actual hand
  // for testing. Bill gets more columns (he has much more horizontal
  // room); Mike/Lisa get 3 columns, which spreads 12 cards into 4 rows
  // to fit their narrow side columns.
  ['N','E','W'].forEach(seat=>{
    const el = document.getElementById(`cards-${seat}`);
    if(state.viewAllCards){
      el.innerHTML = cardTextGridHtml(state.hands[seat], seat === 'N' ? 4 : 2);
    } else {
      el.innerHTML = state.hands[seat].map(()=>'<div class="cardback"></div>').join('');
    }
  });

  // South hand: real, clickable cards. What clicking a card does depends
  // on the current phase — dispatched through onSouthCardClick below.
  const southEl = document.getElementById('south-hand');
  southEl.classList.toggle('crowded', state.hands.S.length > 12);
  const leadSuit = state.phase==='play' ? leadSuitOfTrick() : null;
  const legal = state.phase==='play' ? legalPlays('S', leadSuit).map(c=>c.id) : null;
  const southHtml = state.hands.S.map(card=>{
    let clickable = false, dimmed = false, extraClass = '';

    if(state.phase==='play'){
      const isLegal = !legal || legal.includes(card.id);
      clickable = isLegal && !state.trick['S'] && isSouthsTurn();
      // Deliberately no dimming here — the follow-suit rule is still
      // enforced (illegal cards just won't respond to a click), but the
      // greyed-out look wasn't wanted.
    } else if(state.phase==='passing'){
      clickable = true;
      if(state.passSelection.includes(card.id)) extraClass = 'selected';
    } else if(state.phase==='humanMeld'){
      clickable = true;
      if(state.humanMeldSelection.includes(card.id)) extraClass = 'selected';
      // No visual marker for "already used in a declared meld" anymore —
      // it was reading as a persistent selection outline rather than a
      // helpful note, which is confusing since it isn't actually
      // selected. state.humanMeldUsed is still tracked internally, just
      // not shown.
    }

    return `<div class="cardWrap ${extraClass}" ${clickable ? `onclick="onSouthCardClick('${card.id}')"` : ''}>
      <div style="${dimmed ? 'opacity:.35;' : ''}">
        ${cardHtml(card, false)}
      </div>
    </div>`;
  }).join('');
  // Only actually touch the DOM if something about it changed — rebuilding
  // innerHTML unconditionally recreates every card element every time
  // ANY player plays, which re-triggers :hover (and its lift animation)
  // on whatever card your mouse happens to be sitting over.
  if(southHtml !== _lastSouthHandHtml){
    // A rebuild right as it becomes your turn (e.g. right after Lisa
    // plays, since she's the seat before you in rotation) is genuinely
    // necessary — your cards' clickability actually changes. But if your
    // mouse is already resting on a card when that happens, recreating
    // the element re-triggers :hover from scratch, and the transition
    // animates the lift as if you'd just moved your mouse there — a
    // "bounce" you didn't cause. Suppressing the transition for one
    // frame around the rebuild makes that instant instead of animated.
    southEl.classList.add('no-transition');
    southEl.innerHTML = southHtml;
    _lastSouthHandHtml = southHtml;
    requestAnimationFrame(()=> requestAnimationFrame(()=>{
      southEl.classList.remove('no-transition');
    }));
  }

  // Trick area
  ['N','E','S','W'].forEach(seat=>{
    const slot = document.getElementById(`tc-${seat}`);
    slot.innerHTML = state.trick[seat] ? cardHtml(state.trick[seat], true) : '';
  });
}

function isSouthsTurn(){
  const order = rotateFrom(state.trickLeader);
  const nextToPlay = order.find(s => !state.trick[s]);
  return nextToPlay === 'S';
}

function onSouthCardClick(cardId){
  if(state.phase === 'play') humanPlay(cardId);
  else if(state.phase === 'passing') togglePassSelection(cardId);
  else if(state.phase === 'humanMeld') toggleMeldSelection(cardId);
}

function humanPlay(cardId){
  if(state.phase !== 'play' || !isSouthsTurn()) return;
  const leadSuit = leadSuitOfTrick();
  const legal = legalPlays('S', leadSuit);
  const card = state.hands.S.find(c=>c.id===cardId);
  if(!card || !legal.some(c=>c.id===cardId)) return;
  playCard('S', card);
}

function highlightActiveSeat(seat){
  ['N','E','S','W'].forEach(s=>{
    document.getElementById(`seat-${s}`).classList.toggle('active', s===seat);
  });
}
function clearActiveSeat(){
  ['N','E','S','W'].forEach(s=> document.getElementById(`seat-${s}`).classList.remove('active'));
}
function clearTrickArea(){
  ['N','E','S','W'].forEach(seat=>{
    document.getElementById(`tc-${seat}`).innerHTML = '';
  });
}
function setHandMsg(msg){ /* handMsg UI removed per request — kept as a no-op so existing calls don't need touching; addLog() already captures the same info in the game log */ }

// Speech bubbles: shows a short message next to a seat's avatar, then
// fades it back out after a few seconds. Re-triggering on the same seat
// before it fades just resets the timer with the new text. persist=true
// (used during bidding) skips the auto-hide entirely — those bubbles stay
// up until hideAllBubbles() is called when bidding actually ends.
function showBubble(seat, text, persist=false){
  const el = document.getElementById(`bubble-${seat}`);
  if(!el) return;
  el.textContent = text;
  el.classList.add('visible');
  clearTimeout(el._hideTimer);
  if(!persist){
    el._hideTimer = setTimeout(()=> el.classList.remove('visible'), 2800);
  }
}

function hideAllBubbles(){
  ['N','E','S','W'].forEach(seat=>{
    const el = document.getElementById(`bubble-${seat}`);
    if(!el) return;
    clearTimeout(el._hideTimer);
    el.classList.remove('visible');
  });
}

// Score table (top-left corner): Team / Bid / Score. The Bid column stays
// blank while bidding is still live — it only shows the final winning
// bid once the auction has actually concluded (phase moves past bidding).
function updateScoreTable(){
  document.getElementById('team-ns-label').textContent = getTeamLabel('NS');
  document.getElementById('team-ew-label').textContent = getTeamLabel('EW');
  const biddingSettled = state.phase !== 'bidding' && state.bid > 0;
  const winningTeam = biddingSettled ? TEAM[state.bidWinner] : null;
  document.getElementById('ns-bid').textContent = winningTeam === 'NS' ? state.bid : '—';
  document.getElementById('ew-bid').textContent = winningTeam === 'EW' ? state.bid : '—';
  document.getElementById('ns-score').textContent = state.scores.NS;
  document.getElementById('ew-score').textContent = state.scores.EW;

  // Match the trump badge's width to the score table's — min-width only,
  // so a long trump name (e.g. "Diamonds") can still push it wider on
  // its own without being clipped.
  const scoreWidth = document.getElementById('scoreTable').offsetWidth;
  document.getElementById('trumpBadge').style.minWidth = scoreWidth + 'px';
}

function addLog(msg){
  log.push(msg);
  const panel = document.getElementById('logPanel');
  const div = document.createElement('div');
  div.textContent = msg;
  panel.appendChild(div);
  panel.scrollTop = panel.scrollHeight;
}

// ---------------------------------------------------------------------
// MODAL SYSTEM (matches the #universalModal / showModal() pattern used
// across the Game Hub, so Notepad++ diffs stay familiar between files)
// ---------------------------------------------------------------------
function showModal(title, bodyHtml, btnHtml, dismissable){
  const titleEl = document.getElementById('modalTitle');
  titleEl.textContent = title;
  titleEl.style.textAlign = '';
  titleEl.style.color = '';
  document.getElementById('modalBody').innerHTML = bodyHtml;
  document.getElementById('modalBtns').innerHTML = btnHtml || `<button onclick="closeModal()">OK</button>`;
  document.getElementById('modalBtns').style.justifyContent = '';
  const modal = document.getElementById('universalModal');
  modal.style.display = 'flex';
  modal.dataset.dismissable = dismissable ? '1' : '0';
}
function closeModal(){
  document.getElementById('universalModal').style.display = 'none';
}
document.getElementById('universalModal').addEventListener('click', (e)=>{
  if(e.target.id === 'universalModal' && e.target.dataset.dismissable === '1') closeModal();
});

    <p style="font-size:.92rem; font-weight:600; text-align:center; margin: -10px 0 0.5in;">(The Check Boxes are Provided for Learning Purposes)</p>
    <div style="display:grid; grid-template-columns: auto 130px; row-gap:18px; column-gap:16px; align-items:center;">
      <label for="playerNameInput" style="font-weight:600; text-align:left;">Change the Name:</label>
      <input type="text" id="playerNameInput" maxlength="16"
        value="${isDefaultName ? '' : SEAT_NAME.S}" placeholder="${isDefaultName ? 'You' : SEAT_NAME.S}"
        style="padding:6px 10px;font-size:1rem;border:2px solid #333;border-radius:6px;width:100%;">

      <label for="aiMeldsCheckbox" style="font-weight:600; text-align:left; cursor:pointer;">AI Creates the Melds:</label>
      <input type="checkbox" id="aiMeldsCheckbox" ${state.aiCreatesMelds ? 'checked' : ''}
        style="width:22px;height:22px;cursor:pointer;justify-self:end;">

      <label for="viewAllCardsCheckbox" style="font-weight:600; text-align:left; cursor:pointer;">View All Cards:</label>
      <input type="checkbox" id="viewAllCardsCheckbox" ${state.viewAllCards ? 'checked' : ''}
        style="width:22px;height:22px;cursor:pointer;justify-self:end;">

      <label for="spacebarPauseCheckbox" style="font-weight:600; text-align:left; cursor:pointer;">Use Spacebar to Pause:</label>
      <input type="checkbox" id="spacebarPauseCheckbox" ${state.spacebarPauseEnabled ? 'checked' : ''}
        style="width:22px;height:22px;cursor:pointer;justify-self:end;">
    </div>
  `, `
    <button onclick="saveOptions()">Save</button>
    <button onclick="closeModal()">Cancel</button>
  `, true);
  document.getElementById('playerNameInput').focus();
});

function saveOptions(){
  const input = document.getElementById('playerNameInput');
  const newName = input.value.trim();
  if(newName){
    SEAT_NAME.S = newName;
    document.getElementById('south-name').textContent = newName;
  }
  state.aiCreatesMelds = document.getElementById('aiMeldsCheckbox').checked;
  state.viewAllCards = document.getElementById('viewAllCardsCheckbox').checked;
  state.spacebarPauseEnabled = document.getElementById('spacebarPauseCheckbox').checked;
  // If the player just disabled spacebar-pause while already paused,
  // don't leave the game stuck paused with no way to resume it.
  if(!state.spacebarPauseEnabled && state.paused) togglePause();
  render(); // refreshes the score table, bubbles, and anywhere else that reads SEAT_NAME.S
  closeModal();
}

function togglePause(){
  state.paused = !state.paused;
  document.getElementById('pauseOverlay').style.display = state.paused ? 'flex' : 'none';
}

document.addEventListener('keydown', (e)=>{
  if(e.code !== 'Space') return;
  if(!state.spacebarPauseEnabled) return;
  // Don't hijack spacebar while typing in a text field (e.g. the name
  // input in Options)
  const tag = document.activeElement ? document.activeElement.tagName : '';
  if(tag === 'INPUT' || tag === 'TEXTAREA') return;
  e.preventDefault();
  togglePause();
});

document.getElementById('newHandBtn').addEventListener('click', ()=>{
  showModal('Start New Game?', 'This resets both scores to 0.', `
    <button onclick="closeModal(); newGame();">Start New Game</button>
    <button onclick="closeModal()">Cancel</button>
  `, false);
});
document.getElementById('logToggle').addEventListener('click', ()=>{
  const p = document.getElementById('logPanel');
  p.style.display = p.style.display === 'block' ? 'none' : 'block';
});

dealNewHand();
</script>
</body>
</html>
