      if(legal.includes(card)) playCard('player', card);
    }
  });
  document.getElementById('sendToCribBtn').addEventListener('click', sendToCrib);

  // Hidden debug-outline toggle (double-click the invisible button in the
  // top-left corner) - same aid used on Pinochle, for checking box/frame
  // boundaries during layout work.
  document.getElementById('outlineToggle').addEventListener('dblclick', function(){
    document.body.classList.toggle('debug-on');
  });

  // ---- Name box ----
  try {
    const savedName = localStorage.getItem(PLAYER_NAME_KEY);
    if(savedName && savedName.trim()){ state.playerName = savedName.trim(); }
  } catch(e){}
  document.getElementById('yourNameInput').value = state.playerName === 'Player 1' ? '' : state.playerName;
  document.getElementById('yourNameInput').addEventListener('change', ()=>{
    const input = document.getElementById('yourNameInput');
    const newName = input.value.trim();
    state.playerName = newName || 'Player 1';
    input.value = newName;
    try { if(newName) localStorage.setItem(PLAYER_NAME_KEY, newName); else localStorage.removeItem(PLAYER_NAME_KEY); } catch(e){}
    render();
  });

  // ---- Load persisted options / session wins ----
  try {
    const raw = localStorage.getItem(OPTIONS_KEY);
    if(raw){
      const saved = JSON.parse(raw);
      if(typeof saved.soundEnabled === 'boolean') state.soundEnabled = saved.soundEnabled;
      if(typeof saved.aiCalculatesScores === 'boolean') state.aiCalculatesScores = saved.aiCalculatesScores;
      if(typeof saved.statusBarEnabled === 'boolean') state.statusBarEnabled = saved.statusBarEnabled;
    }
  } catch(e){}
  try {
    const rawWins = sessionStorage.getItem(SESSION_WINS_KEY);
    if(rawWins) state.sessionWins = JSON.parse(rawWins);
  } catch(e){}

  // ---- Resume (sessionStorage) - lets an in-progress hand survive a trip
  // to Instructions and back, per Perry's report that returning from
  // CribbageInstructions.html was starting a brand-new game instead of
  // continuing the one he was in the middle of. Same pattern as Blackjack/
  // Klondike's own Instructions round-trip.
  //
  // Only the 'discard' and 'play' phases are saved/restored - the other
  // phases ('dealercut', 'cut', 'show', 'gameover') all depend on
  // in-progress ribbon animations, timers, or the Show walkthrough's own
  // step counter, none of which live in `state` or survive a page reload -
  // restoring mid-ribbon or mid-Show would leave the game soft-locked, or
  // (for the Show) risk re-scoring a step that was already scored. The
  // rulesBtn click handler below blocks Instructions outright during 'cut'
  // and 'show' (with an explanation) rather than letting it navigate away
  // to a game it can't safely restore, per Perry's follow-up request -
  // 'dealercut' and 'gameover' are brief/terminal enough that falling back
  // to a fresh game there is a non-issue, so those are left as they are.
  function saveResumeState(){
    try { sessionStorage.setItem(RESUME_KEY, JSON.stringify(state)); } catch(e){}
  }
  function clearResumeState(){
    try { sessionStorage.removeItem(RESUME_KEY); } catch(e){}
  }
  function tryRestoreResumeState(){
    let raw;
    try { raw = sessionStorage.getItem(RESUME_KEY); } catch(e){ return false; }
    if(!raw) return false;
    clearResumeState(); // consume once, whether or not it turns out to be valid
    try {
      const saved = JSON.parse(raw);
      const validPhase = saved.phase === 'discard' || saved.phase === 'play';
      const validDealer = saved.dealer === 'player' || saved.dealer === 'ai';
      const validHands = saved.hands && Array.isArray(saved.hands.player) && Array.isArray(saved.hands.ai);
      const validScores = saved.scores && typeof saved.scores.player === 'number' && typeof saved.scores.ai === 'number';
      const validDeck = Array.isArray(saved.deck) && Array.isArray(saved.crib);
      if(!validPhase || !validDealer || !validHands || !validScores || !validDeck){
        return false;
      }
      Object.assign(state, saved);
      render();
      // The AI's own turn is normally driven by a setTimeout chain (see
      // aiTakeTurn's call sites) - a restore has no pending timer to pick
      // that back up, so re-arm it here the same way Blackjack re-arms its
      // dealerPlayStep after a restore.
      if(state.phase === 'play' && state.turn === 'ai'){
        setTimeout(aiTakeTurn, 700);
      }
      return true;
    } catch(e){ return false; }
  }

  // ---- Keep the felt exactly 0.25in clear of the Action buttons - measured
  // from the buttons' own actual rendered width rather than a guessed
  // fixed px value, so it stays exact regardless of font rendering. ----
  function layoutButtonGap(){
    const btnRect = document.getElementById('buttonGroup').getBoundingClientRect();
    const gapPx = 0.25 * 96; // 0.25in at the standard 96px/in CSS resolution
    document.getElementById('gameArea').style.paddingLeft = (btnRect.right + gapPx) + 'px';
  }
  window.addEventListener('resize', layoutButtonGap);

  // ---- Keep "Rev. N" right-aligned with the cribbage board's own right
  // edge (the board can sit short of the window's right edge, so a fixed
  // CSS "right" value doesn't track it). ----
  function layoutRevBadge(){
    const boardRect = document.getElementById('boardColumn').getBoundingClientRect();
    document.getElementById('revBadge').style.right = (window.innerWidth - boardRect.right) + 'px';
  }
  window.addEventListener('resize', layoutRevBadge);

  // ---- Center the names/hands/deck/status bar (all centered on each
  // other inside #cardArea already) on the true "playing field": the span
  // between the felt's left edge and the left edge of the actual wooden
  // board - NOT #boardColumn's own left edge, which is the left edge of
  // the Scoreboard box that sits beside the board, further left than the
  // board itself. #cardArea's own flex-allocated width stops at
  // #boardColumn (so as to leave room for the Scoreboard), which is
  // narrower than this target span, so the shortfall is made up with a
  // pure visual shift (transform - doesn't affect layout/flow) rather
  // than resizing #cardArea itself. ----
  // Caches the horizontal-shift clamp computed in layoutCardAreaCenter()
  // below, so it's computed once per hand (reset to null in startNewHand()
  // and on window resize) instead of being recomputed from live, changing
  // measurements on every render()/setStatus() call. Per Perry's report,
  // recomputing it continuously let it fluctuate turn-to-turn as hand
  // widths shrank during play and status text length varied, which made
  // the whole #cardArea visibly shift left/right during play and counting.
  let cachedMaxShift = null;
  // Caches the Status/Directions bar's own NATURAL (pre-transform) top AND
  // height, the first time each is measured each hand - see the note where
  // these are used, in layoutCardAreaCenter() below, for why a live
  // measurement isn't safe here.
  let cachedStatusBoxNaturalTop = null;
  let cachedStatusBoxNaturalHeight = null;

  function layoutCardAreaCenter(){
    const cardArea = document.getElementById('cardArea');
    // Reset the shift and any previous per-element offsets first, so every
    // measurement below reflects the natural (untransformed) layout.
    cardArea.style.transform = '';
    document.getElementById('topCribSlot').style.left = '';
    document.getElementById('topCribSlot').style.top = '';
    document.getElementById('bottomCribSlot').style.left = '';
    document.getElementById('deckStarterArea').style.left = '';
    document.getElementById('topArea').style.transform = '';
    document.getElementById('topHandCribRow').style.minHeight = '';
    document.getElementById('topHandCribRow').style.marginTop = '';
    document.getElementById('topHandCribRow').style.transform = '';
    document.getElementById('bottomCribSlot').style.top = '';
    document.getElementById('bottomHandCribRow').style.minHeight = '';
    document.getElementById('playPileArea').style.transform = '';
    document.getElementById('playPileArea').style.marginLeft = '';
    document.getElementById('aiHandRow').style.marginLeft = '';
    document.getElementById('playerHandRow').style.marginLeft = '';
    document.getElementById('playerHandRow').style.transform = '';
    document.getElementById('statusBox').style.marginTop = '';
    document.getElementById('statusBox').style.left = '';
    document.getElementById('statusBox').style.transform = '';
    document.getElementById('sendToCribBtn').style.left = '';
    document.getElementById('sendToCribBtn').style.top = '';
    document.getElementById('sendToCribBtn').style.transform = '';
    document.getElementById('sessionWinsBox').style.top = '';
    document.getElementById('topName').style.transform = '';
    document.getElementById('topDealerTag').style.transform = '';
    document.getElementById('bottomName').style.transform = '';
    document.getElementById('bottomDealerTag').style.transform = '';
    const calcScoreBtnReset = document.getElementById('calcScoreBtn');
    if(calcScoreBtnReset){ calcScoreBtnReset.style.transform = ''; }

    const tableWrapRect = document.getElementById('table-wrap').getBoundingClientRect();
    const boardFrameRect = document.getElementById('boardFrame').getBoundingClientRect();
    const scoreboardRect = document.getElementById('scoreboardBox').getBoundingClientRect();
    const cardAreaRect = cardArea.getBoundingClientRect();
    const aiHandRect = document.getElementById('aiHandRow').getBoundingClientRect();
    const playerHandRect = document.getElementById('playerHandRow').getBoundingClientRect();
    const sendBtnEl = document.getElementById('sendToCribBtn');
    const SEND_BTN_GAP = 16;

    const desiredCenter = (tableWrapRect.left + boardFrameRect.left) / 2;
    const currentCenter = cardAreaRect.left + cardAreaRect.width / 2;
    let shift = desiredCenter - currentCenter;

    // Cap on the right: never shift far enough that the widest current
    // content (a 6-card hand or the deck) could reach the Scoreboard box,
    // which sits between #cardArea and the actual board. The status bar is
    // deliberately left OUT of this now that it's a fixed-width box with
    // its own independent centering below (its raw, not-yet-repositioned
    // rect at this point is flush against #cardArea's left edge and would
    // wildly overstate how far right content actually reaches, forcing
    // #cardArea - and everything in it, names and hands included - too far
    // left). The "Send to Crib" button is deliberately left OUT of this too
    // - per Perry's request, the button must never pull the actual
    // names/hands/status bar off true-center; instead the button's own
    // position is clamped separately, below, after the shift is settled.
    const contentRight = Math.max(
      aiHandRect.right, playerHandRect.right,
      document.getElementById('playPileArea').getBoundingClientRect().right
    );
    if(cachedMaxShift === null){
      cachedMaxShift = (scoreboardRect.left - 12) - contentRight;
    }
    shift = Math.min(shift, cachedMaxShift);

    cardArea.style.transform = shift ? `translateX(${shift}px)` : '';

    // "George" and "Perry" (the player names) are centered left-to-right
    // directly on the same playing-field midpoint (desiredCenter) the hands,
    // status bar and deck/starter stack already use, per Perry's request.
    // The name is nudged individually here, rather than relying on the
    // existing align-items:center on #topArea/#bottomArea, because it sits
    // in a .nameRow alongside its own Dealer tag - which stays in the flex
    // row (reserving its own width) even while hidden via
    // visibility:hidden - so centering the ROW as a whole was leaving the
    // NAME text itself visibly off-center by half the tag's reserved width.
    // The Dealer tag is carried along by the SAME shift (not centered on
    // its own), so it keeps riding immediately to the right of the name,
    // exactly as before, rather than being left behind at its old position
    // while the name moves out from under it.
    const topNameEl = document.getElementById('topName');
    const topNameRectForCenter = topNameEl.getBoundingClientRect();
    const topNameShift = desiredCenter - (topNameRectForCenter.left + topNameRectForCenter.width / 2);
    topNameEl.style.transform = topNameShift ? `translateX(${topNameShift}px)` : '';
    document.getElementById('topDealerTag').style.transform = topNameShift ? `translateX(${topNameShift}px)` : '';
    const bottomNameEl = document.getElementById('bottomName');
    const bottomNameRectForCenter = bottomNameEl.getBoundingClientRect();
    const bottomNameShift = desiredCenter - (bottomNameRectForCenter.left + bottomNameRectForCenter.width / 2);
    bottomNameEl.style.transform = bottomNameShift ? `translateX(${bottomNameShift}px)` : '';
    document.getElementById('bottomDealerTag').style.transform = bottomNameShift ? `translateX(${bottomNameShift}px)` : '';

    // The Status/Directions bar is a static-width box, per Perry's
    // request, which can end up wider than #cardArea's own flex-allocated
    // width - meaning ordinary flex/margin centering can't center it
    // within #cardArea (an oversized flex item just flushes to the
    // container's edge instead). Nudge it with its own relative-position
    // offset so its
    // center lands exactly on the same playing-field midpoint #cardArea
    // itself is centered on above.
    const statusBoxEl = document.getElementById('statusBox');
    const statusRectNow = statusBoxEl.getBoundingClientRect();
    statusBoxEl.style.left = (desiredCenter - (statusRectNow.left + statusRectNow.width / 2)) + 'px';

    // Both crib boxes and the deck/starter stack left-align with "This
    // Session's Wins" own left edge, per Perry's request - independent of
    // where the (separately centered) hands and play pile currently sit.
    const sessionWinsRect = document.getElementById('sessionWinsBox').getBoundingClientRect();
    ['topCribSlot','bottomCribSlot'].forEach(slotId => {
      const slot = document.getElementById(slotId);
      const handCribRowRect = slot.parentElement.getBoundingClientRect();
      slot.style.left = (sessionWinsRect.left - handCribRowRect.left) + 'px';
    });
    const middleAreaRect = document.getElementById('middleArea').getBoundingClientRect();
    document.getElementById('deckStarterArea').style.left = (sessionWinsRect.left - middleAreaRect.left) + 'px';

    // The play pile (pegging cards) no longer recenters in #middleArea as it
    // grows - it starts at a fixed left edge, just to the right of the
    // deck/starter stack, and only ever builds further right, per Perry's
    // request. (#middleArea itself switched from justify-content:center to
    // flex-start in the CSS for this - this margin is what replaces the
    // centering, since #playPileArea is #middleArea's only normal-flow
    // child.)
    const DECK_STACK_WIDTH = 60.69; // matches .deckStarterStack's own width
    const DECK_PILE_GAP = 40; // same 40px #middleArea already used as its (otherwise-unused, since the deck is absolutely positioned) flex gap
    const PLAY_PILE_RIGHT_SHIFT = 216; // 2.25in further right than that, per Perry's request
    document.getElementById('playPileArea').style.marginLeft =
      ((sessionWinsRect.left - middleAreaRect.left) + DECK_STACK_WIDTH + DECK_PILE_GAP + PLAY_PILE_RIGHT_SHIFT) + 'px';

    // Both hands are centered left-to-right as if they were still holding a
    // full 6-card hand, within the span from the left edge of the felt to
    // the left edge of the cribbage board (the same span #cardArea itself
    // centers on, above) - per Perry's request. Because this uses a FIXED,
    // 6-card-wide measurement rather than the hand's actual (shrinking)
    // current width, the hand's position never moves as cards are
    // discarded or played - it just has empty space to its right once
    // fewer than 6 cards remain. (.handCribRow itself switched from
    // justify-content:center to flex-start in the CSS for this - this
    // margin is what replaces the centering.)
    const SIX_CARD_HAND_WIDTH = 214.14; // .card's 60.69px width + 5 more cards at (60.69 - 30)px each, matching .handRow's own -30px card overlap
    const sixCardHandLeftPage = desiredCenter - (SIX_CARD_HAND_WIDTH / 2);
    ['topHandCribRow','bottomHandCribRow'].forEach(rowId => {
      const row = document.getElementById(rowId);
      const hand = row.querySelector('.handRow');
      const rowRect = row.getBoundingClientRect();
      hand.style.marginLeft = (sixCardHandLeftPage - rowRect.left) + 'px';
    });

    // "This Session's Wins" moves to the bottom-left of the felt, its own
    // bottom edge aligned with the bottom of the Cribbage board - only the
    // vertical anchor changes (left:8px is untouched), per Perry's
    // request. Measured as a delta from its own CSS reset position (8px)
    // rather than computed from scratch, so it's exact regardless of
    // #table-wrap's border/padding.
    const sessionWinsBox = document.getElementById('sessionWinsBox');
    const sessionWinsBaseRect = sessionWinsBox.getBoundingClientRect();
    const sessionWinsBaseTop = parseFloat(getComputedStyle(sessionWinsBox).top);
    const sessionWinsDownDelta = boardFrameRect.bottom - sessionWinsBaseRect.bottom;
    sessionWinsBox.style.top = (sessionWinsBaseTop + sessionWinsDownDelta) + 'px';

    // George's crib box top-aligns with the top of his playing cards, per
    // Perry's request - meaning the CARD BACKS in the crib box line up with
    // his hand's cards. The "GEORGE'S CRIB" label now sits to the RIGHT of
    // the box (see .cribSlot's row layout in the CSS), vertically centered
    // against the box's own height rather than above it - so unlike the old
    // column layout, the label no longer needs any extra headroom reserved
    // above the row, and the box's top can simply match the hand's top
    // directly.
    const topCribSlot = document.getElementById('topCribSlot');
    const topHandCribRow = document.getElementById('topHandCribRow');
    topHandCribRow.style.minHeight = '136px';
    if(topCribSlot.classList.contains('active')){
      const topHandCribRowRect = topHandCribRow.getBoundingClientRect();
      topCribSlot.style.top = (aiHandRect.top - topHandCribRowRect.top) + 'px';
    }

    // George's name AND his hand move up TOGETHER as one group, per Perry's
    // request, so the TOP of his name lands exactly 0.125in (12px) below
    // the top edge of the felt (just inside the board's burgundy border) -
    // regardless of whether the Dealer tag or crib box are currently
    // showing. Applied as a transform on #topArea itself (the shared
    // parent of the name row and #topHandCribRow), not a margin - #topArea
    // sits in the same flex column as #middleArea (flex:1) inside
    // #cardArea, which would silently cancel out a margin-based shift the
    // same way it did for the Status/Directions bar (see the note on
    // STATUS_BAR_NET_SHIFT below). Measured and applied AFTER the
    // crib-label clearance above is settled, so that internal spacing
    // (name-to-hand) is unaffected - the whole group just slides as one.
    const TOP_NAME_GAP = 12; // 0.125in, per Perry's request
    const TABLE_WRAP_PADDING_TOP = 10; // matches #table-wrap's own padding: 10px 14px
    const feltTopY = cardAreaRect.top - TABLE_WRAP_PADDING_TOP;
    const topArea = document.getElementById('topArea');
    const topNameRectNatural = document.getElementById('topName').getBoundingClientRect();
    const topGroupShift = (feltTopY + TOP_NAME_GAP) - topNameRectNatural.top;
    topArea.style.transform = topGroupShift ? `translateY(${topGroupShift}px)` : '';
    // George's cards' own final (shifted) bottom edge - used below to
    // center the play pile between here and the status bar. Computed as a
    // fixed card-height below the row's own top, rather than read straight
    // off the row's rendered .bottom, because #aiHandRow has no explicit
    // height of its own - once George has played his last card for the
    // round and the row sits empty, its rendered height (and so its real
    // .bottom) collapses toward 0, which was dragging the played-cards pile
    // upward with it. This virtual bottom stays put whether the row holds
    // 6 cards or none, per Perry's report.
    const CARD_HEIGHT = 85.255; // matches .card's own height
    const aiHandRowFinal = document.getElementById('aiHandRow').getBoundingClientRect();
    const finalAiHandBottom = aiHandRowFinal.top + CARD_HEIGHT;

    // ---- Player 1's hand, crib box, and "Send to Crib" button move down
    // together as one group, per Perry's request, by an amount computed so
    // that the BOTTOM of Player 1's crib box lands exactly 0.125in (12px)
    // above "This Session's Wins" (set just above). The crib box's own
    // height is fixed (built for the full eventual 4-card crib - see
    // .crib-stack below), and its top always equals the hand's own top (see
    // the top-alignment step further down), so there's one group-shift
    // value that puts the crib's bottom at exactly that spot - solved for
    // here, using the hand's and crib's UNSHIFTED/natural positions, before
    // anything below is moved. Because this is computed once per layout
    // pass (on a new hand or a resize) from positions that don't change
    // while cards are dealt, discarded, or played, the whole group still
    // holds still for the rest of the hand once set, same as the old fixed
    // constant this replaces.
    const playerHandRow = document.getElementById('playerHandRow');
    const bottomHandCribRow = document.getElementById('bottomHandCribRow');
    const statusBox = document.getElementById('statusBox');
    const CRIB_BOX_HEIGHT = 101.255; // .crib-stack (85.255px) + .crib-box's 5px padding and 3px border on each side
    const CRIB_ABOVE_WINS_GAP = 12; // 0.125in gap, per Perry's request
    const sessionWinsFinalRect = sessionWinsBox.getBoundingClientRect(); // already moved to the bottom of the felt, above
    const playerHandTopUnshifted = playerHandRow.getBoundingClientRect().top;
    const GROUP_SHIFT = sessionWinsFinalRect.top - CRIB_ABOVE_WINS_GAP - CRIB_BOX_HEIGHT - playerHandTopUnshifted;
    // Player 1's hand/crib/button group moves an EXTRA amount on top of the
    // solved GROUP_SHIFT above, per Perry's requests: first up 0.25in
    // (-24px) to open up more clearance above "This Session's Wins" than
    // the exact 0.125in solved for there already gave, then down 0.3125in
    // (+30px) on top of that to clear a newer overlap Perry reported above
    // this group - net +6px (still slightly above the originally-solved
    // exact-gap position).
    const GROUP_EXTRA_SHIFT = -24 + 30;
    const GROUP_SHIFT_TOTAL = GROUP_SHIFT + GROUP_EXTRA_SHIFT;
    // Status bar moves up 0.375in (36px), per Perry's latest request.
    // Applied as a TRANSFORM, not a margin: #middleArea sits directly above
    // the status bar and is itself a flex:1 item that silently
    // absorbs/releases space to exactly cancel out any margin change on the
    // status bar - which is why every earlier attempt to nudge it via
    // marginTop (clearing the crib label below it, moving it down 0.7in)
    // never actually moved it on screen, no matter the value, even though
    // it looked like it should. (Confirmed directly: setting two different
    // marginTop values and measuring the status bar's actual on-screen
    // position afterward gave the identical pixel result both times -
    // #middleArea had simply grown or shrunk by the same amount to
    // compensate.) A transform moves the box after layout has already
    // settled, so #middleArea has nothing left to compensate for, and the
    // shift actually happens - starting fresh from the position Perry has
    // actually been seeing all along, since none of those earlier
    // adjustments were ever really there to build on top of. This also
    // happens to clear "Perry's Crib" label below it, which the status bar
    // had been overlapping.
    // -36 = the status bar's net upward shift, per Perry's request (moved
    // back down 0.25in/24px from an earlier -60, now that the
    // grow-upward-not-downward fix just below makes it safe again - see
    // that note for why -36 previously had to be abandoned).
    const STATUS_BAR_NET_SHIFT = -36;
    // The status bar's NATURAL (pre-transform) top AND height aren't
    // actually constant on their own - promptPegClaim() swaps its plain
    // one-line text for a taller claim prompt (a message plus a number
    // input and Claim button), and growing the box's own height eats into
    // #middleArea's flex:1 space the same way a margin change would,
    // pulling the status bar's natural top upward by however much it grew.
    // Both values are measured once per hand - on an early call, before any
    // claim prompt has had a chance to show - and reused as fixed
    // references for every call after.
    //
    // A taller claim prompt is now made to grow UPWARD from a fixed BOTTOM
    // position instead of stretching further downward from a fixed TOP, per
    // Perry's report that a tall prompt (e.g. His Heels, right at the start
    // of a hand) could grow down far enough to overlap - and even block
    // clicking into - Player 1's own hand below it. Pinning the top instead
    // (the old behavior) let the box's bottom edge drift downward by however
    // much the content grew; pinning the bottom like this instead lets the
    // box grow into the space ABOVE it (toward the deck/starter area),
    // which is never occupied by anything the box could overlap, and its
    // bottom edge - and everything below it - never moves no matter how
    // tall the content gets.
    const statusBoxNaturalTopNow = statusBox.getBoundingClientRect().top;
    const statusBoxHeightNow = statusBox.getBoundingClientRect().height;
    if(cachedStatusBoxNaturalTop === null){
      cachedStatusBoxNaturalTop = statusBoxNaturalTopNow;
      cachedStatusBoxNaturalHeight = statusBoxHeightNow;
    }
    const statusBoxExtraHeight = Math.max(0, statusBoxHeightNow - cachedStatusBoxNaturalHeight);
    const statusBoxDesiredFinalTop = (cachedStatusBoxNaturalTop + STATUS_BAR_NET_SHIFT) - statusBoxExtraHeight;
    const statusBoxFinalShift = statusBoxDesiredFinalTop - statusBoxNaturalTopNow;

    function applyGroupShift(px){
      playerHandRow.style.transform = px ? `translateY(${px}px)` : '';
      // Only ever GROWS bottomHandCribRow's min-height, for a downward
      // shift (so the row's own box has room for the lower content without
      // overlapping Perry's name below it) - never shrinks it below the
      // CSS default for an upward shift. #bottomArea is bottom-pinned
      // (margin-top:auto), so shrinking this box's min-height actually
      // moves #bottomArea's own (and so #playerHandRow's) NATURAL top
      // further down to compensate, which was silently cancelling out part
      // of an upward transform here - exactly the same kind of flex
      // side-effect already found and fixed for the status bar above, just
      // on this box's height instead of its margin.
      bottomHandCribRow.style.minHeight = (136 + Math.max(0, px)) + 'px';
      statusBox.style.transform = statusBoxFinalShift ? `translateY(${statusBoxFinalShift}px)` : '';
    }
    applyGroupShift(GROUP_SHIFT_TOTAL);

    // "Calculate score" moves down a flat, permanent 0.5in (48px), per
    // Perry's request - fixing the overlap it could have with a taller
    // claim prompt above it (Perry hit this specifically with his own crib
    // showing, where an earlier conditional-clearance fix here deliberately
    // held back to protect the crib's own exact spacing - this flat offset
    // replaces that conditional logic entirely, so the button always ends
    // up in the exact same spot, claim prompt or not, rather than moving
    // around based on what else is showing). Applied directly to the
    // button itself (not to playerHandRow's own transform above), so it
    // never disturbs Player 1's crib, which stays aligned to playerHandRow's
    // own (unchanged) position.
    const CALC_BTN_DOWN_SHIFT = 48;
    const calcScoreBtnEl = document.getElementById('calcScoreBtn');
    if(calcScoreBtnEl){
      // "Calculate Score" is also centered left-to-right on the same
      // playing-field midpoint (desiredCenter) as the names above, per
      // Perry's request - measured from its natural (reset) position before
      // either transform is applied, then combined with the vertical
      // down-shift into one transform.
      const calcBtnRectForCenter = calcScoreBtnEl.getBoundingClientRect();
      const calcBtnCenterShift = desiredCenter - (calcBtnRectForCenter.left + calcBtnRectForCenter.width / 2);
      calcScoreBtnEl.style.transform = `translateY(${CALC_BTN_DOWN_SHIFT}px) translateX(${calcBtnCenterShift}px)`;
    }

    const finalPlayerHandRect = playerHandRow.getBoundingClientRect();
    const finalBottomHandCribRowRect = bottomHandCribRow.getBoundingClientRect();

    // Player 1's crib box top-aligns with the top of his own cards, per
    // Perry's request - mirrors George's crib-to-hand alignment above, but
    // measured against the hand's FINAL (shifted-down) position, since the
    // hand moves down via the shift just above. The label sits beside the
    // box now (see the top crib slot's note above), so no label-height
    // offset is needed here either.
    const bottomCribSlot = document.getElementById('bottomCribSlot');
    if(bottomCribSlot.classList.contains('active')){
      bottomCribSlot.style.top = (finalPlayerHandRect.top - finalBottomHandCribRowRect.top) + 'px';
    }

    // The cards played (the pegging pile) are re-centered vertically between
    // George's cards (now shifted up) and the Status/Directions bar (now
    // shifted down), per Perry's request. The deck/starter stack beside it
    // is deliberately left where it is - Perry asked specifically about the
    // cards played, not the deck.
    const playPileArea = document.getElementById('playPileArea');
    const playPileRectNow = playPileArea.getBoundingClientRect();
    const playPileCurrentCenter = playPileRectNow.top + playPileRectNow.height/2;
    // When the Status/Directions bar is turned off in Options, it's
    // display:none and its rect collapses to all-zeros - using it here
    // would pull the play pile up near the top of the page instead. Fall
    // back to Player 1's hand (the next thing down) as the lower boundary
    // in that case, so the pile still centers in the space that's actually
    // there.
    const playAreaBottomBound = state.statusBarEnabled
      ? statusBox.getBoundingClientRect().top
      : finalPlayerHandRect.top;
    const playAreaMidpoint = (finalAiHandBottom + playAreaBottomBound) / 2;
    const playPileShift = playAreaMidpoint - playPileCurrentCenter;
    playPileArea.style.transform = playPileShift ? `translateY(${playPileShift}px)` : '';

    // ---- Item 4: "Send to Crib" button moved to the right of Player 1's
    // hand, vertically centered top-to-bottom on it, per Perry's request.
    // Measured AFTER the shift above settles, so it centers on the hand's
    // actual (possibly shifted) on-screen position, not its unshifted one.
    // The button is no longer clamped to stay clear of the Scoreboard - per
    // Perry's request, it's now allowed to move right far enough to cross
    // over it (the thicker frame and z-index on #sendToCribBtn keep it
    // visible on top when that happens).
    const sendBtn = document.getElementById('sendToCribBtn');
    const sendBtnLeftViewport = finalPlayerHandRect.right + SEND_BTN_GAP;
    sendBtn.style.left = (sendBtnLeftViewport - finalBottomHandCribRowRect.left) + 'px';
    sendBtn.style.top = (finalPlayerHandRect.top + finalPlayerHandRect.height/2 - finalBottomHandCribRowRect.top) + 'px';
    sendBtn.style.transform = 'translateY(-50%)';
  }
  window.addEventListener('resize', () => { cachedMaxShift = null; cachedStatusBoxNaturalTop = null; cachedStatusBoxNaturalHeight = null; layoutCardAreaCenter(); });

  // ---- Init ----
  // Settle the sidebar gap / rev-badge position / card-area centering
  // against the page's static layout FIRST, before starting the game.
  // startNewGame() (below) immediately builds the cut-for-dealer ribbon,
  // and a ribbon's cards are positioned with frozen px coordinates that
  // never get recalculated afterward - running these three first makes
  // sure #gameArea's sidebar padding (set by layoutButtonGap()) is already
  // in place, so #cardArea isn't still temporarily too wide (not yet
  // making room for the sidebar) at the moment the ribbon is measured and
  // built, which used to leave it looking off-center.
  layoutButtonGap();
  layoutRevBadge();
  layoutCardAreaCenter();
  // Page auto-starts straight into the cut-for-dealer screen on load, per
  // Perry's request, instead of idling on "Welcome to Cribbage" waiting for
  // a New Game click. No sound plays until the player actually clicks a
  // ribbon card, so this doesn't try to play audio before a user gesture.
  // A saved resume state (see tryRestoreResumeState above) takes priority
  // over that fresh start, so returning from Instructions continues the
  // hand that was in progress instead of starting over.
  const resumed = tryRestoreResumeState();
  if(!resumed){
    startNewGame();
  }
</script>

<script>
