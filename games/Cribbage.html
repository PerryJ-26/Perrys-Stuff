<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cribbage - Game Hub</title>
<style>
  :root {
    --felt: #c15762;
    --board-border: #111111;
    --page-bg: #dfe7f0;
    --cream: #fffdf5;
    --cream-border: #222;
    --ink: #1b1b1b;
    --red: #b3261e;
    --green-btn: #2f7d3a;
    --green-btn-dark: #235c2b;
    --cardback-1: #d6394a;
    --cardback-2: #ffffff;
    --cardback-border: #7a1c26;
    --shadow-soft: rgba(255,255,255,.55);
    --shadow-medium: rgba(0,0,0,.4);
    --wood: #e3bf8d;
    --wood-dark: #c79a5f;
    --wood-border: #8b5a2b;
    --blue-peg: #3eb6f5;
    --red-peg: #e04a3b;
    --yellow: #eef07a;
    --yellow-border: #2a2a10;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: var(--page-bg);
    font-family: Arial, Helvetica, sans-serif;
  }

  body { display:flex; flex-direction:column; }

  .revBadge {
    position: fixed;
    top: 10px;
    right: 12px;
    z-index: 9999;
    font-size: 0.7rem;
    font-weight: 600;
    color: #000000;
    pointer-events: none;
  }

  /* ===== TEMPORARY DEBUG OUTLINES - toggled via the hidden "outlineToggle"
     button in the top-left corner (double-click it), same aid used on
     Pinochle. Each major layout box gets its own color so boundaries are
     easy to tell apart in a screenshot. Uses outline (not border), so
     nothing shifts or resizes - these are purely visual, drawn on top. ===== */
  body.debug-on #table-wrap{ outline: 2px solid magenta; outline-offset: -2px; }
  body.debug-on #cardArea{ outline: 2px solid orange; outline-offset: -2px; }
  body.debug-on #topArea{ outline: 2px solid cyan; outline-offset: -2px; }
  body.debug-on #bottomArea{ outline: 2px solid cyan; outline-offset: -2px; }
  body.debug-on #middleArea{ outline: 2px solid lime; outline-offset: -2px; }
  body.debug-on #topHandCribRow{ outline: 2px solid yellow; outline-offset: -2px; }
  body.debug-on #bottomHandCribRow{ outline: 2px solid yellow; outline-offset: -2px; }
  body.debug-on .cribSlot{ outline: 2px solid lime; outline-offset: -2px; }
  body.debug-on #deckStarterArea{ outline: 2px solid deeppink; outline-offset: -2px; }
  body.debug-on #playPileArea{ outline: 2px solid deeppink; outline-offset: -2px; }
  body.debug-on #statusBox{ outline: 2px solid orange; outline-offset: -2px; }
  body.debug-on #boardColumn{ outline: 2px solid blue; outline-offset: -2px; }
  body.debug-on #scoreboardBox{ outline: 2px solid blue; outline-offset: -2px; }
  body.debug-on #boardFrame{ outline: 2px solid blue; outline-offset: -2px; }
  body.debug-on #sessionWinsBox{ outline: 2px solid blue; outline-offset: -2px; }
  body.debug-on #yourNameBox{ outline: 2px solid blue; outline-offset: -2px; }
  body.debug-on #buttonGroup{ outline: 2px solid blue; outline-offset: -2px; }
  /* ===== END TEMPORARY DEBUG OUTLINES ===== */

  /* Invisible but still clickable in its original spot - opacity:0 (unlike
     display:none) keeps it in the page layout and able to receive clicks,
     it just isn't visually rendered. Double-click toggles the debug
     outlines above - same hidden-button technique used on Pinochle, just
     in the top-left corner here instead (Pinochle has it by its Game Log
     button; Cribbage has no such panel to anchor near). */
  #outlineToggle{
    opacity:0;
    position:fixed; top:0; left:0; width:40px; height:40px;
    background:transparent; border:none; padding:0; margin:0;
    cursor:default; z-index:9998;
  }

  #pageTitle{
    margin: 0 0 10px;
    font-size: 2rem;
    font-weight: 800;
    letter-spacing: 2px;
    color: #4a1218;
    text-shadow: 1px 1px 0 rgba(255,255,255,.5);
  }
  #buttonGroup{
    position: fixed;
    top: 10px; left: 10px;
    z-index: 70;
    display:flex;
    flex-direction: column;
    gap:6px;
  }
  #buttonGroup button{
    background: var(--cream);
    color: var(--ink);
    border: 2px solid var(--board-border);
    border-radius: 6px;
    padding: 6px 14px;
    cursor:pointer;
    font-size:.8rem;
    font-weight:700;
    white-space: nowrap;
    font-family: inherit;
  }
  #buttonGroup button:hover{ background:#fff; }

  /* ---- Name box: per Dev Note 4, about 1 inch below the Exit button ---- */
  #yourNameBox{
    position: fixed;
    top: calc(10px + 5*34px + 1in);
    left: 10px;
    z-index: 70;
    width: 160px;
    background: var(--shadow-soft);
    border: 2px solid #000000;
    border-radius: 8px;
    padding: 8px 10px;
    font-size: 0.8rem;
  }
  #yourNameBox .corner-box-title{
    font-weight:bold;
    text-decoration:underline;
    font-size:0.8rem;
    margin-bottom:6px;
    text-align:center;
  }
  #yourNameInput{
    width:100%;
    box-sizing:border-box;
    padding:4px 8px;
    border-radius:5px;
    border:1px solid #000;
    font-family:inherit;
    font-size:0.8rem;
    background:#fffdf5;
    color:#000;
  }

  /* ---- Main game area: felt (with the board embedded on it) ---- */
  #gameArea{
    flex: 1;
    display:flex;
    align-items:center;
    justify-content:center;
    padding: 10px 10px 10px 0; /* left padding set in JS - exactly 0.25in past the Action buttons */
    min-height: 0;
    min-width: 0;
  }

  /* height uses min() instead of a vh-based clamp with a tall floor, so a
     short browser window (Perry's own window chrome can eat a lot of the
     viewport) shrinks the felt instead of overflowing it off the bottom */
  #table-wrap{
    width: min(1280px, 94vw);
    height: min(760px, calc(100vh - 20px));
    background: var(--felt);
    border: 4px solid var(--board-border);
    border-radius: 14px;
    position: relative;
    display:flex;
    flex-direction:row;
    align-items:stretch;
    gap: 16px;
    padding: 10px 14px;
    overflow: hidden;
  }

  /* The card-game side of the felt - everything that used to be table-wrap's
     own column content now lives in here, with the board column (below)
     as its flex sibling, so both sit on the SAME green felt surface. */
  #cardArea{
    flex: 1;
    min-width: 0;
    display:flex;
    flex-direction:column;
  }

  /* ---- This Session's Wins: bottom-left of the felt, bottom edge aligned
     with the bottom of the Cribbage board - set precisely in JS by
     layoutCardAreaCenter() per Perry's request. left:8px is unchanged
     (only the vertical anchor moved); top:8px below is just the reset
     baseline that JS measures from, not the final position. ---- */
  #sessionWinsBox{
    position:absolute;
    top:8px; left:8px;
    background: #fff; /* matches the Scoreboard's background */
    border:2px solid #000000;
    border-radius:8px;
    padding:4px 10px; /* tightened from 6px top/bottom per Perry's request, to shrink the box's height and clear the overlap below it */
    font-size:0.72rem;
    color:#000;
    z-index: 5;
  }
  #sessionWinsBox .corner-box-title{
    font-weight:bold;
    text-decoration:underline;
    font-size:0.72rem;
    margin-bottom:2px; /* tightened from 4px per Perry's request */
    white-space:nowrap;
  }
  /* Matches the Scoreboard's own font-size, with the "=" signs and scores
     in their own table columns so they line up regardless of name length. */
  #winsTable{ border-collapse:collapse; font-size:0.95rem; }
  #winsTable td{ padding: 1px 4px; white-space:nowrap; } /* tightened from 2px top/bottom per Perry's request */
  #winsTable .winsEq{ text-align:center; }
  #winsTable .winsVal{ font-weight:700; text-align:right; }

  .dealerTag{
    font-size: 0.68rem;
    font-weight: 700;
    color: #fff;
    background: #000;
    border-radius: 4px;
    padding: 1px 8px;
    text-align:center;
    visibility: hidden;
    width: fit-content;
  }
  .dealerTag.show{ visibility: visible; }

  .playerName{
    font-size: 16px;
    font-weight: 700;
    color: #fff;
    text-shadow: 0 1px 2px rgba(0,0,0,.6);
    text-align:center;
  }

  /* Holds a player's name and their Dealer tag side by side (tag to the
     right of the name), per Perry's request - previously the tag sat
     stacked above/below the name instead. */
  .nameRow{
    display:flex;
    flex-direction:row;
    align-items:center;
    gap:8px;
  }

  #topArea{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:2px;
    flex-shrink:0;
    padding-top: 2px;
  }
  #bottomArea{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:2px;
    flex-shrink:0;
    padding-bottom: 2px;
    margin-top:auto;
  }

  .handCribRow{
    position: relative; /* anchors the absolutely-positioned .cribSlot */
    align-self: stretch; /* full cardArea width, not shrink-wrapped to the hand */
    display:flex;
    flex-direction:row;
    align-items:flex-start;
    /* Left-anchored (not centered), per Perry's request to eliminate
       shifting: a hand that centers its own row visibly shifts position as
       cards are dealt/discarded/played, since centering depends on the
       hand's current width. layoutCardAreaCenter() instead gives
       #aiHandRow/#playerHandRow a fixed left margin (clearing the crib box,
       whether or not it's currently shown, so the anchor itself never
       changes) so the hand's FIRST card sits at one unchanging spot and the
       hand only ever grows further right from there. */
    justify-content:flex-start;
    /* Tall enough for the crib box's label-plus-box stack (the tallest
       thing this row ever holds), not just the hand's own card height -
       otherwise, since .cribSlot sits outside the flex flow, its label
       would push its box taller than this row "officially" is, and it
       would visually spill into whatever sits below (Send to Crib, the
       player's name, the Dealer tag). */
    min-height: 136px;
  }
  /* Both rows sometimes need extra height beyond the shared 136px base:
     the bottom row for #playerHandRow's downward shift below, and the top
     row so a top crib box pushed down in JS (to clear "This Session's
     Wins") has room without spilling into the AI hand beneath it. The
     actual extra amount is computed and applied as an inline min-height
     by layoutCardAreaCenter() - never more than the felt can actually
     hold - so a shorter browser window shrinks these shifts gracefully
     instead of letting the bottom row's content render below the felt. */

  /* The crib box is pulled out of the flex flow and left-aligned with
     "This Session's Wins" own left edge (set precisely in JS by
     layoutCardAreaCenter(), per Perry's request) rather than following
     the hand - so showing/hiding it never shifts where the hand itself
     is centered. The top crib box's "top" is also set in JS, to clear
     Session's Wins when the two would otherwise overlap. */
  .cribSlot{
    display:none;
    /* Row layout, per Perry's request - the label sits to the RIGHT of the
       crib box instead of stacked above it. align-items:center now centers
       the (shorter) label vertically against the box's own height, i.e.
       centered top to bottom on the crib's cards. The box is the first
       child (see the HTML) so the box's own left edge stays exactly where
       it's always been anchored (lined up with "This Session's Wins"); the
       label just extends further right from there. */
    flex-direction:row;
    align-items:center;
    gap:4px;
    position:absolute;
    left: 10px; /* fallback only - layoutCardAreaCenter() sets this precisely in JS */
    top:0;
  }
  .cribSlot.active{ display:flex; }
  .crib-label{
    font-size:0.7rem;
    font-weight:700;
    color:#fff;
    text-transform:uppercase;
    text-shadow: 0 1px 2px rgba(0,0,0,.6);
    white-space:nowrap;
  }
  .crib-box{
    border: 3px solid #fff;
    border-radius: 10px;
    background: rgba(0,0,0,0.28);
    padding: 5px;
  }
  /* The box is always sized for the full, eventual 4-card crib, per Perry's
     request - so it doesn't grow/resize when the second pair of discards
     arrives. Cards overlap the same way as a hand row, but with a tighter
     overlap so the box (which sits in the limited space just left of the
     hand) stays compact; with only 2 cards in, the box simply shows empty
     (reserved) space to their right. */
  .crib-stack{
    position:relative;
    width: 122.76px; /* 60.69px (1 card, 15% smaller per Perry's request) + 3 * 20.69px (each additional card's visible sliver) */
    height: 85.255px;
    display:flex;
    flex-direction:row;
    align-items:flex-start;
  }
  .crib-stack .cardback:not(:first-child){ margin-left: -40px; }

  .handRow{
    display:flex;
    flex-direction:row;
    align-items:center;
    justify-content:center;
  }
  .handRow .cardWrap:not(:first-child){ margin-left: -30px; }
  .handRow .cardWrap.selected{ transform: translateY(-16px); }
  .handRow .cardWrap{ transition: transform 150ms ease; position:relative; }

  /* Player 1's hand (and, via #statusBox's own margin below, the
     Status/Directions bar above it) moves down up to 0.75in (72px) per
     Perry's request - applied as an inline transform by
     layoutCardAreaCenter(), which scales the shift back on a shorter
     browser window rather than letting the hand/name render below the
     felt (see that function for why). */

  #middleArea{
    flex: 1;
    display:flex;
    flex-direction:row;
    align-items:center;
    /* Left-anchored (not centered), per Perry's request to eliminate
       shifting: #playPileArea is the only normal-flow child here (the deck
       is absolutely positioned, below), so centering it visibly shifted the
       pile's own start position left/right as cards were played and the
       pile grew wider. layoutCardAreaCenter() instead gives #playPileArea a
       fixed left margin (clearing the deck/starter stack) so its first card
       sits at one unchanging spot and the pile only ever grows further
       right from there. */
    justify-content:flex-start;
    gap: 40px;
    min-height: 0;
    position: relative;
  }

  /* The deck + starter card sit to the LEFT of the playing field (not
     centered), matching the reference layout Perry asked to match -
     absolutely positioned within #middleArea (which is already
     position:relative) so the centered play pile below is unaffected. */
  #deckStarterArea{
    position:absolute;
    left:4px; /* fallback only - layoutCardAreaCenter() sets this precisely in JS */
    top:50%;
    /* Vertically centered in #middleArea (the -50%), then nudged up an
       extra 0.25in (24px) on top of that, per Perry's request. */
    transform: translateY(calc(-50% - 24px));
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:4px;
  }
  /* The starter sits directly on top of the deck back - same footprint,
     no offset - so the stack reads as one deck with its top card cut and
     turned face-up, per Perry's request. */
  .deckStarterStack{ position:relative; width:60.69px; height:85.255px; }
  #stockPile.cardback{ box-shadow: 1px 2px 3px var(--shadow-medium); }
  #stockPileWrap{ position:absolute; top:0; left:0; width:60.69px; height:85.255px; }
  #starterWrap{ position:absolute; top:0; left:0; width:60.69px; height:85.255px; }
  #starterLabel{ font-size:0.68rem; font-weight:700; color:#fff; text-align:center; text-shadow:0 1px 2px rgba(0,0,0,.6); min-height: 1em; }

  /* The play pile (pegging) now occupies the actual center of the table -
     each card played this count segment overlaps the last, with the
     running count shown as a large number beside the pile, same idea as
     the reference layout. */
  #playPileArea{
    display:flex;
    flex-direction:row;
    align-items:center;
    gap:16px;
  }
  /* Each pegging "segment" (the cards played between one count reset and
     the next) is its own fanned group - #playPileRow lines up one or more
     of these side by side, with a gap between groups, per Perry's request
     to keep a finished segment on screen (dimmed) while the next one
     starts. */
  #playPileRow{ display:flex; flex-direction:row; align-items:center; }
  .pile-segment{ display:flex; flex-direction:row; align-items:center; }
  .pile-segment:not(:first-child){ margin-left:24px; }
  .pile-segment .cardWrap:not(:first-child){ margin-left:-46px; }
  .pile-segment .cardWrap{ position:relative; }
  /* Cards played are staggered up/down by who played them, so the pile
     reads like two interleaved hands rather than one stack - per Perry's
     request. Stagger amount is 0.125in (12px) per Perry's request. */
  .pile-segment .cardWrap.pile-player{ transform: translateY(12px); }
  .pile-segment .cardWrap.pile-ai{ transform: translateY(-12px); }
  /* The still-active segment plays at full opacity; an already-finished
     segment kept on screen fades to 60%, per Perry's request. */
  .pile-segment.pile-dim{ opacity: 0.60; }
  /* Points-earned badge shown below a pile card the instant it scores -
     EXCEPT for George's (AI's) cards, which show the badge above the card
     instead via the .pile-points-top modifier, per Perry's request. */
  .pile-points{
    position:absolute;
    left:50%; bottom:-22px;
    transform: translateX(-50%);
    background: var(--yellow);
    border: 2px solid var(--yellow-border);
    border-radius: 6px;
    padding: 1px 6px;
    font-size: 0.78rem;
    font-weight: 800;
    color: #3a3a10;
    white-space: nowrap;
    z-index: 10;
  }
  .pile-points.pile-points-top{ bottom:auto; top:-22px; }
  #playPileCount{
    font-size:1.7rem;
    font-weight:800;
    color:#fff;
    text-shadow:0 1px 3px rgba(0,0,0,.6);
    min-width:1.2em;
    text-align:center;
  }

  #statusBox{
    background: var(--yellow);
    border: 2px solid var(--yellow-border);
    border-radius: 10px;
    padding: 8px 14px;
    font-size: 0.92rem;
    color: #3a3a10;
    text-align:center;
    margin: 6px auto; /* top margin gets up to +96px (1.0in) added inline by layoutCardAreaCenter() - see that function */
    /* Static width sized to comfortably fit the longest realistic status
       message (play-scoring messages that stack multiple combos, e.g.
       "Thirty-one for 2, Double Pair Royal for 12") with room to spare,
       per Perry's request - no longer sized off content or container. */
    width: 600px;
    /* Wider than #cardArea's own flex-allocated width, so left/right auto
       margins can't center it there (an oversized flex item just flushes to
       the container's edge) - position:relative lets layoutCardAreaCenter()
       nudge it with an explicit left offset instead, to land it centered on
       the true playing field regardless. */
    position: relative;
  }

  /* Positioned to the right of Player 1's cards, vertically centered on
     them, per Perry's request - set precisely in JS by
     layoutCardAreaCenter() (left/top are fallbacks only), since the hand
     itself can be visually shifted down (see #playerHandRow). Per Perry's
     request, this button is now allowed to slide right far enough to cross
     over the Scoreboard box - the thicker 3px frame (vs. the standard 2px
     on other boxes) and the explicit z-index keep it clearly visible and
     on top whenever it overlaps the Scoreboard. */
  #sendToCribBtn{
    background: var(--green-btn);
    color:#fff;
    border:3px solid var(--board-border);
    border-radius:6px;
    padding:6px 16px;
    font-weight:700;
    cursor:pointer;
    font-family:inherit;
    visibility:hidden;
    position:absolute;
    left: 0;
    top: 50%;
    z-index: 20;
  }
  #sendToCribBtn.show{ visibility:visible; }
  #sendToCribBtn:disabled{ opacity:0.5; cursor:not-allowed; }

  /* Shown in place of Player 1's hand once all of this Play phase's cards
     have been played, per Perry's request - sits centered in #playerHandRow
     the same way the hand itself was (that row is already a centered flex
     row), matching #sendToCribBtn's own look. What it does is still to be
     wired up. */
  .calc-score-btn{
    background: var(--green-btn);
    color:#fff;
    border:2px solid var(--board-border);
    border-radius:6px;
    padding:6px 16px;
    font-weight:700;
    cursor:pointer;
    font-family:inherit;
  }

  /* ---- Cards ---- */
  /* Card size reduced 15% per Perry's request (71.4x100.3 -> 60.69x85.255). */
  .card{
    width: 60.69px; height: 85.255px;
    border-radius: 6px;
    box-shadow: 1px 2px 3px var(--shadow-medium);
    user-select:none;
    display:block;
  }
  .card.clickable{ cursor:pointer; }
  .card.clickable:hover{
    box-shadow: 0 0 0 3px #fff, 0 0 0 5px var(--board-border), 1px 2px 3px var(--shadow-medium);
  }
  .card.legal{
    box-shadow: 0 0 0 3px #ffe066, 1px 2px 3px var(--shadow-medium);
  }
  .card-face-img{ display:block; width:100%; height:100%; border-radius:6px; -webkit-user-drag:none; }
  .cardback{
    width: 60.69px; height: 85.255px;
    background-color: var(--cardback-1);
    background-image:
      repeating-linear-gradient(45deg, transparent 0 4px, var(--cardback-2) 4px 8px),
      repeating-linear-gradient(-45deg, transparent 0 4px, var(--cardback-2) 4px 8px);
    border: 1px solid var(--cardback-border);
    border-radius: 6px;
  }
  .cardback.clickable{ cursor:pointer; }

  /* ---- Flip animation (face-down -> face-up), same technique as Klondike ---- */
  .flip3d{
    width: 60.69px; height: 85.255px;
    position: relative;
    transform-style: preserve-3d;
    transform-origin: left center;
    animation: flip3dRotate 0.3s ease-out both;
  }
  @keyframes flip3dRotate{
    0%   { transform: translateX(0) rotateY(0deg); }
    100% { transform: translateX(100%) rotateY(180deg); }
  }
  .flip3d-face{ position:absolute; inset:0; backface-visibility:hidden; -webkit-backface-visibility:hidden; }
  .flip3d-face.flip3d-back{
    background-color: var(--cardback-1);
    background-image:
      repeating-linear-gradient(45deg, transparent 0 4px, var(--cardback-2) 4px 8px),
      repeating-linear-gradient(-45deg, transparent 0 4px, var(--cardback-2) 4px 8px);
    border: 1px solid var(--cardback-border);
    border-radius: 6px;
  }
  .flip3d-face.flip3d-front{ transform: rotateY(180deg); }

  /* ---- Deck spread (cut animation) ---- */
  #spreadLayer{
    position:fixed;
    z-index: 40;
    display:none;
  }
  #spreadLayer .spreadCard{
    position:absolute;
    top:0;
    transition: left 500ms ease, transform 500ms ease;
  }
  /* ---- Ribbon spread (cut-for-dealer and cut-for-starter) ---- */
  #spreadLayer .cutSpreadCard.clickable{ cursor:pointer; }
  #spreadLayer .cutSpreadCard.clickable:hover{
    box-shadow: 0 0 0 3px #fff, 0 0 0 5px var(--board-border), 1px 2px 3px var(--shadow-medium);
  }

  /* ---- Peg board column - now a flex sibling of #cardArea inside
     #table-wrap, so it sits on the same green felt; align-items:stretch
     on #table-wrap gives it the exact same height as #cardArea with no
     height value needed here. ---- */
  #boardColumn{
    display:flex;
    flex-direction:row;
    align-items:flex-start;
    gap: 10px;
    flex-shrink:0;
  }
  #scoreboardBox{
    flex-shrink:0;
    background:#fff;
    border: 2px solid #000;
    border-radius: 8px;
    overflow:hidden;
    /* Bottom-aligned with the Cribbage board (#boardFrame fills the full
       column height), rather than top-aligned, per Perry's request. */
    align-self: flex-end;
    margin-bottom: 2px;
  }
  #scoreTable{ border-collapse:collapse; font-size:0.95rem; }
  #scoreTable td{ padding: 6px 10px; border-bottom:1px solid #ccc; white-space:nowrap; }
