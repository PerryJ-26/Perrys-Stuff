 /* Buttons under the Header (New Game / Sound / Exit) */

  /* Dice */
  .die{
    width:48px;
    height:48px;
    border-radius:12px;
    background: linear-gradient(145deg,var(--die-bg-1),var(--die-bg-2));
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    user-select:none;
    transition: transform 160ms ease, box-shadow 160ms ease, border 160ms ease, background 160ms ease;
    border: 1px solid var(--die-border);
    box-shadow:
      0 3px 6px rgba(0,0,0,0.45),
      inset 0 1px 1px rgba(255,255,255,0.95),
      inset 0 -3px 5px rgba(0,0,0,0.14); }
      
  .die-face{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    grid-template-rows:repeat(3,1fr);
    width:74%;
    height:74%; }
    
  .pip-cell{
    display:flex;
    align-items:center;
    justify-content:center; }
    
  .pip{
    width:9px;
    height:9px;
    border-radius:50%;
    background: radial-gradient(circle at 35% 30%, var(--pip-color-1), var(--pip-color-2) 70%);
    box-shadow: inset 0 1px 1px rgba(255,255,255,0.15), 0 1px 1px rgba(0,0,0,0.3);
    transition: background 160ms ease; }
    
  .die.held{
    transform: translateY(-6px) scale(1.06);
    background: linear-gradient(145deg,var(--die-held-bg-1),var(--die-held-bg-2));
    border: 2px solid var(--die-held-border);
    box-shadow:
      0 10px 22px rgba(43,122,58,0.4),

  .die.held .pip{

  .die:focus{

  @keyframes dieTumble{
    0%{ transform: rotate(0deg) scale(1); }

<script>
/* Global safety: capture errors and show overlay */
(function(){
  const overlay = document.getElementById('errorOverlay');
  function showError(msg){
    overlay.style.display = 'block';
    overlay.textContent = msg;
    console.error(msg);
  }
  window.addEventListener('error', function(e){
    const msg = e && e.message ? e.message : String(e);
    if(msg.includes('ResizeObserver loop')) return; // benign browser warning, not a real error
    showError('Error: ' + msg);
  });
  window.addEventListener('unhandledrejection', function(e){
    showError('Unhandled promise rejection: ' + (e && e.reason ? (e.reason.message || JSON.stringify(e.reason)) : String(e)));
  });
})();

/* -------------------------
   Audio engine (synthesized, no external files)
   ------------------------- */
let soundEnabled = true;
try {
  const savedSound = localStorage.getItem('gamehubSoundEnabled');
  if (savedSound !== null) soundEnabled = savedSound === 'true';
} catch (e) { /* ignore */ }

let audioCtx = null;
function getAudioCtx(){
  try {
    if (!audioCtx) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if (audioCtx.state === 'suspended') audioCtx.resume();
    return audioCtx;
  } catch (err) {
    console.error('getAudioCtx error', err);
    return null;
  }
}

function toggleSound(){
  try {
    soundEnabled = !soundEnabled;
    const btn = document.getElementById('soundToggleBtn');
    if (btn) btn.textContent = soundEnabled ? '🔊 Sound: On' : '🔇 Sound: Off';
    try { localStorage.setItem('gamehubSoundEnabled', String(soundEnabled)); } catch (e) {}
    if (soundEnabled) getAudioCtx();
  } catch (err) {
    console.error('toggleSound error', err);
  }
}

/* A single short percussive "clack" - simulates a die hitting the table/other dice */
function playDiceClack(){
  if (!soundEnabled) return;
  try {
    const ctx = getAudioCtx();
    if (!ctx) return;
    const now = ctx.currentTime;

    const bufferSize = Math.floor(ctx.sampleRate * 0.05);
    const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < bufferSize; i++) {
      data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / bufferSize, 2);
    }
    const noise = ctx.createBufferSource();
    noise.buffer = buffer;

    const bandpass = ctx.createBiquadFilter();
    bandpass.type = 'bandpass';
    bandpass.frequency.value = 900 + Math.random() * 1400;
    bandpass.Q.value = 1.1;

    const gain = ctx.createGain();
    const peak = 0.22 + Math.random() * 0.08;
    gain.gain.setValueAtTime(peak, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.06);

    noise.connect(bandpass);
    bandpass.connect(gain);
    gain.connect(ctx.destination);

    noise.start(now);
    noise.stop(now + 0.07);
  } catch (err) {
    console.error('playDiceClack error', err);
  }
}

/* A pleasant two-note "ding" for when a score is applied */
function playDing(){
  if (!soundEnabled) return;
  try {
    const ctx = getAudioCtx();
    if (!ctx) return;
    const now = ctx.currentTime;

    [1318.5, 1975.5].forEach((freq, idx) => {
      const osc = ctx.createOscillator();
      osc.type = 'sine';
      osc.frequency.value = freq;

      const gain = ctx.createGain();
      const start = now + idx * 0.05;
      gain.gain.setValueAtTime(0, start);
      gain.gain.linearRampToValueAtTime(0.18, start + 0.015);
      gain.gain.exponentialRampToValueAtTime(0.0001, start + 0.7);

      osc.connect(gain);
      gain.connect(ctx.destination);

      osc.start(start);
      osc.stop(start + 0.75);
    });
  } catch (err) {
    console.error('playDing error', err);
  }
}

/* -------------------------
   Yahtzee with scoring + high scores
   ------------------------- */
let dice = [1,1,1,1,1];
let held = [false,false,false,false,false];
let rollsLeft = 3;
let scorecard = {};
const categories = [
  {id:'ones', label:'Ones', type:'upper', calc:vals=>sumOf(1,vals)},
  {id:'twos', label:'Twos', type:'upper', calc:vals=>sumOf(2,vals)},
  {id:'threes', label:'Threes', type:'upper', calc:vals=>sumOf(3,vals)},
  {id:'fours', label:'Fours', type:'upper', calc:vals=>sumOf(4,vals)},
  {id:'fives', label:'Fives', type:'upper', calc:vals=>sumOf(5,vals)},
  {id:'sixes', label:'Sixes', type:'upper', calc:vals=>sumOf(6,vals)},
  {id:'threeKind', label:'Three of a Kind', type:'lower', calc:vals=>ofAKind(3,vals)},
  {id:'fourKind', label:'Four of a Kind', type:'lower', calc:vals=>ofAKind(4,vals)},
  {id:'fullHouse', label:'Full House (25)', type:'lower', calc:vals=>fullHouse(25,vals)},
  {id:'smallStraight', label:'Small Straight (30)', type:'lower', calc:vals=>straight(4,30,vals)},
  {id:'largeStraight', label:'Large Straight (40)', type:'lower', calc:vals=>straight(5,40,vals)},
  {id:'yahtzee', label:'Yahtzee (50)', type:'lower', calc:vals=>yahtzeeScore(50,vals)},
  {id:'chance', label:'Chance', type:'lower', calc:vals=>chance(vals)}
];

const diceContainer = document.getElementById('diceContainer');
const rollInfo = document.getElementById('rollInfo');
const scoreBody = document.getElementById('scoreBody');
const upperTotalEl = document.getElementById('upperTotal');
const upperBonusEl = document.getElementById('upperBonus');
const lowerTotalEl = document.getElementById('lowerTotal');

const LOCAL_FILE_BACKUP_ENABLED = false;

/* Player name - shown in the Name field and recorded with each finished game. Uses sessionStorage
   (not localStorage) on purpose: the name should stick around for as long as this tab stays open -

   opened fresh, rather than being remembered forever across browser sessions. */

try {
  const savedName = sessionStorage.getItem(PLAYER_NAME_KEY);
  if (savedName && savedName.trim()) currentPlayerName = savedName.trim();

/* Non-blocking end-of-game banner */
function showEndBanner(message) {
  try {
    let banner = document.getElementById('endBanner');
    if (!banner) {
      banner = document.createElement('div');
      banner.id = 'endBanner';
      banner.style.position = 'fixed';
      banner.style.right = '20px';
      banner.style.bottom = '20px';
      banner.style.background = 'var(--banner-bg)';
      banner.style.color = 'var(--banner-text)';
      banner.style.padding = '12px 16px';
      banner.style.borderRadius = '8px';
      banner.style.boxShadow = '0 6px 18px rgba(0,0,0,0.5)';
      banner.style.zIndex = 9999;
      banner.style.opacity = '0';
      banner.style.pointerEvents = 'none';
      banner.style.transition = 'opacity 400ms ease';
      document.body.appendChild(banner);
    }
    banner.textContent = message;
    banner.style.opacity = '1';
    setTimeout(()=> { banner.style.opacity = '0'; }, 2200);
  } catch (err) {

  }

/* Standard dice pip layouts, mapped onto a 3x3 grid (cells numbered 1-9, left-to-right, top-to-bottom) */
const PIP_LAYOUT = {
  1: [5],
  2: [1,9],
  3: [1,5,9],
  4: [1,3,7,9],
  5: [1,3,5,7,9],
  6: [1,3,4,6,7,9]
};

function buildDieFace(value){
  const face = document.createElement('div');
  face.className = 'die-face';
  const activeCells = PIP_LAYOUT[value] || [];
  for(let i=1;i<=9;i++){
    const cell = document.createElement('div');
    cell.className = 'pip-cell';
    if(activeCells.includes(i)){
      const pip = document.createElement('div');
      pip.className = 'pip';
      cell.appendChild(pip);
    }
    face.appendChild(cell);
  }
  return face;
}

function renderDice(){
  try {
    diceContainer.innerHTML = '';
    dice.forEach((v,i)=>{
      const d = document.createElement('div');
      d.className = 'die' + (held[i] ? ' held' : '') + (rolling && !held[i] ? ' tumbling' : '');
      d.appendChild(buildDieFace(v));
      d.title = held[i] ? 'Click to release' : 'Click to hold';
      d.tabIndex = 0;
      d.addEventListener('click', ()=>toggleHold(i));
      d.addEventListener('keydown', (ev)=>{ if(ev.key==='Enter' || ev.key===' ') { ev.preventDefault(); toggleHold(i); }});
      diceContainer.appendChild(d);
    });
  } catch (err) {
    console.error('renderDice error', err);
    document.getElementById('errorOverlay').textContent = 'renderDice error: ' + err.message;
    document.getElementById('errorOverlay').style.display = 'block';
  }
}

function renderScorecard(){
  try {
    scoreBody.innerHTML = '';
    const currentVals = dice.slice();
    categories.forEach(cat=>{
      const tr = document.createElement('tr');
      const tdLabel = document.createElement('td'); tdLabel.textContent = cat.label;
      const tdScore = document.createElement('td');
      tdScore.textContent = scorecard[cat.id] === null ? '-' : scorecard[cat.id];
      const tdAction = document.createElement('td');
      const btn = document.createElement('button');
      btn.className = 'scoreBtn';
      if(scorecard[cat.id] !== null){
        btn.textContent = '';
        btn.classList.add('disabled');
        btn.disabled = true;
      } else {
        // Before the first roll of a turn, dice[] is still just placeholder values (all 1s), not
        // an actual roll - show 0 for every category rather than a "potential" score computed
        // against dice the player hasn't rolled yet.
        const potential = (rollsLeft===3) ? 0 : getCategoryScore(cat, currentVals);
        btn.textContent = `Score ${potential}`;
        btn.onclick = ()=>applyScore(cat.id, potential);
        if(rollsLeft===3) { btn.disabled=true; btn.classList.add('disabled'); btn.title='Roll at least once before scoring'; }
        if(rolling) { btn.disabled=true; btn.classList.add('disabled'); btn.title='Wait for the dice to finish rolling'; }
      }
      tdAction.appendChild(btn);
      tr.appendChild(tdLabel); tr.appendChild(tdScore); tr.appendChild(tdAction);
      scoreBody.appendChild(tr);
    });
    updateTotals();
  } catch (err) {
    console.error('renderScorecard error', err);
    document.getElementById('errorOverlay').textContent = 'renderScorecard error: ' + err.message;
    document.getElementById('errorOverlay').style.display = 'block';
  }
}

function toggleHold(i){
  try {
    if(rollsLeft===3) return;
    held[i] = !held[i];
    renderDice();
  } catch (err) {
    console.error('toggleHold error', err);
    document.getElementById('errorOverlay').textContent = 'toggleHold error: ' + err.message;
    document.getElementById('errorOverlay').style.display = 'block';
  }
}
let rolling = false;
function rollDice(){
  try {
    if(rolling) return;
    if(Object.values(scorecard).every(v=>v!==null)){
      initYahtzee();
    }
    if(rollsLeft<=0) return;
    rolling = true;
    const rollBtnEl = document.getElementById('rollBtn');
    if (rollBtnEl) rollBtnEl.disabled = true;
    document.querySelectorAll('#scoreBody button').forEach(btn => btn.disabled = true);

    const TUMBLE_DURATION = 900;
    const TUMBLE_INTERVAL = 90;
    const startTime = Date.now();

    const tumble = setInterval(()=>{
      for(let i=0;i<5;i++){
        if(!held[i]) dice[i] = Math.floor(Math.random()*6)+1;
      }
      renderDice();
      playDiceClack();

      if(Date.now() - startTime >= TUMBLE_DURATION){
        clearInterval(tumble);
        for(let i=0;i<5;i++){
          if(!held[i]) dice[i] = Math.floor(Math.random()*6)+1;
        }
        rollsLeft--;
        rolling = false;
        renderDice();
        playDiceClack();
        updateRollInfo();
        renderScorecard();
        if (rollBtnEl) rollBtnEl.disabled = rollsLeft<=0;
      }
    }, TUMBLE_INTERVAL);
  } catch (err) {
    rolling = false;
    console.error('rollDice error', err);
    document.getElementById('errorOverlay').textContent = 'rollDice error: ' + err.message;
    document.getElementById('errorOverlay').style.display = 'block';
  }
}
function updateRollInfo(){
  try {
    rollInfo.textContent = `Rolls left: ${rollsLeft}`;
    const rollBtnEl = document.getElementById('rollBtn');
    if (rollBtnEl && !rolling) rollBtnEl.disabled = rollsLeft<=0;
  } catch (err) {
    console.error('updateRollInfo error', err);
  }
}

/* Scoring helpers */
function counts(vals){
  const c=[0,0,0,0,0,0];
  vals.forEach(v=>c[v-1]++);
  return c;
}
function sumOf(face, vals){
  return vals.filter(v=>v===face).reduce((a,b)=>a+b,0);
}
function ofAKind(n, vals){
  const c = counts(vals);
  if(c.some(x=>x>=n)) return vals.reduce((a,b)=>a+b,0);
  return 0;
}
function fullHouse(score, vals){
  const c = counts(vals).filter(x=>x>0);
  if(c.length===2 && (c.includes(2) && c.includes(3))) return score;
  return 0;
}
function straight(len, score, vals){
  const unique = Array.from(new Set(vals)).sort((a,b)=>a-b);
  let run=1;
  for(let i=1;i<unique.length;i++){
    if(unique[i]===unique[i-1]+1) run++; else run=1;
    if(run>=len) return score;
  }
  return 0;
}
function yahtzeeScore(score, vals){
  if(new Set(vals).size===1) return score;
  return 0;
}
function chance(vals){ return vals.reduce((a,b)=>a+b,0); }

/* Joker Rule: once a natural Yahtzee (50) has been scored, a later five-of-a-kind roll can be used
   to fill an open lower-section box at its guaranteed value, even though the dice don't literally
   match that pattern (e.g. five 4s counts as a made Full House or Straight when used as a joker).
   Three/Four of a Kind and Chance already score correctly via their normal calc (a Yahtzee always
   qualifies for those), and the matching Upper section box also already scores correctly - only
   Full House/Small Straight/Large Straight need the override, since their normal calc would return 0. */
const JOKER_SCORES = { fullHouse: 25, smallStraight: 30, largeStraight: 40 };

function getCategoryScore(cat, vals){
  const normal = cat.calc(vals);
  const isYahtzeeRoll = new Set(vals).size === 1;
  if(isYahtzeeRoll && scorecard['yahtzee'] === 50 && normal === 0 && JOKER_SCORES[cat.id] !== undefined){
    return JOKER_SCORES[cat.id];
  }
  return normal;
}

function applyScore(catId, value){
  try {
    if(scorecard[catId] !== null) return;

    const isCurrentRollYahtzee = new Set(dice).size === 1;
    if(isCurrentRollYahtzee && scorecard['yahtzee'] === 50){
      yahtzeeBonusCount++;
      showEndBanner(`Bonus Yahtzee! +${YAHTZEE_BONUS_POINTS} points`);
    }

    scorecard[catId] = value;
    playDing();
    rollsLeft = 3;
    held = [false,false,false,false,false];
    dice = [1,1,1,1,1];
    renderDice();
    renderScorecard();
    updateRollInfo();
    if(Object.values(scorecard).every(v=>v!==null)){
      const finalTotal = computeGrandTotal();
      saveHighScore(currentPlayerName, finalTotal);
      console.info('Yahtzee complete, total:', finalTotal);
      showGameOverModal(finalTotal);
    }
  } catch (err) {
    console.error('applyScore error', err);
    document.getElementById('errorOverlay').textContent = 'applyScore error: ' + err.message;
    document.getElementById('errorOverlay').style.display = 'block';
  }
}

/* Shown once the scorecard is completely filled in (see applyScore above) - replaces the old
   non-blocking "Scorecard complete!" corner banner with the shared universal modal, and adds a
   Play Again? Yes/No choice. Title is "Game Over" at +3px over the modal's normal title size
   (18.72px base -> 21.72px); "Final Score:", the score itself, and "Play again?" are all set
   +3px over the modal's normal message size (16px base -> 19px) and bold, via an HTML message
   (see the html:true / titleFontSizePx options added to showModal above - opt-in, so no other
   modal on this page is affected). Choosing "No" doesn't act on it immediately - it asks for a
   "Are You Sure You Want To Quit?" confirmation first, same as Reset/Exit already do elsewhere
   on this page. On THAT confirmation, "No" (not quitting) starts a fresh game via initYahtzee() -
   same as clicking "Yes" up on the Game Over prompt itself; "Yes" (confirming the quit) exits the
   app the same way the Exit Game button does (performExit(), defined below). */
async function showGameOverModal(finalTotal){
  try {
    const playAgain = await showModal({
      title: 'Game Over',
      titleFontSizePx: 25.72,
      html: true,
      message: '<span style="font-size:19px;font-weight:bold;">Final Score: ' + finalTotal + '</span><br><br>' +
                '<span style="font-size:19px;font-weight:bold;">Play again?</span>',
      buttons: [
        { label:'Yes', value:true, primary:true },
        { label:'No', value:false, primary:false }
      ]
    });
    if(playAgain){
      initYahtzee();
      return;
    }
    const reallyDone = await showModal({
      title: 'Are You Sure You Want To Quit?',
      buttons: [
        { label:'Yes', value:true, primary:true },
        { label:'No', value:false, primary:false }
      ]
    });
    if(!reallyDone){
      // "No" (not quitting) starts a fresh game, same as "Yes" up on the Game Over prompt.
      initYahtzee();
      return;
    }
    // reallyDone === true ("Yes", confirming the quit): exit, same as the Exit Game button.
    performExit();
  } catch (err) {
    console.error('showGameOverModal error', err);
  }
}

function updateTotals(){
  try {
    const upperCats = categories.filter(c=>c.type==='upper').map(c=>scorecard[c.id]||0);
    const lowerCats = categories.filter(c=>c.type==='lower').map(c=>scorecard[c.id]||0);
    const upperTotal = upperCats.reduce((a,b)=>a+b,0);
    const upperBonus = upperTotal >= 63 ? 35 : 0;
    const lowerTotal = lowerCats.reduce((a,b)=>a+b,0);
    const yahtzeeBonus = yahtzeeBonusCount * YAHTZEE_BONUS_POINTS;
    const grand = upperTotal + upperBonus + lowerTotal + yahtzeeBonus;
    upperTotalEl.textContent = upperTotal;
    upperBonusEl.textContent = upperBonus;
    lowerTotalEl.textContent = lowerTotal;
    yahtzeeBonusEl.textContent = yahtzeeBonus;
    grandTotalEl.textContent = grand;
  } catch (err) {
    console.error('updateTotals error', err);
  }
}

function computeGrandTotal(){
  try {
    return parseInt(upperTotalEl.textContent) + parseInt(upperBonusEl.textContent) + parseInt(lowerTotalEl.textContent) + parseInt(yahtzeeBonusEl.textContent);
  } catch (err) {
    console.error('computeGrandTotal error', err);
    return 0;
  }
}

/* -------------------------
   High scores (localStorage)
   ------------------------- */
function loadHighScores(){
  try{
    const raw = localStorage.getItem(HIGH_SCORES_KEY);
    if(!raw) return [];
    const parsed = JSON.parse(raw);
    if(!Array.isArray(parsed)) return [];
    return parsed;
  }catch(e){
    console.error('Failed to load high scores', e);
    return [];
  }
}

function saveHighScoresArray(arr){
  try{
    localStorage.setItem(HIGH_SCORES_KEY, JSON.stringify(arr));
  }catch(e){
    console.error('Failed to save high scores', e);
  }
}

/* Shared ranking order for high scores: highest score first, most recent date breaks ties.
   Returns a new array (doesn't mutate the input) so it's safe to call on data we don't own. */
function sortScores(list){
  return list.slice().sort((a,b)=>{
    if(b.score !== a.score) return b.score - a.score;
    return new Date(b.date) - new Date(a.date);
  });
}

/* Shared cross-device leaderboard data from Firebase (see the <script type="module"> block near
   the end of the file). null means "haven't heard from Firebase yet" - renderHighScores falls back
   to the local list in that case so the panel isn't empty while Firebase is still connecting or if
   it's unreachable. Once Firebase sends its first update, this becomes the source of truth. */
let sharedScores = null;
window.onSharedScoresUpdate = function(list){
  sharedScores = list;
  renderHighScores();
};

function saveHighScore(name, total){
  try {
    const now = new Date();
    const entry = { name: (name && name.trim()) ? name.trim() : 'Visitor', score: total, date: now.toISOString() };
    const list = loadHighScores();
    list.push(entry);
    const trimmed = sortScores(list).slice(0, MAX_HIGH_SCORES);
    saveHighScoresArray(trimmed);
    renderHighScores();
    saveHighScoresToFileSilently();
    if (window.pushSharedScore) window.pushSharedScore(entry);
  } catch (err) {
    console.error('saveHighScore error', err);
  }
}

function renderHighScores(){
  try {
    const source = sharedScores !== null ? sharedScores : loadHighScores();
    const list = sortScores(source).slice(0, MAX_HIGH_SCORES_DISPLAY);
    highScoresList.innerHTML = '';
    if(list.length === 0){
      const li = document.createElement('li');
      li.textContent = 'No high scores yet';
      highScoresList.appendChild(li);
      return;
    }
    list.forEach((entry, idx)=>{
      const li = document.createElement('li');

      const left = document.createElement('div');
      left.textContent = `${idx+1}.\u00A0\u00A0${entry.score}`;
      left.style.minWidth = '64px';

      const center = document.createElement('div');
      center.textContent = entry.name || 'Visitor';
      center.style.flex = '1';
      center.style.textAlign = 'center';
      center.style.padding = '0 8px';
      center.style.overflow = 'hidden';
      center.style.textOverflow = 'ellipsis';
      center.style.whiteSpace = 'nowrap';

      const d = new Date(entry.date);
      const right = document.createElement('div');
      right.textContent = d.toLocaleDateString();
      right.style.minWidth = '80px';
      right.style.textAlign = 'left';

      li.appendChild(left);
      li.appendChild(center);
      li.appendChild(right);
      highScoresList.appendChild(li);
    });
  } catch (err) {
    console.error('renderHighScores error', err);
  }
}

/* -------------------------
   High scores: automatic sync to a chosen local file
   (File System Access API - Chrome/Edge only)
   ------------------------- */
let highScoreFileHandle = null;
const FILE_HANDLE_DB = 'gamehub-filehandles';
const FILE_HANDLE_STORE = 'handles';
const FILE_HANDLE_KEY = 'highScoresFile';

function fileSystemAccessSupported(){
  return typeof window.showSaveFilePicker === 'function';
}

function updateFileStatus(text){
  const el = document.getElementById('fileStatus');
  if (el) el.textContent = text;
}

function openHandleDB(){
  return new Promise((resolve, reject)=>{
    const req = indexedDB.open(FILE_HANDLE_DB, 1);
    req.onupgradeneeded = () => { req.result.createObjectStore(FILE_HANDLE_STORE); };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

async function storeFileHandle(handle){
  try {
    const db = await openHandleDB();
    const tx = db.transaction(FILE_HANDLE_STORE, 'readwrite');
    tx.objectStore(FILE_HANDLE_STORE).put(handle, FILE_HANDLE_KEY);
    return new Promise((res, rej)=>{ tx.oncomplete = res; tx.onerror = ()=>rej(tx.error); });
  } catch (err) { console.error('storeFileHandle error', err); }
}

async function loadStoredFileHandle(){
  try {
    const db = await openHandleDB();
    const tx = db.transaction(FILE_HANDLE_STORE, 'readonly');
    const req = tx.objectStore(FILE_HANDLE_STORE).get(FILE_HANDLE_KEY);
    return new Promise((res)=>{
      req.onsuccess = () => res(req.result || null);
      req.onerror = () => res(null);
    });
  } catch (err) { console.error('loadStoredFileHandle error', err); return null; }
}

async function clearStoredFileHandle(){
  try {
    const db = await openHandleDB();
    const tx = db.transaction(FILE_HANDLE_STORE, 'readwrite');
    tx.objectStore(FILE_HANDLE_STORE).delete(FILE_HANDLE_KEY);
    return new Promise((res)=>{ tx.oncomplete = res; tx.onerror = res; });
  } catch (err) { console.error('clearStoredFileHandle error', err); }
}

async function writeHighScoresToFile(){
  if(!highScoreFileHandle) return { ok:false, reason:'No file connected.' };
  if(!highScoreFileSynced) return { ok:false, reason:'The file has not been successfully read yet this session, so saving to it is paused to avoid overwriting its contents.' };
  try {
    const permission = await highScoreFileHandle.queryPermission({mode:'readwrite'});
    if(permission !== 'granted') return { ok:false, reason:'Permission not granted for the file.' };
    const list = loadHighScores();
    const writable = await highScoreFileHandle.createWritable();
    await writable.write(JSON.stringify(list, null, 2));
    await writable.close();
    return { ok:true };
  } catch (err) {
    console.error('writeHighScoresToFile error', err);
    if(err.name === 'NotFoundError'){
      highScoreFileHandle = null;
      await clearStoredFileHandle();
      return { ok:false, reason:'The connected file could not be found (it may have been moved or renamed).', needsReconnect:true };
    }
    return { ok:false, reason: err.message || String(err) };
  }
}

/* True only once this session has successfully read the connected file at least once (including
   the case where the file is legitimately empty/new). writeHighScoresToFile refuses to run until
   this is true, specifically to prevent the failure mode where a read silently fails (e.g. the
   file was hand-edited and now has invalid JSON) and a later save then overwrites the file with
   the browser's stale, smaller copy of the list - destroying whatever was actually in the file. */
let highScoreFileSynced = false;

async function loadHighScoresFromFile(){
  try {
    if(!highScoreFileHandle) return;
    const file = await highScoreFileHandle.getFile();
    const text = await file.text();
    if(text && text.trim()){
      const parsed = JSON.parse(text);
      if(!Array.isArray(parsed)) throw new Error('File content is valid JSON but not a list of scores.');
      saveHighScoresArray(parsed);
    }
    highScoreFileSynced = true;
  } catch (err) {
    console.error('loadHighScoresFromFile error', err);
    highScoreFileSynced = false;
    showMessage(
      'The high scores file could not be read (' + (err.message || err) + ').\n\n' +
      'To avoid overwriting whatever is actually in the file, saving to it is paused until it can ' +
      'be read successfully - fix the file\'s contents, then reload the page.'
    );
  }
}

async function connectHighScoreFile(){
  try {
    if(!fileSystemAccessSupported()){
      return { ok:false, reason:'Automatic saving needs Chrome or Edge. Use "Export (JSON)" instead.' };
    }
    const handle = await window.showSaveFilePicker({
      suggestedName: 'yahtzee_high_scores.json',
      types: [{ description: 'JSON file', accept: {'application/json': ['.json']} }]
    });
    highScoreFileHandle = handle;
    await storeFileHandle(handle);
    await loadHighScoresFromFile();
    const result = await writeHighScoresToFile();
    renderHighScores();
    if(result.ok) updateFileStatus('High scores saved to: ' + handle.name);
    return result;
  } catch (err) {
    if (err && err.name === 'AbortError') return { ok:false, reason:'cancelled' };
    console.error('connectHighScoreFile error', err);
    return { ok:false, reason: err.message || String(err) };
  }
}

async function tryReconnectHighScoreFile(){
  try {
    if(!LOCAL_FILE_BACKUP_ENABLED) return;
    if(!fileSystemAccessSupported()) return;
    const handle = await loadStoredFileHandle();
    if(!handle) return;
    highScoreFileHandle = handle;
    const permission = await handle.queryPermission({mode:'readwrite'});
    if(permission === 'granted'){
      await loadHighScoresFromFile();
      renderHighScores();
      updateFileStatus('Auto-saving high scores to: ' + handle.name);
    } else {
      // Browsers reset File System Access permission to "ask again" on every fresh session, and
      // won't let a page request it without an actual click - queryPermission above can only see
      // that it's not granted yet, it can't re-grant it. So: wait for the very first click
      // anywhere on the page (any button press counts) and use that click's user gesture to
      // silently re-request permission and pull in whatever is currently in the file.
      updateFileStatus('Click "Exit" to reconnect and save to: ' + handle.name);
      document.addEventListener('click', reconnectHighScoreFileOnFirstClick, { once:true });
    }
  } catch (err) {
    console.error('tryReconnectHighScoreFile error', err);
  }
}

async function reconnectHighScoreFileOnFirstClick(){
  try {
    if(!highScoreFileHandle) return;
    const already = await highScoreFileHandle.queryPermission({mode:'readwrite'});
    if(already !== 'granted'){
      await highScoreFileHandle.requestPermission({mode:'readwrite'});
    }
    const permission = await highScoreFileHandle.queryPermission({mode:'readwrite'});
    if(permission === 'granted'){
      await loadHighScoresFromFile();
      renderHighScores();
      updateFileStatus('Auto-saving high scores to: ' + highScoreFileHandle.name);
    }
  } catch (err) {
    console.error('reconnectHighScoreFileOnFirstClick error', err);
  }
}

/* Called automatically after every finished game. Writes silently to the connected file - no
   dialogs, no confirmations, UNLESS this is the very first time a file has ever been connected on
   this browser, in which case the OS "Save As" dialog is unavoidable (browsers require it once,
   for security). Gated by LOCAL_FILE_BACKUP_ENABLED (see its definition above) - when that's
   false, this returns immediately and none of that ever runs. */
async function saveHighScoresToFileSilently(){
  try {
    if(!LOCAL_FILE_BACKUP_ENABLED) return;
    if(!fileSystemAccessSupported()) return;
    if(!highScoreFileHandle){
      const stored = await loadStoredFileHandle();
      if(stored) highScoreFileHandle = stored;
    }
    if(highScoreFileHandle){
      const permission = await highScoreFileHandle.queryPermission({mode:'readwrite'});
      if(permission === 'granted'){
        await writeHighScoresToFile();
        return;
      }
      const requested = await highScoreFileHandle.requestPermission({mode:'readwrite'});
      if(requested === 'granted') await writeHighScoresToFile();
      return;
    }
    await connectHighScoreFile();
  } catch (err) {
    console.error('saveHighScoresToFileSilently error', err);
  }
}

/* -------------------------
   Universal popup modal - shared look for every popup on this page
   ------------------------- */
function showModal({ title, message, buttons, fontSizePt, titleFontSizePx, html, exitStyle } = {}){
  return new Promise((resolve)=>{
    const modal = document.getElementById('universalModal');
    const titleEl = document.getElementById('universalModalTitle');
    const textEl = document.getElementById('universalModalText');
    const buttonsEl = document.getElementById('universalModalButtons');

    // exitStyle is opt-in per-call (only the Exit confirmation uses the AceyDeucey-matching
    // cream/gold look, via the #universalModal.exit-style rules below) - toggled fresh on every
    // call so it never leaks onto the next modal that doesn't ask for it.
    if(modal) modal.classList.toggle('exit-style', !!exitStyle);

    if(titleEl){
      if(title){ titleEl.textContent = title; titleEl.style.display = 'block'; }
      else { titleEl.style.display = 'none'; }
      // titleFontSizePx is an opt-in per-call override (e.g. the Game Over title); reset to '' when
      // not supplied so it doesn't leak the last modal's size onto the next one that omits it.
      titleEl.style.fontSize = titleFontSizePx ? (titleFontSizePx + 'px') : '';
    }
    if(textEl){
      // html is opt-in per-call (e.g. the Game Over modal needs bold/larger spans within the
      // message); every other caller keeps passing plain text through textContent as before.
      if(html){ textEl.innerHTML = message || ''; }
      else { textEl.textContent = message || ''; }
      textEl.style.fontSize = (fontSizePt || 12) + 'pt';
    }
    if(buttonsEl){
      buttonsEl.innerHTML = '';
      (buttons || [{label:'OK', value:undefined, primary:true}]).forEach((def)=>{
        const btn = document.createElement('button');
        btn.textContent = def.label;
        btn.className = 'modalBtn ' + (def.primary ? 'primary' : 'secondary');
        btn.onclick = () => {
          if(modal) modal.style.display = 'none';
          resolve(def.value);
        };
        buttonsEl.appendChild(btn);
      });
    }
    if(modal) modal.style.display = 'block';
  });
}

function showMessage(text, fontSizePt){
  return showModal({ message: text, fontSizePt, buttons: [{ label:'OK', value:undefined, primary:true }] });
}

function showConfirm(text){
  return showModal({ message: text, buttons: [
    { label:'OK', value:true, primary:true },
    { label:'Cancel', value:false, primary:false }
  ]});
}

async function handleExitClick(){
  try {
    const confirmed = await showModal({
      title: 'Exit Yahtzee',
      message: 'Are you sure you want to exit?',
      exitStyle: true,
      buttons: [
        { label:'Yes', value:true, primary:true },
        { label:'Cancel', value:false, primary:false }
      ]
    });
    if(!confirmed) return;
    /* High scores are saved automatically after every finished game, so this is just one last
       silent save attempt (in case a file was never connected yet) before closing - no file-save
       prompts, just the plain exit confirmation above. */
    await saveHighScoresToFileSilently();
    performExit();
  } catch (err) {
    console.error('handleExitClick error', err);
  }
}

function performExit(){
  try {
    /* Sends the player back to the Perry's Stuff home page rather than
       trying to close the tab (browsers block window.close() on tabs
       the page itself didn't open, so this is more reliable anyway). */
    window.location.href = '../index.html';
  } catch (err) {
    console.error('performExit error', err);
  }
}

async function resetYahtzee(){

}

/* Initialize UI */
initYahtzee();

/* Pins the Scorecard and High Scores cards to the left column's exact height (not just a minimum),
   so neither can overshoot past Totals' bottom either - min-height alone still let Scorecard's own
   tall natural content (13 rows) push past it. Scorecard gets overflow-y:auto as a safety net in
   case its content ever doesn't fit (e.g. a future added category) rather than silently clipping.
   Root cause of them not matching before was a #yahtzeeArea{align-items:stretch} rule that silently
   overrode this - all three columns were being stretched to match the tallest one, Scorecard,
   regardless of what this function set. That rule is gone now. Runs on initial load, again after
   the window 'load' event (in case late-loading fonts shifted text height), and on resize since the
   left column's width - and therefore how the dice wrap - can change with viewport. */
function matchColumnHeightsToLeftColumn(){
  try {
    const left = document.getElementById('leftColumn');
    if(!left) return;
    const targetHeight = left.offsetHeight + 'px';
    const scorecard = document.getElementById('scorecardCard');
    const highScores = document.getElementById('highScoresCard');
    if(scorecard){
      scorecard.style.boxSizing = 'border-box';
      scorecard.style.height = targetHeight;
      scorecard.style.overflowY = 'hidden';
    }
    if(highScores){
      highScores.style.boxSizing = 'border-box';
      highScores.style.height = targetHeight;
      highScores.style.overflowY = 'hidden';
    }
  } catch (err) {
    console.error('matchColumnHeightsToLeftColumn error', err);
  }
}
matchColumnHeightsToLeftColumn();
window.addEventListener('load', matchColumnHeightsToLeftColumn);
window.addEventListener('resize', matchColumnHeightsToLeftColumn);

/* Guarantees no page scrollbar, regardless of small rendering differences between browsers/fonts
   that made manually trimming individual paddings an endless chase: measures the actual rendered
   height of everything (pageWrapper, which holds the header bar and all three columns), and if it's
   taller than the window, scales the whole thing down by exactly enough to fit - same proportions,
   same look, just slightly smaller. Does nothing if it already fits (scale stays at 1). The error
   overlay and confirmation modal live outside pageWrapper on purpose, so they're never scaled and
   still cover the true full-size viewport if shown. Re-checks on resize, and after the column
   height matching above so it scales an already correctly laid-out page. */
function fitPageToViewport(){
  try {
    const wrapper = document.getElementById('pageWrapper');
    if(!wrapper) return;
    wrapper.style.zoom = 1;
    const contentHeight = wrapper.scrollHeight;
    const available = window.innerHeight;
    if(contentHeight > available && contentHeight > 0){
      const scale = available / contentHeight;
      wrapper.style.zoom = scale;
    }
  } catch (err) {
    console.error('fitPageToViewport error', err);
  }
}
fitPageToViewport();
window.addEventListener('load', fitPageToViewport);
window.addEventListener('resize', fitPageToViewport);

(function(){
  const btn = document.getElementById('soundToggleBtn');
  if (btn) btn.textContent = soundEnabled ? '🔊 Sound: On' : '🔇 Sound: Off';
})();
/* Builds the Name input from scratch, the same way Pinochle's playerNameInput is built fresh each
   time its Options modal opens: the correct value is set right at creation time via .value, so the
   field never exists on the page in a state where anything else - browser form-restore included -
   could have written a different value into it first. Rebuilding (rather than just re-syncing a
   value) on 'pageshow' also protects against a bfcache restore bringing back an entire stale copy
   of this element with leftover typed text still in it. */
function buildNameInput(){
  const slot = document.getElementById('nameInputSlot');
  if(!slot) return;
  slot.innerHTML = '';
  const input = document.createElement('input');
  input.type = 'text';
  input.id = 'nameInput';
  input.maxLength = 24;
  input.placeholder = 'Visitor';
  input.autocomplete = 'off';
  input.value = (currentPlayerName === 'Visitor') ? '' : currentPlayerName;
  input.style.cssText =
    'background:var(--name-field-bg); color:var(--name-field-text); font-size:20px; ' +
    'font-weight:600; text-align:center; border:0; padding:6px 8px; width:100%; height:100%; box-sizing:border-box;';
  input.addEventListener('input', ()=>updatePlayerName(input.value));
  slot.appendChild(input);
}
buildNameInput();
window.addEventListener('pageshow', buildNameInput);

tryReconnectHighScoreFile();
</script>

<!-- -------------------------------------------------------------------------
     Shared (cross-device) high scores via Firebase Realtime Database.
     Loaded as a separate <script type="module"> because Firebase's SDK is
     distributed as native ES modules - this doesn't touch or replace any of
     the local-file/localStorage machinery above, it just adds a second,
     shared source that the classic script above reads from and writes to via
     a few small window.* functions (see the comments below).
     ------------------------------------------------------------------------- -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
  import {
    getDatabase, ref, push, remove, onValue
  } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyAJLWtpWR8VYmRYLa3kBD9lh2JO_-hFAEc",
    authDomain: "perrys-stuff.firebaseapp.com",
    databaseURL: "https://perrys-stuff-default-rtdb.firebaseio.com",
    projectId: "perrys-stuff",
    storageBucket: "perrys-stuff.firebasestorage.app",
    messagingSenderId: "604958963124",
    appId: "1:604958963124:web:d02aca2cdb29915b306ee1"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);
  const scoresRef = ref(db, 'yahtzeeScores');

  // Adds one finished game's score to the shared leaderboard. Fire-and-forget - the classic
  // script calls this but doesn't wait on it, so a slow/offline connection never blocks gameplay.
  window.pushSharedScore = function(entry){
    return push(scoresRef, entry).catch(err => console.error('pushSharedScore error', err));
  };

  // Wipes the entire shared leaderboard. Only ever called from the password-gated Clear High
  // Scores dialog in the classic script - there's no separate button or link to this.
  window.clearSharedScores = function(){
    return remove(scoresRef).catch(err => console.error('clearSharedScores error', err));
  };

  // Live subscription: fires immediately with whatever's currently in the database, then again
  // every time anyone (on any device) adds or clears scores. Converts Firebase's object-of-objects
  // shape into a plain array and hands it to the classic script's onSharedScoresUpdate, which
  // re-renders the High Scores panel from it.
  onValue(scoresRef, (snapshot) => {
    const val = snapshot.val() || {};
    const list = Object.keys(val).map(key => ({ id: key, ...val[key] }));
    if (window.onSharedScoresUpdate) window.onSharedScoresUpdate(list);
  }, (err) => console.error('onValue(scoresRef) error', err));
</script>
