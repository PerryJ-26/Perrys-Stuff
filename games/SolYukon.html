<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Yukon - Game Hub</title>
<style>
  /* ===== ALL COLORS LIVE HERE - matches the rest of the site's card-game theme (from Pinochle) ===== */
  :root {
    --board-green: #3f9142;
    --board-green-dark: #327638;
    --board-border: #111111;
    --page-bg: #dfe7f0;
    --card-bg: #fffdf8;
    --card-border: #b7b7b7;
    --ink: #1b1b1b;
    --red: #b3261e;

    --cream: #fffdf5;
    --cream-border: #222;

    --green-btn: #2f7d3a;
    --green-btn-dark: #235c2b;

    --cardback-1: #d6394a;
    --cardback-2: #ffffff;
    --cardback-border: #7a1c26;

    --shadow-soft: rgba(255,255,255,.55);
    --shadow-medium: rgba(0,0,0,.4);
    --shadow-strong: rgba(0,0,0,.6);

    --drop-target-color: #57e389;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    overflow: hidden;
    background: var(--page-bg);
    font-family: Arial, Helvetica, sans-serif;
  }
  /* The ~0.25in top AND bottom margins both live on <html> (as padding,
     outside <body>'s own box) rather than as padding/margin on the
     bottom-anchored flex items below. A margin/padding on the flex side
     gets swallowed by the felt's own bottom-anchored overflow-clipping
     the moment content is taller than the window (exactly Perry's case)
     - putting the reserved strips on the outer element instead means
     they're never competed for by that clipping and always show, on
     every side, including the border that had been getting clipped
     off at the bottom. */
  html {
    height: 100vh;
    padding-top: 24px;
    padding-bottom: 24px;
  }
  body {
    height: 100%;
  }

  /* Anchors the whole button-column + felt group to the BOTTOM of the
     page (not centered - see below), so the felt's own bottom edge is
     never the part that runs short of room on a shorter window; any
     leftover space collects above the group instead. */
  body {
    display: flex;
    justify-content: center;
    align-items: flex-end;
  }
  /* align-items: flex-end (not center) so the button column's own
     bottom - the bottom of the Name/Score box - lines up with the
     felt's bottom edge. The felt (721.2x497) is taller than the
     button column, so it's the felt that sets #gameLayout's own
     height; flex-end here moves the (shorter) button column down
     within that height until the two bottoms match. */
  #gameLayout {
    display: flex;
    align-items: flex-end;
    gap: 24px;
    padding: 0 10px; /* left/right unchanged - top/bottom padding removed so the felt's own top/bottom edges reach all the way to <html>'s reserved margins instead of adding 10px more on the bottom only (that mismatch was why the top and bottom margins weren't equal) */
  }

  .revBadge {
    position: fixed;
    top: 10px;
    right: 12px;
    z-index: 9999;
    font-size: 0.7rem;
    font-weight: 600;
    color: #000000;
    pointer-events: none;
  }

  /* ---- Left-side action button stack ----
     No longer position:fixed - it's now a normal flex child inside
     #gameLayout so it can be centered as a group with the felt (see
     body/#gameLayout above). Only the Rev. badge stays pinned to the
     viewport corner. */
  #buttonGroup{
    display: flex;
    flex-direction: column;
    gap: 6px;
    width: 168px;
    flex-shrink: 0;
  }
  #pageTitle{
    margin: 0 0 10px;
    font-size: 2rem;
    font-weight: 800;
    letter-spacing: 2px;
    color: #1e3a22;
    text-shadow: 1px 1px 0 rgba(255,255,255,.5);
  }
  #buttonGroup button{
    background: var(--cream);
    color: var(--ink);
    border: 2px solid var(--board-border);
    border-radius: 6px;
    padding: 6px 14px;
    cursor: pointer;
    font-size: .8rem;
    font-weight: 700;
    white-space: nowrap;
    font-family: inherit;
  }
  #buttonGroup button:hover{ background: #fff; }

  /* Name and Score fields, placed below the Exit button per Perry's instruction */
  #nameScoreBox{
    margin-top: 10px;
    background: var(--shadow-soft);
    border: 2px solid #000000;
    border-radius: 8px;
    padding: 8px 10px;
    font-size: .8rem;
  }
  #nameScoreBox label{
    display: block;
    font-weight: 700;
    margin-bottom: 2px;
  }
  #nameScoreBox input{
    width: 100%;
    box-sizing: border-box;
    padding: 4px 6px;
    border-radius: 5px;
    border: 1px solid #000;
    font-family: inherit;
    font-size: .8rem;
    background: var(--cream);
    color: #000;
    margin-bottom: 8px;
  }
  #scoreDisplay{
    font-size: 1.1rem;
    font-weight: 800;
    color: #1e3a22;
    text-align: center;
  }
  .scoreLabel{ text-align: center; }

  /* ---- Felt / board ----
     Unlike Klondike/Pyramid, Yukon has no Stock and no Waste pile at all
     - every card is dealt straight into the Tableau up front - and its
     four Foundations are stacked VERTICALLY in a narrow column on the
     right instead of sitting in a horizontal row across the top. So
     #table-wrap is a ROW flex container with two children: a wide left
     area (#tableauArea, the familiar 7-column Tableau grid) and a
     narrower right area (#foundationArea, the 4 Foundations stacked top
     to bottom). Fixed width/height (box-sizing: border-box, so these
     totals already include the padding and border below).
     Padding-top/bottom started at 48px/48px (about 0.5in each) per
     Perry's original request, giving the Tableau room to grow into
     above the felt's inner bottom edge. It's since been trimmed twice
     to fit Perry's actual browser window (measured directly via
     window.innerHeight + table-wrap's own getBoundingClientRect(): a
     549px-tall window, ~40px short of the original 541.2px-tall felt)
     without losing the border on any side - most recently split evenly
     per Perry's own choice, so top padding is 13.9px and bottom padding
     is 37.9px (down from 24px/48px), still leaving a bit of headroom
     above/below the true minimum needed, with the reduction weighted
     toward keeping most of the Tableau's own growing room intact.
     Width = 20px padding + the Tableau grid (7 x 71.4px cards + 6 x 12px
     gaps = 571.8px) + a 30px gap + the Foundation column's own width
     (one card, 71.4px) + 20px padding + the 4px border on each side =
     721.2px. Height = 13.9px padding (top) + the Foundation column's
     own total height (4 piles x 100.3px + 3 x 12px gaps between them =
     437.2px - see #foundationArea below) + 37.9px padding (bottom) +
     the 4px border on each side = 497px. See the .cardWrap.faceDown/
     faceUp comment below for why sizing the felt to the Foundation
     column's height, rather than to the Tableau's own starting height,
     is what actually gives the Tableau its headroom to grow. */
  #table-wrap{
    display: flex;
    flex-direction: row;
    align-items: flex-start;
    gap: 30px;
    background: var(--board-green);
    border: 4px solid var(--board-border);
    border-radius: 14px;
    padding: 13.9px 20px 37.9px 20px;
    margin: 0;
    width: 721.2px;
    height: 497px;
    box-sizing: border-box;
  }
  .tableau-row{
    display: grid;
    grid-template-columns: repeat(7, 71.4px);
    gap: 12px;
  }
  /* The 4 Foundations, stacked top to bottom instead of Klondike's
     horizontal row - same 12px gap Klondike used between its own
     horizontally-arranged piles, just applied vertically here. */
  .foundation-col{
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .pile{
    width: 71.4px; height: 100.3px;
    border: 2px dashed rgba(255,255,255,.55);
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: rgba(255,255,255,.65);
    font-size: 1.87rem;
    font-weight: 800;
    cursor: pointer;
    position: relative;
  }
  .pile.empty-hint{ font-size: 2.04rem; }
  .tableau-col{
    position: relative;
    min-height: 100.3px;
  }
  .tableau-col .empty-slot{
    width: 71.4px; height: 100.3px;
    border: 2px dashed rgba(255,255,255,.35);
    border-radius: 6px;
  }
  /* touch-action:none keeps a touch-drag of a card from also scrolling the
     page - see the Drag and drop section of the script, which reads move
     events for both mouse and touch through the same Pointer Events code
     path. */
  .cardWrap{ position: relative; perspective: 700px; touch-action: none; }
  /* Face-up and face-down cards stagger by different amounts, same
     convention as Klondike: a face-up card's rank/suit corner needs to
     show more clearly, while a face-down card (nothing to read on it
     anyway) can stay tighter. The felt's own height (721.2 x 497 - see
     #table-wrap) is actually set by the four Foundations stacked
     vertically on the right (4 piles x 100.3px + 3 x 12px gaps =
     437.2px of content height) rather than by the Tableau itself, since
     that stack is taller than even Yukon's own deepest starting column
     (column 7: 6 face-down cards + 5 face-up cards = 11 cards, only
     235.3px tall with this same overlap: 100.3px for the first card,
     then 5 more face-down cards x 10px each, then 5 face-up cards x
     17px each). That leaves the Tableau a great deal of extra headroom
     to grow into over the course of play - comfortably past 20 cards
     deep in a single column - without the felt itself ever needing to
     grow. (Yukon's face-down count in any column is fixed the instant
     it's dealt and can only ever go DOWN as cards flip face up over the
     course of play, so 6 is always the worst case there; it's the
     face-up portion - built up by moving groups of cards onto a column
     during play - that has no fixed cap, so the sizing above just needs
     to comfortably outlast the Foundation stack's own fixed height,
     which it does with plenty of room to spare.) */
  .tableau-col .cardWrap.faceDown:not(:first-child){ margin-top: -90.3px; }
  .tableau-col .cardWrap.faceUp:not(:first-child){ margin-top: -83.3px; }

  /* ---- Dramatic reveal animation ----
     .flip3d: a GENUINE two-sided flip for a Tableau card turning face up
     once the card that was covering it is moved away - shows the
     cardback first, rotates through edge-on (where neither face is
     visible, same as a real card mid-flip), and only then reveals the
     front, so you can watch what was underneath actually turn over.
     Built from two stacked faces inside a rotating wrapper; each face
     has backface-visibility:hidden so only whichever one is currently
     facing the viewer shows. This is ordinary Klondike-style mid-game
     reveal behavior, reused as-is - Yukon's own INITIAL deal does NOT
     use this animation at all (every card already shows its correct
     face, up or down, from the instant it starts flying in - see
     animateYukonDealFlyIn() in the script). */
  .flip3d{
    width: 71.4px; height: 100.3px;
    position: relative;
    transform-style: preserve-3d;
    /* Pivoting around the left edge instead of the center, below, is what
       makes the card look like it's hinging down flat starting from its
       left side, instead of spinning in place around its own middle. */
    transform-origin: left center;
    /* 0.3s per card, per Perry's request. animation-fill-mode: both is
       essential here, not just "backwards" - backwards alone only holds
       the 0% pose (showing the back) during the animation-delay before it
       starts; the instant the animation finishes, the element snaps back
       to its un-animated state, which for a rotation means it would
       immediately flip right back to showing the cardback again. "both"
       keeps it locked at the 100% pose (front facing the viewer) once
       the flip completes, the same way it holds the 0% pose beforehand. */
    animation: flip3dRotate 0.3s ease-out both;
  }
  @keyframes flip3dRotate{
    /* Rotating around the left edge (transform-origin above) swings the
       card 180 degrees around that edge, which - on its own - would leave
       it sitting a full card-width to the left of where it started (the
       same way a hinged door ends up on the far side of its hinge). The
       translateX(100%) at 100% cancels that drift out so the card still
       lands exactly back in its own spot, having visibly pivoted from its
       left edge along the way rather than spun around its center. */
    0%   { transform: translateX(0) rotateY(0deg); }
    100% { transform: translateX(100%) rotateY(180deg); }
  }
  .flip3d-face{
    position: absolute;
    inset: 0;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
  }
  .flip3d-face.flip3d-back{
    /* identical look to .cardback */
    background-color: var(--cardback-1);
    background-image:
      repeating-linear-gradient(45deg, transparent 0 4px, var(--cardback-2) 4px 8px),
      repeating-linear-gradient(-45deg, transparent 0 4px, var(--cardback-2) 4px 8px);
    border: 1px solid var(--cardback-border);
    border-radius: 6px;
  }
  .flip3d-face.flip3d-front{
    transform: rotateY(180deg);
  }
  .flip3d-face.flip3d-front .card{
    width: 100%;
    height: 100%;
  }

  @keyframes foundationLand{
    0%   { transform: scale(1.9) rotate(-12deg); box-shadow: 0 0 0 6px #fff, 0 0 30px 12px rgba(255,215,0,.9); }
    55%  { transform: scale(0.9) rotate(4deg); box-shadow: 0 0 0 3px #fff, 0 0 16px 6px rgba(255,215,0,.55); }
    100% { transform: scale(1) rotate(0deg); box-shadow: 1px 2px 3px var(--shadow-medium); }
  }
  .foundation-anim{ animation: foundationLand 0.55s cubic-bezier(.34,1.56,.64,1); }

  /* Hint: the gold dotted halo shown after 6s of no move (see the Hint
     section of the script) around the card that could be played and the
     card/pile it could go to. outline (not border) so it never disturbs
     layout or the overlapping-card stack spacing. */
  .hint-highlight{
    outline: 3px dotted gold;
    outline-offset: 3px;
    border-radius: 6px;
  }

  /* ---- Drag and drop (see the script section of the same name) ----
     .dragGhost: the floating card-or-group that follows the cursor while
     dragging - fixed positioning plus pointer-events:none keeps it from
     ever being what a drop-target lookup or a click actually lands on.
     .dragSourceHidden: dims the real card(s) in place while they're being
     dragged, so it reads as "picked up" without a gap opening in the felt.
     .dropTargetValid: the live highlight on whichever Tableau column or
     Foundation pile the drag is currently over AND could legally drop on -
     a solid outline (rather than .hint-highlight's dotted gold) keeps the
     two visually distinct at a glance. */
  .dragGhost{
    position: fixed;
    top: 0; left: 0;
    pointer-events: none;
    z-index: 500;
    opacity: 0.92;
    filter: drop-shadow(2px 4px 6px var(--shadow-strong));
  }
  .dragSourceHidden{ opacity: 0.35; }
  .dropTargetValid{
    outline: 3px solid var(--drop-target-color);
    outline-offset: 3px;
    border-radius: 6px;
  }

  /* ---- Troubleshooting log (see the script section of the same name) ----
     Same invisible-corner-button pattern used for this in AceyDeucey:
     #diagLogToggleBtn is a completely invisible 44x44 button tucked into
     the very bottom-left corner of the screen, double-clicked to show/hide
     the log panel. Colors match this page's own cream/board-border theme
     instead of AceyDeucey's wood-and-gold one. */
  #diagLogToggleBtn{
    position: fixed;
    bottom: 0; left: 0;
    width: 44px; height: 44px;
    padding: 0; margin: 0; border: none;
    background: transparent;
    opacity: 0;
    cursor: default;
    z-index: 600;
  }
  #diagLogPanel{
    display: none;
    position: fixed;
    bottom: 10px; left: 10px;
    width: 320px;
    max-height: 520px;
    background: var(--cream);
    color: var(--ink);
    border: 3px solid var(--board-border);
    border-radius: 10px;
    padding: 10px 12px;
    z-index: 550;
    box-shadow: 0 4px 20px var(--shadow-strong);
  }
  #diagLogPanel.show{ display: flex; flex-direction: column; }
  #diagLogPanelTitle{
    font-weight: 800;
    font-size: .9rem;
    margin-bottom: 6px;
    flex: 0 0 auto;
  }
  /* A real (readonly) textarea rather than a div of lines - so a Ctrl-A
     while the log has focus selects only the log's own text, the normal
     browser behavior for a form field, instead of selecting the whole
     page. Unlike a div, a textarea's own height doesn't grow on its own as
     text is added to it - debugLog() (see the script section of the same
     name) re-measures and re-sets its height after every new line, up to
     the max-height below, so the box grows right along with the log the
     same way the plain-div version in AceyDeucey does. Past max-height,
     this overflow-y:auto is what takes over with a normal scroll bar
     instead of growing the box any further. */
  #diagLog{
    overflow-y: auto;
    font-family: 'Courier New', monospace;
    font-size: .72rem;
    line-height: 1.45;
    max-height: 460px;
    width: 100%;
    resize: none;
    border: none;
    outline: none;
    background: var(--cream);
    color: var(--ink);
    padding: 0;
  }

  /* ---- Playing cards (face-up / face-down), same visual family as Pinochle ---- */
  .card{
    width: 71.4px; height: 100.3px;
    border-radius: 6px;
    box-shadow: 1px 2px 3px var(--shadow-medium);
    user-select: none;
  }
  .card-face-img{
    display: block;
    width: 100%;
    height: 100%;
    border-radius: 6px;
    -webkit-user-drag: none;
  }
  .cardback{
    width: 71.4px; height: 100.3px;
    background-color: var(--cardback-1);
    background-image:
      repeating-linear-gradient(45deg, transparent 0 4px, var(--cardback-2) 4px 8px),
      repeating-linear-gradient(-45deg, transparent 0 4px, var(--cardback-2) 4px 8px);
    border: 1px solid var(--cardback-border);
    border-radius: 6px;
  }
  .card.clickable, .cardback.clickable, .flip3d.clickable{ cursor: pointer; }
  .card.clickable:hover{
    box-shadow: 0 0 0 3px #fff, 0 0 0 5px var(--board-border), 1px 2px 3px var(--shadow-medium);
  }
  /* Same hover ring as .card.clickable:hover, applied to the front face
     while a card is still sitting in its post-flip .flip3d wrapper (it
     stays that way until the next render() rebuilds it as a plain card). */
  .flip3d.clickable:hover .flip3d-front .card{
    box-shadow: 0 0 0 3px #fff, 0 0 0 5px var(--board-border), 1px 2px 3px var(--shadow-medium);
  }

  /* ---- Generic universalModal system (same pattern used across the Game Hub) ---- */
  #universalModal{
    display:none;
    position:fixed; inset:0;
    background: transparent;
    z-index:100;
  }
  #universalModal .modalBox{
    position: fixed;
    box-shadow: 0 4px 20px rgba(0,0,0,.5);
    background: var(--cream);
    color: var(--ink);
    border: 3px solid var(--board-border);
    border-radius: 12px;
    padding: 22px;
    max-width: 560px;
    width: 90%;
    max-height: 85vh;
    overflow-y: auto;
  }
  #universalModal h2{ margin-top:0; color: var(--ink); text-align:center; }
  /* Win title flash - see the "You Win!" call site below, which is the only
     place this class gets added. */
  @keyframes blink-win{ 0%,49%{ opacity:1; } 50%,100%{ opacity:0; } }
  .win-blink{ animation: blink-win 1s step-start infinite; }
  #universalModal .modalBody{ font-size:.92rem; line-height:1.5; text-align:center; }
  #universalModal .modalBtns{ display:flex; gap:10px; justify-content:center; margin-top:16px; flex-wrap: wrap; }
  #universalModal button{
    background: var(--green-btn); color: #fff;
    border:2px solid var(--board-border); border-radius:6px;
    padding:8px 16px; cursor:pointer; font-weight:600;
    font-family: inherit;
  }
  #universalModal button:hover{ background: var(--green-btn-dark); }

  .scores-table{
    width: 100%;
    border-collapse: collapse;
    margin-top: 10px;
    font-size: .85rem;
  }
  .scores-table th, .scores-table td{
    border: 1px solid var(--card-border);
    padding: 4px 8px;
    text-align: center;
  }
  .scores-table th{ background: #e8e2c8; }

  /* Recorded Scores modal only - the Scoring System Explanation button sits
     at the top of the popup body, under the title, so it needs its own
     bottom margin to separate it from the score list below. */
  .scores-explain-btn{ margin-bottom: 12px; }

  .options-grid{
    display: grid;
    grid-template-columns: auto auto auto auto auto;
    row-gap: 14px;
    column-gap: 12px;
    align-items: center;
    justify-content: center;
    margin-top: 10px;
  }
  .options-grid label{ font-weight: 600; cursor: pointer; white-space: nowrap; }
  .options-grid .options-question{ font-weight: 600; white-space: nowrap; text-align: left; }

  /* Options modal only - widened ~1.5in (144px) from the shared modal's
     560px max-width, since the two-column grid of questions/choices felt
     crowded at the standard width. Yukon's own Options popup only has the
     Sound and Autoplay rows (no draw-count row - Yukon has no Stock pile
     to draw from), but keeps the same widened modal Klondike/Pyramid use
     for visual consistency across the site. */
  #universalModal .modalBox.optionsModal{ max-width: 704px; }

  /* Recorded Scores modal only - allowed to grow up to (but not past) the
     felt's own footprint (#table-wrap is a fixed 721.2 x 497 - see that
     rule), instead of the shared modal's normal viewport-relative sizing,
     since showing up to 30 rows needs more room than the standard 560px/
     85vh popup. Sized a bit smaller than the felt itself so it visually
     sits inside the green area with a little breathing room. */
  #universalModal .modalBox.scoresModal{ max-width: 680px; max-height: 500px; }
  /* The scores list scrolls on its own within that fixed-height popup, so
     the title and the Scoring System Explanation/OK buttons always stay
     visible - only the table grows a scroll bar once its rows run past
     this height. */
  .scores-scroll{ max-height: 300px; overflow-y: auto; }
</style>
</head>
<body>

  <div class="revBadge" id="revBadge"></div>

  <div id="gameLayout">
  <div id="buttonGroup">
    <h1 id="pageTitle">Yukon</h1>
    <button id="newGameBtn" title="Start a new game using this version.">New Game</button>
    <button id="restartBtn" title="Restart the current game.">Restart</button>
    <button id="selectGameBtn" title="Select a version of Solitaire.">Select a Game</button>
    <button id="undoBtn" title="Undo the last move.">Undo</button>
    <button id="autoplayBtn" title="Automatically move eligible cards to the foundation">Autoplay: ON</button>
    <button id="instructionsBtn" title="Instructions for playing this game.">Instructions</button>
    <button id="scoresBtn" title="Scores recorded from previous games.">Recorded Scores</button>
    <button id="optionsBtn" title="Customize the game.">Options</button>
    <button id="exitBtn" title="Quit the game.">Exit</button>

    <div id="nameScoreBox">
      <label for="playerNameInput">Name</label>
      <input type="text" id="playerNameInput" maxlength="16" placeholder="Player 1">
      <label class="scoreLabel">Score</label>
      <div id="scoreDisplay" title="The current score.">0</div>
    </div>
  </div>

  <div id="table-wrap">
    <div class="tableau-row" id="tableauArea">
      <div class="tableau-col" id="tableau-0"></div>
      <div class="tableau-col" id="tableau-1"></div>
      <div class="tableau-col" id="tableau-2"></div>
      <div class="tableau-col" id="tableau-3"></div>
      <div class="tableau-col" id="tableau-4"></div>
      <div class="tableau-col" id="tableau-5"></div>
      <div class="tableau-col" id="tableau-6"></div>
    </div>
    <div class="foundation-col" id="foundationArea">
      <div class="pile empty-hint" id="foundation-s" onclick="onFoundationClick('&spades;')"></div>
      <div class="pile empty-hint" id="foundation-h" onclick="onFoundationClick('&hearts;')"></div>
      <div class="pile empty-hint" id="foundation-c" onclick="onFoundationClick('&clubs;')"></div>
