<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mancala</title>
<style>
  /* ===== ALL COLORS LIVE HERE - warm carved-wood theme, sampled from Perry's
     reference photo of a wooden Mancala board =====
     Every color used anywhere on this page is assigned here, named for what
     it's used for, so the impact of changing any one of them is clear. */
  :root {
    /* Outer page background - solid fallback shown before/if the tiled photo
       texture (applied directly to body below) loads - used by: body
       background-color, header background, control-bar background. */
    --page-wood: #4b2817;
    --page-wood-dark: #341a0d;

    /* The board's own surface color (the lighter honey-brown wood visible in
       the photo) - used by: .board background gradient + border. */
    --board-wood: #8a5226;
    --board-wood-light: #a8703f;
    --board-wood-dark: #5c3316;

    /* Pit / Mancala interiors - used by: .pit background, .mancala background. */
    --pit-dark: #140a04;
    --pit-mid: #3a2010;
    --mancala-dark: #1c0f06;
    --mancala-mid: #4a2c14;

    /* Seed-count numbers engraved into each pit/Mancala - used by: .pit .count,
       .mancala .count, and the clickable-pit outline glow. */
    --seed-text: #e8c78a;

    /* Cool blue-green / soft teal action buttons - used by: .action-btn
       background + border, and its hover/disabled states. */
    --btn-teal: #3d8f86;
    --btn-teal-dark: #2b675f;
    --btn-teal-light: #5aada3;
    --btn-text: #ffffff;

    /* Name input fields - used by: .name-input background, border, text. */
    --input-bg: #9cc9c4;
    --input-border: #a8703f;
    --input-text: #2c1c0f;

    /* General text drawn directly over the wood background - used by: header
       h1, revBadge, turn banner. */
    --wood-area-text: #f3e2c8;
    --wood-area-text-shadow: rgba(0,0,0,0.6);

    /* Themed confirmation / scores modal - used by: #universalModal and its
       children. */
    --modal-overlay-bg: rgba(20,10,4,0.55);
    --modal-box-bg: #f3e9da;
    --modal-box-border: #8a5226;
    --modal-text: #2c1c0f;
    --modal-shadow: rgba(0,0,0,0.5);
  }

  * {
    box-sizing: border-box;
  }

  html, body {
    margin: 0;
    min-height: 100%;
    font-family: Arial, Helvetica, sans-serif;
  }

  .page {
    max-width: 1100px;
    margin: 0 auto;
    padding: 0 16px 40px;
  }

  header {
    text-align: center;
    padding: 1.3rem 1rem 1rem;
    position: relative;
  }

  header h1 {
    margin: 0;
    font-size: 2.6rem;
    letter-spacing: 2px;
    color: var(--wood-area-text);
    text-shadow: 0 2px 4px var(--wood-area-text-shadow);
  }

  .revBadge {
    position: absolute;
    top: 6px;
    right: 10px;
    font-size: 0.7rem;
    font-weight: 600;
    color: var(--wood-area-text);
    opacity: 0.85;
  }

  /* ---- Centered control row: buttons + name field(s), all one visible group ---- */
  .control-bar {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    align-items: center;
    gap: 10px;
    padding: 6px 10px 18px;
  }

  .action-btn {
    background: var(--btn-teal);
    color: var(--btn-text);
    border: 1px solid var(--btn-teal-dark);
    border-radius: 8px;
    padding: 10px 18px;
    font-size: 1rem;
    font-weight: bold;
    font-family: inherit;
    cursor: pointer;
    transition: background 150ms ease;
  }

  .action-btn:hover {
    background: var(--btn-teal-light);
  }

  .action-btn:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }

  .name-input {
    background: var(--input-bg);
    border: 1px solid var(--input-border);
    color: var(--input-text);
    border-radius: 8px;
    padding: 10px 12px;
    font-size: 1rem;
    font-family: inherit;
    width: 150px;
  }

  .turn-banner {
    text-align: center;
    color: var(--wood-area-text);
    text-shadow: 0 1px 3px var(--wood-area-text-shadow);
    font-size: 1.2rem;
    font-weight: bold;
    min-height: 1.6rem;
    margin-bottom: 10px;
  }

  /* ---- The board itself ---- */
  .board-wrap {
    display: flex;
    justify-content: center;
    padding-bottom: 30px;
    overflow-x: auto;
  }

  .board {
    display: grid;
    grid-template-columns: 100px repeat(6, 90px) 100px;
    grid-template-rows: 110px 110px;
    gap: 14px;
    padding: 26px;
    background: linear-gradient(155deg, var(--board-wood-light), var(--board-wood) 55%, var(--board-wood-dark));
    border: 6px solid var(--board-wood-dark);
    border-radius: 34px;
    box-shadow: 0 10px 26px rgba(0,0,0,0.55), inset 0 0 24px rgba(0,0,0,0.25);
  }

  .pit, .mancala {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    border: none;
    font-family: inherit;
    cursor: default;
  }

  /* Pits are a true circle, sized to a fixed diameter (rather than
     stretching to fill their grid cell) and centered in that cell - 81px is
     90px (the old cell width) reduced 10%, per Perry's "round and 10%
     smaller in diameter" request. */
  .pit {
    width: 81px;
    height: 81px;
    justify-self: center;
    align-self: center;
    border-radius: 50%;
    background: radial-gradient(circle at 42% 38%, var(--pit-mid), var(--pit-dark) 70%);
    box-shadow: inset 0 4px 10px rgba(0,0,0,0.7), inset 0 -2px 5px rgba(255,255,255,0.06);
  }

  .pit.clickable {
    cursor: pointer;
  }

  /* The gold ring is a separate class from .clickable so it can be limited
     to AI Opponent OFF (two human players) - a Pit stays fully clickable
     (and shows the pointer cursor) with AI Opponent ON, it just doesn't get
     the ring around it. */
  .pit.ring {
    box-shadow: inset 0 4px 10px rgba(0,0,0,0.7), inset 0 -2px 5px rgba(255,255,255,0.06), 0 0 0 3px var(--seed-text);
  }

  .pit.ring:hover {
    box-shadow: inset 0 4px 10px rgba(0,0,0,0.7), inset 0 -2px 5px rgba(255,255,255,0.06), 0 0 0 4px var(--seed-text);
  }

  /* Player 2's own Pit numbers (1-6, right to left) - only shown above the
     top row while AI Opponent is OFF, so a second human player can find
     their own Pits. Sits above the Pit circle itself, in the board's own
     wood padding. */
  .pit-label {
    display: none;
    position: absolute;
    top: -20px;
    left: 50%;
    transform: translateX(-50%);
    color: #000000;
    font-weight: bold;
    font-size: 0.85rem;
    pointer-events: none;
    z-index: 3;
  }

  .pit-label.show {
    display: block;
  }

  /* Mancalas keep their original footprint (full width/height of their
     spanned cell) - only the corner rounding changes below, from a smooth
     ellipse to a "stadium" capsule (flat sides, semicircle caps) to match
     Perry's reference photo. The radius is fixed at half of the Mancala's
     own width, which is what turns the two short ends into true semicircles
     instead of curving the long sides too. */
  .mancala {
    width: 100%;
    height: 100%;
    border-radius: 50px;
    background: radial-gradient(circle at 42% 32%, var(--mancala-mid), var(--mancala-dark) 72%);
    box-shadow: inset 0 5px 14px rgba(0,0,0,0.7), inset 0 -3px 6px rgba(255,255,255,0.06);
  }

  /* ---- Colored seeds (glass-marble look, sampled from Perry's reference
     photo: charcoal/black, pearl, and burgundy-red) ---- */
  .seeds {
    position: absolute;
    inset: 0;
    display: flex;
    flex-wrap: wrap;
    align-content: center;
    justify-content: center;
    align-items: center;
    gap: 2px;
    padding: 10px;
    overflow: hidden;
    pointer-events: none;
  }

  .seed {
    width: 12px;
    height: 12px;
    border-radius: 50%;
    flex: 0 0 auto;
    box-shadow: 0 1px 2px rgba(0,0,0,0.55);
  }

  .seed-0 {
    background: radial-gradient(circle at 35% 30%, #6f6f6f, #232222 62%, #060606 100%);
  }

  .seed-1 {
    background: radial-gradient(circle at 35% 30%, #ffffff, #ecdbd3 55%, #c9a99c 100%);
  }

  .seed-2 {
    background: radial-gradient(circle at 35% 30%, #ea9490, #b5342f 58%, #6e1815 100%);
  }

  @keyframes seedDrop {
    from { transform: scale(0.15); opacity: 0.25; }
    to   { transform: scale(1); opacity: 1; }
  }

  .seed-new {
    animation: seedDrop 200ms ease-out;
  }

  @keyframes seedCapture {
    to { transform: scale(0.25); opacity: 0; }
  }

  .seeds.capturing {
    animation: seedCapture 560ms ease-in forwards;
  }

  @keyframes cellBump {
    0%   { transform: scale(1); }
    45%  { transform: scale(1.12); }
    100% { transform: scale(1); }
  }

  .pit.bump, .mancala.bump {
    animation: cellBump 200ms ease-out;
  }

  /* The quantity number always stays on top of the seed dots, centered, on
     its own small dark backdrop so it stays legible over busy seed colors. */
  .count {
    position: relative;
    z-index: 2;
    color: var(--seed-text);
    font-weight: bold;
    font-size: 1.375rem;
    pointer-events: none;
    background: rgba(10,5,2,0.6);
    border-radius: 8px;
    padding: 0 5px;
    line-height: 1.35;
  }

  .mancala .count {
    font-size: 1.575rem;
  }

  @media (max-width: 760px) {
    .board {
      grid-template-columns: 60px repeat(6, 52px) 60px;
      grid-template-rows: 64px 64px;
      gap: 8px;
      padding: 14px;
    }
    .pit { width: 47px; height: 47px; }
    .mancala { border-radius: 30px; }
    .seed { width: 8px; height: 8px; }
    .count { font-size: 1.05rem; }
    .mancala .count { font-size: 1.2rem; }
    .pit-label { top: -15px; font-size: 0.7rem; }
    header h1 { font-size: 1.9rem; }
  }

  /* Phone-width screens: the 760px-breakpoint board is still wider than a
     typical phone screen, so shrink the pits/Mancalas further here so the
     whole board fits without needing to scroll sideways. */
  @media (max-width: 480px) {
    .board {
      grid-template-columns: 42px repeat(6, 36px) 42px;
      grid-template-rows: 46px 46px;
      gap: 5px;
      padding: 10px;
      border-width: 4px;
      border-radius: 22px;
    }
    .pit { width: 32px; height: 32px; }
    .mancala { border-radius: 21px; }
    .seed { width: 6px; height: 6px; }
    .seeds { padding: 5px; gap: 1px; }
    .count { font-size: 0.8rem; }
    .mancala .count { font-size: 0.9rem; }
    .pit-label { top: -11px; font-size: 0.55rem; }
    header h1 { font-size: 1.6rem; }
    .action-btn { padding: 8px 12px; font-size: 0.85rem; }
    .name-input { width: 110px; font-size: 0.85rem; }
  }

  /* Themed confirmation / scores modal (matches the rest of the Game Hub's
     universalModal pattern, retinted to this page's wood theme). */
  #universalModal {
    display: none;
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: var(--modal-overlay-bg);
    z-index: 99998;
  }

  #universalModal .modal-box {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    background: var(--modal-box-bg);
    color: var(--modal-text);
    padding: 24px;
    border-radius: 10px;
    max-width: 380px;
    width: 90%;
    text-align: center;
    box-shadow: 0 8px 30px var(--modal-shadow);
    border: 2px solid var(--modal-box-border);
  }

  #universalModal .modal-box.wide {
    max-width: 500px;
  }

  #universalModalTitle {
    margin: 0 0 8px;
    color: var(--modal-text);
    font-size: 1.4rem;
    display: none;
  }

  #universalModalSubtitle {
    margin: -4px 0 10px;
    color: var(--modal-text);
    font-size: 0.95rem;
    font-weight: normal;
  }

  #universalModalText {
    margin: 0 0 18px;
    color: var(--modal-text);
    white-space: pre-line;
  }

  #universalModalText.scores-list {
    font-family: 'Courier New', monospace;
    font-size: 0.8rem;
    text-align: left;
    white-space: pre;
    display: inline-block;
  }

  #universalModalButtons {
    display: flex;
    gap: 8px;
    justify-content: center;
    flex-wrap: wrap;
  }

  #universalModalButtons button {
    padding: 8px 16px;
    border-radius: 6px;
    border: none;
    cursor: pointer;
    font-weight: 700;
    font-size: 0.9rem;
    font-family: inherit;
  }

  #universalModalButtons button.primary {
    background: var(--btn-teal);
    color: var(--btn-text);
  }

  #universalModalButtons button.secondary {
    background: #d8c6ac;
    color: var(--modal-text);
  }

  #universalModalButtons button:hover {
    filter: brightness(1.08);
  }
</style>
</head>
<body>

<div id="universalModal" role="dialog" aria-modal="true">
  <div class="modal-box">
    <h3 id="universalModalTitle"></h3>
    <p id="universalModalSubtitle" style="display:none;"></p>
    <p id="universalModalText"></p>
    <div id="universalModalButtons"></div>
  </div>
</div>

<div class="page">
  <header>
    <h1>Mancala</h1>
    <span class="revBadge" id="revBadge"></span>
  </header>

  <div class="control-bar">
    <button class="action-btn" id="resetBtn">New Game</button>
    <button class="action-btn" id="scoresBtn">Recorded Scores</button>
    <button class="action-btn" id="instructionsBtn">Instructions</button>
    <button class="action-btn" id="aiBtn" data-label="AI Opponent">AI Opponent: ON</button>
    <button class="action-btn" id="exitBtn">Exit</button>
    <input type="text" class="name-input" id="p1NameInput" placeholder="Your Name" maxlength="16">
    <input type="text" class="name-input" id="p2NameInput" placeholder="Player 2" maxlength="16" style="display:none;">
  </div>

  <div class="turn-banner" id="turnBanner"></div>

  <div class="board-wrap">
    <div class="board" id="board"></div>
  </div>
</div>

<script>
(function(){
  'use strict';

  // ---------------- board indexing ----------------
  // 14 cells: 0-5 = Player 1's pits (left to right), 6 = Player 1's Mancala,
  // 7-12 = Player 2's pits (continuing the counterclockwise sowing order),
  // 13 = Player 2's Mancala. Sowing always moves index -> index+1 (mod 14),
  // skipping the sower's OWN opponent's Mancala.
  const STORE_OF = { p1: 6, p2: 13 };
  const OPP_STORE_OF = { p1: 13, p2: 6 };
  const ROW_OF = { p1: [0,1,2,3,4,5], p2: [7,8,9,10,11,12] };

  // Where each of the 14 cells sits in the visual grid (columns 2-7 are the
  // shared pit columns; column 1 / column 8 are the two Mancalas, each
  // spanning both rows so they render as a tall, vertically-elongated oval).
  const CELL_POS = {
    13: { c: 1, r: '1 / 3' },
    12: { c: 2, r: 1 }, 11: { c: 3, r: 1 }, 10: { c: 4, r: 1 }, 9: { c: 5, r: 1 }, 8: { c: 6, r: 1 }, 7: { c: 7, r: 1 },
    6:  { c: 8, r: '1 / 3' },
    0:  { c: 2, r: 2 }, 1:  { c: 3, r: 2 }, 2:  { c: 4, r: 2 }, 3:  { c: 5, r: 2 }, 4:  { c: 6, r: 2 }, 5:  { c: 7, r: 2 }
  };

  // Player 2's own Pit numbers 1-6, read right to left on screen (Pit 1 sits
  // nearest Player 1's Mancala, Pit 6 nearest Player 2's own Mancala) - shown
  // above the top row only when AI Opponent is OFF, so a second human player
  // can identify their own Pits.
  const PIT_LABEL_OF = { 7: 1, 8: 2, 9: 3, 10: 4, 11: 5, 12: 6 };

  function opposite(i){ return 12 - i; }
  function other(player){ return player === 'p1' ? 'p2' : 'p1'; }
  function rowEmpty(board, player){ return ROW_OF[player].every(i => board[i] === 0); }

  function newBoard(){
    const b = new Array(14).fill(0);
    ROW_OF.p1.forEach(i => b[i] = 4);
    ROW_OF.p2.forEach(i => b[i] = 4);
    b[STORE_OF.p1] = 0;
    b[STORE_OF.p2] = 0;
    return b;
  }

  // Sows the seeds from startIdx one at a time, skipping the sowing player's
  // OWN opponent's Mancala, and returns the index the last seed landed in.
  function sow(board, startIdx, player){
    let seeds = board[startIdx];
    board[startIdx] = 0;
    let idx = startIdx;
    const skip = OPP_STORE_OF[player];
    while(seeds > 0){
      idx = (idx + 1) % 14;
      if(idx === skip) continue;
      board[idx]++;
      seeds--;
    }
    return idx;
  }

  // Given the index the last sown seed landed in, decides whether that earns
  // an extra turn or triggers a capture, applying the capture directly to
  // the board it's given. Pulled out on its own so the instant (scratch
  // board, AI-evaluation) path and the animated (real board, on-screen)
  // path apply the exact same rule in exactly the same way.
  function resolveLanding(board, last, player){
    let extraTurn = false;
    let captured = 0;
    if(last === STORE_OF[player]){
      extraTurn = true;
    } else if(ROW_OF[player].includes(last) && board[last] === 1){
      const oppIdx = opposite(last);
      if(board[oppIdx] > 0){
        captured = board[oppIdx] + 1;
        board[STORE_OF[player]] += captured;
        board[last] = 0;
        board[oppIdx] = 0;
      }
    }
    return { last, extraTurn, captured };
  }

  // Applies one full move (sow + capture check) and reports what happened,
  // so the caller can decide whether to grant an extra turn. Used for AI
  // move evaluation (on scratch boards) and by the test suite; real
  // on-screen moves go through the animated equivalent, animateMove(),
  // below, which shares the same sowing order and resolveLanding() rule.
  function applyMove(board, startIdx, player){
    const last = sow(board, startIdx, player);
    return resolveLanding(board, last, player);
  }

  // Pure helper: works out the exact sequence of cell indices a sow from
  // startIdx with the given seed count will visit, in order, skipping the
  // sower's opponent's Mancala - identical rule to sow() above, but without
  // touching the board, so animateMove() can replay it one step at a time
  // for the on-screen sowing animation.
  function computeSowSequence(startIdx, seedCount, skipIdx){
    const seq = [];
    let idx = startIdx;
    let remaining = seedCount;
    while(remaining > 0){
      idx = (idx + 1) % 14;
      if(idx === skipIdx) continue;
      seq.push(idx);
      remaining--;
    }
    return seq;
  }

  // ---------------- game state ----------------
  let board = newBoard();
  let current = 'p1';
  let aiOn = true;
  let busy = false;
  let gameOver = false;

  const RESUME_KEY = 'mancalaResumeState_v1';
  const NAMES_KEY = 'mancalaPlayerNames_v1';

  function names(){
    return {
      p1: document.getElementById('p1NameInput').value.trim() || 'Player 1',
      p2: aiOn ? 'AI' : (document.getElementById('p2NameInput').value.trim() || 'Player 2')
    };
  }

  function saveNames(){
    try {
      localStorage.setItem(NAMES_KEY, JSON.stringify({
        p1: document.getElementById('p1NameInput').value,
        p2: document.getElementById('p2NameInput').value
      }));
    } catch (err) { console.error('saveNames error', err); }
  }

  function restoreNames(){
    try {
      const raw = localStorage.getItem(NAMES_KEY);
      if(raw){
        const parsed = JSON.parse(raw);
        if(parsed.p1) document.getElementById('p1NameInput').value = parsed.p1;
        if(parsed.p2) document.getElementById('p2NameInput').value = parsed.p2;
      }
    } catch (err) { console.error('restoreNames error', err); }
  }

  document.getElementById('p1NameInput').addEventListener('change', saveNames);
  document.getElementById('p2NameInput').addEventListener('change', saveNames);

  // Keeps the turn banner in sync with the name fields as you type, instead
  // of only picking up the new name the next time a turn starts.
  document.getElementById('p1NameInput').addEventListener('input', updateTurnBanner);
  document.getElementById('p2NameInput').addEventListener('input', updateTurnBanner);

  // ---------------- sound (procedural - no audio files, same technique the
  // other Game Hub titles use for their disc/dice sounds) ----------------
  let audioCtx = null;
  function getAudioCtx(){
    try {
      if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if(audioCtx.state === 'suspended') audioCtx.resume();
      return audioCtx;
    } catch (err) {
      console.error('getAudioCtx error', err);
      return null;
    }
  }

  // A short, high, wooden "tick" - one seed dropping into a Pit.
  function playSeedSound(){
    try {
      const ctx = getAudioCtx();
      if(!ctx) return;
      const now = ctx.currentTime;
      const bufferSize = Math.floor(ctx.sampleRate * 0.03);
      const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
      const data = buffer.getChannelData(0);
      for(let i = 0; i < bufferSize; i++){
        data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / bufferSize, 2);
      }
      const noise = ctx.createBufferSource();
      noise.buffer = buffer;
      const bandpass = ctx.createBiquadFilter();
      bandpass.type = 'bandpass';
      bandpass.frequency.value = 1400 + Math.random() * 800;
      bandpass.Q.value = 1.4;
      const gain = ctx.createGain();
      const peak = 0.14 + Math.random() * 0.05;
      gain.gain.setValueAtTime(peak, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.04);
      noise.connect(bandpass);
      bandpass.connect(gain);
      gain.connect(ctx.destination);
      noise.start(now);
      noise.stop(now + 0.05);
    } catch (err) { console.error('playSeedSound error', err); }
  }

  // A fuller, lower "sweep" - seeds being captured into a Mancala.
  function playCaptureSound(){
    try {
      const ctx = getAudioCtx();
      if(!ctx) return;
      const now = ctx.currentTime;
      const bufferSize = Math.floor(ctx.sampleRate * 0.14);
      const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
      const data = buffer.getChannelData(0);
      for(let i = 0; i < bufferSize; i++){
        data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / bufferSize, 1.5);
      }
      const noise = ctx.createBufferSource();
      noise.buffer = buffer;
      const bandpass = ctx.createBiquadFilter();
      bandpass.type = 'bandpass';
      bandpass.frequency.setValueAtTime(900, now);
      bandpass.frequency.exponentialRampToValueAtTime(400, now + 0.13);
      bandpass.Q.value = 1.1;
      const gain = ctx.createGain();
      gain.gain.setValueAtTime(0.22, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.14);
      noise.connect(bandpass);
      bandpass.connect(gain);
      gain.connect(ctx.destination);
      noise.start(now);
      noise.stop(now + 0.15);
    } catch (err) { console.error('playCaptureSound error', err); }
  }

  function delay(ms){ return new Promise(resolve => setTimeout(resolve, ms)); }

  // ---------------- rendering ----------------
  // Deterministic (not truly random) so a given Pit's dots don't visibly
  // re-shuffle color on every render - purely decorative, since seeds are
  // otherwise identical/fungible for scoring purposes.
  function seedColorClass(cellIndex, seedNumber){
    return 'seed-' + ((cellIndex * 13 + seedNumber * 7) % 3);
  }

  function buildBoardDOM(){
    const boardEl = document.getElementById('board');
    boardEl.innerHTML = '';
    for(let i = 0; i < 14; i++){
      const pos = CELL_POS[i];
      const isStore = (i === STORE_OF.p1 || i === STORE_OF.p2);
      const cell = document.createElement('div');
      cell.className = isStore ? 'mancala' : 'pit';
      cell.id = 'cell' + i;
      cell.style.gridColumn = String(pos.c);
      cell.style.gridRow = String(pos.r);
      const seedsEl = document.createElement('div');
      seedsEl.className = 'seeds';
      seedsEl.id = 'seeds' + i;
      cell.appendChild(seedsEl);
      const countEl = document.createElement('span');
      countEl.className = 'count';
      countEl.id = 'count' + i;
      cell.appendChild(countEl);
      if(PIT_LABEL_OF[i]){
        const labelEl = document.createElement('span');
        labelEl.className = 'pit-label';
        labelEl.id = 'label' + i;
        labelEl.textContent = PIT_LABEL_OF[i];
        cell.appendChild(labelEl);
      }
      if(!isStore){
        cell.addEventListener('click', () => onPitClick(i));
      }
      boardEl.appendChild(cell);
    }
    renderBoard();
    updatePitLabels();
  }

  // Shows/hides Player 2's Pit-number labels: only relevant (and only
  // shown) when AI Opponent is OFF, i.e. a second human is actually using
  // those Pits.
  function updatePitLabels(){
    Object.keys(PIT_LABEL_OF).forEach(i => {
      const el = document.getElementById('label' + i);
      if(el) el.classList.toggle('show', !aiOn);
    });
  }

  // Redraws one cell's seed-count number and its cluster of colored seed
  // dots. The dot count is capped (dots are decoration; the number above
  // them is always the exact count) so a Pit or Mancala holding a lot of
  // seeds doesn't try to cram dozens of circles into a small space.
  function renderCell(i){
    const isStore = (i === STORE_OF.p1 || i === STORE_OF.p2);
    const n = board[i];
    document.getElementById('count' + i).textContent = n;
    const seedsEl = document.getElementById('seeds' + i);
    const maxDots = isStore ? 24 : 11;
    const shown = Math.min(n, maxDots);
    seedsEl.innerHTML = '';
    for(let k = 0; k < shown; k++){
      const dot = document.createElement('span');
      dot.className = 'seed ' + seedColorClass(i, k);
      seedsEl.appendChild(dot);
    }
  }

  function renderBoard(){
    for(let i = 0; i < 14; i++){
      renderCell(i);
    }
    updateClickable();
  }

  function updateClickable(){
    for(let i = 0; i < 14; i++){
      if(i === STORE_OF.p1 || i === STORE_OF.p2) continue;
      const cell = document.getElementById('cell' + i);
      const isHumanTurn = !busy && !gameOver && !(current === 'p2' && aiOn);
      const canClick = isHumanTurn && ROW_OF[current].includes(i) && board[i] > 0;
      cell.classList.toggle('clickable', canClick);
      // The gold ring itself only shows with AI Opponent OFF - a Pit stays
      // just as clickable with AI Opponent ON, it simply isn't ringed.
      cell.classList.toggle('ring', canClick && !aiOn);
    }
  }

  function updateTurnBanner(){
    if(gameOver){ return; }
    const n = names();
    const label = current === 'p1' ? n.p1 : n.p2;
    document.getElementById('turnBanner').textContent = label + "'s Turn";
  }

  // ---------------- turn flow ----------------
  function startTurn(){
    if(rowEmpty(board, current)){
      endGame();
      return;
    }
    updateTurnBanner();
    updateClickable();
    if(current === 'p2' && aiOn){
      busy = true;
      updateClickable();
      setTimeout(aiPlay, 700);
    }
  }

  function onPitClick(idx){
    if(busy || gameOver) return;
    if(current === 'p2' && aiOn) return;
    if(!ROW_OF[current].includes(idx) || board[idx] <= 0) return;
    playPit(idx);
  }

  const SOW_STEP_MS = 280;
  const CAPTURE_FADE_MS = 560;

  // Plays out one move on the real board and on screen: empties the chosen
  // Pit, then places its seeds one at a time (each placement bumps that
  // cell, plays a soft "tick", and pauses briefly) before checking for a
  // capture or an extra turn via the same resolveLanding() rule applyMove()
  // uses. Returns the same {last, extraTurn, captured} shape applyMove()
  // does, once the animation has finished.
  async function animateMove(startIdx, player){
    const seedCount = board[startIdx];
    const skip = OPP_STORE_OF[player];
    const seq = computeSowSequence(startIdx, seedCount, skip);

    board[startIdx] = 0;
    renderCell(startIdx);

    for(const idx of seq){
      board[idx]++;
      renderCell(idx);
      const cellEl = document.getElementById('cell' + idx);
      cellEl.classList.remove('bump');
      void cellEl.offsetWidth; // restart the bump animation even if it's still running
      cellEl.classList.add('bump');
      const newestDot = document.getElementById('seeds' + idx).lastElementChild;
      if(newestDot) newestDot.classList.add('seed-new');
      playSeedSound();
      await delay(SOW_STEP_MS);
    }

    const last = seq[seq.length - 1];
    const result = resolveLanding(board, last, player);

    if(result.captured > 0){
      const oppIdx = opposite(last);
      const landSeeds = document.getElementById('seeds' + last);
      const oppSeeds = document.getElementById('seeds' + oppIdx);
      landSeeds.classList.add('capturing');
      oppSeeds.classList.add('capturing');
      playCaptureSound();
      await delay(CAPTURE_FADE_MS);
      landSeeds.classList.remove('capturing');
      oppSeeds.classList.remove('capturing');
      renderCell(last);
      renderCell(oppIdx);
      renderCell(STORE_OF[player]);
    }

    return result;
  }

  async function playPit(idx){
    busy = true;
    updateClickable();
    const player = current;
    const result = await animateMove(idx, player);
    if(!result.extraTurn){
      current = other(player);
    }
    busy = false;
    startTurn();
  }

  // ---------------- simple AI (Player 2, when AI Opponent is ON) ----------------
  // Greedy: tries every legal pit, simulates the sow + capture on a scratch
  // copy of the board, and scores it by how many seeds it nets into its own
  // Mancala this move plus a bonus for earning an extra turn. Not a deep
  // lookahead, but it reliably takes free captures and chains extra turns.
  function chooseAiMove(){
    let best = null, bestScore = -Infinity;
    for(const idx of ROW_OF.p2){
      if(board[idx] <= 0) continue;
      const scratch = board.slice();
      const before = scratch[STORE_OF.p2];
      const result = applyMove(scratch, idx, 'p2');
      const gained = scratch[STORE_OF.p2] - before;
      let score = gained + (result.extraTurn ? 3 : 0) + Math.random() * 0.01;
      if(score > bestScore){ bestScore = score; best = idx; }
    }
    return best;
  }

  async function aiPlay(){
    const idx = chooseAiMove();
    if(idx === null){ busy = false; startTurn(); return; }
    await playPit(idx);
  }

  // ---------------- end game ----------------
  function endGame(){
    gameOver = true;
    busy = true;
    updateClickable();
    // The player whose row is empty (current) does not move; the OTHER
    // player sweeps whatever is left in their own row into their own Mancala.
    const sweeper = other(current);
    ROW_OF[sweeper].forEach(i => { board[STORE_OF[sweeper]] += board[i]; board[i] = 0; });
    renderBoard();

    const n = names();
    const p1Total = board[STORE_OF.p1];
    const p2Total = board[STORE_OF.p2];
    document.getElementById('turnBanner').textContent = 'Game Over';

    let message, title;
    if(p1Total === p2Total){
      title = "It's a Tie!";
      message = `Both players finished with ${p1Total} Seeds.`;
    } else {
      const winnerIsP1 = p1Total > p2Total;
      const winnerName = winnerIsP1 ? n.p1 : n.p2;
      const loserName = winnerIsP1 ? n.p2 : n.p1;
      const winnerTotal = winnerIsP1 ? p1Total : p2Total;
      const loserTotal = winnerIsP1 ? p2Total : p1Total;
      const margin = winnerTotal - loserTotal;
      title = winnerName + ' Wins!';
      message = `${winnerName} finished with ${winnerTotal} Seeds to ${loserName}'s ${loserTotal}.`;
      recordScore(winnerName, margin, loserName);
    }
    try { sessionStorage.removeItem(RESUME_KEY); } catch (err) {}
    showModal({ title, message, buttons: [
      { label: 'New Game', value: true, primary: true }
    ]}).then(() => startGame());
  }

  // ---------------- new game / exit / instructions ----------------
  document.getElementById('resetBtn').addEventListener('click', async () => {
    const ok = await showConfirm('Start a new game? Your current game will be lost.', 'New Game');
    if(ok) startGame();
  });

  document.getElementById('exitBtn').addEventListener('click', async () => {
    const ok = await showConfirm('Are you sure you want to exit?', 'Exit Game');
    if(ok) performExit();
  });

  function performExit(){
    try { sessionStorage.removeItem(RESUME_KEY); } catch (err) {}
    window.location.href = '../index.html';
  }

  document.getElementById('instructionsBtn').addEventListener('click', () => {
    saveResumeState();
    window.location.href = '../ManInstructions.html';
  });

  // ---------------- AI Opponent toggle ----------------
  document.getElementById('aiBtn').addEventListener('click', () => {
    const btn = document.getElementById('aiBtn');
    aiOn = !aiOn;
    btn.textContent = btn.dataset.label + (aiOn ? ': ON' : ': OFF');
    document.getElementById('p2NameInput').style.display = aiOn ? 'none' : '';
    try { sessionStorage.setItem('mancalaSettings_v1', JSON.stringify({ aiOn })); } catch (err) {}
    startGame();
  });

  // ---------------- resume across Instructions navigation ----------------
  function saveResumeState(){
    try {
      sessionStorage.setItem(RESUME_KEY, JSON.stringify({ board, current, aiOn, gameOver }));
    } catch (err) { console.error('saveResumeState error', err); }
  }

  function tryRestoreResumeState(){
    try {
      const raw = sessionStorage.getItem(RESUME_KEY);
      if(!raw) return false;
      const parsed = JSON.parse(raw);
      if(!Array.isArray(parsed.board) || parsed.board.length !== 14) return false;
      board = parsed.board;
      current = parsed.current === 'p2' ? 'p2' : 'p1';
      gameOver = !!parsed.gameOver;
      buildBoardDOM();
      if(!gameOver) startTurn(); else renderBoard();
      return true;
    } catch (err) {
      console.error('tryRestoreResumeState error', err);
      return false;
    }
  }

  // ---------------- start / restart ----------------
  function startGame(){
    try { sessionStorage.removeItem(RESUME_KEY); } catch (err) {}
    board = newBoard();
    gameOver = false;
    busy = false;
    current = Math.random() < 0.5 ? 'p1' : 'p2';
    buildBoardDOM();
    document.getElementById('universalModal').style.display = 'none';
    startTurn();
  }

  // ---------------- themed modal (New Game / Exit confirm, Recorded Scores) ----------------
  function showModal({ title, message, buttons } = {}){
    return new Promise((resolve) => {
      const modal = document.getElementById('universalModal');
      const titleEl = document.getElementById('universalModalTitle');
      const textEl = document.getElementById('universalModalText');
      const buttonsEl = document.getElementById('universalModalButtons');
      const subtitleEl = document.getElementById('universalModalSubtitle');

      if(title){ titleEl.textContent = title; titleEl.style.display = 'block'; }
      else { titleEl.style.display = 'none'; }
      subtitleEl.textContent = '';
      subtitleEl.style.display = 'none';
      textEl.textContent = message || '';
      textEl.classList.remove('scores-list');
      buttonsEl.innerHTML = '';
      (buttons || [{ label: 'OK', value: undefined, primary: true }]).forEach((def) => {
        const btn = document.createElement('button');
        btn.textContent = def.label;
        btn.className = def.primary ? 'primary' : 'secondary';
        btn.onclick = () => {
          modal.style.display = 'none';
          resolve(def.value);
        };
        buttonsEl.appendChild(btn);
      });
      modal.style.display = 'block';
      modal.querySelector('.modal-box').classList.remove('wide');
    });
  }

  function showConfirm(text, title){
    return showModal({ title, message: text, buttons: [
      { label: 'Yes', value: true, primary: true },
      { label: 'Cancel', value: false, primary: false }
    ]});
  }

  // ---------------- ranked score history (shared, via Firebase) ----------------
  const MAX_RECORDED_SCORES = 15;
  let sharedScores = null;
  window.onSharedScoresUpdate = function(list){
    sharedScores = list;
    const modal = document.getElementById('universalModal');
    // Refreshes the Recorded Scores modal in place if it's the one currently
    // open - checked by its title rather than by whether it already had rows
    // to show, since "still Loading" and "no scores yet" both leave the
    // scores-list CSS class off, which used to make Recorded Scores stay
    // stuck on "Loading scores..." forever if you opened it before the very
    // first Firebase read finished (even though the read succeeded soon
    // after - it just never told the already-open modal to redraw itself).
    if(modal.style.display === 'block' && document.getElementById('universalModalTitle').textContent === 'Recorded Scores'){
      showScoresModal();
    }
  };

  function recordScore(winnerName, margin, opponentName){
    try {
      const entry = { name: winnerName, margin, opponent: opponentName, date: new Date().toLocaleDateString() };
      if(window.pushSharedScore) window.pushSharedScore(entry);
    } catch (err) { console.error('recordScore error', err); }
  }

  function formatScoreLine(entry, rank){
    const pad = (str, len) => {
      str = String(str);
      const extra = Math.max(0, len - str.length);
      return str + ' '.repeat(extra);
    };
    const rankStr = String(rank).padStart(2, ' ') + '.';
    const nameStr = pad(entry.name, 9);
    const marginStr = String(entry.margin).padStart(2, ' ');
    const ptsStr = pad(`${marginStr} Seeds`, 10);
    const vsStr = pad('vs ' + (entry.opponent || 'Unknown'), 12);
    const dateStr = String(entry.date).padStart(10, ' ');
    return `${rankStr} ${nameStr} ${ptsStr} ${vsStr} ${dateStr}`;
  }

  function showScoresModal(){
    let message;
    if(sharedScores === null){
      message = 'Loading scores… (or unable to reach the shared scoreboard right now)';
    } else {
      const list = [...sharedScores].sort((a, b) => b.margin - a.margin).slice(0, MAX_RECORDED_SCORES);
      message = list.length === 0
        ? 'No scores recorded yet. Play a game to add one!'
        : list.map((entry, i) => formatScoreLine(entry, i + 1)).join('\n');
    }
    const hasRows = sharedScores !== null && sharedScores.length > 0;
    showModal({ title: 'Recorded Scores', message, buttons: [
      { label: 'OK', value: true, primary: true }
    ]});
    const subtitleEl = document.getElementById('universalModalSubtitle');
    subtitleEl.textContent = 'The number of Seeds the winner was ahead.';
    subtitleEl.style.display = '';
    document.getElementById('universalModalText').classList.toggle('scores-list', hasRows);
    document.querySelector('#universalModal .modal-box').classList.toggle('wide', hasRows);
  }

  document.getElementById('scoresBtn').addEventListener('click', showScoresModal);

  // ---------------- boot ----------------
  restoreNames();
  (function restoreSettings(){
    try {
      const raw = sessionStorage.getItem('mancalaSettings_v1');
      if(raw){
        const parsed = JSON.parse(raw);
        if(typeof parsed.aiOn === 'boolean') aiOn = parsed.aiOn;
      }
    } catch (err) { console.error('restoreSettings error', err); }
    const btn = document.getElementById('aiBtn');
    btn.textContent = btn.dataset.label + (aiOn ? ': ON' : ': OFF');
    document.getElementById('p2NameInput').style.display = aiOn ? 'none' : '';
  })();

  if(!tryRestoreResumeState()){
    startGame();
  }

  const PAGE_REVISION = 7;
  document.getElementById('revBadge').textContent = 'Rev. ' + PAGE_REVISION;
})();
</script>

<!-- -------------------------------------------------------------------------
     Shared (cross-device) recorded scores via Firebase Realtime Database.
     Same Firebase project the other games already use (perrys-stuff) - just
     a separate database path (mancalaScores) so this game's scores stay
     independent of the others. -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
  import {
    getDatabase, ref, push, onValue
  } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyAJLWtpWR8VYmRYLa3kBD9lh2JO_-hFAEc",
    authDomain: "perrys-stuff.firebaseapp.com",
    databaseURL: "https://perrys-stuff-default-rtdb.firebaseio.com",
    projectId: "perrys-stuff",
    storageBucket: "perrys-stuff.firebasestorage.app",
    messagingSenderId: "604958963124",
    appId: "1:604958963124:web:d02aca2cdb29915b306ee1"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);
  const scoresRef = ref(db, 'mancalaScores');

  window.pushSharedScore = function(entry){
    return push(scoresRef, entry).catch(err => console.error('pushSharedScore error', err));
  };

  onValue(scoresRef, (snapshot) => {
    const val = snapshot.val() || {};
    const list = Object.keys(val).map(key => ({ id: key, ...val[key] }));
    if (window.onSharedScoresUpdate) window.onSharedScoresUpdate(list);
  }, (err) => console.error('onValue(scoresRef) error', err));
</script>
