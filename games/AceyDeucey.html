

<!-- Revision 50 | Tuesday, September 1, 2026 -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Acey-Deucey</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;900&family=Space+Mono:wght@400;700&display=swap');

  /* ===== ALL COLORS LIVE HERE - change a theme by editing this block only ===== */
  :root{
    /* Page background & wood/felt palette */
    --baize:#00b32d;
    --baize-dark:#0b2f26;
    --wood:#3b2415;
    --wood-dark:#241608;
    --cream:#eee1c6;
    --cream-dark:#d8c8a0;
    --maroon:#7a2e2e;
    --maroon-dark:#5e2222;
    --gold:#c9a227;
    --gold-bright:#e6c65c;
    --h1-shadow:rgba(0,0,0,0.35);

    /* Score card - player name labels (e.g. "Player 1 (White)") */
    --player-name-color:#000000;

    /* Checkers */
    --white-checker:#f5efe0;
    --white-checker-edge:#8a7b55;
    --black-checker:#2a2018;
    --black-checker-edge:#c9a227;
    --checker-shadow:rgba(0,0,0,0.5);
    --checker-shadow-inset:rgba(0,0,0,0.15);

    /* Panels (setup boxes, score cards) */
    --panel-bg:rgba(0,0,0,0.22);
    --panel-border:rgba(201,162,39,0.35);
    --score-card-bg:rgba(0,0,0,0.28);
    --score-card-border:rgba(201,162,39,0.3);
    --score-card-active-glow:rgba(230,198,92,0.25);

    /* Board */
    --point-selected:#7fd88f;
    --stack-overflow-bg:rgba(0,0,0,0.6);

    /* Dice */
    --die-bg-1:#f9f8f4;
    --die-bg-2:#dedbd2;
    --die-border:rgba(0,0,0,0.18);
    --die-shadow-outer:rgba(0,0,0,0.45);
    --die-shadow-inset-light:rgba(255,255,255,0.95);
    --die-shadow-inset-dark:rgba(0,0,0,0.14);
    --pip-bg-1:#4a4a4a;
    --pip-bg-2:#111;
    --pip-shadow-light:rgba(255,255,255,0.15);
    --pip-shadow-dark:rgba(0,0,0,0.3);

    /* Universal confirmation modal */
    --modal-overlay-bg:rgba(0,0,0,0.65);
    --modal-box-shadow:rgba(0,0,0,0.6);

    /* Game Over / "Play Another Game?" screen: kept as its OWN set of
       variables (separate from --gold-bright, --panel-bg, etc. above) even
       though they start out at the same values, specifically so this screen's
       colors can be tweaked without touching the Setup screen, sidebar
       buttons, or anything else that also happens to use gold/cream/wood. */
    --gameover-panel-bg:rgba(0,0,0,0.2);
    --gameover-panel-border:rgba(201,162,39,0.35);
    --gameover-title-color:#e6c65c;
    --gameover-prompt-color:#241608;
    --gameover-btn-bg:#e6c65c;
    --gameover-btn-text:#241608;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  
  body{
    margin:0;
    height:100vh;
    overflow:hidden;
    background:radial-gradient(
      ellipse at 50% -10%,
      var(--baize),
      var(--baize-dark) 100%);
    font-family:'Space Mono', monospace;
    color:var(--cream);
    display:flex;
    justify-content:center;
    padding:10px 12px;}
  
  .wrap{
    width:100%; 
    max-width:1056px; 
    height:100%; 
    display:flex; 
    flex-direction:column; 
    min-height:0;}
    
  header{
    text-align:center;
    margin-bottom:6px;
    flex:0 0 auto;}
  
  h1{
    font-family:'Playfair Display', serif;
    font-weight:900;
    font-size:clamp(1.3rem,3.5vw,2.2rem);
    margin:0;
    color:var(--gold-bright);
    text-shadow:0 2px 0 var(--h1-shadow);}
    
  .subtitle{
    margin:2px 0 0;
    font-size:0.80rem;
    letter-spacing:0.28em;
    text-transform:uppercase;
    color:var(--gold-bright);
    font-weight: bold;} 
  
   .rule-line{
    width:90px; 
    height:2px; 
    background:var(--gold);
    margin:6px auto 0;
    opacity:0.6;}

  .panel{
    background:var(--panel-bg);
    border:1px solid var(--panel-border);
    border-radius:10px;
    padding:14px 18px;
    margin-bottom:10px;
  }

  /* ---- setup ---- */
  /* #setup itself is just a layout wrapper now 
     (no background/border of its own); its two children 
     each have the .panel class, so they render as two
     separate boxes.  gap:96px because 1 inch = 96px in
     CSS (a fixed conversion, same as the browser uses
     for print/physical units) - using 96px keeps it 
     consistent with the rest of the file's px-based 
     layout sizing rather than relying on the browser to 
     interpret "1in" itself. */
     
  #setup{
    display:flex; 
    flex-direction:column;
    gap:24px; 
    overflow-y:auto; 
    flex:1; min-height:0;}
  
  /* Override .panel's own margin-bottom:10px here 
     so the gap between the two boxes is exactly the
     96px (1 inch) set above, not 96px + 10px */
  
  #setup .panel{margin-bottom:0;}

  .setup-controls{
    width:calc(100% - 384px);
    max-width:calc(100% - 384px);
    margin-left:auto;
    margin-right:auto;}


  /* Rules paragraph is 16px (set inline in the HTML) - this heading is 3px
     bigger (19px) and colored to match the Title (h1), per Perry's request */
  #setup .rules-heading{
    font-family:'Playfair Display', serif;
    font-weight:900;
    font-size:19px;
    color:var(--gold-bright);
    text-align:center;
    margin:0 0 8px;}

  #setup .rules{
    font-size:0.83rem; 
    line-height:1.65; 
    opacity:1.0;}
    
  /* Bold phrases in the rules text no longer get a special color - they stay
     the same cream as the rest of the paragraph, just bold from the <b> tag itself */
  #setup .rules b{color:inherit;}
  
  .mode-choices{
    display:flex; 
    gap:14px; 
    flex-wrap:wrap; 
    justify-content:center; 
    margin-bottom:16px;}
  
  .mode-btn{
    flex:0 1 230px; 
    max-width:230px;
    background:var(--wood-dark); 
    border:2px solid var(--gold); 
    color:var(--cream);
    border-radius:8px; 
    padding:14px 12px; 
    font-family:'Space Mono',monospace; 
    font-size:0.92rem; 
    cursor:pointer;}
    
  .mode-btn:hover{background:var(--wood);}
  
  .mode-btn.selected{
    background:var(--gold-bright); 
    color:var(--wood-dark); 
    font-weight:700;}
    
  .name-inputs{
    display:flex; 
    gap:12px; 
    flex-wrap:wrap; 
    justify-content:center;
    margin-bottom:16px;}
    
  .name-inputs label{
    flex:0 1 230px; 
    max-width:230px;
    text-align:center;
    font-size:0.75rem; 
    text-transform:uppercase; 
    letter-spacing:0.1em; 
    color:var(--gold);}
    
  .name-inputs input{
    width:100%; 
    text-align:center;
    margin-top:6px; 
    padding:8px 10px; 
    background:var(--cream); 
    border:none; 
    border-radius:4px; 
    font-family:'Space Mono',monospace; 
    font-size:0.9rem;}
  
  .go-btn{
    display:block; 
    width:100%; 
    padding:13px; 
    background:var(--gold-bright); 
    color:var(--wood-dark);
    border:none; 
    border-radius:8px; 
    font-family:'Space Mono',monospace; 
    font-weight:700; 
    font-size:2.0rem; cursor:pointer;}
    
  .go-btn:hover{filter:brightness(1.08);}

  /* #startBtn overrides (not the shared .go-btn class) so this only affects the
     Start button, not the Yes/No buttons on the Play Again screen which also use .go-btn.
     Font: 2.0rem (32px) -> 1.875rem (30px), a 2px reduction.
     Size: width/padding roughly halved, then centered with margin:0 auto since a
     block-level element narrower than its container needs that to center itself
     (same trick used for .play-again-row).
     max-width:366px - width:50% alone can't be "1 inch narrower" (percentages
     have no fixed inch value), so this caps it: at the page's widest point
     (.wrap maxes out at 960px), 50% width worked out to ~462px, so 462-96=366px
     is that same button 1 inch (96px) narrower there. On smaller screens the
     50% keeps it fluid/responsive below that cap. */
  #startBtn{
    width:fit-content;
    margin:0 auto;
    padding:9px 28px;
    font-size:1.75rem;}

  /* "Play Another Game?" prompt + Yes/No split 
     buttons on the Game Over screen.  These replace 
     the old single "Play Another Game?" button + separate
     popup: now the question is just a text label, and 
     the same long gold bar is divided into two clickable
     halves (Yes / No) instead of opening a modal. */
     
  .play-again-prompt{
    text-align:center; 
    font-family:'Playfair Display',serif; 
    font-size:1.8rem;
    color:var(--wood-dark);
    font-weight: bold;
    margin:4px 0 10px;}
  
  .play-again-row{
    display:flex; 
    gap:10px;
    max-width:200px;
    margin:0 auto;}
  
  .play-again-row .go-btn{ 
    width:auto;
    flex:1;
    padding:2px 12px;
    font-size:1.3rem;
    background:var(--gameover-btn-bg);
    color:var(--gameover-btn-text);}
  /* ---- game screen ---- */
  #game{display:none;}
  
  #game.show{
    display:flex; 
    flex-direction:column; 
    flex:1; min-height:0;}
    
  .scoreboard{
    display:flex; 
    gap:10px; 
    margin-bottom:6px; 
    flex-wrap:wrap; 
    flex:0 0 auto;}
    
  .score-card{
    flex:1 1 200px; 
    background:var(--score-card-bg); 
    border:2px solid var(--score-card-border); 
    border-radius:8px; 
    padding:6px 14px; 
    text-align:center;}
    
  .score-card.active{
    border-color:var(--gold-bright); 
    box-shadow:0 0 0 1px var(--gold-bright),
    0 0 16px var(--score-card-active-glow);}
    
  .score-card .name{
    font-size:1.0rem;
    font-weight: 900;
    letter-spacing:0.14em; 
    text-transform:uppercase; 
    color:var(--player-name-color); 
    opacity:1;}
    
  .score-card .stat{
    font-family:'Playfair Display',serif; 
    font-size:1.15rem; 
    font-weight:700; 
    margin-top:1px;}

  /* Left box (Perry/White): "PERRY (WHITE)" recolored to match its own "0 Home..." text -
     both lines the lighter cream color. Right box (AI/Black): "0 Home..." recolored to match
     its own "THE AI (BLACK)" text - both lines the darker black. Scoped to each box's own ID
     so only the requested line in each box changes, not both boxes identically. */
  #scoreWhite .name{ color:var(--cream); }
  #scoreBlack .stat{ color:#000000; }

  .turn-banner{
    text-align:center; 
    font-family:'Playfair Display',serif; 
    font-size:0.95rem; 
    font-weight:bold;
    text-transform:capitalize;
    color:var(--gold-bright); 
    margin-bottom:6px; 
    min-height:1.2em; 
    flex:0 0 auto;}

  /* ---- board ---- */
  .board-row{
    display:flex; 
    gap:14px; 
    align-items:stretch; 
    flex:1; 
    min-height:0;}
    
  /* Widened both sidebars to fit the larger 
     dice on one row; there's room to spare on both
     flanks of the board */
     
  /* display:flex column (rather than the old position:absolute inner group +
     absolute bottom box) so the bottom box is pushed down by margin-top:auto
     instead of being pinned at bottom:0 independently of the content above it -
     on a short window the two could otherwise overlap, with the bottom box
     painted on top and hiding whichever button landed underneath it. This way
     the box still sits flush at the bottom when there's room, but simply
     follows on below the buttons (rather than covering them) when there isn't. */
  .side-controls{
    position:relative;
    width:190px;
    flex-shrink:0;
    display:flex;
    flex-direction:column;
    align-items:center;}

  .side-controls-inner{
    width:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:8px;}

  .board-frame{
    background:linear-gradient(160deg, var(--wood), 
      var(--wood-dark));
    border:8px solid var(--wood-dark);
    border-radius:10px;
    padding:10px;
    flex:1;
    min-width:0;
    display:flex;
    position:relative;}
    
  .board-grid{
    display:grid;
    grid-template-columns: repeat(6, 1fr) 0.6fr repeat(6,1fr) 0.7fr;
    grid-template-rows: 1fr 1fr;
    gap:2px;
    flex:1;
    min-height:0;}
    
  .point{
    position:relative;
    background:var(--baize-dark);
    cursor:pointer;
    overflow:visible;}
    
  .point .tri{
    position:absolute; 
    inset:0;}
    
  .point.top .tri{clip-path:polygon(0% 0%, 100% 0%, 50% 100%);}
  
  .point.bottom .tri{clip-path:polygon(0% 100%, 100% 100%, 50% 0%);}
  
  .point.shade-a .tri{background:var(--cream-dark);}
  
  .point.shade-b .tri{background:var(--maroon);}
  
  /* Point numbers, restored along the outer edge of the board (top edge for the top row of
     points, bottom edge for the bottom row) - plain black, no shadow/glow. Hidden entirely
     whenever #boardGrid carries .numbers-hidden, which pointNumbersToggleBtn (below) flips -
     see the script for how that's wired up and persisted. */
  .point .plabel{
    position:absolute;
    left:50%;
    transform:translateX(-50%);
    font-size:clamp(9px, 1.6vw, 13px);
    font-weight:800;
    color:#000000;
    pointer-events:none;
    z-index:2;}

  .point.top .plabel{ top:2px; }
  .point.bottom .plabel{ bottom:2px; }

  #boardGrid.numbers-hidden .plabel{ display:none; }

  .point.legal-dest{
    outline:3px solid var(--gold-bright); 
    outline-offset:-3px; z-index:2;}
  
  .point.selected{
    outline:3px solid var(--point-selected);
    outline-offset:-3px; z-index:2;}

  .checker-stack{
    position:relative; 
    z-index:3; 
    height:100%; 
    display:flex; 
    align-items:center; 
    justify-content:center;
    padding:4px 2px;}
    
  .point.top .checker-stack{flex-direction:column;}
  
  .point.bottom .checker-stack{flex-direction:column-reverse;}
  
  .checker{
    width:26px;
    height:26px;
    border-radius:50%;
    margin:1px 0;
    box-shadow:0 2px 4px var(--checker-shadow),
    inset 0 0 0 2px var(--checker-shadow-inset);
    flex-shrink:0;
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:Arial, Helvetica, sans-serif;
    font-weight:800;
    font-size:12px;
    line-height:1;
    user-select:none;
  }
  .checker.white{
    background:var(--white-checker);
    border:2px solid var(--white-checker-edge);
    color:#000000;}

  .checker.black{
    background:var(--black-checker);
    border:2px solid var(--black-checker-edge);
    color:#ffffff;}

  .stack-overflow{
    font-size:0.65rem;
    color:var(--gold-bright); 
    background:var(--stack-overflow-bg);
    border-radius:8px;
    padding:1px 5px; 
    margin-top:1px;}

  .bar-col{
    grid-column:7;
    grid-row:1 / span 2;
    background:var(--wood-dark);
    display:flex;
    flex-direction:column; 
    justify-content:space-between; 
    align-items:center;
    padding:8px 2px; 
    cursor:pointer; 
    border-left:2px solid var(--gold); 
    border-right:2px solid var(--gold);}
    
  .bar-col.legal-dest{
    outline:3px solid var(--gold-bright); 
    outline-offset:-3px;}
    
  .bar-half{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:2px;}

  /* Holds just the checker stack, separate from .bar-label, so the label can be
     reordered before/after the stack (Black Bar: label on top; White Bar: label
     on bottom) without disturbing renderStack()'s checker markup. */
  .bar-checkers{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:2px;}

  .bar-label{
    font-size:0.6rem;
    color:var(--gold);
    text-transform:uppercase;
    letter-spacing:0.08em;}

  .off-col{
    background:var(--wood-dark);
    display:flex;
    flex-direction:column; 
    align-items:center; 
    justify-content:center;
    gap:6px; 
    cursor:pointer; 
    border-radius:4px; 
    padding:6px 2px;}
    
  .off-col.legal-dest{
    outline:3px solid var(--gold-bright); 
    outline-offset:-3px;}
    
  .off-col .off-label{
    font-size:0.6rem; 
    color:var(--gold); 
    text-transform:uppercase; 
    letter-spacing:0.06em;}
    
  .off-col .off-count{
    font-family:'Playfair Display',serif;
    font-size:1.4rem; 
    color:var(--gold-bright);
    font-weight:700;}

  #offBlack{grid-column:14; grid-row:1;}

  #offWhite{grid-column:14; grid-row:2;}

  /* ---- controls ---- */
  
  /* Dice-row: nowrap so all dice (up to 4 on doubles)
     stay on one line */
  .dice-row-wrap{
    position:relative;
    width:100%;}

  .dice-row{
    display:flex;
    gap:6px;
    min-height:44px;
    align-items:center; 
    justify-content:center;
    flex-wrap:nowrap;}

  /* Positioned absolutely (not in normal flow) so it doesn't push the Roll Dice button or
     anything else around when it appears/disappears - it just overlays .5in below the dice. */
  .cant-move-msg{
    position:absolute;
    top:calc(100% + .125in);
    left:50%;
    transform:translateX(-50%);
    background:var(--wood-dark);
    color:var(--gold-bright);
    border:2px solid var(--gold);
    border-radius:6px;
    padding:6px 14px;
    font-family:'Playfair Display',serif;
    font-weight:700;
    font-size:0.85rem;
    white-space:nowrap;
    opacity:0;
    pointer-events:none;
    transition:opacity 200ms ease;
    z-index:20;}

  .cant-move-msg.show{
    opacity:1;}
  
  /* die visuals duplicated from the Yahtzee app 
     (gradient face, inset/outset shadow, pip grid);
     sized up 50% (26px -> 39px) now that the sidebar has room */
  .die{
    width:39px;
    height:39px;
    border-radius:9px;
    background: linear-gradient(145deg,var(--die-bg-1),var(--die-bg-2));
    display:flex;
    align-items:center;
    justify-content:center;
    flex-shrink:0;
    border: 1px solid var(--die-border);
    box-shadow:
      0 3px 6px var(--die-shadow-outer),
      inset 0 1px 1px var(--die-shadow-inset-light),
      inset 0 -2px 3px var(--die-shadow-inset-dark);}
      
  .die-face{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    grid-template-rows:repeat(3,1fr);
    width:74%;
    height:74%;}
    
  .die .pip-cell{
    display:flex; 
    align-items:center; 
    justify-content:center; }
    
  .die .pip{
    width:6px;
    height:6px;
    border-radius:50%;
    background: 
      radial-gradient(circle at 35% 30%, 
      var(--pip-bg-1), var(--pip-bg-2) 70%);
    box-shadow: 
      inset 0 1px 1px var(--pip-shadow-light), 
      0 1px 1px var(--pip-shadow-dark);}
      
  /* This little rock/scale wiggle plays on repeat 
     ("infinite") on each die while its "tumbling" 
     class is applied (added in JS during rollDice(),
     removed once the roll settles). 0.2s here is roughly
     the same pace as TUMBLE_INTERVAL in the JS, so the 
     wiggle and the face-swapping happen in sync - if 
     you speed up TUMBLE_INTERVAL further, shortening this
     animation-duration to match keeps them feeling 
     connected. */

  .die.tumbling{ 
    animation: dieTumble 0.2s ease-in-out infinite; }
  
  @keyframes dieTumble{
    0%{ transform: rotate(0deg) scale(1); }
    50%{ transform: rotate(-10deg) scale(0.94); }
    100%{ transform: rotate(9deg) scale(1); }}

  .action-btn{
    padding:10px 18px; 
    background:var(--gold-bright);
    color:var(--wood-dark);
    border:none; border-radius:8px;
    font-family:'Playfair Display',serif;
    font-weight:700;
    font-size:0.92rem;
    cursor:pointer;
    width:100%;}
    
  .action-btn:hover{filter:brightness(1.08);}

  /* Roll Dice specifically - same font-family as This Session's Wins, and ~3px larger than
     the other buttons that share .action-btn */
  #rollBtn{
    font-family:Arial, Helvetica, sans-serif;
    font-size:19.72px;}

  /* ~30% smaller than .action-btn (padding and font-size scaled down) - used for the 4
     secondary buttons (New Game/Recorded Scores/Instructions/Exit) but deliberately NOT
     applied to Roll Dice, which keeps its original full size. */
  .action-btn-small{
    padding:7px 13px;
    background:var(--gold-bright);
    color:var(--wood-dark);
    border:none; border-radius:8px;
    font-family:Arial, Helvetica, sans-serif;
    font-weight:700;
    font-size:13.6px;
    cursor:pointer;
    width:100%;}

  .action-btn-small:hover{filter:brightness(1.08);}

  /* Visually separates the Roll Dice/dice group above from the 4 smaller buttons below -
     bigger than the standard 8px flex gap between individual buttons. */
  #secondaryButtons{
    margin-top:44px;
    display:flex;
    flex-direction:column;
    gap:8px;
    width:100%;}

  .session-wins-box{
    margin-top:16px;
    width:100%;
    box-sizing:border-box;
    background:var(--cream-dark);
    border:2px solid #000000;
    border-radius:8px;
    padding:8px 12px;
    font-family:Arial, Helvetica, sans-serif;
    color:#000000;
    text-align:left;}

  /* Pushed to the bottom of the .side-controls flex column (flush with the board's
     bottom edge, same as before) via margin-top:auto rather than position:absolute,
     so if the buttons above ever need more room than the column has, this box is
     simply pushed further down in normal flow instead of overlapping them. */
  .session-wins-box-bottom{
    margin-top:auto;}

  /* Compact game-screen copy of the Setup screen's mode/name/start controls - narrow enough
     to fit the 190px sidebar, and using Arial (matching the buttons on the right side of the
     board) instead of the Setup screen's monospace font. */
  #gsPanel{
    width:100%;
    display:flex;
    flex-direction:column;
    gap:6px;
    font-family:Arial, Helvetica, sans-serif;}

  .gs-mode-btn{
    flex:0 0 auto;
    max-width:none;
    width:100%;
    padding:7px 13px;
    border:none;
    border-radius:6px;
    font-family:Arial, Helvetica, sans-serif;
    font-weight:700;
    font-size:13.6px;
    cursor:pointer;
    background:var(--wood-dark);
    color:var(--cream);}

  /* Game Options intentionally isn't given the shared .mode-btn class - that class is what the
     Human/AI toggle JS selects and relabels, and this button isn't a mode toggle. .gs-mode-btn
     already covers the rest of the look on its own (border:none, which overrides .mode-btn's
     gold border on Human/AI Opponent too - neither of those actually shows a border), except
     the background/text color, which is overridden below to the same gold-bright/wood-dark
     pairing as Roll Dice (and every other action button on the page) instead of the mode
     buttons' plain wood-dark/cream, since Game Options isn't a toggle and Perry asked for it to
     match Roll Dice's yellow specifically. Its bottom margin is set at runtime by
     alignPlayer1WithNewGame() instead of a fixed value here, same as AI Opponent's margin used
     to be, since it's now the last button in the group sitting right above the name fields - AI
     Opponent itself goes back to relying on the panel's normal 6px gap, the same spacing it
     already had above itself (between it and Human Opponent), so Game Options' top margin
     matches AI Opponent's. */
  #gameOptionsBtn{
    background:var(--gold-bright);
    color:var(--wood-dark);}

  .gs-mode-btn.selected{
    background:var(--gold-bright);
    color:var(--wood-dark);}

  .gs-field{
    width:100%;}

  .gs-field label{
    display:block;
    font-size:10px;
    text-transform:uppercase;
    letter-spacing:0.06em;
    color:var(--gold);
    margin-bottom:2px;}

  .gs-field input{
    width:100%;
    box-sizing:border-box;
    padding:7px 13px;
    border-radius:5px;
    border:none;
    font-family:Arial, Helvetica, sans-serif;
    font-size:13.6px;
    background:var(--cream);
    color:var(--wood-dark);}

  .session-wins-title{
    font-weight:bold;
    text-decoration:underline;
    font-size:0.85rem;
    margin-bottom:6px;
    white-space:nowrap;}

  .session-wins-stats{
    font-size:0.8rem;
    white-space:nowrap;}

  /* Each row's label sits on the left and its value on the right, so the two
     values line up in their own column regardless of how long either
     player's name is (used by the Remaining Pips box). */
  .pips-row{
    display:flex;
    justify-content:space-between;
    gap:10px;}

  .pips-row + .pips-row{
    margin-top:2px;}

  .pips-value{
    font-weight:700;
    text-align:right;}

  .action-btn:disabled{opacity:0.35; cursor:not-allowed;}
  
  .double-choice{
    display:flex;
    gap:6px;
    flex-wrap:wrap; 
    justify-content:center; 
    max-width:100%;}
  
  .double-choice button{
    width:34px;
    height:34px; 
    border-radius:7px;
    border:2px solid var(--gold); 
    background:var(--wood-dark);
    color:var(--cream);
    font-family:'Playfair Display',serif;
    font-weight:700; 
    font-size:0.95rem; cursor:pointer;}
    
  .double-choice button:hover{
    background:var(--gold);
    color:var(--wood-dark);}

  #gameOver{
    display:none;
    position:fixed;
    top:0; left:0;
    width:100%; height:100%;
    background:transparent;
    z-index:99997;
    text-align:center;}

  #gameOver.show{
    display:block;}

  .gameover-box{
    position:absolute;
    top:50%; left:50%;
    transform:translate(-50%, -50%);
    max-width:600px;
    width:90%;
    box-sizing:border-box;
    background:var(--cream);
    color:var(--wood-dark);
    border:2px solid var(--gold);
    border-radius:10px;
    padding:24px;
    box-shadow:0 8px 30px var(--modal-box-shadow);}

  #gameOver h2{
    font-family:'Playfair Display',serif;
    color:var(--gameover-title-color);
    font-size:1.9rem;
    margin-bottom:6px;
    animation:flash-red 1s step-start infinite;}

  /* Flashes the winner announcement ("<Name> Wins!") between red and its normal gold color.
     step-start (not ease-in-out) so it's a hard on/off blink, not a smooth fade. */
  @keyframes flash-red{
    0%, 49%{color:#ff2b2b;}
    50%, 100%{color:var(--gameover-title-color);}
  }

  footer{
    text-align:center; 
    font-size:0.62rem; 
    letter-spacing:0.08em;
    color:var(--gold); 
    opacity:0.6; 
    margin-top:4px;
    flex:0 0 auto;}

  /* Themed confirmation modal (replaces native
     confirm()), matching the Yahtzee app's universal 
     modal pattern */
  #universalModal{
    display:none; 
    position:fixed; 
    top:0; 
    left:0; 
    width:100%;
    height:100%;
    background:var(--modal-overlay-bg); 
    z-index:99998;}
  
  #universalModal .modal-box{
    position:absolute;
    top:50%; 
    left:50%; 
    transform:translate(-50%,-50%);
    background:var(--cream);
    color:var(--wood-dark); 
    padding:24px; 
    border-radius:10px;
    max-width:380px; 
    width:90%; text-align:center; 
    box-shadow:0 8px 30px var(--modal-box-shadow);
    border:2px solid var(--gold);}

  #universalModal .modal-box.wide{
    max-width:480px;}
    
  #universalModalTitle{
    margin:0 0 8px;
    font-family:'Playfair Display',serif;
    color:var(--wood-dark); 
    text-align:center;
    font-size:22.7px;
    display:none;}

  #universalModalSubtitle{
    margin:-4px 0 10px;
    font-family:'Playfair Display',serif;
    color:var(--wood-dark);
    text-align:center;
    font-size:16.72px;
    font-weight:normal;}
    
  #universalModalText{
    margin:0 0 18px;
    color:var(--wood-dark);
    white-space:pre-line;
    text-align:center;}

  #universalModalText.scores-list{
    font-family:'Space Mono', monospace;
    font-size:0.8rem;
    text-align:left;
    display:inline-block;}
    
  #universalModalButtons{
    display:flex;
    gap:8px;
    justify-content:center; 
    flex-wrap:wrap;}
    
  #universalModalButtons button{
    padding:8px 16px; 
    border-radius:6px;
    border:none;

    font-family:'Playfair Display',serif;
    font-weight:700;
    font-size:0.9rem;}
    
  #universalModalButtons button.primary{
    background:var(--gold-bright);
    color:var(--wood-dark);}
    
  #universalModalButtons button.secondary{
    background:var(--cream-dark);
    color:var(--wood-dark);}
    
  #universalModalButtons button:hover{
    filter:brightness(1.06);}

  /* Game Options placeholder popup, styled to match Pinochle's Options popup exactly (cream/
     ink/green, Segoe UI) instead of this page's own gold/cream Playfair Display look - the same
     kind of one-off cross-game reskin Pinochle itself already does for its Exit popup (matching
     THIS page's gold/cream/Playfair look there). Scoped to .modal-box.pinochle-style, which the
     Game Options button adds only to this one modal; showModal() strips the class again on
     every other call so it never leaks into Recorded Scores, New Game, Exit, etc. */
  #universalModal .modal-box.pinochle-style{
    background:#fffdf5;
    color:#1b1b1b;
    border:3px solid #111111;
    max-width:520px;}

  /* Font sizes below are copied from Pinochle's own Options popup exactly - its title (h2,
     24px/700), its "(...Provided for Learning Purposes)" subtitle line (16.72px/600), and its
     checkbox labels (14.72px/600) - so this popup reads as the same size hierarchy even though
     the actual option text here is longer and wraps onto multiple lines. */
  #universalModal .modal-box.pinochle-style #universalModalTitle{
    font-family:'Segoe UI', Tahoma, sans-serif;
    color:#1b1b1b;
    font-size:24px;
    font-weight:700;}

  #universalModal .modal-box.pinochle-style #universalModalSubtitle{
    font-family:'Segoe UI', Tahoma, sans-serif;
    color:#1b1b1b;
    font-size:16.72px;
    font-weight:600;
    text-align:center;}

  #universalModal .modal-box.pinochle-style #universalModalText{
    font-family:'Segoe UI', Tahoma, sans-serif;
    color:#1b1b1b;
    text-align:left;}

  /* Numbered option rows: label text on the left (can wrap onto multiple lines), its checkbox
     lined up on the right - same left-label/right-checkbox grid pattern Pinochle's own Options
     popup uses, just with a narrower fixed checkbox column since these rows wrap. */
  #universalModal .modal-box.pinochle-style .go-options-grid{
    display:grid;
    grid-template-columns:auto 32px;
    row-gap:18px;
    column-gap:16px;

  #universalModal .modal-box.pinochle-style .go-item-text{

    font-weight:600;}

  #universalModal .modal-box.pinochle-style .go-checkbox{

  #universalModal .modal-box.pinochle-style #universalModalButtons button{
    background:#2f7d3a;
    color:#fff;
    border:2px solid #111111;
    border-radius:6px;
    font-family:'Segoe UI', Tahoma, sans-serif;
    font-weight:600;}

  #universalModal .modal-box.pinochle-style #universalModalButtons button:hover{
    filter:none;
    background:#235c2b;}

  @media (max-width:640px){
    .checker{width:18px; height:18px; font-size:8px;}}
  
  /* Invisible double-click toggle for the game log, tucked into the very corner of the

  /* Same invisible hidden-toggle pattern as #logToggleBtn just below it, but for showing/hiding
     the point numbers instead of the log. Stacked directly above so the two out-of-the-way
     toggles sit in the same corner without overlapping each other. */
  #pointNumbersToggleBtn{
    position:fixed;
    bottom:44px; left:0;
    width:44px; height:44px;
    padding:0; margin:0; border:none;
    background:transparent;
    opacity:0;
    cursor:default;
    z-index:600;}

  #logPanel{
    display:none;
    position:fixed;
    bottom:10px; left:10px;
    width:300px;
    max-height:520px;
    background:var(--wood-dark);
    border:2px solid var(--gold);
    border-radius:8px;
    padding:8px 10px;
    z-index:500;
    box-shadow:0 6px 20px rgba(0,0,0,0.5);}

  #logPanel.show{ display:flex; flex-direction:column; }

  #logPanelTitle{
    font-family:'Playfair Display', serif;
    font-weight:700;
    color:var(--gold-bright);
    font-size:0.95rem;
    margin-bottom:6px;
    flex:0 0 auto;}

  #log{
    overflow-y:auto;
    font-size:0.78rem;
    line-height:1.5;
    color:var(--cream);
    flex:1 1 auto;
    min-height:0;}

  #log div{ padding:1px 0; border-bottom:1px solid rgba(255,255,255,0.06); }
  #log div.win{ color:var(--gold-bright); font-weight:700; }
  #log div.info{ opacity:0.9; }

</style>

</head>
<body>
<div id="universalModal" role="dialog" aria-modal="true">
  <div class="modal-box">
    <h3 id="universalModalTitle"></h3>
    <p id="universalModalSubtitle" style="display:none;"></p>
    <p id="universalModalText"></p>
    <div id="universalModalButtons"></div>
  </div>
</div>
<div class="wrap">
  <header>
    <h1>Acey-Deucey</h1>
    <p class="subtitle" >The Sailor's Backgammon </p>
    <div class="rule-line"></div>
  </header>


  <section id="game">
    <div class="scoreboard">
      <div class="score-card" id="scoreWhite">
        <div class="name" id="nameWhite">Player 1 (White)</div>
        <div class="stat"><span id="offWhiteCount">0</span> Home&nbsp;&nbsp;&middot;&nbsp;&nbsp;
          <span id="barWhiteCount">15</span> On The Bar</div>
      </div>
      <div class="score-card" id="scoreBlack">
        <div class="name" id="nameBlack">Player 2 (Black)</div>
        <div class="stat"><span id="offBlackCount">0
          </span> Home&nbsp;&nbsp;&middot;&nbsp;&nbsp;
          <span id="barBlackCount">15</span> On The Bar</div>
      </div>
    </div>

    <div class="turn-banner" id="turnBanner"></div>

    <div class="board-row">
      <div class="side-controls">
        <div class="side-controls-inner side-controls-inner-top">
          <div id="gsPanel">
            <button class="mode-btn gs-mode-btn" data-mode="human" data-label="Human Opponent">Human Opponent: OFF</button>
            <button class="mode-btn gs-mode-btn selected" id="gsAiBtn" data-mode="ai" data-label="AI Opponent">AI Opponent: ON</button>
            <button class="gs-mode-btn" id="gameOptionsBtn">Game Options</button>

            <div class="gs-field">
              <label for="gsP1Name">White (Player 1)</label>
              <input type="text" id="gsP1Name" placeholder="Player 1" maxlength="16">
            </div>
            <div class="gs-field">
              <label id="gsP2Label" for="gsP2Name">Black (AI)</label>
              <input type="text" id="gsP2Name" value="The AI" maxlength="16" disabled>
            </div>
          </div>
        </div>

        <div class="session-wins-box session-wins-box-bottom">
          <div class="session-wins-title">This Session's Wins</div>
          <div class="session-wins-stats"><span id="sessionWinsP1Name">Player 1</span> = <span id="sessionWinsP1">0</span>&nbsp;&nbsp;&nbsp;&nbsp;<span id="sessionWinsP2Name">Player 2</span> = <span id="sessionWinsP2">0</span></div>
        </div>
      </div>
      <div class="board-frame">
        <div class="board-grid" id="boardGrid"></div>
      </div>
      <div class="side-controls">
        <div class="side-controls-inner side-controls-inner-top">
          <button class="action-btn" id="rollBtn">Roll Dice</button>
          <div class="dice-row-wrap">
            <div class="dice-row" id="diceRow"></div>
            <div class="cant-move-msg" id="cantMoveMsg">Can't Move</div>
          </div>
          <div class="double-choice" id="doubleChoice" style="display:none;"></div>

          <div id="secondaryButtons">
            <button class="action-btn-small" id="resetBtn">New Game</button>
            <button class="action-btn-small" id="scoresBtn">Recorded Scores</button>
            <button class="action-btn-small" id="instructionsBtn">Instructions</button>
            <button class="action-btn-small" id="exitBtn">Exit</button>
          </div>
        </div>

        <div class="session-wins-box session-wins-box-bottom">
          <div class="session-wins-title">Remaining Pips</div>
          <div class="session-wins-stats">
            <div class="pips-row"><span><span id="pipsWhiteLabel">Player 1</span> pips</span><span class="pips-value" id="pipsWhite">0</span></div>
            <div class="pips-row"><span><span id="pipsBlackLabel">Player 2</span> pips</span><span class="pips-value" id="pipsBlack">0</span></div>
          </div>
        </div>
      </div>
    </div>
  </section>

  <div id="gameOver">
    <div class="gameover-box">
      <h2 id="gameOverTitle">Game Over</h2>
      <p id="gameOverText"></p>
      <p id="gameOverPips"></p>
      <p class="play-again-prompt">Play Another Game?</p>
      <div class="play-again-row">
        <button class="go-btn" id="playAgainYesBtn">Yes</button>
        <button class="go-btn" id="playAgainNoBtn">No</button>
      </div>
    </div>
  </div>

 <!-- <footer>All checkers begin off the board &middot;
 standard bear-off &amp; blocking rules apply</footer> -->
</div>

<!-- Hidden double-click toggle for the game log - invisible, sits in the very bottom-left
     corner of the screen. Same pattern used elsewhere in the Game Hub for out-of-the-way
     debug/utility toggles the player isn't meant to stumble onto by accident. -->
<button id="logToggleBtn" aria-label="Toggle game log"></button>

<!-- Hidden double-click toggle for the point numbers on the board - same invisible pattern as
     logToggleBtn, stacked directly above it. -->
<button id="pointNumbersToggleBtn" aria-label="Toggle point numbers"></button>

<div id="logPanel">
  <div id="logPanelTitle">Game Log</div>
  <div id="log"></div>
</div>

<script>
(function(){

  // ---------------- state ----------------
  let mode = 'ai'; // Defaults to AI opponent; setup screen's "Play the AI"
                   // button starts pre-selected to match
  // When the mode toggle (Human/AI Opponent) is changed mid-game, the actual restart is
  // deferred until the next Roll Dice click rather than applying instantly - see the
  // mode-btn handler and the rollBtn handler below.
  let pendingRestart = false;
  let names = {white:'Player 1', black:'Player 2'};
  let isAI = {white:false, black:false};
  let board; // points[1..24] = {owner:null|'white'|'black', count:0}
  let bar, off;
  let current;            // 'white' | 'black'
  let nextStarter = 'white'; // alternates each game - see startGame()
  let dice = [];          // remaining die values this "segment"
  let originalRoll = [];  // for display of used/unused
  let usedCount = 0;
  let phase = 'awaiting-roll'; // awaiting-roll | moving | choose-double | game-over
  let awaitingDoubleChoice = false;
  let isDoubleFromAceyDeucey = false;
  let isDoubleBonusPending = false; // Option 2: bonus roll queued up after a played (non Acey-Deucey) double
  let doublesStreak = 0;            // Option 2: consecutive genuine doubles rolled by the current player this turn
  let gameOptions = { opt1:false, opt2:false, opt3:false }; // real value assigned below, once loadGameOptions() exists
  // Option 1 only covers the OPENING dance, where everyone's still streaming checkers in from
  // the bar for the first time - not a checker that gets hit and sent to the bar again later,
  // which always has to re-enter before anything else moves, same as with the option off. Once
  // a player has gotten every one of their 15 checkers off the bar for the first time this game,
  // this flips true for good (see applyMove()) and Option 1 stops applying to them.
  let everFullyEntered = {white:false, black:false};
  let selected = null; // 'bar' or point number
  let legalMap = [];    // [{die, dest, hit}] for currently selected source
  let rolling = false;  // True while the tumble animation is playing, guards against double-rolls

  /* Standard dice pip layouts duplicated from the Yahtzee app, mapped onto a
     3x3 grid (cells numbered 1-9, left-to-right, top-to-bottom) */
  const PIP_LAYOUT = {
    1: [5],
    2: [1,9],
    3: [1,5,9],
    4: [1,3,7,9],
    5: [1,3,5,7,9],
    6: [1,3,4,6,7,9]
  };

  function buildDieFace(value){
    const face = document.createElement('div');
    face.className = 'die-face';
    const activeCells = PIP_LAYOUT[value] || [];
    for(let i=1;i<=9;i++){
      const cell = document.createElement('div');
      cell.className = 'pip-cell';
      if(activeCells.includes(i)){
        const pip = document.createElement('div');
        pip.className = 'pip';
        cell.appendChild(pip);
      }
      face.appendChild(cell);
    }
    return face;
  }

  /* Draws the dice row from a plain array of values, independent of the
     full render(), so the tumble animation can update just the dice every
     tick without rebuilding the whole board each time */
  function renderDiceRow(values, isTumbling){
    const diceRow = document.getElementById('diceRow');
    diceRow.innerHTML = '';
    values.forEach(d=>{
      const el = document.createElement('div');
      el.className = 'die' + (isTumbling ? ' tumbling' : '');
      el.appendChild(buildDieFace(d));
      diceRow.appendChild(el);
    });
  }

  // ---------------- helpers ----------------
  function opp(p){ return p === 'white' ? 'black' : 'white'; }
  function distToOff(player, point){ return player === 'white' ? point : 25 - point; }
  function pointFromDist(player, dist){ return player === 'white' ? dist : 25 - dist; }

  // True once neither side can possibly hit the other anymore - i.e. a "pure race" with a wide-
  // open board. White travels from high point numbers down to 1, black travels from low point
  // numbers up to 24 - they cross paths over the course of the game. A white checker at point W
  // and a black checker at point B can still meet as long as W >= B (white hasn't yet moved past
  // where that black checker is); once every white checker's point is BELOW every black checker's
  // point, the two sides have fully passed each other and are only moving further apart from here
  // on. A checker still on the bar hasn't entered yet and could land near anything, so that alone
  // counts as contact. Used by aiChooseDouble() below to tell "still racing/blocking matters"
  // apart from "it's just a straight race now, so pip progress is all that matters" - see that
  // function for why.
  function hasContact(givenBoard, givenBar){
    const b = givenBoard || board, br = givenBar || bar;
    if(br.white > 0 || br.black > 0) return true;
    let maxWhite = -Infinity, minBlack = Infinity;
    for(let p=1;p<=24;p++){
      if(b[p].owner === 'white') maxWhite = Math.max(maxWhite, p);
      else if(b[p].owner === 'black') minBlack = Math.min(minBlack, p);
    }
    if(maxWhite === -Infinity || minBlack === Infinity) return false; // one side is entirely off
    return maxWhite >= minBlack;
  }

  function newBoard(){
    const pts = {};
    for(let i=1;i<=24;i++) pts[i] = {owner:null, count:0};
    return pts;
  }

  function allCheckersHome(player){
    if(bar[player] > 0) return false;
    for(let p=1;p<=24;p++){
      if(board[p].owner === player && distToOff(player,p) > 6) return false;
    }
    return true;
  }

  function maxDistOnBoard(player){
    let m = 0;
    for(let p=1;p<=24;p++){
      if(board[p].owner === player){
        const d = distToOff(player,p);
        if(d > m) m = d;
      }
    }
    return m;
  }

  // Option 1 ("move before all checkers are entered") only ever relaxes the bar-first rule
  // during a player's OPENING entry - once they've gotten all 15 off the bar for the first
  // time this game, a later hit always has to re-enter before anything else moves, exactly as
  // if the option were off.
  function opt1Applies(player){
    return gameOptions.opt1 && !everFullyEntered[player];
  }

  // Attempt a move; returns {legal:bool, dest:'off'|number, hit:bool}
  function tryMove(player, source, die){
    if(source === 'bar'){
      if(bar[player] <= 0) return {legal:false};
      const entry = player === 'white' ? (25 - die) : die;
      const cell = board[entry];
      if(cell.owner === opp(player) && cell.count >= 2) return {legal:false};
      const hit = cell.owner === opp(player) && cell.count === 1;
      return {legal:true, dest:entry, hit};
    } else {
      const p = source;
      const cell = board[p];
      if(cell.owner !== player || cell.count <= 0) return {legal:false};
      // Option 1: normally you must finish entering every checker from the bar before moving
      // any other checker. With Option 1 checked, that restriction is lifted - but only during
      // this player's opening entry (see opt1Applies() above).
      if(bar[player] > 0 && !opt1Applies(player)) return {legal:false}; // must enter first
      const dist = distToOff(player, p);
      const newDist = dist - die;
      if(newDist > 0){
        const destPoint = pointFromDist(player, newDist);
        const dc = board[destPoint];
        if(dc.owner === opp(player) && dc.count >= 2) return {legal:false};
        const hit = dc.owner === opp(player) && dc.count === 1;
        return {legal:true, dest:destPoint, hit};
      } else if(newDist === 0){
        if(!allCheckersHome(player)) return {legal:false};
        return {legal:true, dest:'off', hit:false};
      } else {
        if(!allCheckersHome(player)) return {legal:false};
        // Option 3: normally an overshoot can bear off the highest occupied point instead.
        // With Option 3 checked, only an exact roll may bear a checker off - no fallback.
        if(gameOptions.opt3) return {legal:false};
        const m = maxDistOnBoard(player);
        if(dist === m) return {legal:true, dest:'off', hit:false};
        return {legal:false};
      }
    }
  }

  function applyMove(player, source, die, result){
    if(source === 'bar'){
      bar[player]--;
      // The moment this player's bar count reaches 0 for the first time this game, their
      // opening entry is complete - Option 1 (see opt1Applies()) stops applying to them from
      // here on, even if they get hit and land back on the bar again later.
      if(bar[player] === 0) everFullyEntered[player] = true;
    }
    else { board[source].count--; if(board[source].count <= 0){ board[source].owner=null; board[source].count=0; } }

    if(result.dest === 'off'){
      off[player]++;
    } else {
      const cell = board[result.dest];
      if(result.hit){
        bar[opp(player)]++;
        board[result.dest] = {owner:player, count:1};
      } else if(cell.owner === player){
        cell.count++;
      } else {
        board[result.dest] = {owner:player, count:1};
      }
    }
  }

  function sourcesFor(player){
    const list = [];
    if(bar[player] > 0){
      list.push('bar');
      // Normally that's the ONLY legal source until the bar is empty. Option 1 lifts that -
      // on-board checkers become legal sources too, even with checkers still on the bar - but
      // only during this player's opening entry (see opt1Applies()).
      if(!opt1Applies(player)) return list;
    }
    for(let p=1;p<=24;p++){ if(board[p].owner===player && board[p].count>0) list.push(p); }
    return list;
  }

  function anyLegalMove(player, diceArr){
    const uniq = [...new Set(diceArr)];
    const srcs = sourcesFor(player);
    for(const s of srcs){
      for(const d of uniq){
        if(tryMove(player, s, d).legal) return true;
      }
    }
    return false;
  }

  // ---------------- "Can't Move" toast ----------------
  // Shown whenever a player has no legal move available with their current dice (e.g. blocked
  // by the opponent's checkers). Positioned absolutely below the dice so it doesn't shift any
  // layout, and stays up for about 3 seconds. If it's triggered again while already showing
  // (e.g. two forfeits in a row), the 3-second timer restarts rather than stacking timers.
  let cantMoveTimeout = null;
  function showCantMoveMessage(){
    const el = document.getElementById('cantMoveMsg');
    if(!el) return;
    el.classList.add('show');
    if(cantMoveTimeout) clearTimeout(cantMoveTimeout);
    cantMoveTimeout = setTimeout(()=>{ el.classList.remove('show'); }, 3000);
  }

  // Used at every point where no legal move is available with the current dice. Shows the
  // "Can't Move" message while deliberately leaving the `dice` array untouched and re-rendering
  // immediately, so the dice everyone just rolled stay visible during the message instead of
  // vanishing the instant the forfeit happens. The actual forfeit (clearing dice, advancing the
  // turn) is deferred until the message's own 3-second window closes.
  function forfeitTurnNoMoves(logMsg){
    log(logMsg, 'info');
    showCantMoveMessage();
    render();
    setTimeout(()=>{
      dice = [];
      afterDiceExhausted();
    }, 3000);
  }

  // ---------------- setup screen ----------------
  document.querySelectorAll('.mode-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      mode = btn.dataset.mode;
      // Syncs EVERY mode-btn on the page (Setup screen's originals + the game-screen copies)
      // to match whichever mode was just picked, rather than only toggling the one clicked -
      // otherwise clicking a button in one panel wouldn't update the other panel's buttons.
      document.querySelectorAll('.mode-btn').forEach(b=>{
        const isSelected = b.dataset.mode === mode;
        b.classList.toggle('selected', isSelected);
        b.textContent = b.dataset.label + (isSelected ? ': ON' : ': OFF');
      });
      // Same idea for the "Black" name field/label - only one pair now that the Setup screen
      // (and its duplicate copy of these controls) has been removed.
      const p2Input = document.getElementById('gsP2Name');
      const p2Label = document.getElementById('gsP2Label');
      if(mode==='ai'){
        p2Label.childNodes[0].textContent = 'Black (AI) ';
        // Disabled field - fine to use a real value here since the player can't click into it anyway
        p2Input.value = 'The AI'; p2Input.disabled = true;
      } else {
        p2Label.childNodes[0].textContent = 'Black (Player 2) ';
        // Editable field - use placeholder (greyed hint text) + empty value, so clicking in
        // gives a blank box to type into instead of text the player has to delete first
        p2Input.value = ''; p2Input.placeholder = 'Player 2'; p2Input.disabled = false;
      }
      // Mode changes need a fresh game to apply safely (switching who controls a seat
      // mid-turn would be disruptive), but shouldn't interrupt the CURRENT game just from
      // clicking the toggle - defer the actual restart until the next Roll Dice click.
      pendingRestart = true;
    });
  });

  // Entering a name mid-game just relabels the current player live (header, session-wins
  // box) - it doesn't need a restart at all, unlike mode changes which do.
  // Names are saved to localStorage (not sessionStorage) so they're remembered the next time
  // the app is opened, even in a brand new browser session - not just within the same tab.
  // Mode stays in sessionStorage as before: it should reset to the default the next time the
  // app is opened fresh, it just shouldn't reset on an in-tab reload (e.g. Instructions and
  // back). Called from both applyNameChangeLive() (a plain name edit, no restart) and
  // startGame() (mode changes/New Game/etc.), since either one can be the most recent thing
  // the player did.
  const PLAYER_NAMES_KEY = 'aceyDeuceyPlayerNames_v1';
  function persistSettings(){
    try {
      localStorage.setItem(PLAYER_NAMES_KEY, JSON.stringify({
        p1Name: names.white,
        p2Name: mode==='ai' ? '' : names.black, // don't persist "The AI" as if it were a typed name
      }));
    } catch (err) {}
    try {
      sessionStorage.setItem('aceyDeuceySettings_v1', JSON.stringify({ mode: mode }));
    } catch (err) {}
  }

  // Game Options checkbox selections are saved to localStorage (like player names) so they're
  // remembered the next time the app is opened, not just within the current tab.
  const GAME_OPTIONS_KEY = 'aceyDeuceyGameOptions_v1';
  function loadGameOptions(){
    try {
      const raw = localStorage.getItem(GAME_OPTIONS_KEY);
      if(raw) return JSON.parse(raw);
    } catch (err) {}
    return { opt1:false, opt2:false, opt3:false };
  }
  function saveGameOptions(opts){
    try { localStorage.setItem(GAME_OPTIONS_KEY, JSON.stringify(opts)); } catch (err) {}
  }
  // Now that loadGameOptions() actually exists, replace the placeholder above with whatever
  // was really saved (an earlier attempt at this line, up near the other "let" state near the
  // top of the file, silently failed - GAME_OPTIONS_KEY didn't exist yet at that point in the
  // script, so the try/catch inside loadGameOptions() quietly ate the error and always
  // returned the all-false default).
  gameOptions = loadGameOptions();

  function applyNameChangeLive(){
    const p1 = document.getElementById('gsP1Name').value.trim() || 'Player 1';
    names.white = p1;
    document.getElementById('nameWhite').textContent = p1 + ' (White)';
    document.getElementById('sessionWinsP1Name').textContent = p1;

      document.getElementById('sessionWinsP2Name').textContent = p2;

    }

  }
  document.getElementById('gsP1Name').addEventListener('change', applyNameChangeLive);
  document.getElementById('gsP2Name').addEventListener('change', applyNameChangeLive);
  document.getElementById('gsP1Name').addEventListener('keydown', (e)=>{

  });
  document.getElementById('gsP2Name').addEventListener('keydown', (e)=>{

  // "Yes" immediately starts a fresh game with the current panel settings - there's no

  document.getElementById('playAgainYesBtn').addEventListener('click', ()=>{

  // "No" means "I don't want to play another game," so it exits the app -

  document.getElementById('playAgainNoBtn').addEventListener('click', async ()=>{

  function startGame(){
    pendingRestart = false;
    names.white = document.getElementById('gsP1Name').value.trim() || 'Player 1';
    names.black = mode==='ai' ? 'The AI' : (document.getElementById('gsP2Name').value.trim() || 'Player 2');
    isAI = {white:false, black: mode==='ai'};

    board = newBoard();

    off = {white:0, black:0};

    dice = []; originalRoll = []; usedCount = 0;
    phase = 'awaiting-roll';
