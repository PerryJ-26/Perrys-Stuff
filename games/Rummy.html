  showModal('Exit Standard Rummy', 'Are you sure you want to exit?', `
    <button onclick="location.href='../index.html';">Yes</button>
    <button onclick="${returningToSummary ? 'modalReopenFn()' : 'closeModal()'}">Cancel</button>
  `, false, 'exit-style');
}
document.getElementById('exitBtn').addEventListener('click', confirmExit);

history.pushState(null, '', location.href);
window.addEventListener('popstate', function(){
  history.pushState(null, '', location.href);
  document.getElementById('exitBtn').click();
});

document.getElementById('optionsBtn').addEventListener('click', ()=>{
  showModal('Options', `
    <div class="options-grid">
      <div class="options-question">Select the default for Sounds</div>
      <span class="opt-pair"><label for="soundOnRadio">On</label><input type="radio" id="soundOnRadio" name="soundSetting" ${state.soundEnabled ? 'checked' : ''}></span>
      <span class="opt-pair"><label for="soundOffRadio">Off</label><input type="radio" id="soundOffRadio" name="soundSetting" ${!state.soundEnabled ? 'checked' : ''}></span>

      <p style="grid-column: 1 / -1; font-size:1.045rem; font-weight:600; text-align:center; text-decoration: underline; margin: 7px 0;">These Options are Provided for Learning Purposes</p>

      <div class="options-question">View All Cards</div>
      <span class="opt-pair"><label for="viewAllOnRadio">On</label><input type="radio" id="viewAllOnRadio" name="viewAllSetting" ${state.viewAllCards ? 'checked' : ''}></span>
      <span class="opt-pair"><label for="viewAllOffRadio">Off</label><input type="radio" id="viewAllOffRadio" name="viewAllSetting" ${!state.viewAllCards ? 'checked' : ''}></span>

      <div class="options-question">Use Spacebar to Pause</div>
      <span class="opt-pair"><label for="spacebarOnRadio">On</label><input type="radio" id="spacebarOnRadio" name="spacebarSetting" ${state.spacebarPauseEnabled ? 'checked' : ''}></span>
      <span class="opt-pair"><label for="spacebarOffRadio">Off</label><input type="radio" id="spacebarOffRadio" name="spacebarSetting" ${!state.spacebarPauseEnabled ? 'checked' : ''}></span>
    </div>
  `, `
    <button onclick="saveOptions()">Save</button>
    <button onclick="closeModal()">Cancel</button>
  `, true, 'optionsModal');
});

document.getElementById('yourNameInput').addEventListener('change', ()=>{
  const input = document.getElementById('yourNameInput');
  const newName = input.value.trim();
  SEAT_NAME.S = newName || 'You';
  document.getElementById('south-name').textContent = SEAT_NAME.S;
  input.value = newName;
  try {
    if(newName) localStorage.setItem(PLAYER_NAME_KEY, newName);
    else localStorage.removeItem(PLAYER_NAME_KEY);
  } catch(e) {}
  render();
});

function saveOptions(){
  state.soundEnabled = document.getElementById('soundOnRadio').checked;
  state.viewAllCards = document.getElementById('viewAllOnRadio').checked;
  state.spacebarPauseEnabled = document.getElementById('spacebarOnRadio').checked;
  try {
    localStorage.setItem(GAME_OPTIONS_KEY, JSON.stringify({
      soundEnabled: state.soundEnabled,
      viewAllCards: state.viewAllCards,
      spacebarPauseEnabled: state.spacebarPauseEnabled
    }));
  } catch(e) { /* ignore */ }
  if(!state.spacebarPauseEnabled && state.paused) togglePause();
  render();
  closeModal();
}

function togglePause(){
  state.paused = !state.paused;
  document.getElementById('pauseOverlay').style.display = state.paused ? 'flex' : 'none';
}

document.addEventListener('keydown', (e)=>{
  if(e.code !== 'Space') return;
  if(!state.spacebarPauseEnabled) return;
  const tag = document.activeElement ? document.activeElement.tagName : '';
  if(tag === 'INPUT' || tag === 'TEXTAREA') return;
  e.preventDefault();
  togglePause();
});

document.getElementById('newHandBtn').addEventListener('click', ()=>{
  if(!gameEverStarted){
    newGame();
    return;
  }
  showModal('Start New Game?', 'This resets every score to 0.', `
    <button onclick="closeModal(); newGame();">Start New Game</button>
    <button onclick="closeModal()">Cancel</button>
  `, false);
});
document.getElementById('logToggle').addEventListener('dblclick', ()=>{
  document.getElementById('logPanel').classList.toggle('show');
});

document.addEventListener('keydown', (e)=>{
  if(!(e.ctrlKey || e.metaKey) || e.key.toLowerCase() !== 'a') return;
  if(!document.getElementById('logPanel').classList.contains('show')) return;
  const active = document.activeElement;
  const activeIsEditable = active && (active.tagName === 'INPUT' || active.tagName === 'TEXTAREA' || active.isContentEditable);
  if(activeIsEditable) return;
  e.preventDefault();
  const logEl = document.getElementById('log');
  const range = document.createRange();
  range.selectNodeContents(logEl);
  const sel = window.getSelection();
  sel.removeAllRanges();
  sel.addRange(range);
});

let gameEverStarted = tryRestoreResumeState();
if(!gameEverStarted){
  render();
}
</script>

<!-- -------------------------------------------------------------------------
     Shared (cross-device) recorded scores via Firebase Realtime Database.
     Same Firebase project the rest of the site (perrys-stuff) already uses -
     just its own database path (RummyScores) so this game's scores stay
     independent. Loaded as a separate <script type="module"> because
     Firebase's SDK is distributed as native ES modules - this doesn't touch
     or replace any of the local-storage machinery above, it just adds a
     second, shared source that the classic script reads from and writes to
     via a couple of small window.* functions. -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
  import {
    getDatabase, ref, push, onValue
  } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyAJLWtpWR8VYmRYLa3kBD9lh2JO_-hFAEc",
    authDomain: "perrys-stuff.firebaseapp.com",
    databaseURL: "https://perrys-stuff-default-rtdb.firebaseio.com",
    projectId: "perrys-stuff",
    storageBucket: "perrys-stuff.firebasestorage.app",
    messagingSenderId: "604958963124",
    appId: "1:604958963124:web:d02aca2cdb29915b306ee1"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);
  const scoresRef = ref(db, "RummyScores");

  window.pushSharedScore = function(entry){
    return push(scoresRef, entry).catch(err => console.error("pushSharedScore error", err));
  };

  onValue(scoresRef, (snapshot) => {
    const val = snapshot.val() || {};
    const list = Object.keys(val).map(key => ({ id: key, ...val[key] }));
    if (window.onSharedScoresUpdate) window.onSharedScoresUpdate(list);
  }, (err) => console.error("onValue(scoresRef) error", err));
</script>
