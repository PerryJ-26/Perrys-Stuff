  /* ===================================================================
     LAYOUT PHILOSOPHY - direct re-skin of Hearts.html's board (same
     CSS-grid seating: N/W/felt/E/S, same corner boxes, same modal/log/
     deal-animation system, same resume-state and shared-scoreboard
     machinery) with Standard Rummy's own rules underneath. Rummy has no
     tricks, so the trick-slot cross in the felt is replaced with a stock
     pile + discard pile + a scrolling area of melds played to the table.
     The "Hearts: Not Broken" badge has no Rummy equivalent, so that slot
     is now occupied by the "Your Name" box instead (moved up from the
     bottom-right corner), per the Development Notes.
     A deep plum/amethyst felt was chosen for Rummy since the site's other
     card games already claim wine-red (500), orange (Spades), green
     (Blackjack/Klondike/Yukon) and blue (Hearts) - purple keeps every
     game visually distinct at a glance. Card backs use a deep purple
     lattice on cream so they stay clearly different from the felt itself
     (same "cardback color != felt color" rule the other games follow).
     Every color used anywhere in this file - including colors written
     into JS-generated inline styles - is defined once below and referred
     to by a descriptive (role-based, not hue-based) custom-property name.
     =================================================================== */
  :root{
    /* ---- Page / board frame (same blues as Hearts) ---- */
    --page-background: #e6edf6;
    --felt-primary: #7396ff;
    --board-frame: #101c26;

    /* ---- Cards ---- */
    --card-face-bg: #fffdf8;
    --card-face-edge: #c9bfd6;
    --ink-primary: #1d1526;
    --suit-accent-ink: #c81e2c; /* same clear, saturated red used site-wide for hearts/diamonds */

    /* ---- Cream control panels (corner boxes, pass-style action bars) ---- */
    --cream-panel: #fdf6e8;
    --cream-panel-border: #1c2b38;

    /* ---- Primary modal action buttons (Save/OK/Deal Next Hand, etc.) ---- */
    --primary-btn-bg: #2f7d3a;
    --primary-btn-bg-hover: #235c2b;

    /* ---- Card backs: cream base with a deep crimson diamond lattice (same as Hearts) ---- */
    --cardback-base: #fbf3e6;
    --cardback-pattern: #a8172e;
    --cardback-edge: #5c0d1a;

    /* ---- Shadows / highlights shared across the board ---- */
    --shadow-soft: rgba(255,255,255,.45);
    --shadow-medium: rgba(0,0,0,.4);
    --shadow-strong: rgba(0,0,0,.6);
    --glow-active: rgba(255,255,255,.6);

    /* ---- Misc UI ink / dividers ---- */
    --meta-tag-ink: #f4d6a8;
    --divider-soft: rgba(0,0,0,.15);
    --divider-strong: rgba(0,0,0,.3);
    --row-emphasis-bg: rgba(0,0,0,.06);
    --name-box-ink: #000000;
    --revbadge-ink: #000000;

    /* ---- Pause overlay ---- */
    --pause-overlay-bg: rgba(0,0,0,.15);
    --pause-badge-bg: rgba(0,0,0,.75);
    --pause-badge-ink: #ffffff;

    /* ---- Card selection outline (South's hand) ---- */
    --selection-outline-inner: #ffffff;

    /* ---- Disabled-pile dimming (stock/discard when it isn't your draw) ---- */
    --disabled-pile-tint: rgba(0,0,0,.08);

    /* ---- Exit-confirmation popup (gold/cream, matches 500/AceyDeucey/
       Pinochle/Hearts site-wide) ---- */
    --exit-modal-bg: #eee1c6;
    --exit-modal-ink: #241608;
    --exit-modal-border: #c9a227;
    --exit-btn-bg: #e6c65c;
    --exit-btn-bg-secondary: #d8c8a0;
  }
  *{ box-sizing: border-box; }
  html, body{ height: 100%; margin:0; }
  body{
    font-family: 'Inter', 'Segoe UI', Tahoma, sans-serif;
    background: var(--page-background);
    color: var(--ink-primary);
    display: flex;
    flex-direction: column;
    overflow-x: hidden;
    overflow-y: auto; /* Revision 9: the board can no longer shrink below the size your cards need (rows have a hard floor, so cards are never clipped) - on a shorter browser window that floor can now be taller than the window itself, so this lets the page scroll down to the rest of the board instead of silently cutting it off at the window edge */
  }

  .revBadge{
    position: fixed;
    top: 10px;
    right: 12px;
    z-index: 9999;
    font-size: 0.7rem;
    font-weight: 600;
    color: var(--revbadge-ink);
    pointer-events: none;
  }

  #pageTitle{
    margin: 0 0 10px;
    font-size: 2rem;
    font-weight: 800;
    letter-spacing: 2px;
    color: #16283a;
    text-shadow: 1px 1px 0 rgba(255,255,255,.5);
  }
  #buttonGroup{
    position: fixed;
    top: 10px; left: 10px;
    z-index: 70;
    display:flex;
    flex-direction: column;
    gap:6px;
  }
  #buttonGroup button{
    background: var(--cream-panel);
    color: var(--ink-primary);
    border: 2px solid var(--board-frame);
    border-radius: 6px;
    padding: 6px 14px;
    cursor:pointer;
    font-size:.8rem;
    font-weight:700;
    white-space: nowrap;
  }
  #buttonGroup button:hover{ background:#fff; }

  /* ---------- The board ---------- */
  #table-wrap{
    display:grid;
    grid-template-columns: clamp(145px,13vw,180px) 560px clamp(145px,13vw,180px); /* Revision 4: widened for Eve/Jim's side-by-side name+count layout */
    justify-content: center;
    grid-template-rows:
      140px  /* Revision 10, point 1: trimmed from 170px - Kevin's row only ever needs about 134px, so the extra room was pure slack being spent on the scrollbar problem */
      226px  /* Revision 10/11/12: grown again (was 220px) to give the melds strip below (point 2) a real cushion on your actual screen, instead of the razor-thin 2px it had before */
      minmax(177px, 1fr);  /* Revision 10, point 1: trimmed from 205px - your row only ever needs about 170px including its own padding */
    gap: 0px; /* Revision 11, point 1: trimmed further from 2px - on your actual screen the scroll bar was still appearing right after the deal (about .125in of overflow), so this round trims the remaining structural (non-content) space rather than the rows themselves, since those are the ones closest to clipping */
    padding: 0px; /* Revision 11, point 1: trimmed further from 5px, same reasoning - this is pure breathing room around the board's edge, not space anything actually needs */
    flex: 1;
    min-height: 543px; /* Revision 12: the three rows above now need 140+226+177px (543px total) - grown 6px from Revision 11 to cover the meldsArea growth below (point 2) */
    overflow: hidden;
    background: var(--felt-primary);
    border: 4px solid var(--board-frame);
    border-radius: 14px;
    margin: 0.05in clamp(0.2in, 5vw, 1.4in) 0.1in 165px;
    position: relative;
  }

  #pauseOverlay{
    display:none;
    position:absolute; inset:0; z-index:50;
    background: var(--pause-overlay-bg);
    pointer-events:auto;
    align-items:flex-start; justify-content:center;
    padding-top: 16px;
  }
  #pauseOverlay .pause-badge{
    background: var(--pause-badge-bg);
    color: var(--pause-badge-ink);
    font-size:1.3rem;
    font-weight:700;
    padding: 10px 22px;
    border-radius: 10px;
    text-align:center;
  }

  .seat{
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:flex-start;
    padding: 6px;
    position: relative;
    overflow: hidden;
    min-height: 0;
  }
  /* Eve (West) and Jim (East) - name and card count sit beside their card
     stack instead of above it: Eve's info column is to the left of her
     cards, Jim's is to the right of his, each on the side away from the
     center of the table. */
  .seat.side-seat{
    flex-direction:row;
    align-items:center;
    justify-content:center;
    gap:8px;
  }
  .side-seat .side-info{
    display:flex;
    flex-direction:column;
    align-items:center;
    flex-shrink:0;
  }
  /* Eve/Jim's card stack sits 0.375in (36px) lower than their name/count
     column next to it (Revision 5, point 6). A transform is used instead
     of margin-top so it just shifts the already-laid-out cards down
     without disturbing the row's flex-centering (which margin-top did -
     it ended up pulling the cards UP instead). */
  #seat-W .cardback-row.vertical,
  #seat-E .cardback-row.vertical{
    transform: translateY(36px);
  }
  /* Revision 6: the 36px shift above moves the card stack visually below
     its own layout box; seat-W/E clip at their box edge (.seat has
     overflow:hidden), so without this the bottom of the lowest card gets
     cut off. This reserves the extra room so nothing is clipped - it only
     became visible now that the larger cards (point 4) made the clipped
     sliver bigger. */
  #seat-W, #seat-E{
    padding-bottom: 40px;
  }
  .seat.active .name{
    text-shadow: 0 0 8px var(--glow-active), 0 1px 2px rgba(0,0,0,.6);
  }
  .seat .name{
    font-weight:700;
    font-size: calc(.9rem + 2px);
    color:#fff;
    text-shadow: 0 1px 2px rgba(0,0,0,.6);
  }
  .name-row{
    display:flex;
    align-items:center;
    gap:6px;
    width:100%;
    margin-top:2px;
    flex-shrink:0;
    justify-content:center;
  }
  .meta-line{
    font-size:.68rem;
    font-weight:700;
    min-height: 1em;
    text-align:center;
    white-space: nowrap;
    flex-shrink:0;
  }
  .meta-line .tag{ color: var(--meta-tag-ink); text-shadow: 0 1px 2px rgba(0,0,0,.7); }
  .meta-line .cardcount{ color:#fff; text-shadow: 0 1px 2px rgba(0,0,0,.6); }
  .meta-line .sep{ color:#fff; opacity:.6; margin: 0 3px; }

  .cardback-row{ display:flex; margin-top:6px; }
  .cardback-row.vertical{ flex-direction:column; align-items:center; }
  .cardback{
    width:65.6px; height:91.9px; /* Revision 7: corrected to actually render at 1.25in x 1.75in on your screen (point 4) - see the note by .card below */
    background-color: var(--cardback-base);
    background-image:
      repeating-linear-gradient(45deg, transparent 0 4px, var(--cardback-pattern) 4px 8px),
      repeating-linear-gradient(-45deg, transparent 0 4px, var(--cardback-pattern) 4px 8px);
    border: 1px solid var(--cardback-edge);
    border-radius:6px;
    margin-left:-56.3px; /* Revision 4: overlap increased 20% from -60px; Revision 7: scaled with the corrected card width so the same sliver of each card still peeks out */
  }
  .cardback-row .cardback:first-child{ margin-left:0; }
  /* West/East hands stack straight up and down (no rotation), each card peeking
     out just below the one above it - matches the cardgames.io reference video
     rather than the sideways-rotated stack used before Revision 2. */
  .cardback-row.vertical .cardback{ margin-left:0; margin-top:-87.8px; } /* Revision 4: overlap increased 20% from -94px; Revision 7: scaled with the corrected card height */
  .cardback-row.vertical .cardback:first-child{ margin-top:0; }

  #dealDeck{
    display:none;
    position:absolute;
    top:50%; left:50%;
    width:40px; height:56px;
    transform:translate(-50%,-50%);
    z-index:5;
  }
  #dealDeck .deal-deck-card{
    position:absolute;
    top:0; left:0;
    width:40px; height:56px;
    border-radius:5px;
    background-color: var(--cardback-base);
    background-image:
      repeating-linear-gradient(45deg, transparent 0 4px, var(--cardback-pattern) 4px 8px),
      repeating-linear-gradient(-45deg, transparent 0 4px, var(--cardback-pattern) 4px 8px);
    border: 1px solid var(--cardback-edge);
    box-shadow: 1px 2px 3px var(--shadow-medium);
  }
  #dealDeck .deal-deck-card:nth-child(2){ transform: translate(2px,-2px); }
  #dealDeck .deal-deck-card:nth-child(3){ transform: translate(4px,-4px); }

  #seat-N{ grid-column:2; grid-row:1; }
  #seat-W{ grid-column:1; grid-row:2; align-self:start; }
  #seat-E{ grid-column:3; grid-row:2; align-self:start; }
  #seat-S{ grid-column:1 / span 3; grid-row:3; justify-content:flex-start; }

  #felt{
    grid-column:2; grid-row:2;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:flex-start;
    gap:6px;
    position:relative;
    overflow: hidden;
    min-height: 0;
    max-width: 540px;
    width: 100%;
    height: 100%;
    margin: 0 auto;
    align-self: center;
    padding-top: 4px;
  }

  /* ---------- Stock / discard piles ---------- */
  #centerPiles{
    display:flex;
    align-items:flex-start;
    justify-content:center;
    gap: 28px;
    flex-shrink:0;
    position: relative;
  }
  /* Revision 11, point 4: while a meld or lay-off is being held before it's
     actually created, the selected card(s) show here - centered directly
     over the Stock/Discard piles, on top of everything else on the felt.
     Revision 18, point 1: pinned to the viewport (position:fixed) with its
     left/top set in JS from #centerPiles's actual screen position (see
     renderMeldPreview) rather than positioned absolutely inside it - see
     that function's comment for why. */
  #meldPreview{
    position: fixed;
    transform: translate(-50%, -50%);
    display:flex;
    align-items:center;
    gap: 26.25px; /* .5in gap, using the ~52.5px/inch ratio measured from your screen in Revision 7 */
    z-index: 30;
    pointer-events: none;
  }
  #meldPreview:empty{ display:none; }
  .pile-area{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:4px;
  }
  .pile-label{
    font-size:.68rem;
    font-weight:700;
    color:#fff;
    text-shadow: 0 1px 2px rgba(0,0,0,.6);
  }
  .pile-click-target{
    cursor:pointer;
    min-width:65.6px; min-height:91.9px; /* Revision 7: matches the corrected card size (point 4) */
    display:flex; align-items:center; justify-content:center;
  }
  /* Revision 12, point 1: the Stock/Discard piles no longer lift on hover - they stay stationary now */
  .pile-click-target.disabled-pile{
    cursor:not-allowed;
    pointer-events:none;
  }
  .pile-click-target.disabled-pile:hover{ transform:none; }
  .pile-click-target.disabled-pile .cardback,
  .pile-click-target.disabled-pile .card{
    filter: grayscale(.25);
    box-shadow: inset 0 0 0 999px var(--disabled-pile-tint), 1px 2px 3px var(--shadow-medium);
  }
  #stockCount{
    font-size:.72rem;
    font-weight:700;
    color:#fff;
    text-shadow: 0 1px 2px rgba(0,0,0,.6);
  }
  #discardPile:empty{
    width:65.6px; height:91.9px; /* Revision 7: matches the corrected card size (point 4) */
    border: 2px dashed rgba(255,255,255,.5);
    border-radius:6px;
  }
  #discardPile{ position:relative; } /* Revision 12, point 5: lets the incoming card (below) overlay the outgoing one instead of the pile briefly having nothing to show */
  #discardPile .discardIncoming{ position:absolute; top:0; left:0; }

  #stockChoiceBar{
    display:none;
    gap:8px;
    flex-wrap:wrap;
    justify-content:center;
    align-items:center;
    background: var(--cream-panel);
    border: 2px solid var(--cream-panel-border);
    border-radius: 10px;
    padding: 6px 10px;
    flex-shrink:0;
  }
  #stockChoiceBar button{
    background: #fff;
    color: var(--ink-primary);
    border: 2px solid var(--board-frame);
    border-radius: 6px;
    padding: 6px 12px;
    cursor:pointer;
    font-weight:700;
    font-size:.82rem;
  }
  #stockChoiceBar button:hover{ background:#f2f6fa; }
  #stockChoiceBar button:disabled{ opacity:.35; cursor:not-allowed; }

  /* ---------- Melds on the table ---------- */
  #meldsArea{
    flex: 0 0 auto;
    min-height: 0;
    height: 86px; /* Revision 6, point 3: fixed instead of max-height. Revision 8, point 1: reduced to 40px (1 row). Revision 10, point 3: grown to 78px for 2 rows (76px measured + a 2px buffer). Revision 12, point 2: that 2px buffer wasn't enough on your actual screen - a scroll bar was still showing up even with 2 rows fitting - so this grows to 86px, an 8px buffer over the same precisely-measured 76px */
    width: 100%;
    overflow-y: auto;
    display:flex;
    flex-wrap:wrap;
    align-content:flex-start;
    gap: 8px 10px;
    padding: 6px 4px;
  }
  .meldsEmpty{
    width:100%;
    text-align:center;
    color: rgba(255,255,255,.85);
    font-size:.85rem;
    font-style: italic;
    margin-top: 10px;
  }
  /* Each meld is shown as a compact pill of suit+rank pairs (cardgames.io
     style), not full card images - leaves room for two rows of melds
     without the panel growing huge. */
  .meldPill{
    display:flex;
    align-items:center;
    gap:7px;
    background: var(--card-face-bg);
    border: 2px solid var(--board-frame);
    border-radius: 8px;
    padding: 4px 10px;
    font-weight:700;
    font-size:.85rem;
    box-shadow: 1px 2px 3px var(--shadow-medium);
  }
  .pillCard{ color: var(--ink-primary); }
  .pillCard.red{ color: var(--suit-accent-ink); }
  /* While laying off, the meld(s) a selected card could legally join light
     up and become clickable - clicking one completes the lay-off. */
  .meldPill.meld-target{
    cursor:pointer;
    box-shadow: 0 0 0 3px var(--exit-btn-bg), 0 0 10px var(--glow-active);
  }
  .meldPill.meld-target:hover{ transform: translateY(-2px); }

  /* ---------- Status / directions box - always-visible line telling the
     player what just happened or what to do next, same idea as the message
     bar in the cardgames.io Rummy reference video. Lives just above your
     hand now (Revision 4, point 5), inside #seat-S rather than #felt. ---------- */
  #statusBox{
    flex-shrink:0;
    box-sizing: border-box;
    width: 100%;
    margin: 2px 0 8px;
    background: var(--cream-panel);
    border: 2px solid var(--cream-panel-border);
    border-radius: 8px;
    padding: 8px 12px;
    font-size: .85rem;
    font-weight: 600;
    color: var(--ink-primary);
    text-align: center;
    line-height: 1.35;
  }

  /* ---------- Card visuals ---------- */
  .card{
    position: relative;
    width:65.6px; height:91.9px; /* Revision 7: a CSS "inch" assumes 96px/inch, which your screen isn't actually rendering at - the Revision 6 attempt at 120x168px (1.25in x 1.75in by that math) measured 2.25in x 3.25in on your screen, so this is scaled down from that using your own measurement to actually land on 1.25in x 1.75in (point 4) */
    background: var(--card-face-bg);
    border: 1px solid var(--card-face-edge);
    border-radius: 6px;
    display:flex;
    flex-direction:column;
    justify-content:space-between;
    padding: 4px;
    font-weight:800;
    box-shadow: 1px 2px 3px var(--shadow-medium);
    color: var(--ink-primary);
    user-select:none;
  }
  .card.red{ color: var(--suit-accent-ink); }
  .card .corner{ font-size:1.1rem; line-height:1; }
  .card .center-suit{ font-size:2.6rem; text-align:center; }
  .card.mini{ width:66px; height:91px; padding:2px; }
  .card.mini .corner{ font-size:1.1rem; }
  .card.mini .center-suit{ font-size:2.6rem; }

  /* South row: the hand of cards and the Meld/Lay Off button side by side,
     button on the right (Revision 4, point 4). */
  #south-row{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:14px;
    width:100%;
  }
  #south-hand{
    display:flex;
    justify-content:center;
    flex-wrap: nowrap;
    overflow: hidden;
    margin-top: 2px;
    padding: 20px 4px 6px;
    flex: 0 1 auto;
    min-height: 0;
  }
  #south-hand .cardWrap{
    flex-shrink: 0;
    margin-left: -31.5px; /* Revision 13, point 1: 6px less overlap (was -37.5px) so more of each covered card peeks out - enough that the rank+suit corner on a two-character "10" isn't cut off by the card on top of it */
    position: relative;
  }
  #south-hand .cardWrap:first-child{ margin-left: 0; }
  #south-hand .card{
    cursor:pointer;
    transition: transform .12s;
  }
  #south-hand .card:hover{ transform: translateY(-8px); }
  #south-hand.no-transition .card{ transition: none !important; }
  #south-hand .cardWrap.selected .card{
    box-shadow: 0 0 0 3px var(--selection-outline-inner), 0 0 0 5px var(--board-frame), 1px 2px 3px var(--shadow-medium);
    transform: translateY(-8px);
  }

  /* ---------- Meld/Lay Off (and, when needed, Reshuffle) button - sit to
     the right of your hand. Revision 5, point 1: height reduced 40% from
     the Revision 4 full-card-height value (118px -> 70.8px). ---------- */
  #actionBar{
    display:flex;
    gap:8px;
    align-items:stretch;
    flex-shrink:0;
  }
  #actionBar button{
    background: #fff;
    color: var(--ink-primary);
    border: 2px solid var(--board-frame);
    border-radius: 8px;
    padding: 6px 14px;
    cursor:pointer;
    font-weight:700;
    font-size:.85rem;
    height: 70.8px; /* Revision 5: 40% shorter than the previous 118px (full card height) */
    width: 96px;
    white-space: normal;
  }
  #actionBar button:hover:not(:disabled){ background:#f2f6fa; }
  #actionBar button:disabled{ opacity:.35; cursor:not-allowed; }
  /* Pressed-in look while Meld/Lay Off selection mode is active */
  #actionBar button.active{
    background: var(--primary-btn-bg);
    color: #fff;
    border-color: var(--board-frame);
  }
  #actionBar button.active:hover:not(:disabled){ background: var(--primary-btn-bg-hover); }

  @keyframes blink-win{ 0%,49%{ opacity:1; } 50%,100%{ opacity:0; } }
  .win-blink{ animation: blink-win 1s step-start infinite; }

  /* ---------- Score table (top-left corner) ---------- */
  #scoreTable{
    /* Revision 8, point 4: pinned directly to the board's own top-left
       corner (8px/8px) instead of being placed in the grid and nudged with
       margins - the grid's side columns are narrower than the board itself
       and centered within it, so a margin here could never actually reach
       a consistent, equal gap on all four sides the way this does. */
    position:absolute; top:8px; left:8px; z-index:15;
    background: var(--shadow-soft);
    border: 2px solid rgba(0,0,0,.35);
    border-radius: 10px;
    padding: 7px 10px;
    box-shadow: 0 2px 6px var(--shadow-medium);
  }
  #scoreTable table{ border-collapse: collapse; }
  #scoreTable th, #scoreTable td{
    padding: 3px 10px;
    text-align:center;
    white-space:nowrap;
    color:#1b1b1b;
  }
  #scoreTable th{
    font-size:calc(.68rem + 2px);
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:.5px;
    border-bottom: 1px solid var(--divider-strong);
  }
  #scoreTable td{ font-size:calc(.85rem + 2px); font-weight:400; }
  #scoreTable tr:not(:last-child) td{ border-bottom: 1px solid var(--divider-soft); }

  /* ---------- This Session's Wins (bottom-left) / Your Name (top-right,
     replacing the removed "Hearts: Not Broken"-equivalent badge slot) ---------- */
  .corner-box{
    position:relative; z-index:15;
    box-sizing:border-box;
    width:180px;
    min-height:73px;
    background: var(--shadow-soft);
    border:2px solid var(--name-box-ink);
    border-radius:8px;
    padding:8px 12px;
    font-family:Arial, Helvetica, sans-serif;
    color: var(--name-box-ink);
    text-align:left;
  }
  /* Revision 8, point 4: both pinned directly to the board's own corners
     (8px/8px), same reasoning as #scoreTable above. sessionWinsBox's
     vertical position is still nudged up from there by JS afterward, to
     keep lining its bottom edge up with the bottom of your hand
     (Revision 5, point 4) - see positionCornerBoxes(). */
  #sessionWinsBox{ position:absolute; left:8px; bottom:8px; }
  #yourNameBox{ position:absolute; top:8px; right:8px; }
  .corner-box-title{
    font-weight:bold;
    text-decoration:underline;
    font-size:0.85rem;
    margin-bottom:6px;
    white-space:nowrap;
    text-align:center;
  }
  .corner-box-stats{ font-size:0.8rem; white-space:nowrap; }
  .wins-grid{
    display:grid;
    grid-template-columns: auto auto auto;
    row-gap:2px;
  }
  .wins-grid .wname{ text-align:left; padding-left:24px; }
  .wins-grid .weq{ text-align:center; }
  .wins-grid .wnum{ text-align:left; padding-left:17.5px; font-weight:700; }
  #yourNameInput{
    width:100%;
    box-sizing:border-box;
    padding:4px 8px;
    border-radius:5px;
    border:1px solid var(--name-box-ink);
    font-family:Arial, Helvetica, sans-serif;
    font-size:0.8rem;
    background:#fffdf5;
    color: var(--name-box-ink);
  }

  /* ---------- Log ---------- */
  #logToggle{
    opacity:0;
    position:fixed; bottom:10px; left:10px;
    background: var(--cream-panel); color:var(--ink-primary);
    border:2px solid var(--board-frame); border-radius:20px;
    padding:8px 14px; cursor:pointer; font-size:.8rem; z-index:50;
  }
  #logPanel{
    position:fixed; bottom:50px; left:10px; width:320px; max-height:75vh; /* Revision 12, point 3: grown from 50vh - no exact height was given, so this is a judgment call; let me know if you'd like it taller or shorter still */
    background: var(--cream-panel); border:2px solid var(--board-frame); border-radius:8px;
    padding:10px; font-size:.78rem; z-index:50; display:none;
    color: var(--ink-primary);
  }
  #logPanel.show{ display:flex; flex-direction:column; }
  #log{ overflow-y:auto; flex:1 1 auto; min-height:0; }
  #log div{ margin-bottom:4px; border-bottom:1px solid #cbb; padding-bottom:3px;}

  /* ---------- Universal modal ---------- */
  #universalModal{
    display:none;
    position:fixed; inset:0;
    background: transparent;
    z-index:100;
  }
  #universalModal .modalBox{
    position: fixed;
    box-shadow: 0 4px 20px rgba(0,0,0,.5);
    background: var(--cream-panel);
    color: var(--ink-primary);
    border: 3px solid var(--board-frame);
    border-radius: 12px;
    padding: 22px;
    max-width: 520px;
    width: 90%;
    max-height: 80vh;
    overflow-y:auto;
  }
  .options-grid{
    display: grid;
    grid-template-columns: auto auto auto;
    row-gap: 14px;
    column-gap: 12px;
    align-items: center;
    justify-content: center;
    margin-top: 10px;
  }
  .options-grid .options-question{ font-weight: 600; white-space: nowrap; text-align: left; }
  .options-grid .opt-pair{ display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
  .options-grid .opt-pair label{ font-weight: 600; cursor: pointer; }
  .options-grid .opt-pair input{ cursor: pointer; margin: 0; }
  #universalModal .modalBox.optionsModal{ max-width: 620px; }

  #universalModal h2{ margin-top:0; color: var(--ink-primary); text-align:center; }
  #universalModal .modalBody{ font-size:.92rem; line-height:1.5; text-align:center; }
  #universalModal .modalBtns{
    display:flex; gap:10px; justify-content:center; margin-top:16px;
  }
  #universalModal button{
    background: var(--primary-btn-bg); color: #fff;
    border:2px solid var(--board-frame); border-radius:6px;
    padding:8px 16px; cursor:pointer; font-weight:600;
  }
  #universalModal button:hover{ background: var(--primary-btn-bg-hover); }

  #universalModal .modalBox.exit-style{
    background: var(--exit-modal-bg);
    color: var(--exit-modal-ink);
    border-width:2px;
    border-color: var(--exit-modal-border);
  }
  #universalModal .modalBox.exit-style h2{
    font-family:'Playfair Display', serif;
    font-weight:700;
    color: var(--exit-modal-ink);
  }
  #universalModal .modalBox.exit-style .modalBody{
    font-family:'Space Mono', monospace;
    color: var(--exit-modal-ink);
  }
  #universalModal .modalBox.exit-style .modalBtns button{
    background: var(--exit-btn-bg);
    color: var(--exit-modal-ink);
    border:2px solid var(--exit-modal-border);
    font-family:'Playfair Display', serif;
    font-weight:700;
  }

<!-- Revision 14, point 3: the end-of-round card-by-card score reveal -
     shown over the board (the opponents' own cardback stacks shrink in
     step with it, see runScoreReveal) before the existing Hand Complete
     popup appears. -->
